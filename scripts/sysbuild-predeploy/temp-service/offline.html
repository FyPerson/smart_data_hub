async function ensureAttachment(dir,projectId,a){
  const key=projectId+':'+a.id;let info=attachmentMemo.get(key);

    const base=safeName(dot>0?a.originalName.slice(0,dot):a.originalName,45);
    info={data:a.data,sha256,filePath:'附件/'+base+'__'+sha256.slice(0,20)+extension};
    attachmentMemo.set(key,info);
  }
  const fileKey=projectId+'/'+info.filePath;
  let exists=false;
  try{
    const f=await(await fileAt(dir,info.filePath)).getFile();
    if(f.size!==a.size||(info.lastModified!==f.lastModified&&await digest(new Uint8Array(await f.arrayBuffer()))!==info.sha256))throw Error('附件在页面外被修改，请通过页面登记新版本：'+a.originalName);

  if(!exists){await writeFile(dir,info.filePath,decodeAttachment(a));info.lastModified=(await(await fileAt(dir,info.filePath)).getFile()).lastModified;}

async function saveWorkspace(snapshot){
  if(!folderHandle||!folderReady)throw Error('请先选择工作目录');
  const root=folderHandle;
  async function persist(){
    const current=await readJSON(root,WORKSPACE_FILE,true);
    if((current?.revision||null)!==(workspaceManifest?.revision||null))throw Error('工作目录已被其他窗口更新，请重新连接目录后继续');
    const previous=workspaceManifest,revision=id(),refs=[],views=[];
    for(const p of snapshot.projects){
      let ref=previous?.projects.find(x=>x.id===p.id);
      const folder=ref?.folder||'项目/'+safeName(p.systemName,38)+'__'+safeName(p.id,40);
      const dir=await directoryAt(root,folder,true),diskProject=clone(p);
      if(!ref&&await readJSON(dir,'project.json',true))throw Error('目录中已有未登记的项目资料，请恢复工作区索引或选择空工作目录：'+folder);
      await directoryAt(dir,'附件',true);
      for(const s of diskProject.milestones)for(const r of s.checks){
        const descriptors=[];for(const a of r.attachments)descriptors.push(await ensureAttachment(dir,p.id,a));r.attachments=descriptors;
      }
      const serialized=JSON.stringify(diskProject);let pkg;
      if(ref&&writtenText.get(folder+':project-data')===serialized){pkg=await readJSON(dir,ref.snapshot);}
      else{
        pkg={format:PROJECT_FORMAT,schemaVersion:3,projectId:p.id,revision,savedAt:now(),project:diskProject};
        ref={id:p.id,systemName:p.systemName,folder,snapshot:'版本记录/'+revision+'.json'};
        await writeFile(dir,ref.snapshot,JSON.stringify(pkg,null,2));
      }
      refs.push({...ref,systemName:p.systemName});views.push({ref:refs[refs.length-1],p,pkg,serialized});
    }
    const manifest={format:WORKSPACE_FORMAT,schemaVersion:3,workspaceId:previous?.workspaceId||id(),revision,savedAt:now(),dataRevision:snapshot.revision,projects:refs,drafts:snapshot.drafts||{}};
    // Commit point: older manifest continues pointing to complete, immutable snapshots until this closes.
    await writeFile(root,WORKSPACE_FILE,JSON.stringify(manifest,null,2));
    workspaceManifest=manifest;folderWarning='';
    for(const view of views){
      writtenText.set(view.ref.folder+':project-data',view.serialized);
      try{await writeProjectViews(root,view.ref,view.p,view.pkg);}
      catch(error){folderWarning='有效版本已保存，但项目文件夹尚未整理完整；请重试保存后再交接。';}
    }
    try{await writeTextChanged(root,'工作目录说明.txt','此目录由系统建设记录页面维护。\n工作区索引.json 指定各项目的有效版本。\n每个项目文件夹包含 project.json、附件、阶段资料和版本记录。\n请完整复制工作目录进行备份；也可单独复制一个项目文件夹用于后续平台接入。\n请用同一个页面窗口维护同一目录。\n','workspace-help');}catch(error){folderWarning=folderWarning||'记录已保存，工作目录说明未能更新。';}
    return manifest;
  }
  const lockName='sysbuild-folder:'+(workspaceManifest?.workspaceId||root.name);
  return navigator.locks?navigator.locks.request(lockName,persist):persist();
}

// Stage schedule metadata; legacy missing start dates remain unknown rather than inferred.
function validateStageDates(s){
 if(s.plannedStartDate&&!dateOK(s.plannedStartDate))throw Error('计划开始日期无效');
 if(!!s.plannedStartDate!==!!s.baselineStartDate)throw Error('计划开始日期与首次计划开始日期必须同时有值');
 if(s.baselineStartDate&&!dateOK(s.baselineStartDate))throw Error('首次计划开始日期无效');
 if(s.plannedStartDate&&(!s.plannedDate||s.plannedStartDate>s.plannedDate))throw Error('计划开始日期不能晚于计划完成日期，且须同时填写计划完成日期');
 if(s.actualStartDate&&!factualDate(s.actualStartDate))throw Error('实际开始日期必须为有效日期，且不得晚于今天');
 if(s.actualStartDate&&s.actualDate&&s.actualStartDate>s.actualDate)throw Error('实际开始日期不能晚于实际完成日期');
}
function stageCanRecordStart(p,i){

  (i===frontier(p)||(s.completed&&!s.actualStartDate));

function validateActualStart(p,i,date){

function editActualStart(i){
