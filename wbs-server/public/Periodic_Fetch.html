           已整体退场 → 改用共享层 components.css 的 .u-status-badge + .sem-* 语义类（字号随 base 12→11，

        .pf-body { display: none; padding: 4px 20px 22px; }
        .pf-card.open .pf-body { display: block; }

        .pf-subtabs { display: flex; gap: 6px; margin: 14px 0 18px; border-bottom: 1px solid #e2e8f0; }
        .pf-subtab { padding: 9px 16px; font-size: 13px; cursor: pointer; color: #64748b; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: .15s; }
        .pf-subtab:hover { color: #0f766e; }
        .pf-subtab.active { color: #0f766e; font-weight: 700; border-bottom-color: #0f766e; }
        .pf-subpanel { display: none; }
        .pf-subpanel.active { display: block; }

        /* 表单字段 */
        .pf-field { margin-bottom: 16px; }

        .pf-field input:focus, .pf-field select:focus, .pf-field textarea:focus { outline: none; border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15,118,110,.1); }
        .pf-field textarea { min-height: 60px; font-family: inherit; resize: vertical; }

        .pf-placeholder-bar { background: #f0fdfa; border: 1px solid #99f6e4; border-radius: 8px; padding: 11px 14px; font-size: 12px; color: #0f766e; margin-bottom: 12px; line-height: 1.7; }

        .pf-recip-status { font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 600; white-space: nowrap; }
        /* 〔状态徽章统一 S5a·口径二·次级族色值 token 化〕class 不动，只换色值引用。七值逐条验证：
             ⚠️【提案·待主会话裁定】matched→**done**（预判给的是 active，未采）：原色是绿系（与 done 一致），
               语义"号码已匹配到人"是一个**已完成的前置结果**，不是"进行中"；active 的蓝会把一个
               静态事实画成动态过程，且与同族的 pushed_success（也是绿）失去呼应。
             blocked→rejected：语义"被拦截/不予推送"＝已拒绝；原 fg #b91c1c 恰是 failed 的 fg，
               但 failed 是"尝试了没成功"，blocked 是"根本不给推"，按语义优先取 rejected（同为深红，肉眼几无差）。
             pushed_success→done ／ pushed_failed→failed（两者色相语义双验证一致）。
             pushed_skipped→**wait**〔S5a-fix HIGH-1：原定 voided，因**次级族禁用豁免层**改判〕——
               voided/legacy 的对比度豁免建立在「line-through + 文案冗余」上，而次级族按终审 L
               不继承 deco，等于拿了豁免又拆掉豁免赖以成立的冗余通道；wait 是达标的中性灰，语义也对。
             pushed_pending→**active**〔S5a-fix MED-2 订正〕——
               ⚠️ 本行 S5a 初版写的是"语义『待推送』故映射 wait"，**那个语义是我杜撰的**：
               页内 `pfPushStatusMeta()` 的 LABELS 白纸黑字写着 `pending: '处理中'`（:1017）。
               「处理中」＝进行中 → active，且恰与原色 #dbeafe/#1d4ed8 同为蓝系，两条验证都对上。
               以此为鉴：语义论据必须引真相源的行号级证据，不能凭 key 的字面印象推。 */
        .pf-recip-status.matched { background: var(--sem-done-bg); color: var(--sem-done-fg); }
        .pf-recip-status.blocked { background: var(--sem-rejected-bg); color: var(--sem-rejected-fg); }
        .pf-recip-status.pushed_success { background: var(--sem-done-bg); color: var(--sem-done-fg); }
        .pf-recip-status.pushed_failed { background: var(--sem-failed-bg); color: var(--sem-failed-fg); }
        .pf-recip-status.pushed_skipped { background: var(--sem-wait-bg); color: var(--sem-wait-fg); }
        .pf-recip-status.pushed_pending { background: var(--sem-active-bg); color: var(--sem-active-fg); }
        /* superseded=人为强制重发替代的技术终态，中性灰蓝，非红色"失败"（避免误读为真实发送失败）
           〔S5a-fix HIGH-1〕原定 legacy（语义最贴：legacy=历史旧态，而"被后续推送取代"正是这个意思），
           因**次级族禁用豁免层**改判 **intake（借色制）**：legacy 与 voided 一样是靠
           「文案冗余」换来的对比度豁免层，次级族不继承 deco，用它就是在没有冗余通道的地方
           把文字压到 4.5:1 以下。借色理由（两条硬约束的交集）：① 达标层；② 与同族的
           pushed_skipped（wait 灰）拉得开——两者都是"没真正发出去"的终态，同为灰会分不清。
           **借的是色不是语义**：superseded 不是"待受理"，语义由 label「已被强制重发替代」承载。 */
        .pf-recip-status.pushed_superseded { background: var(--sem-intake-bg); color: var(--sem-intake-fg); }
        .pf-drift { color: #b45309; font-size: 11px; margin-left: 6px; }

        .pf-push-target { font-size: 12.5px; color: #475569; background: #f0fdfa; border: 1px solid #ccfbf1; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
        .pf-push-target b { color: #0f766e; }

        .pf-modal-body pre { white-space: pre-wrap; word-break: break-word; font-family: "Consolas", "Courier New", monospace; font-size: 12.5px; line-height: 1.6; background: #fafafa; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 14px; }
        .pf-kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; font-size: 12.5px; margin-bottom: 14px; }
        .pf-kv-grid label { display: block; font-size: 11px; color: #9ca3af; margin-bottom: 2px; }

    </style>

    <script src="assets/js/app.js?v=v1.158.0_legacy1"></script>
    <script>
    /* ============================================================
       周期取数推送前端 · 仅 admin 可用
       后端契约见 routes/periodic-fetch/index.js（14 端点）
       ============================================================ */

    // ---- 全局状态 ----
    // ── 状态徽章 class 片段白名单（状态徽章统一 S3·与 IT/DC 同范式）────────────────────
    //   本页走**新语义模式**（方案 §2.2 双模式契约）：直接输出 `u-status-badge sem-*`，
    //   页内不写任何别名规则、不写任何色值——sem-* 的样式只在共享层 components.css。
    //   不引 unify-helpers.js（保持本页最小引用面），故 gate 在页内自实现，契约与
    //   UnifyHelpers.statusBadgeByMap 一致：命中才给修饰类，未命中落 base 的 wait fallback + warn。
    //
    //   来源受控度：**两张表都有 CHECK**（routes/periodic-fetch/index.js 建表处）——
    //     periodic_task_runs.status CHECK IN ('queued','running','success','failed','empty_result')
    //     periodic_tasks.status      CHECK IN ('active','disabled')
    //   ⚠️ 更正 S0 双矩阵：S0 把本页记为"无 CHECK"，那是因为只扫了 server.js；PF 的建表在
    //   routes/periodic-fetch/index.js 里。但按终审 M，后端 CHECK 只证明输入受控，
    //   **不替代前端 class 白名单**——本 map 仍是 class 片段的唯一出口。
    //
    //   映射依据（语义 + 原 direct 色最近层 双重验证）：
    //     success     → done     绿·跑成功
    //     failed      → failed   红（原 fg #b91c1c 与 failed 层逐字相同）
    //     running     → active   蓝·执行中（原 fg #1d4ed8 与 active 层逐字相同）
    //     queued      → wait     排队中=尚未开始。⚠️ 原本 queued 与 running **共用一条 CSS 规则**
    //                            （同蓝），统一后分色（灰/蓝）= 正向语义细化，非回归。
    //     empty_result→ review   跑通但零行、需人工显式确认才可推送（见页内说明区）=「待确认」。
    //                            原 fg #b45309 与 review 层逐字相同。
    //     disabled    → voided   任务已停用。**不可逆**：PF 路由只有 /disable，无 enable/恢复端点，
    //                            `status='active'` 在整个 PF 路由零回写点 ⇒ 是终态不是可恢复暂停。
    const PF_STATUS_CLASS = Object.freeze({
        success: 'sem-done',
        failed: 'sem-failed',
        running: 'sem-active',
        queued: 'sem-wait',
        empty_result: 'sem-review',
        disabled: 'sem-voided',
    });

    // ── 状态中文文案单源（S3-fix MED-5）────────────────────────────────────────────
    //   原先「上次运行」区（pfRenderTaskCard）用一串三元、历史表（pfRenderRunRow）用另一张行内对象，
    //   两处各写一份、各自演进 —— 实际已经分叉：三元把 running 与 queued 一起兜成"进行中"，
    //   而历史表把 queued 正确显示为"排队中"。合并成本表后该分叉自动消失。
    const PF_STATUS_LABEL = Object.freeze({
        success: '成功', failed: '失败', empty_result: '空结果', running: '进行中', queued: '排队中',
    });
    // 仍在跑/待跑的两态不加「上次」前缀——"上次进行中"读不通，它描述的是**当下**而非上一轮结果。
    //   这与原三元的行为一致（原来也是把这两态显示成不带前缀的"进行中"），只是 queued 从
    //   被兜进"进行中"变成如实显示"排队中"= 顺带修掉的文案精度问题。
    const PF_INFLIGHT_STATUSES = Object.freeze(['running', 'queued']);
    function pfStatusLabel(status) { return PF_STATUS_LABEL[status] || status; }
    function pfLastRunLabel(status) {
        return PF_INFLIGHT_STATUSES.includes(status) ? pfStatusLabel(status) : '上次' + pfStatusLabel(status);
    }

    // 降级告警去重（对齐 A-L1：列表几十行同一未知状态刷屏会淹掉真正有用的那条）
    const pfWarnedStatuses = new Set();
    function pfStatusClass(status) {
        if (Object.prototype.hasOwnProperty.call(PF_STATUS_CLASS, status)) return PF_STATUS_CLASS[status];
        const key = String(status);
        if (!pfWarnedStatuses.has(key)) {
            pfWarnedStatuses.add(key);
            console.warn('[Periodic_Fetch.pfStatusClass] 状态值不在徽章白名单内，徽章降级为默认等待态：', status);
        }
        return '';
    }

    let pfReady = false;
    let pfTasks = [];
    let pfSourceConns = [];
    let pfOpenTaskId = null;              // 当前展开的任务卡 id（单卡展开，简化状态管理）
    let pfDetailCache = {};                // taskId -> 任务详情（含完整 script_template）
    let pfEditBuf = {};                    // taskId -> 编辑中的表单值缓存（避免重渲染丢输入）
    let pfActiveSub = {};                  // taskId -> 'script' | 'runs' | 'push'
    let pfRunsCache = {};                  // taskId -> runs 数组
    let pfPushSelectedRun = {};            // taskId -> 选中的 run_id（推送必须显式选具体 run，不默认最新）
    let pfPreviewItems = {};               // taskId -> preview 反查结果数组
    let pfPushHistory = {};                // runId -> pushes 数组

    // ---- 收件人/推送错误码 → 中文文案（覆盖 recipients.js reason 枚举 + confirm 阶段专属码）----
    //   改造（2026-07-06）：钉钉详情接口无权限，删掉姓名/在职反查——仅保留 phone→userid 反查产生的 reason
    //   （INACTIVE_USER/UNKNOWN_ACTIVE_STATUS/DETAIL_NOT_FOUND/DETAIL_LOOKUP_FAILED 已不再产生，一并移除）。
    const PF_REASON_TEXT = {
        INVALID_PHONE_FORMAT: '手机号格式不正确',
        NOT_FOUND: '查不到对应钉钉用户（未登记/非企业成员/已离职）',
        MULTIPLE_MATCHES: '该手机号匹配多个钉钉账号，需人工处理',
        RECIPIENT_MISMATCH: '收件人钉钉身份与核对时不一致，已拒绝发送',
        DUPLICATE_USERID: '重复收件人（不同手机号对应同一人），已自动去重',
        invalid_staff: '钉钉判定为无效员工，发送失败',
        send_failed: '钉钉发送失败',
        token_expired: '钉钉凭证已过期',
        network: '钉钉网络异常',
    };
    function pfReasonText(code) {
        if (!code) return '';
        if (PF_REASON_TEXT[code]) return PF_REASON_TEXT[code];
        return code;
    }

    // ============================================================
    // 通用 fetch 封装（镜像 Sys_Iteration.html 的 siApi/siApiErr）
    // ============================================================
    async function pfApi(path, { method = 'GET', body = null } = {}) {
        const opt = { method };
        if (body != null) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
        const res = await authFetch('/api' + path, opt);
        if (!res) return { ok: false, aborted: true };
        let data = null;
        try { data = await res.json(); } catch (e) { data = null; }
        if (!res.ok) return { ok: false, status: res.status, data };
        return { ok: true, data };
    }
    function pfApiErr(r, fallback) {
        if (r && r.aborted) return null;
        const msg = (r && r.data && (r.data.error || r.data.code)) || fallback || '操作失败';
        showToast(msg, 'error');
        return null;
    }
    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function pfFmtDate(v) { return v ? String(v) : '—'; }

    // ============================================================
    // 启动
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
        if (typeof checkAuth === 'function') {
            const ok = await checkAuth();
            if (!ok) return;
        }
        // 本页仅 admin 可用（后端 14 端点均 requireAdmin，前端同步拒绝非 admin 访问，纵深防御，
        // 镜像 admin.html/admin.js 的 checkAuth 角色重定向范式）。
        if (typeof isAdmin !== 'function' || !isAdmin()) {
            alert('需要管理员权限');
            window.location.href = '/Task_Pool.html';
            return;
        }
        await pfLoadReadiness();
        await pfLoadSourceConnections();
        await pfLoadTasks();
    });

    async function pfLoadReadiness() {
        const r = await pfApi('/periodic-tasks/_readiness');
        const banner = document.getElementById('pfReadyBanner');
        if (!r.ok) { banner.style.display = 'none'; return; }
        pfReady = !!(r.data && r.data.ready);
        if (!pfReady) {
            banner.className = 'pf-warn-banner';
            banner.style.display = 'block';
            banner.textContent = '周期取数推送功能正在初始化或表结构未就绪：' + (r.data.error || '请稍后重试') + '。此期间登记/跑数/推送均不可用。';
        } else {
            banner.style.display = 'none';
        }
    }

    async function pfLoadSourceConnections() {
        // 复用数据协作模块既有只读列表端点（GET，requireAdmin），不在本模块重复造一个"列 source 连接"端点。
        const r = await pfApi('/collab/db-connections/source');
        if (!r.ok) { pfSourceConns = []; return; }
        // C4（方案 §3.5.8，D12）：/source 端点已按 externalSourceSqlFilter() 把已登记外部源也纳入
        // 返回集（服务于数据协作建单选库），周期取数模块创建/更新/执行三路由后端本就拒绝 external
        // 连接（G3 Q3 主断言：/api/periodic-tasks 三路由命中 external id 一律 400/409
        // SOURCE_CONNECTION_NOT_FOUND，见 verify-collab-external-source.js §Q1）——前端下拉不给
        // external 选项，客户端先过滤一次，避免用户选了必定会被后端拒绝的连接、白走一次报错往返。
        // 过滤发生在赋值 pfSourceConns 之后、构建 opts 之前，两处消费者（本函数的新建下拉 + 671
        // 行编辑表单下拉）共用同一份已过滤数组，天然同步不必两处各自过滤。
        // 〔codex 10-L1〕元素级防御：非对象/空条目跳过（不让一条脏数据把整个下拉加载炸掉），再过滤 external。
        pfSourceConns = ((r.data && r.data.items) || (Array.isArray(r.data) ? r.data : []) || [])
            .filter(c => c && typeof c === 'object' && c.type !== 'external');
        const opts = ['<option value="">请选择目标库</option>']
            .concat(pfSourceConns.map(c => `<option value="${c.id}">${esc(c.name)}（${esc(c.type)}）</option>`));
        const sel = document.getElementById('pfNewConn');
        if (sel) sel.innerHTML = opts.join('');
    }

    // ============================================================
    // 任务列表
    // ============================================================
    async function pfLoadTasks() {
        const status = document.getElementById('pfFStatus').value;
        const r = await pfApi('/periodic-tasks' + (status ? ('?status=' + encodeURIComponent(status)) : ''));
        if (!r.ok) { pfApiErr(r, '任务列表加载失败'); return; }
        pfTasks = (r.data && r.data.items) || [];
        pfRenderTaskList();
    }

    function pfRenderTaskList() {
        const activeCount = pfTasks.filter(t => t.status === 'active').length;
        document.getElementById('pfCount').textContent = pfTasks.length ? `共 ${pfTasks.length} 个 · ${activeCount} 启用` : '';
        const box = document.getElementById('pfTaskList');
        if (!pfTasks.length) {
            box.innerHTML = '<div class="pf-card"><div class="pf-empty">暂无周期任务，点右上角「登记新任务」开始</div></div>';
            return;
        }
        box.innerHTML = pfTasks.map(pfRenderTaskCard).join('');
    }

    function pfRenderTaskCard(task) {
        const isOpen = pfOpenTaskId === task.id;
        const runs = pfRunsCache[task.id];
        let lastRunHtml = '<span style="color:#94a3b8;">点击展开查看</span>';
        if (Array.isArray(runs) && runs.length) {
            const last = runs[0];
            const label = pfLastRunLabel(last.status);
            lastRunHtml = `<span class="u-status-badge ${pfStatusClass(last.status)}">${esc(label)}</span><div class="pf-rt">${esc(last.started_at || '')}${last.row_count != null ? ' · ' + last.row_count + ' 行' : ''}</div>`;
        } else if (Array.isArray(runs)) {
            lastRunHtml = '<span style="color:#94a3b8;">尚未跑过</span>';
        }
        const disabledTag = task.status === 'disabled' ? ` <span class="u-status-badge ${pfStatusClass('disabled')}">已禁用</span>` : '';
        const body = isOpen ? pfRenderCardBody(task) : '';
        return `
        <div class="pf-card ${isOpen ? 'open' : ''}" id="pfCard_${task.id}">
            <div class="pf-head" onclick="pfToggleCard(${task.id})">
                <span class="pf-caret">▶</span>
                <div class="pf-main">
                    <div class="pf-name">${esc(task.task_name)}${disabledTag}</div>
                    <div class="pf-meta">
                        <span class="pf-db">${esc(task.source_connection_name || ('#' + task.source_connection_id))}</span>
                        <span>模板 v${task.template_version}</span>
                        ${task.description ? `<span>${esc(task.description)}</span>` : ''}
                    </div>
                </div>
                <div class="pf-lastrun">${lastRunHtml}</div>
            </div>
            <div class="pf-body">${body}</div>
        </div>`;
    }

    async function pfToggleCard(taskId) {
        if (pfOpenTaskId === taskId) {
            pfOpenTaskId = null;
            pfRenderTaskList();
            return;
        }
        pfOpenTaskId = taskId;
        if (!pfActiveSub[taskId]) pfActiveSub[taskId] = 'script';
        pfRenderTaskList(); // 先渲染展开骨架（含"加载中"占位），再异步补详情，避免点击无反馈
        await pfOpenTaskDetail(taskId);
        await pfLoadRuns(taskId, /*silent*/ true);
        pfRenderTaskList();
    }

    async function pfOpenTaskDetail(taskId) {
        const r = await pfApi('/periodic-tasks/' + taskId);
        if (!r.ok) { pfApiErr(r, '任务详情加载失败'); return; }
        pfDetailCache[taskId] = r.data;
        if (!pfEditBuf[taskId]) {
            pfEditBuf[taskId] = {
                task_name: r.data.task_name, description: r.data.description || '',
                source_connection_id: r.data.source_connection_id, script_template: r.data.script_template,
            };
        }
    }

    function pfRenderCardBody(task) {
        const detail = pfDetailCache[task.id];
        if (!detail) return '<div class="pf-empty">加载中…</div>';
        const sub = pfActiveSub[task.id] || 'script';
        return `
        <div class="pf-subtabs">

            <div class="pf-subtab ${sub === 'runs' ? 'active' : ''}" onclick="pfShowSub(${task.id},'runs')">跑数 · 历史</div>

    function pfShowSub(taskId, sub) {
        pfActiveSub[taskId] = sub;
        // 首次切到"跑数·历史"或"推送"时按需懒加载 runs（避免展开脚本 tab 时就多打一次请求）
        if ((sub === 'runs' || sub === 'push') && !pfRunsCache[taskId]) {
            pfLoadRuns(taskId).then(() => pfRenderTaskList());
            return;
        }
        pfRenderTaskList();
    }

    function pfInsertPlaceholder(taId, txt) {
        const ta = document.getElementById(taId);
        if (!ta) return;
        const s = ta.selectionStart, e = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + txt + ta.value.slice(e);
        ta.focus(); ta.selectionStart = ta.selectionEnd = s + txt.length;
    }

    async function pfSaveTask(taskId) {
        const buf = pfEditBuf[taskId];
        if (!buf) return;
        if (!buf.task_name || !buf.task_name.trim()) { showToast('任务名不能为空', 'error'); return; }
        if (!buf.source_connection_id) { showToast('请选择目标业务库', 'error'); return; }
        const r = await pfApi('/periodic-tasks/' + taskId, {
            method: 'PUT',
            body: { task_name: buf.task_name.trim(), description: buf.description || '', source_connection_id: buf.source_connection_id, script_template: buf.script_template },
        });
        if (!r.ok) { pfApiErr(r, '保存失败'); return; }
        showToast(r.data.script_changed ? `保存成功（模板已改，版本升至 v${r.data.template_version}）` : '保存成功', 'success');
        delete pfDetailCache[taskId];
        await pfOpenTaskDetail(taskId);
        await pfLoadTasks();
    }

    async function pfDisableTask(taskId) {
        if (!confirm('确认禁用该周期任务？禁用后不可跑数，任务名会释放（可另建同名新任务）。')) return;
        const r = await pfApi('/periodic-tasks/' + taskId + '/disable', { method: 'POST' });
        if (!r.ok) { pfApiErr(r, '禁用失败'); return; }
        showToast('已禁用', 'success');
        await pfLoadTasks();
    }

    // ============================================================
    // 子面板 2：跑数 · 历史
    // ============================================================
    async function pfLoadRuns(taskId, silent) {
        const r = await pfApi('/periodic-tasks/' + taskId + '/runs');
        if (!r.ok) { if (!silent) pfApiErr(r, 'run 历史加载失败'); pfRunsCache[taskId] = pfRunsCache[taskId] || []; return; }

    function pfRenderRunsPanel(task) {
        const runs = pfRunsCache[task.id];
        if (!Array.isArray(runs)) return '<div class="pf-empty">加载中…</div>';
        const disabledHint = task.status === 'disabled' ? '<span style="font-size:12px;color:#94a3b8;">任务已禁用，不可跑数</span>' : '';
        const rows = runs.length ? runs.map(run => pfRenderRunRow(task, run)).join('') : '<tr><td colspan="6" class="pf-empty">暂无执行历史</td></tr>';
        return `
        <div class="pf-run-toolbar">
            <button class="pf-btn pf-btn-primary pf-btn-sm" ${task.status !== 'active' ? 'disabled' : ''} onclick="pfRunTask(${task.id}, this)">▶ 跑本月（按 Asia/Shanghai 算上月区间）</button>
            ${disabledHint}
        </div>
        <div class="pf-table-wrap">
            <table class="pf-table">
                <thead><tr><th>执行时间</th><th>日期区间</th><th>行数</th><th>耗时</th><th>状态</th><th></th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
        <div class="pf-note"><b>硬约束</b>：全量跑但设<span class="kw">最大 10 万行 + 60s 超时</span>，超限直接失败不隐式截断。<br><b>可推送前置</b>：仅<span class="kw">成功+文件存在+校验通过</span>可推送；<span class="u-status-badge ${PF_STATUS_CLASS.empty_result}">${pfStatusLabel('empty_result')}</span>需显式确认；<span class="u-status-badge ${PF_STATUS_CLASS.failed}">${pfStatusLabel('failed')}</span>不可推送、不复用旧文件。</div>`;
    }

    function pfRenderRunRow(task, run) {
        const statusLabel = pfStatusLabel(run.status);
        const canDownload = (run.status === 'success' || run.status === 'empty_result') && run.file_status === 'present';
        const canPush = (run.status === 'success' || run.status === 'empty_result') && run.file_status === 'present';
        const durationText = run.duration_ms != null ? (run.duration_ms / 1000).toFixed(1) + 's' : '—';
        let actionCell = '';
        if (canDownload) actionCell += `<button class="pf-link" onclick="pfDownloadRun(${run.id},'${esc(run.task_name_snapshot || task.task_name)}')">下载</button> · `;
        actionCell += `<button class="pf-link" onclick="pfViewRunDetail(${run.id})">详情</button>`;
        if (canPush) actionCell += ` · <button class="pf-link" onclick="pfGoPush(${task.id},${run.id})">去推送→</button>`;
        if (run.file_status === 'present' && (run.status === 'success' || run.status === 'empty_result' || run.status === 'failed')) {
            actionCell += ` · <button class="pf-link" onclick="pfCleanFile(${task.id},${run.id})" style="color:#dc2626;">清理文件</button>`;
        }
        const errNote = run.error_msg ? `<div style="font-size:11px;color:#b91c1c;margin-top:2px;">${esc(run.error_msg)}</div>` : '';
        return `<tr>
            <td>${esc(run.started_at)}</td>
            <td>${pfFmtDateRange(run.date_range_start, run.date_range_end)}</td>
            <td>${run.row_count != null ? run.row_count : '—'}</td>
            <td>${durationText}</td>
            <td><span class="u-status-badge ${pfStatusClass(run.status)}">${esc(statusLabel)}</span>${errNote}</td>
            <td>${actionCell}</td>
        </tr>`;
    }

    // 日期区间显示（2026-07-06）：SQL 用左闭右开 [start, end)（end=本月首日，#21 用 `< end` 精确取整月、
    //   不漏月末带时间的记录），但直接显示 "6-01 ~ 7-01" 让人误以为多取了 7 月。展示层统一把上界减 1 天
    //   显示成"上月最后一天"（6-01 ~ 6-30 = 上月整月），一眼看懂。⚠️ 仅显示层，SQL 替换值与审计留痕不变。
    function pfPrevDay(dateStr) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr || ''));
        if (!m) return dateStr;
        let y = +m[1], mo = +m[2], d = +m[3] - 1;
        if (d < 1) { mo -= 1; if (mo < 1) { mo = 12; y -= 1; } d = new Date(y, mo, 0).getDate(); }
        return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }
    function pfFmtDateRange(start, end) {
        if (!start || !end) return `${esc(start || '')} ~ ${esc(end || '')}`;
        return `${esc(start)} ~ ${esc(pfPrevDay(end))}`;
    }

    async function pfRunTask(taskId, btnEl) {
        if (btnEl) btnEl.disabled = true;
        showToast('已提交，跑数中（全量、上限10万行/60s超时）…', 'info');
        try {
            const r = await pfApi('/periodic-tasks/' + taskId + '/run', { method: 'POST' });
            if (!r.ok) { pfApiErr(r, '跑数失败'); return; }
            const d = r.data;
            if (d.status === 'success') showToast(`跑数成功：${d.row_count} 行，耗时 ${(d.duration_ms / 1000).toFixed(1)}s`, 'success');
            else if (d.status === 'empty_result') showToast('跑数完成：本月结果为 0 行（空结果）', 'warning');
            else showToast('跑数失败：' + (d.error || '未知错误'), 'error');
        } finally {
            await pfLoadRuns(taskId);
            await pfLoadTasks();
            if (pfOpenTaskId === taskId) pfRenderTaskList();
        }
    }

    async function pfDownloadRun(runId, taskName) {
        const res = await authFetch('/api/periodic-tasks/runs/' + runId + '/download');
        if (!res) return;
        if (!res.ok) { showToast('下载失败', 'error'); return; }
        let name = `periodic-run-${runId}.xlsx`;
        const dispo = res.headers.get('Content-Disposition') || '';
        let m = /filename\*=(?:UTF-8'')?([^;\r\n]+)/i.exec(dispo);
        if (m) { try { name = decodeURIComponent(m[1].trim().replace(/^["']|["']$/g, '')); } catch (e) { /* keep default */ } }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    async function pfCleanFile(taskId, runId) {
        if (!confirm('确认清理该 run 的结果文件？清理后如需重发，需重新跑本月。')) return;
        const r = await pfApi('/periodic-tasks/runs/' + runId + '/file/clean', { method: 'POST' });
        if (!r.ok) { pfApiErr(r, '清理失败'); return; }
        showToast('文件已清理', 'success');
        await pfLoadRuns(taskId);
        pfRenderTaskList();
    }

    // ============================================================
    // 子面板 3：推送
    // ============================================================
    function pfGoPush(taskId, runId) {
        pfPushSelectedRun[taskId] = runId;
        pfActiveSub[taskId] = 'push';
        pfPreviewItems[taskId] = null; // 切换 run 后清空上次核对结果，避免误用旧核对
        pfRenderTaskList();
    }

    function pfRenderPushPanel(task) {
        const runs = pfRunsCache[task.id];
        if (!Array.isArray(runs)) return '<div class="pf-empty">加载中…</div>';
        const pushableRuns = runs.filter(r => (r.status === 'success' || r.status === 'empty_result') && r.file_status === 'present');
        if (!pushableRuns.length) {
            return '<div class="pf-empty">暂无可推送的 run（需成功或空结果 且 文件存在）。请先在"跑数 · 历史"里跑一次。</div>';
        }
        let selectedRunId = pfPushSelectedRun[task.id];
        if (selectedRunId && !pushableRuns.some(r => r.id === selectedRunId)) selectedRunId = null;
        const runOpts = ['<option value="">请选择一个具体的 run（不默认最新）</option>']
            .concat(pushableRuns.map(r => `<option value="${r.id}" ${r.id === selectedRunId ? 'selected' : ''}>${esc(r.started_at)} · ${pfFmtDateRange(r.date_range_start, r.date_range_end)} · ${r.row_count}行 · ${r.status === 'empty_result' ? '空结果' : '成功'}</option>`));
        const pickerHtml = `<div class="pf-field"><label>选择要推送的 run <span class="req">*</span> <span class="hint">推送必须绑定某个具体成功/空结果的 run，不默认推最新</span></label>
            <select id="pfPushRunSel_${task.id}" onchange="pfSelectPushRun(${task.id}, this.value)">${runOpts.join('')}</select></div>`;

        if (!selectedRunId) return pickerHtml;

        const run = pushableRuns.find(r => r.id === selectedRunId);
        const isEmpty = run.status === 'empty_result';
        const emptyConfirmChecked = !!(pfEditBuf['_confirmEmpty_' + task.id]);
        const emptyBlockHtml = isEmpty ? `
            <div class="pf-empty-confirm">
                <input type="checkbox" id="pfConfirmEmpty_${task.id}" ${emptyConfirmChecked ? 'checked' : ''} onchange="pfEditBuf['_confirmEmpty_' + ${task.id}] = this.checked; pfRenderTaskList();">
                <label for="pfConfirmEmpty_${task.id}" style="margin:0;">本次结果为 0 行（空结果），确认仍要推送空结果给需求人</label>
            </div>` : '';
        const canProceed = !isEmpty || emptyConfirmChecked;

        const items = pfPreviewItems[task.id];
        let recipHtml = '';
        if (Array.isArray(items) && items.length) {
            recipHtml = `<label style="display:block;font-size:13px;font-weight:600;color:#334155;margin:14px 0 9px;">反查结果 —— 勾选确认要发的收件人：</label>
            <div class="pf-recip-list">${items.map((it, idx) => pfRenderRecipRow(task.id, it, idx)).join('')}</div>
            <div class="pf-btn-row">
                <button class="pf-btn pf-btn-primary pf-btn-sm" onclick="pfConfirmPush(${task.id})">✓ 确认发送给已勾选的收件人</button>
                <button class="pf-btn pf-btn-sec pf-btn-sm" onclick="pfPreviewItems[${task.id}]=null; pfRenderTaskList();">重新填号</button>
            </div>`;
        }

        const pushHistory = pfPushHistory[selectedRunId];
        const historyHtml = Array.isArray(pushHistory) && pushHistory.length ? `
            <div style="margin-top:18px;">
                <label style="display:block;font-size:12px;color:#9ca3af;margin-bottom:6px;">该 run 历史推送记录</label>
                <div class="pf-table-wrap"><table class="pf-table">
                    <thead><tr><th>手机号</th><th>姓名</th><th>状态</th><th>时间</th></tr></thead>
                    <tbody>${pushHistory.map(p => pfRenderPushHistoryRow(p)).join('')}</tbody>
                </table></div>
            </div>` : '';

        return `
        ${pickerHtml}
        <div class="pf-push-target">推送对象：<b>${esc(run.started_at)}</b> 那次${isEmpty ? '空结果' : '成功'} run（${run.row_count} 行）的结果 xlsx。<span style="color:#94a3b8;">（推送必须绑定某个具体 run，不默认推最新）</span></div>
        ${emptyBlockHtml}
        <div class="pf-field">
            <label>填需求人姓名 + 手机号 <span class="hint">每行一个收件人，姓名和手机号用逗号分隔（如 张三,138xxxx0001），单批最多 20 个</span></label>
            <div class="pf-recip-input">
                <textarea id="pfRecipInput_${task.id}" rows="4" placeholder="张三,13800000001&#10;李四,13900000002" ${!canProceed ? 'disabled' : ''}></textarea>
                <button class="pf-btn pf-btn-primary pf-btn-sm" ${!canProceed ? 'disabled' : ''} onclick="pfPreviewRecipients(${task.id})">核对可送达</button>
            </div>
        </div>
        ${recipHtml}
        ${historyHtml}
        <div class="pf-note"><b>发前核对</b>：发的是含<span class="kw">身份证号、银行账号</span>的敏感数据，<span class="kw">姓名由你自己录入</span>核对是谁、手机号反查<span class="kw">钉钉ID后四位</span>确认能送达，确认才发——防发错人。<br><b>批量失败</b>：查不到的号<span class="kw">跳过继续发其余</span>，最后报告哪几个跳过，不整批中止。</div>`;
    }

    function pfSelectPushRun(taskId, runIdStr) {
        pfPushSelectedRun[taskId] = runIdStr ? Number(runIdStr) : null;
        pfPreviewItems[taskId] = null;
        pfEditBuf['_confirmEmpty_' + taskId] = false;
        if (pfPushSelectedRun[taskId]) pfLoadPushHistory(pfPushSelectedRun[taskId]).then(() => pfRenderTaskList());
        else pfRenderTaskList();
    }

    function pfRenderRecipRow(taskId, item, idx) {
        // 改造（2026-07-06）：姓名一律显示 admin 录入值（item.name），钉钉侧只反查 userid 判能否送达。
        if (item.ok) {

                <span class="pf-recip-phone">${esc(item.phone)}</span>

        }
        return `<div class="pf-recip-row" style="background:#fef2f2;">
            <input type="checkbox" disabled>

            <span class="pf-recip-info"><span class="name" style="color:#7f1d1d;">${esc(item.name || '')}</span> · <span style="color:#b91c1c;">${esc(pfReasonText(item.reason))}</span></span>
            <span class="pf-recip-status blocked">✕ 禁发</span>
        </div>`;
    }

    async function pfPreviewRecipients(taskId) {
        // 改造（2026-07-06）：成对录入"姓名,手机号"（每行一个），姓名由 admin 录入、后端只反查 userid 判可送达。
        const input = document.getElementById('pfRecipInput_' + taskId);
        const lines = (input && input.value || '').split(/\n/).map(s => s.trim()).filter(Boolean);
        if (!lines.length) { showToast('请填写至少一个收件人（姓名,手机号）', 'error'); return; }
        const recipientsInput = [];
        for (const line of lines) {
            const parts = line.split(/[,，]/).map(s => s.trim()).filter(Boolean);
            if (parts.length < 2) { showToast(`格式有误：「${line}」需写成 姓名,手机号`, 'error'); return; }
            recipientsInput.push({ name: parts[0], phone: parts[1] });
        }
        if (recipientsInput.length > 20) { showToast('单批最多 20 个收件人', 'error'); return; }
        const runId = pfPushSelectedRun[taskId];
        if (!runId) { showToast('请先选择要推送的 run', 'error'); return; }
        const confirmEmpty = !!pfEditBuf['_confirmEmpty_' + taskId];
        const r = await pfApi('/periodic-tasks/runs/' + runId + '/push/preview', { method: 'POST', body: { recipients: recipientsInput, confirm_empty: confirmEmpty } });
        if (!r.ok) {
            if (r.data && r.data.code === 'EMPTY_RESULT_CONFIRM_REQUIRED') { showToast('本次结果为 0 行，请先勾选上方"确认仍要推送空结果"', 'error'); return; }
            pfApiErr(r, '收件人核对失败'); return;
        }
        pfPreviewItems[taskId] = r.data.items || [];
        if (r.data.deduped && r.data.deduped.by_phone) showToast(`已自动去重 ${r.data.deduped.by_phone} 个重复手机号`, 'info');
        pfRenderTaskList();
    }

    async function pfConfirmPush(taskId, force) {
        const runId = pfPushSelectedRun[taskId];
        const items = pfPreviewItems[taskId] || [];
        if (!runId || !items.length) return;
        const recipients = [];
        items.forEach((it, idx) => {
            if (!it.ok) return;
            const chk = document.getElementById(`pfRecipChk_${taskId}_${idx}`);
            if (chk && chk.checked) recipients.push({ phone: it.phone, userid: it.userid, name: it.name, last4: it.last4 });
        });
        if (!recipients.length) { showToast('请至少勾选一个收件人', 'error'); return; }
        const confirmEmpty = !!pfEditBuf['_confirmEmpty_' + taskId];
        const r = await pfApi('/periodic-tasks/runs/' + runId + '/push/confirm', {
            method: 'POST', body: { recipients, confirm_empty: confirmEmpty, force: !!force },
        });
        if (!r.ok) {
            const code = r.data && r.data.code;
            if ((code === 'ALREADY_PUSHED' || code === 'NEEDS_RECONCILE') && !force) {
                const msg = (r.data.error || '') + '\n\n是否强制重发？（会新增一条推送记录，此前的留痕保留供对账）';
                if (confirm(msg)) { await pfConfirmPush(taskId, true); return; }
                return;
            }
            pfApiErr(r, '推送失败'); return;
        }
        const s = r.data.summary || {};
        let msg = `推送完成：成功 ${s.success || 0} · 失败 ${s.failed || 0} · 跳过 ${s.skipped || 0}`;
        showToast(msg, (s.failed || s.skipped) ? 'warning' : 'success', 5000);
        if (r.data.warning) showToast(r.data.warning, 'warning', 9000);
        // 改造（2026-07-06）：姓名由 admin 录入、不向钉钉查，无 name/last4 drift 概念，删除 snapshot_warning 提示。
        pfPreviewItems[taskId] = null;
        await pfLoadPushHistory(runId);
        pfRenderTaskList();
    }

    async function pfLoadPushHistory(runId) {
        const r = await pfApi('/periodic-tasks/runs/' + runId + '/pushes');
        if (!r.ok) return;
        pfPushHistory[runId] = (r.data && r.data.items) || [];
    }

    // 推送留痕状态 → 中文标签 + CSS 修饰键。M-2（⑤d）：push_status='failed' 且 push_error 含
    //   SUPERSEDED_BY_FORCE 的行不是"钉钉发送失败"，而是"被强制重发替代退出阻断的技术终态"——
    //   单独渲染成中性"已被强制重发替代"标签（灰蓝色，非红），避免 admin 误读为真实发送失败。
    function pfPushStatusMeta(p) {
        const isSuperseded = p && typeof p.push_error === 'string' && p.push_error.indexOf('SUPERSEDED_BY_FORCE') >= 0;
        if (isSuperseded) return { key: 'superseded', label: '已被强制重发替代' };
        const LABELS = { success: '成功', failed: '失败', skipped: '跳过', pending: '处理中' };
        return { key: p.push_status, label: LABELS[p.push_status] || p.push_status };
    }
    // 〔S5a-fix MED-6〕收件人推送态的 class 片段白名单 + gate（S0 甲7 收口）。
    //   原写法 `pushed_${esc(meta.key)}` 里 meta.key 直接来自 `p.push_status`（后端原值），
    //   esc 只防 HTML 注入、不防"产出一个没有规则的 class"——终审 M 要的是白名单，不是转义。
    const PF_RECIP_CLASS = Object.freeze({
        success: 'pushed_success', failed: 'pushed_failed', skipped: 'pushed_skipped',
        pending: 'pushed_pending', superseded: 'pushed_superseded',
    });
    function pfRecipClass(k) {
        if (Object.prototype.hasOwnProperty.call(PF_RECIP_CLASS, k)) return PF_RECIP_CLASS[k];
        console.warn('[Periodic_Fetch.pfRecipClass] 推送态不在徽章白名单内，降级为无修饰类：', k);
        return '';
    }
    function pfRenderPushHistoryRow(p) {
        const meta = pfPushStatusMeta(p);
        // L-2（⑤e，codex 09 收口）：① superseded 行隐藏内部哨兵串（SUPERSEDED_BY_FORCE），改固定中文说明；
        //   ② 真实 failed 的错误详情恢复红色告警感知（⑤d 曾统一改灰导致失败感知下降）；③ 其余状态中性灰。
        let errNote = '';
        if (meta.key === 'superseded') {
            errNote = `<div style="font-size:11px;color:#94a3b8;">该记录已被后续强制重发替代（原投递状态未落库，留痕备查）</div>`;
        } else if (p.push_error) {
            const errColor = meta.key === 'failed' ? '#b91c1c' : '#94a3b8';
            errNote = `<div style="font-size:11px;color:${errColor};">${esc(p.push_error)}</div>`;
        }
        return `<tr><td>${esc(p.phone_snapshot)}</td><td>${esc(p.recipient_name_snapshot || '—')}</td>`
            + `<td><span class="pf-recip-status ${pfRecipClass(meta.key)}">${esc(meta.label)}</span>${errNote}</td>`
            + `<td>${esc(p.pushed_at)}</td></tr>`;
    }

    // ============================================================
    // 登记新任务
    // ============================================================
    function pfToggleNewCard() {
        const c = document.getElementById('pfNewCard');
        const show = c.style.display === 'none';
        c.style.display = show ? 'block' : 'none';
        if (show) c.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function pfCreateTask() {
        const name = (document.getElementById('pfNewName').value || '').trim();
        const desc = (document.getElementById('pfNewDesc').value || '').trim();
        const connId = Number(document.getElementById('pfNewConn').value || 0);
        const sql = document.getElementById('pfNewSql').value || '';
        if (!name) { showToast('任务名不能为空', 'error'); return; }
        if (!connId) { showToast('请选择目标业务库', 'error'); return; }
        if (!sql.trim()) { showToast('模板脚本不能为空', 'error'); return; }
        const btn = document.getElementById('pfNewSaveBtn');
        btn.disabled = true;
        try {
            const r = await pfApi('/periodic-tasks', { method: 'POST', body: { task_name: name, description: desc, source_connection_id: connId, script_template: sql } });
            if (!r.ok) { pfApiErr(r, '保存失败'); return; }
            showToast('登记成功', 'success');
            document.getElementById('pfNewName').value = '';
            document.getElementById('pfNewDesc').value = '';
            document.getElementById('pfNewSql').value = '';
            pfToggleNewCard();
            await pfLoadTasks();
        } finally {
            btn.disabled = false;
        }
    }
    </script>
</body>
</html>
