<head>

    <link rel="icon" href="data:,">
    <!-- ECharts 图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css?v=v1.117.0_fabdrag">
    <link rel="stylesheet" href="assets/css/components.css?v=v1.110.4_unify">
    <style>
        /* ============================================================
           统计中心·效率统计页 · 页面专属残留（共享组件层见 assets/css/components.css）
           前端统一改造（v1.0）：整页从"老任务池统计（工时/按时率/分类/优先级/团队）"重造为
           "四业务模块全生命周期分阶段时效统计"，借机迁入统一体系。计数卡/表格/排序/分页复用
           共享层 u- 组件；本页专属只剩容器布局/图表卡片/模块 tab/状态徽章修饰色（未并入共享层）。
           ============================================================ */

        .eff-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .eff-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .eff-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .eff-title-icon {
            font-size: 1.2em;
        }

        .eff-time-filter select {
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95em;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .eff-time-filter select:hover { border-color: #d97706; }
        .eff-time-filter select:focus {
            outline: none;
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
        }

        /* ===== ① 四模块效率卡片（聚合层主视图，UI 改版 2026-07-10 用户拍板）=====
           主数字=平均任务时长（仅完结单）+ 副行样本口径 + 卡内纯 CSS 三段堆叠条（不用 echarts——
           四张静态占比条用 div 宽度百分比即可，零实例开销、无 resize 心智，可维护性优先） */
        .eff-module-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        @media (max-width: 1100px) {
            .eff-module-cards { grid-template-columns: repeat(2, 1fr); }
        }
        .eff-module-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .eff-module-card:hover { border-color: #d97706; box-shadow: 0 2px 8px rgba(217, 119, 6, 0.08); }
        .eff-module-card.active { border-color: #d97706; background: #fffbeb; }
        .eff-card-title { font-size: 13px; font-weight: 600; color: #4a5568; }
        .eff-card-num { font-size: 26px; font-weight: 700; color: #111827; margin: 6px 0 2px; }
        .eff-card-sub { font-size: 11px; color: #6b7280; margin-bottom: 10px; }
        .eff-card-bar {
            display: flex;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            background: #f1f5f9;
        }
        .eff-card-bar .eff-seg { height: 100%; }
        .eff-card-bar .eff-seg-0 { background: #3182ce; }
        .eff-card-bar .eff-seg-1 { background: #d69e2e; }
        .eff-card-bar .eff-seg-2 { background: #38a169; }
        .eff-card-legend {
            display: flex;
            gap: 10px;
            font-size: 11px;
            color: #4a5568;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .eff-card-legend .eff-dot {
            width: 8px; height: 8px; border-radius: 2px;
            display: inline-block; margin-right: 4px; vertical-align: baseline;
        }
        .eff-card-legend .eff-dot-0 { background: #3182ce; }
        .eff-card-legend .eff-dot-1 { background: #d69e2e; }
        .eff-card-legend .eff-dot-2 { background: #38a169; }
        .eff-card-empty { font-size: 12px; color: #a0aec0; margin-top: 8px; }

        /* 图表卡片（对齐旧页 .chart-container 观感，未并入共享层——组件层暂无通用"图表卡"抽象） */
        .eff-chart-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .eff-chart-title {
            font-size: 1.05em;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .eff-chart-title .eff-chart-title-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .eff-chart-box {
            height: 300px;
            width: 100%;
        }

        .eff-chart-hint {
            font-size: 0.78em;
            color: #a0aec0;
            margin-top: 8px;
        }

        /* 模块下钻 tab（点选切换明细表所属模块；组件层无通用 tab 抽象，页面专属） */
        .eff-module-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .eff-tab {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #4a5568;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.15s;
        }

        .eff-tab:hover { border-color: #d97706; color: #d97706; }
        .eff-tab.active {
            background: #d97706;
            border-color: #d97706;
            color: #fff;
            font-weight: 600;
        }

        /* 明细下钻控制区（模块 tab + 类型筛选，同一行） */
        .eff-detail-controls {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .eff-type-filter {
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #4a5568;
            font-size: 0.85em;
            cursor: pointer;
        }
        .eff-type-filter:hover { border-color: #d97706; }

        /* 按类型细分小表（用户口径②：某一类任务的平均整体/分阶段耗时；复用 u-corr-table 观感，
           缩小字号/内边距区别于主明细表，行不可点击——不复用主表的 hover/cursor 语义） */
        .eff-type-breakdown-wrap {
            overflow-x: auto;
            margin-bottom: 16px;
        }
        .eff-type-breakdown-table {
            min-width: 600px;
        }
        .eff-type-breakdown-table th,
        .eff-type-breakdown-table td {
            padding: 8px 12px;
            font-size: 12px;
        }
        .eff-type-breakdown-table tbody tr {
            cursor: pointer;
        }
        .eff-type-breakdown-table tbody tr:hover { background: #fffbeb; }
        .eff-type-breakdown-table tbody tr.active { background: #fef3c7; }
        .eff-type-breakdown-table .eff-type-name { font-weight: 600; color: #2d3748; }

        /* 明细表状态徽章（status_group 三态配色，非逐状态码——detail 表跨 4 模块共 20+ 种原始状态码，
           用统一的"完成/在途/异常终止"三态配色比逐码上色更利于快速扫描瓶颈单，颜色语义与计数卡一致） */
        .u-status-badge.s-done { background: #d1fae5; color: #065f46; }
        .u-status-badge.s-inflight { background: #dbeafe; color: #1d4ed8; }
        .u-status-badge.s-aborted { background: #f3f4f6; color: #6b7280; }

        .unified-page .u-corr-table tbody tr { cursor: default; }
        .eff-empty-cell { color: #cbd5e0; }
    </style>
</head>

    <script>
        // ============================================
        // 全局状态
        // ============================================
        const MODULE_ORDER = ['correction', 'issue', 'collab', 'sys'];
        const MODULE_LABELS = { correction: '数据修正', issue: '数据开发', collab: '数据协作', sys: '系统迭代' };
        const STAGE_COLORS = ['#3182ce', '#d69e2e', '#38a169', '#805ad5'];
        const STATUS_GROUP_LABEL = { done: '完成', inflight: '在途', aborted: '异常终止' };

        // 类型码 → 中文标签（各模块用自己的受控枚举字段：issues.type 本身已是中文，无需转换）。
        // correction_type 只有 2 值（单条/批量，procedural 粒度粗于 issue/sys 的业务分类，见方案报告）。
        const TYPE_LABELS = {
            correction: { single: '单条', batch: '批量' },
            issue: {}, // issues.type 落库本身就是中文（数据质量/看板报表需求等），透传显示
            collab: {
                DASHBOARD_NEW: '看板新增', METRIC_CHANGE: '指标改造',
                METRIC_ADD_FROM_SOURCE: '业务变更增指标', ONE_OFF_EXPORT: '一次性取数',
                CONFIRMED: '待领取(旧)', CLAIMED: '进行中(旧)',
            },
            sys: { bug: 'BUG', feature: '新功能', improvement: '优化', config: '配置变更' },
        };
        function typeLabel(moduleKey, type) {
            const map = TYPE_LABELS[moduleKey] || {};
            return map[type] || type || '(未分类)';
        }

        let trendLineChartInstance = null;
        let effAggregate = null;          // 最近一次 /api/statistics/efficiency 响应
        let currentModule = 'correction'; // 明细表当前模块
        let currentStages = [];           // 当前模块阶段标签（三段统一：开发响应/处理中/验收归档）
        let currentDetailRows = [];       // 当前模块扁平化后的明细行（供 attachTableSort 排序）
        let currentTypeFilter = '';       // 类型筛选（''=全部类型）
        const detailCache = new Map();    // `${days}_${module}` -> 扁平化行数组

        // ============================================
        // 时长人性化（<24h 显小时，>=24h 显天）
        // ============================================
        function formatHours(h) {
            if (h === null || h === undefined || !Number.isFinite(h)) return '-';
            if (h < 24) return (Math.round(h * 10) / 10) + ' 小时';
            return (Math.round((h / 24) * 10) / 10) + ' 天';
        }

        // ============================================
        // 数据加载
        // ============================================
        function currentDays() {
            return document.getElementById('timeRange').value;
        }

        async function onTimeRangeChange() {
            detailCache.clear();
            await loadEfficiencyStats();
        }

        async function loadEfficiencyStats() {
            const days = currentDays();
            const res = await authFetch(`/api/statistics/efficiency?days=${days}`);
            if (!res) return;
            if (!res.ok) {
                console.error('效率统计聚合加载失败', res.status);
                return;
            }
            effAggregate = await res.json();
            renderModuleCards(effAggregate.modules);
            renderTrendChart(effAggregate.trend);
            const moduleInfo = effAggregate.modules.find((m) => m.module === currentModule);
            currentStages = moduleInfo ? moduleInfo.stages : [];
            buildDetailTableHead(currentStages);
            renderTypeBreakdown(moduleInfo);
            populateTypeFilter(moduleInfo);
            await loadDetailRows(currentModule);
            detailSorter.init();
            detailSorter.render();
        }

        async function loadDetailRows(moduleKey) {
            const days = currentDays();
            const cacheKey = `${days}_${moduleKey}`;
            if (detailCache.has(cacheKey)) {
                currentDetailRows = detailCache.get(cacheKey);
                return;
            }
            const res = await authFetch(`/api/statistics/efficiency/detail?module=${moduleKey}&days=${days}`);
            if (!res || !res.ok) {
                currentDetailRows = [];
                return;
            }
            const data = await res.json();
            currentStages = data.stages || [];
            const rows = (data.rows || []).map((r) => {
                const flat = {
                    id: r.id,
                    title: r.title,
                    created_at: r.created_at,
                    status: r.status,
                    status_group: r.status_group,
                    type: r.type,
                    total_hours: r.total_hours,
                };
                (r.stage_hours || []).forEach((v, idx) => { flat['stage' + idx] = v; });
                return flat;
            });
            detailCache.set(cacheKey, rows);
            currentDetailRows = rows;
        }

        // ============================================
        // 类型筛选（用户口径②：明细表按类型过滤，客户端过滤——数据量小，复用 currentDetailRows 缓存）
        // ============================================
        function populateTypeFilter(moduleInfo) {
            const select = document.getElementById('typeFilter');
            const types = moduleInfo ? moduleInfo.byType.map((t) => t.type) : [];
            select.innerHTML = '<option value="">全部类型</option>' +
                types.map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(typeLabel(currentModule, t))}</option>`).join('');
            currentTypeFilter = '';
            select.value = '';
        }

        function onTypeFilterChange() {
            currentTypeFilter = document.getElementById('typeFilter').value;
            syncTypeBreakdownActive();
            detailSorter.render();
        }

        function syncTypeBreakdownActive() {
            document.querySelectorAll('#typeBreakdownBody tr').forEach((tr) => {
                tr.classList.toggle('active', tr.dataset.type === currentTypeFilter);
            });
        }

        // ============================================
        // 按类型细分小表（用户口径②：某一类任务的平均整体/分阶段耗时；点行=设置类型筛选）
        // ============================================
        function renderTypeBreakdown(moduleInfo) {
            const thead = document.getElementById('typeBreakdownHead');
            const tbody = document.getElementById('typeBreakdownBody');
            if (!moduleInfo || !moduleInfo.byType || moduleInfo.byType.length === 0) {
                thead.innerHTML = '';
                tbody.innerHTML = '';
                return;
            }
            const stages = moduleInfo.stages;
            let headCols = `<th>类型</th><th>完成</th><th>在途</th><th>异常终止</th>`;
            stages.forEach((label) => { headCols += `<th>${escapeHtml(label)}中位</th>`; });
            headCols += `<th>总周期中位</th>`;
            thead.innerHTML = `<tr>${headCols}</tr>`;

            tbody.innerHTML = moduleInfo.byType.map((t) => {
                let cells = `
                    <td class="eff-type-name">${escapeHtml(typeLabel(moduleInfo.module, t.type))}</td>
                    <td>${t.counts.done}</td>
                    <td>${t.counts.inflight}</td>
                    <td>${t.counts.aborted}</td>`;
                t.stageStats.forEach((st) => {
                    cells += `<td>${st.median === null ? '<span class="eff-empty-cell">—</span>' : escapeHtml(formatHours(st.median))}</td>`;
                });
                cells += `<td><strong>${t.totalStats.median === null ? '-' : escapeHtml(formatHours(t.totalStats.median))}</strong></td>`;
                return `<tr data-type="${escapeHtml(t.type)}">${cells}</tr>`;
            }).join('');

            tbody.querySelectorAll('tr').forEach((tr) => {
                tr.addEventListener('click', () => {
                    const type = tr.dataset.type;
                    document.getElementById('typeFilter').value = currentTypeFilter === type ? '' : type;
                    currentTypeFilter = document.getElementById('typeFilter').value;
                    syncTypeBreakdownActive();
                    detailSorter.render();
                });
            });
        }

        // ============================================
        // ① 四模块效率卡片（主数字=平均任务时长·仅完结单 + 三段 CSS 堆叠条 + 图例 + 副行计数）
        //   堆叠条用纯 CSS（div 宽度百分比）而非 echarts：四张静态占比条无交互需求，零实例开销/
        //   无 resize 心智，hover 精确值用 title；段宽按三段 avg 占比（后端保证三段可加=总平均）。
        // ============================================
        function renderModuleCards(modules) {
            const wrap = document.getElementById('moduleCards');
            const days = currentDays();
            const scopeText = days === 'all' ? '全部时间' : `近 ${days} 天`;

            wrap.innerHTML = modules.map((m) => {
                const doneN = m.counts.done;
                const subLine = `${scopeText}完结 ${doneN} 单 · 在途 ${m.counts.inflight} · 终止 ${m.counts.aborted}`;
                const avgs = m.stageStats.map((st) => st.avg || 0);
                const segSum = avgs.reduce((a, b) => a + b, 0);
                const hasBar = m.totalStats.count > 0 && segSum > 0;

                let barHtml;
                if (hasBar) {
                    const segsHtml = avgs.map((v, i) => {
                        const width = (v / segSum * 100).toFixed(2);
                        const st = m.stageStats[i];
                        return `<div class="eff-seg eff-seg-${i}" style="width:${width}%;" title="${escapeHtml(st.label)}：平均 ${escapeHtml(formatHours(st.avg))}（${width}%）"></div>`;
                    }).join('');
                    const legendHtml = m.stageStats.map((st, i) =>
                        `<span><span class="eff-dot eff-dot-${i}"></span>${escapeHtml(st.label)} ${escapeHtml(formatHours(st.avg))}</span>`
                    ).join('');
                    barHtml = `<div class="eff-card-bar">${segsHtml}</div><div class="eff-card-legend">${legendHtml}</div>`;
                } else {
                    barHtml = `<div class="eff-card-bar"></div><div class="eff-card-empty">该范围内暂无完结单</div>`;
                }

                return `
                    <div class="eff-module-card${m.module === currentModule ? ' active' : ''}" data-module="${m.module}"
                         title="点击下钻到 ${escapeHtml(m.label)} 明细">
                        <div class="eff-card-title">${escapeHtml(m.label)}</div>
                        <div class="eff-card-num" data-avg-total="${m.totalStats.avg === null ? '' : m.totalStats.avg}">${m.totalStats.count > 0 ? escapeHtml(formatHours(m.totalStats.avg)) : '—'}</div>
                        <div class="eff-card-sub">${escapeHtml(subLine)}</div>
                        ${barHtml}
                    </div>`;
            }).join('');

            wrap.querySelectorAll('.eff-module-card').forEach((card) => {
                card.addEventListener('click', () => selectModule(card.dataset.module));
            });
        }

        function syncModuleCardsActive() {
            document.querySelectorAll('#moduleCards .eff-module-card').forEach((card) => {
                card.classList.toggle('active', card.dataset.module === currentModule);
            });
        }

        // ============================================
        // ② 总周期月度趋势折线
        // ============================================
        function renderTrendChart(trend) {
            const container = document.getElementById('trendLineChart');
            if (!trendLineChartInstance) trendLineChartInstance = echarts.init(container);

            if (!trend || trend.length === 0) {
                trendLineChartInstance.setOption({
                    title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#a0aec0' } },
                }, true);
                return;
            }

            const series = MODULE_ORDER.map((key, idx) => ({
                name: MODULE_LABELS[key],
                type: 'line',
                connectNulls: true,
                itemStyle: { color: STAGE_COLORS[idx % STAGE_COLORS.length] },
                data: trend.map((p) => p[key]),
            }));

            const option = {
                tooltip: {
                    trigger: 'axis',
                    valueFormatter: (v) => formatHours(v),
                },
                legend: { data: series.map((s) => s.name), bottom: 0 },
                grid: { left: '3%', right: '4%', bottom: '15%', top: '10%', containLabel: true },
                xAxis: { type: 'category', data: trend.map((p) => p.month) },
                yAxis: { type: 'value', name: '小时', axisLabel: { formatter: '{value}h' } },
                series,
            };
            trendLineChartInstance.setOption(option, true);
        }

        // ============================================
        // ④ 下钻明细表
        // ============================================
        function buildDetailTableHead(stages) {
            const thead = document.getElementById('detailTableHead');
            let cols = `
                <th style="width:70px;" class="u-sortable" data-sort-by="id">ID<span class="u-sort-icon">⇅</span></th>
                <th style="min-width:220px;" class="u-sortable" data-sort-by="title">标题<span class="u-sort-icon">⇅</span></th>
                <th style="width:100px;" class="u-sortable" data-sort-by="type">类型<span class="u-sort-icon">⇅</span></th>
                <th style="width:150px;" class="u-sortable" data-sort-by="created_at">创建时间<span class="u-sort-icon">⇅</span></th>
                <th style="width:110px;" class="u-sortable" data-sort-by="status_group">状态<span class="u-sort-icon">⇅</span></th>`;
            stages.forEach((label, idx) => {
                cols += `<th style="width:110px;" class="u-sortable" data-sort-by="stage${idx}">${escapeHtml(label)}<span class="u-sort-icon">⇅</span></th>`;
            });
            cols += `<th style="width:110px;" class="u-sortable" data-sort-by="total_hours">总时长<span class="u-sort-icon">⇅</span></th>`;
            thead.innerHTML = `<tr>${cols}</tr>`;
        }

        function renderDetailRows(pageRows) {
            const tbody = document.getElementById('detailTableBody');
            const emptyState = document.getElementById('detailEmptyState');
            const table = document.getElementById('detailTable');

            if (!currentDetailRows.length) {
                table.style.display = 'none';
                document.getElementById('detailPagination').style.display = 'none';
                emptyState.style.display = '';
                tbody.innerHTML = '';
                return;
            }
            table.style.display = '';
            document.getElementById('detailPagination').style.display = '';
            emptyState.style.display = 'none';

            tbody.innerHTML = pageRows.map((r) => {
                let stageCells = '';
                for (let i = 0; i < currentStages.length; i++) {
                    const v = r['stage' + i];
                    stageCells += `<td>${v === null || v === undefined ? '<span class="eff-empty-cell">—</span>' : escapeHtml(formatHours(v))}</td>`;
                }
                const groupLabel = STATUS_GROUP_LABEL[r.status_group] || r.status_group;
                return `
                    <tr>
                        <td>#${r.id}</td>
                        <td class="ellip" title="${escapeHtml(r.title || '')}">${escapeHtml(r.title || '')}</td>
                        <td>${escapeHtml(typeLabel(currentModule, r.type))}</td>
                        <td>${escapeHtml(r.created_at || '')}</td>
                        <td>${UnifyHelpers.statusBadge(r.status_group, `${groupLabel}（${escapeHtml(r.status)}）`)}</td>
                        ${stageCells}
                        <td><strong>${r.total_hours === null || r.total_hours === undefined ? '-' : escapeHtml(formatHours(r.total_hours))}</strong></td>
                    </tr>`;
            }).join('');
        }

        const DETAIL_FIELD_TYPES = {
            id: 'number',
            title: 'string',
            type: 'labelMap',
            created_at: 'date',
            status_group: 'statusOrder',
            stage0: 'number',
            stage1: 'number',
            stage2: 'number',
            total_hours: 'number',
        };
        // getList 对 currentDetailRows 应用类型筛选（客户端过滤，数据量小；筛选变化后调 detailSorter.render()
        // 天然回第 1 页——attachPagination 契约）。labelMap 排序取当前模块的 typeLabel 现取（getter 函数），
        // 防止切模块后 TYPE_LABELS 命名空间不同导致排序错位（对齐 unify-helpers.js labelMap MED-1 教训）。
        const detailSorter = UnifyHelpers.attachTableSort({
            tableSelector: '#detailTable',
            fieldTypes: DETAIL_FIELD_TYPES,
            statusOrder: { status_group: { inflight: 0, aborted: 1, done: 2 } },
            labelMaps: { type: () => TYPE_LABELS[currentModule] || {} },
            getList: () => currentTypeFilter ? currentDetailRows.filter((r) => r.type === currentTypeFilter) : currentDetailRows,
            render: renderDetailRows,
            defaultSort: { field: 'id', dir: 'desc' },
            pagination: { containerSelector: '#detailPagination' },
        });

        // ============================================
        // 模块 tab（下钻切换）
        // ============================================
        function initModuleTabs() {
            const container = document.getElementById('moduleTabs');
            container.innerHTML = MODULE_ORDER.map((key) => `
                <button type="button" class="eff-tab${key === currentModule ? ' active' : ''}" data-module="${key}">${escapeHtml(MODULE_LABELS[key])}</button>
            `).join('');
            container.querySelectorAll('.eff-tab').forEach((btn) => {
                btn.addEventListener('click', () => selectModule(btn.dataset.module));
            });
        }

        function syncModuleTabsActive() {
            document.querySelectorAll('#moduleTabs .eff-tab').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.module === currentModule);
            });
        }

        async function selectModule(moduleKey) {
            if (!MODULE_ORDER.includes(moduleKey) || moduleKey === currentModule) {
                if (moduleKey === currentModule) return;
            }
            currentModule = moduleKey;
            syncModuleTabsActive();
            syncModuleCardsActive();
            const moduleInfo = effAggregate && effAggregate.modules.find((m) => m.module === moduleKey);
            currentStages = moduleInfo ? moduleInfo.stages : [];
            buildDetailTableHead(currentStages);
            renderTypeBreakdown(moduleInfo);
            populateTypeFilter(moduleInfo); // 切模块类型集不同，重置筛选为"全部类型"
            await loadDetailRows(moduleKey);
            detailSorter.init();
            detailSorter.render();
        }

        // ============================================
        // 页面初始化
        // ============================================
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof checkAuth === 'function') {
                const ok = await checkAuth();
                if (!ok) return;
            }
            if (typeof adjustNavbarForRole === 'function') adjustNavbarForRole();

            initModuleTabs();
            await loadEfficiencyStats();
        });

        window.addEventListener('resize', () => {
            if (trendLineChartInstance) trendLineChartInstance.resize();
        });
    </script>
</body>

</html>
