<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css?v=1.2">
    <style>
        /* 统计中心专用样式 */
        .stats-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .stats-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stats-title-icon {
            font-size: 1.2em;
        }

        .time-filter {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .time-filter select {
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95em;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .time-filter select:hover {
            border-color: #d97706;
        }

        .time-filter select:focus {
            outline: none;
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* 统计卡片网格 */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .stat-card-label {
            font-size: 0.85em;
            color: #718096;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-card-value {
            font-size: 2em;
            font-weight: 700;
            color: #2d3748;
        }

        .stat-card-sub {
            font-size: 0.8em;
            color: #a0aec0;
            margin-top: 4px;
        }

        /* 不同状态卡片颜色 */
        .stat-card.open .stat-card-value { color: #3182ce; }
        .stat-card.claimed .stat-card-value { color: #d69e2e; }
        .stat-card.pending .stat-card-value { color: #805ad5; }
        .stat-card.done .stat-card-value { color: #38a169; }
        .stat-card.hold .stat-card-value { color: #e53e3e; }
        .stat-card.rate .stat-card-value { color: #d97706; }
        .stat-card.hours .stat-card-value { color: #9f7aea; }

        /* 卡片图标样式 */
        .stat-card-label .icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .stat-card.open .stat-card-label .icon { stroke: #3182ce; }
        .stat-card.claimed .stat-card-label .icon { stroke: #d69e2e; }
        .stat-card.pending .stat-card-label .icon { stroke: #805ad5; }
        .stat-card.done .stat-card-label .icon { stroke: #38a169; }
        .stat-card.hold .stat-card-label .icon { stroke: #e53e3e; }
        .stat-card.rate .stat-card-label .icon { stroke: #d97706; }
        .stat-card.hours .stat-card-label .icon { stroke: #9f7aea; }

        /* 图表标题图标 */
        .chart-title .icon {
            width: 18px;
            height: 18px;
            stroke: #d97706;
        }

        /* 按钮图标 */
        .refresh-btn .icon {
            width: 14px;
            height: 14px;
            stroke: currentColor;
        }

        /* 图表区域 */
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
        }

        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }

        .chart-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-box {
            height: 300px;
            width: 100%;
        }

        /* 团队排行表格 */
        .team-table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            margin-bottom: 24px;
        }

        .team-table {
            width: 100%;
            border-collapse: collapse;
        }

        .team-table th,
        .team-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .team-table th {
            background: #f7fafc;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.9em;
        }

        .team-table tr:hover {
            background: #f7fafc;
        }

        .team-table .rank {
            font-weight: 700;
            color: #d97706;
            width: 60px;
        }

        .team-table .rank-1 { color: #d69e2e; }
        .team-table .rank-2 { color: #a0aec0; }
        .team-table .rank-3 { color: #c27c45; }

        .progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            min-width: 100px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d97706, #b45309);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* 加载状态 */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: #718096;
        }

        .loading-spinner::after {
            content: '';
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #d97706;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 16px;
        }

        /* 刷新按钮 */
        .refresh-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #d97706, #b45309);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 工时统计卡片 */
        .hours-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .hours-stat-item {
            text-align: center;
        }

        .hours-stat-value {
            font-size: 1.5em;
            font-weight: 700;
            color: #2d3748;
        }

        .hours-stat-label {
            font-size: 0.8em;
            color: #718096;
        }
    </style>
</head>

                    <div class="stat-card-sub">等待开发认领</div>
                </div>
                <div class="stat-card claimed">
                    <div class="stat-card-label">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                <div class="chart-title">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    团队产能排行
                </div>
                <table class="team-table" id="teamTable">
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>成员</th>
                            <th>完成任务</th>
                            <th>总工时</th>
                            <th>平均工时</th>
                            <th>任务分布</th>
                            <th>产能占比</th>
                        </tr>
                    </thead>
                    <tbody id="teamTableBody">
                        <tr>
                            <td colspan="7" class="loading-spinner"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="assets/js/app.js"></script>
    <script>
        // ============================================
        // 全局变量
        // ============================================
        // currentUser 已在 app.js 中定义
        let trendChartInstance = null;
        let categoryChartInstance = null;
        let priorityChartInstance = null;
        let hoursChartInstance = null;

        // ============================================
        // 认证相关
        // ============================================
        // authFetch 函数已在 app.js 中定义，此处不再重复

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
                    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
                ).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        // ============================================
        // 用户界面渲染
        // ============================================
        function renderUserProfile() {
            const token = localStorage.getItem('token');
            const area = document.getElementById('userProfileArea');
            if (!token) {
                area.innerHTML = `<a href="/login.html" class="nav-item">登录</a>`;
                return;
            }
            currentUser = parseJwt(token);
            if (!currentUser) {
                area.innerHTML = `<a href="/login.html" class="nav-item">登录</a>`;
                return;
            }
            const isAdmin = currentUser.role === 'admin';
            const roleText = isAdmin ? '管理员' : (currentUser.role === 'publisher' ? '发布者' : (currentUser.role === 'viewer' ? '查看者' : '开发者'));
            const avatarChar = (currentUser.display_name || currentUser.username || 'U').charAt(0).toUpperCase();
            const displayName = currentUser.display_name || currentUser.username;

            // 构造下拉菜单项（与 app.js 中 updateUserUI 保持一致）
            let menuItems = '';
            if (isAdmin) {
                menuItems += `<a href="/admin.html" style="text-decoration:none;">👥 用户管理</a>`;
            }
            menuItems += `<a href="#" onclick="openChangePasswordModal()">🔑 修改密码</a>`;
            menuItems += `<a href="#" onclick="logout()" style="color:#e53e3e;">🚪 退出登录</a>`;

            area.innerHTML = `
                <div class="dropdown">
                    <div class="user-profile">
                        <div class="avatar-circle">${avatarChar}</div>
                        <div class="profile-info">
                            <span class="profile-name">${displayName}</span>
                            <span class="profile-role">${roleText}</span>
                        </div>
                        <span style="font-size:0.8em;color:#a0aec0;">▼</span>
                    </div>
                    <div class="dropdown-content">
                        ${menuItems}
                    </div>
                </div>
            `;
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        // ============================================
        // 数据加载
        // ============================================
        async function loadAllStats() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.disabled = true;
            refreshBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 加载中...';

            try {
                const days = document.getElementById('timeRange').value;
                await Promise.all([
                    loadSummary(days),
                    loadTrend(days),
                    loadCategory(days),
                    loadPriority(days),
                    loadHours(days),
                    loadTeam(days)
                ]);
            } catch (error) {
                console.error('加载统计数据失败:', error);
                alert('加载数据失败，请刷新重试');
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> 刷新数据';
            }
        }

        // 加载汇总数据
        async function loadSummary(days) {
            const url = days === 'all' ? '/api/statistics/summary' : `/api/statistics/summary?days=${days}`;
            const res = await authFetch(url);
            if (!res) return;
            const data = await res.json();

            document.getElementById('openCount').textContent = data.open || 0;
            document.getElementById('claimedCount').textContent = data.claimed || 0;
            document.getElementById('pendingCount').textContent = data.done || 0;  // 待验收 = DONE状态
            document.getElementById('doneCount').textContent = data.archived || 0;  // 已完成 = ARCHIVED状态
            document.getElementById('holdCount').textContent = data.hold || 0;
            document.getElementById('completionRate').textContent = (data.completionRate || 0).toFixed(1) + '%';
            document.getElementById('avgHours').textContent = (data.avgHours || 0).toFixed(1) + 'h';
        }

        // 加载趋势数据
        async function loadTrend(days) {
            const url = days === 'all' ? '/api/statistics/trend' : `/api/statistics/trend?days=${days}`;
            const res = await authFetch(url);
            if (!res) return;
            const data = await res.json();

            renderTrendChart(data);
        }

        // 加载类型分布
        async function loadCategory(days) {
            const url = days === 'all' ? '/api/statistics/category' : `/api/statistics/category?days=${days}`;
            const res = await authFetch(url);
            if (!res) return;
            const data = await res.json();

            renderCategoryChart(data);
        }

        // 加载优先级分布
        async function loadPriority(days) {
            const url = days === 'all' ? '/api/statistics/priority' : `/api/statistics/priority?days=${days}`;
            const res = await authFetch(url);
            if (!res) return;
            const data = await res.json();

            renderPriorityChart(data);
        }

        // 加载工时统计
        async function loadHours(days) {
            const url = days === 'all' ? '/api/statistics/hours' : `/api/statistics/hours?days=${days}`;
            const res = await authFetch(url);
            if (!res) return;
            const data = await res.json();

            document.getElementById('totalActualHours').textContent = (data.totalActual || 0).toFixed(1) + 'h';
            document.getElementById('totalEstimatedHours').textContent = (data.totalEstimated || 0).toFixed(1) + 'h';
            document.getElementById('onTimeRate').textContent = (data.onTimeRate || 0).toFixed(1) + '%';

            renderHoursChart(data);
        }

        // 加载团队数据
        async function loadTeam(days) {
            const url = days === 'all' ? '/api/statistics/team' : `/api/statistics/team?days=${days}`;
            const res = await authFetch(url);
            if (!res) return;
            const data = await res.json();

            renderTeamTable(data);
        }

        // ============================================
        // 图表渲染
        // ============================================

        // 趋势图
        function renderTrendChart(data) {
            const container = document.getElementById('trendChart');
            if (!trendChartInstance) {
                trendChartInstance = echarts.init(container);
            }

            if (!data || data.length === 0) {
                trendChartInstance.setOption({
                    title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#a0aec0' } }
                });
                return;
            }

            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' }
                },
                legend: {
                    data: ['新建任务', '完成任务'],
                    bottom: 0
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '15%',
                    top: '10%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: data.map(d => d.date),
                    axisLabel: {
                        rotate: 45,
                        fontSize: 10
                    }
                },
                yAxis: {
                    type: 'value',
                    minInterval: 1
                },
                series: [
                    {
                        name: '新建任务',
                        type: 'bar',
                        data: data.map(d => d.created),
                        itemStyle: { color: '#d97706' }
                    },
                    {
                        name: '完成任务',
                        type: 'bar',
                        data: data.map(d => d.completed),
                        itemStyle: { color: '#38a169' }
                    }
                ]
            };

            trendChartInstance.setOption(option);
        }

        // 类型分布饼图
        function renderCategoryChart(data) {
            const container = document.getElementById('categoryChart');
            if (!categoryChartInstance) {
                categoryChartInstance = echarts.init(container);
            }

            if (!data || data.length === 0) {
                categoryChartInstance.setOption({
                    title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#a0aec0' } }
                });
                return;
            }

            const colorMap = {
                'ODS_SYNC': '#3182ce',
                'DIM_DEV': '#805ad5',
                'DWD_DEV': '#38a169',
                'ADS_RPT': '#d69e2e',
                'DATA_FIX': '#e53e3e',
                'OTHER': '#718096'
            };

            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {c} ({d}%)'
                },
                legend: {
                    orient: 'vertical',
                    right: '5%',
                    top: 'center'
                },
                series: [
                    {
                        type: 'pie',
                        radius: ['40%', '70%'],
                        center: ['35%', '50%'],
                        avoidLabelOverlap: false,
                        itemStyle: {
                            borderRadius: 6,
                            borderColor: '#fff',
                            borderWidth: 2
                        },
                        label: {
                            show: false
                        },
                        emphasis: {
                            label: {
                                show: true,
                                fontSize: 14,
                                fontWeight: 'bold'
                            }
                        },
                        data: data.map(d => ({
                            name: d.name || d.category,
                            value: d.count,
                            itemStyle: { color: colorMap[d.category] || '#718096' }
                        }))
                    }
                ]
            };

            categoryChartInstance.setOption(option);
        }

        // 优先级分布图
        function renderPriorityChart(data) {
            const container = document.getElementById('priorityChart');
            if (!priorityChartInstance) {
                priorityChartInstance = echarts.init(container);
            }

            if (!data || data.length === 0) {
                priorityChartInstance.setOption({
                    title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#a0aec0' } }
                });
                return;
            }

            const priorityColors = {
                'P0': '#e53e3e',
                'P1': '#d69e2e',
                'P2': '#3182ce',
                'P3': '#718096'
            };

            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' }
                },
                legend: {
                    data: ['已完成', '进行中', '待处理'],
                    bottom: 0
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '15%',
                    top: '10%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: data.map(d => d.priority)
                },
                yAxis: {
                    type: 'value',
                    minInterval: 1
                },
                series: [
                    {
                        name: '已完成',
                        type: 'bar',
                        stack: 'total',
                        data: data.map(d => d.completed),
                        itemStyle: { color: '#38a169' }
                    },
                    {
                        name: '进行中',
                        type: 'bar',
                        stack: 'total',
                        data: data.map(d => d.in_progress),
                        itemStyle: { color: '#d69e2e' }
                    },
                    {
                        name: '待处理',
                        type: 'bar',
                        stack: 'total',
                        data: data.map(d => Math.max(0, d.count - d.completed - d.in_progress)),
                        itemStyle: { color: '#e2e8f0' }
                    }
                ]
            };

            priorityChartInstance.setOption(option);
        }

        // 工时对比图
        function renderHoursChart(data) {
            const container = document.getElementById('hoursChart');
            if (!hoursChartInstance) {
                hoursChartInstance = echarts.init(container);
            }

            const option = {
                tooltip: {
                    trigger: 'item'
                },
                series: [
                    {
                        type: 'gauge',
                        startAngle: 180,
                        endAngle: 0,
                        min: 0,
                        max: 100,
                        splitNumber: 5,
                        itemStyle: {
                            color: '#d97706'
                        },
                        progress: {
                            show: true,
                            roundCap: true,
                            width: 18
                        },
                        pointer: {
                            show: false
                        },
                        axisLine: {
                            roundCap: true,
                            lineStyle: {
                                width: 18,
                                color: [[1, '#e2e8f0']]
                            }
                        },
                        axisTick: { show: false },
                        splitLine: { show: false },
                        axisLabel: { show: false },
                        title: {
                            show: true,
                            offsetCenter: [0, '30%'],
                            fontSize: 14,
                            color: '#718096'
                        },
                        detail: {
                            valueAnimation: true,
                            offsetCenter: [0, '-10%'],
                            fontSize: 28,
                            fontWeight: 'bold',
                            formatter: '{value}%',
                            color: '#2d3748'
                        },
                        data: [
                            {
                                value: data.onTimeRate || 0,
                                name: '工时达成率'
                            }
                        ]
                    }
                ]
            };

            hoursChartInstance.setOption(option);
        }

        // 团队排行表格
        function renderTeamTable(data) {
            const tbody = document.getElementById('teamTableBody');

            if (!data || data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <svg class="empty-state-icon" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#a0aec0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>
                            <div>暂无团队数据</div>
                        </td>
                    </tr>
                `;
                return;
            }

            // 计算最大完成数用于进度条
            const maxCompleted = Math.max(...data.map(d => d.completed_count || 0));

            tbody.innerHTML = data.map((member, index) => {
                const rank = index + 1;
                const rankClass = rank <= 3 ? `rank-${rank}` : '';
                const rankIcon = rank <= 3 ? `<svg viewBox="0 0 24 24" width="20" height="20" fill="${rank === 1 ? '#d69e2e' : rank === 2 ? '#a0aec0' : '#c27c45'}" stroke="none"><circle cx="12" cy="8" r="6"/><path d="M12 14l-4 8h8l-4-8z"/></svg>` : rank;
                const progressWidth = maxCompleted > 0 ? ((member.completed_count || 0) / maxCompleted * 100) : 0;

                // 任务分布
                const taskDist = [];
                if (member.ods_count > 0) taskDist.push(`ODS:${member.ods_count}`);
                if (member.dim_count > 0) taskDist.push(`DIM:${member.dim_count}`);
                if (member.dwd_count > 0) taskDist.push(`DWD:${member.dwd_count}`);
                if (member.ads_count > 0) taskDist.push(`ADS:${member.ads_count}`);
                if (member.fix_count > 0) taskDist.push(`修复:${member.fix_count}`);

                return `
                    <tr>
                        <td class="rank ${rankClass}">${rankIcon}</td>
                        <td><strong>${member.owner || '未知'}</strong></td>
                        <td>${member.completed_count || 0}</td>
                        <td>${(member.total_hours || 0).toFixed(1)}h</td>
                        <td>${(member.avg_hours || 0).toFixed(1)}h</td>
                        <td style="font-size:0.85em;color:#718096;">${taskDist.join(' / ') || '-'}</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progressWidth}%"></div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ============================================
        // 窗口调整
        // ============================================
        window.addEventListener('resize', () => {
            if (trendChartInstance) trendChartInstance.resize();
            if (categoryChartInstance) categoryChartInstance.resize();
            if (priorityChartInstance) priorityChartInstance.resize();
            if (hoursChartInstance) hoursChartInstance.resize();
        });

        // ============================================
        // 页面初始化
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            renderUserProfile();
            loadAllStats();

            // 根据角色调整导航栏（查看者隐藏工作台和任务池）
            if (typeof adjustNavbarForRole === 'function') {
                adjustNavbarForRole();
            }
        });
    </script>
</body>

</html>
