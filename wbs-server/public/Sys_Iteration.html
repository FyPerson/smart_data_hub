        .si-commit-table th { text-align: left; padding: 6px 8px; background: #f8fafc; color: #64748b; font-weight: 600; border-bottom: 1px solid #e2e8f0; }

        /* C7（多开发协作与 commit 留痕重构 v2.9 §11 前端骨架）：chip 内协调人小按钮（开脱/恢复）+ commit

    <script>
    /* ============================================================

       后端契约见 routes/sys-iteration/index.js + transitions.js
       ============================================================ */

    // ---- 全局状态 ----
    let META = null;                 // buildMeta() 结果，启动 fetch 一次缓存
    let META_OK = false;             // meta 是否加载成功（失败降级只读）
    let siUsers = [];                // 可指派用户
    let siList = [];                 // 当前列表
    let siActiveType = 'all';        // 当前类型 tab
    let siActiveStat = '';           // 顶部统计卡筛选（''=全部）
    let siOpenId = null;             // 当前打开的详情单 id
    let siDetail = null;             // 当前详情对象
    let siModalConfirm = null;       // 当前弹框确认回调
    let siCaps = null;               // C7：当前详情的四布尔能力（siComputeCaps 产出，siRenderDrawer 内刷新）

    // 类型中文 label（meta 不返 type label，前端映射；仅展示 meta.typeFlows 里存在的类型）
    const SI_TYPE_LABEL = { bug: 'BUG', feature: '新功能', improvement: '优化', config: '配置变更' };

    // 优先级=风险等级 口径说明（C2，20260713·方案 v1.2 项3）。
    //   SI_PRIORITY_HELP_TEXT = 纯文本口径（单一事实源）：建单/排期表单 label 的 title + aria-label + 详情徽章 title 三处共用，
    //   避免文案多副本漂移（codex60 M-2）。文案为纯中文/全角标点、无英文双引号/&/尖括号，可安全内联进 title 属性。
    //   若未来文案加入这些字符，需改为 HTML 属性转义后再插入。
    const SI_PRIORITY_HELP_TEXT = '优先级即风险等级（按改动风险/影响面，命中多条取最高）：P0 高风险改动核心逻辑、可能引发生产事故/数据错误；P1 影响核心业务流程；P2 一般功能改动；P3 优化项/低风险。';
    // fSelect label 复用（建单表单+排期表单）：可聚焦 ? 图标；title 给鼠标、aria-label 给屏幕阅读器/键盘（codex60 L-2）。
    const SI_PRIORITY_LABEL = `优先级（风险等级） <span class="si-help" tabindex="0" role="img" aria-label="${SI_PRIORITY_HELP_TEXT}" title="${SI_PRIORITY_HELP_TEXT}">?</span>`;

    // 状态 → CSS 语义 key（避免中文类名；含 config 未来态前向兼容）
    const SI_STATUS_CLASS = {
        '待评估': 'pending', '待处理': 'pending',
        '已排期': 'scheduled',
        '开发中': 'dev', '处理中': 'dev',
        '待验证': 'review', '待验收': 'review',
        '待上线': 'prerelease',
        '已上线': 'released', '已生效': 'released',
        '已关闭': 'closed',
        '已暂缓': 'hold',
        '已拒绝': 'rejected',
        '已作废': 'void'
    };
    function siStatusClass(s) { return SI_STATUS_CLASS[s] || 'pending'; }
    const SI_STATUS_GROUPS = {
        active: ['已排期', '开发中', '处理中', '待评估', '待处理'],
        acceptance: ['待验证', '待验收'],
        release: ['待上线'],
        done: ['已上线', '已关闭', '已生效'],
        // codex API 审 MED-1（2026-07-10）：后端状态机含合法旁路态 已暂缓/已拒绝（transitions.js
        //   hold/reject 真实流转入口），原 4 组不覆盖 → 这些单在"全部"计数内但点任一组卡后消失。
        //   补第 5 组；组全集覆盖由 siRenderStats 内守卫兜底（新状态漏归组时 console.warn）。
        paused: ['已暂缓', '已拒绝'],
    };

    // 开发本人（owner）动作集；其余动作归 admin。meta 不暴露 roleGuard，前端做最小 UX 分类，后端仍强制。
    // 注意：unblock（解除受阻）后端是 admin 专属（roleGuard:'admin'），不能归入开发集，否则 admin 看不到、开发点了必 403。
    // [codex 110 号 LOW] set_release_flag 已随 v1.6 R1 全链退场（端点对所有 type 无生效路径、siDoAction case 已删），
    //   从开发动作集移除防未来 meta 回归时被当在册动作放出。
    const SI_DEV_ACTIONS = new Set(['estimate', 'submit', 'feasibility', 'blocked']);
    // 危险按钮样式
    const SI_DANGER_ACTIONS = new Set(['return', 'issue_reject', 'void', 'reopen', 'hold', 'blocked']);
    const SI_SEC_ACTIONS = new Set(['reassign', 'unblock', 'derive', 'close', 'schedule']);
    // [codex29 L-3] 拉群可发起态——⚠️ 须与后端 SYS_CHAT_ALLOWED_STATUSES（index.js）同源：改一端必须改另一端。
    //   （sys 模块动作可见性一贯是前端硬编码镜像后端，未上 capability 字段以保模块一致性；后端有真门槛兜底）。
    const SI_CHAT_STATUSES = ['处理中', '待验证', '待上线'];
    // ── bug 流对接人白名单（Commit ④a，示例发布者 id=7 / 示例对接人 id=13）——⚠️ 三处同步：后端 index.js SYS_BUG_LIAISON_USER_IDS
    //   + 本常量 + scripts/verify-sys-liaison.js（verify 卡三处字面量一致防漂移）。前端仅控 assign/reassign 按钮显隐，
    //   真权限后端 requireAdminOrBugLiaison + type='bug' 精判兜底（前端镜像非授权源）。
    const SI_BUG_LIAISON_USER_IDS = [7, 13];
    function isSiBugLiaison(uid) { return Number(uid) > 0 && SI_BUG_LIAISON_USER_IDS.includes(Number(uid)); }
    // 通知改造 C4：4 类手动通知状态窗口（**前端镜像**后端 index.js SYS_NOTIFY_*_STATUSES 真闸——后端权威、
    //   前端仅控按钮显隐，改一侧须同步另一侧）。F3（2026-07-06 用户拍板，前端可感知变化）：报障人 sendable
    //   去掉「处理中」，与后端 §5.2 sendable 表逐字对齐（旧 ④b-1「受理后活跃态」口径不同）。
    const SI_NOTIFY_DEV_STATUSES = ['处理中'];
    const SI_NOTIFY_RELAY_STATUSES = ['待处理'];
    const SI_NOTIFY_CREATOR_STATUSES = ['待验证', '待上线', '已上线'];
    const SI_NOTIFY_REQUESTER_STATUSES = ['待验证', '待上线', '已上线'];
    const SI_NOTIFY_RELEASE_EXECUTOR_STATUSES = ['待上线'];   // 通知改造 follow-up：镜像后端 SYS_NOTIFY_RELEASE_EXECUTOR_STATUSES

    // ---- 通用 API helper ----
    async function siApi(path, { method = 'GET', body = null, isForm = false } = {}) {
        const opt = { method };
        if (body != null) {
            if (isForm) { opt.body = body; }
            else { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
        }
        const res = await authFetch('/api' + path, opt);
        if (!res) return { ok: false, aborted: true };       // 401 已在 authFetch 内 logout
        let data = null;
        try { data = await res.json(); } catch (e) { data = null; }
        if (!res.ok) return { ok: false, status: res.status, data };
        return { ok: true, data };
    }
    function siApiErr(r, fallback) {
        if (r && r.aborted) return null;                     // 已登出，不再提示
        const msg = (r && r.data && (r.data.error || r.data.code)) || fallback || '操作失败';
        showToast(msg, 'error');
        return null;
    }

    // 本页自带的完整转义（转 & < > " '）。刻意不复用 app.js 全局 escapeHtml——它有两处同名声明，
    // 运行时生效的 textContent 版（app.js L5079）只转 & < >、不转引号，用于属性上下文(value="..." / title="...")会被引号闭合击穿。
    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ---- 启动 ----
    document.addEventListener('DOMContentLoaded', async () => {
        if (typeof checkAuth === 'function') { const ok = await checkAuth(); if (!ok) return; }
        await siLoadMeta();
        await siLoadUsers();
        siRenderHeadActions();
        siRenderTypeTabs();
        siBuildFilters();
        await siLoadList();
        sysIterationSorter.init(); // 前端统一：表头排序初始化（siLoadList 后绑定）
        // 深链 ?issue=<id> 直接打开详情
        const q = new URLSearchParams(location.search);
        const deepId = parseInt(q.get('issue'), 10);
        if (deepId > 0) siOpenDrawer(deepId);
    });

    // ---- meta 加载（失败 → 只读降级，M-5） ----
    async function siLoadMeta() {
        const r = await siApi('/sys-issues/meta');
        const banner = document.getElementById('siReadyBanner');
        if (r.ok && r.data && r.data.typeFlows) {
            META = r.data; META_OK = true;
            banner.style.display = 'none';
        } else {
            META = null; META_OK = false;
            banner.style.display = '';
            banner.className = 'si-info-banner';
            banner.style.background = '#fef2f2'; banner.style.borderColor = '#fecaca'; banner.style.color = '#991b1b';
            banner.textContent = '⚠️ 状态机配置加载失败，页面进入只读模式：可查看单据与时间线，但所有状态动作按钮不可用。请稍后刷新重试。';
        }
    }

    async function siLoadUsers() {
        const r = await siApi('/users/active');
        siUsers = (r.ok && Array.isArray(r.data)) ? r.data : [];
    }

    function siTypeKeys() {
        // 仅展示 meta 暴露的类型（当前后端只启用 feature/improvement）
        if (!META || !META.typeFlows) return [];
        return Object.keys(META.typeFlows);
    }
    function siTypeLabel(t) { return SI_TYPE_LABEL[t] || t; }
    // D-A：批次族别（bug vs 非bug）——与后端 releaseFamilyOf 同源，供加单候选过滤（config 不进批次返 null）
    function siReleaseFamily(t) { return t === 'bug' ? 'bug' : (t === 'feature' || t === 'improvement') ? 'change' : null; }

    // ---- 页头动作按钮 ----
    function siRenderHeadActions() {
        const box = document.getElementById('siHeadActions');
        let html = '';
        if (META_OK && isAdmin()) {
            html += `<button class="u-btn-secondary" onclick="siOpenBatch()">📦 批次管理</button>`;
            if (siTypeKeys().length) html += `<button class="u-btn-primary" onclick="siOpenCreate()">+ 新建迭代单</button>`;
        }
        // C-orch：上线编排批量面板入口——admin（批量指定 + 批量通知上线开发）与被指定执行开发（批量执行发版）共用入口，
        //   面板内部按角色 + 三态分别出对应操作；任意登录用户可开（无待办项时面板自身显示"暂无"，无害）。
        if (META_OK && currentUser) {
            html += `<button class="u-btn-secondary" onclick="siOpenReleaseOrch()">🚀 上线编排</button>`;
        }
        box.innerHTML = html;
    }

    // ---- 类型 tab ----
    function siRenderTypeTabs() {
        const tabs = [['all', '全部']].concat(siTypeKeys().map(t => [t, siTypeLabel(t)]));
        document.getElementById('siTypeTabs').innerHTML = tabs.map(([k, l]) => {
            const cnt = k === 'all' ? siList.length : siList.filter(i => i.type === k).length;
            return `<div class="si-type-tab ${siActiveType === k ? 'active' : ''}" onclick="siSetType('${k}')">${esc(l)}<span class="si-cnt">${cnt}</span></div>`;
        }).join('');
    }
    function siSetType(k) {
        // I：type 改客户端过滤——切 tab 只重渲染（siList 已含全类型），不重拉，其余筛选保持不变
        siActiveType = k;
        siRenderTypeTabs();
        siRenderStats();
        siRenderTable();
    }
    function siVisibleTypeList() {
        return siActiveType === 'all' ? siList : siList.filter(i => i.type === siActiveType);
    }
    function siMatchStatFilter(item, filterKey) {
        if (!filterKey) return true;
        const statuses = SI_STATUS_GROUPS[filterKey];
        return Array.isArray(statuses) ? statuses.includes(item.status) : true;
    }
    function siSetStatFilter(filterKey) {
        siActiveStat = filterKey || '';
        siRenderStats();
        siRenderTable();
    }
    function siResetStatFilterAndLoadList() {
        siActiveStat = '';
        siLoadList();
    }
    // 当前列表可见单：先按 type tab 客户端过滤，再按顶部统计卡筛选过滤。
    function siVisibleList() {
        return siVisibleTypeList().filter(i => siMatchStatFilter(i, siActiveStat));
    }

    // ---- 筛选器 ----
    function siBuildFilters() {
        // 系统下拉
        const sysSel = document.getElementById('siFSystem');
        const systems = (META && META.bizSystems) ? META.bizSystems : [];
        sysSel.innerHTML = '<option value="">全部系统</option>' + systems.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
        siBuildStatusOptions();
        // admin 才显示"指派开发"筛选 + 含已作废
        if (isAdmin()) {
            const aSel = document.getElementById('siFAssigned');
            aSel.style.display = '';
            aSel.innerHTML = '<option value="">全部开发</option>' + siUsers.filter(u => u.role !== 'viewer').map(u => `<option value="${u.id}">${esc(u.display_name || u.username)}</option>`).join('');
            document.getElementById('siVoidedWrap').style.display = '';
        }
    }
    function siBuildStatusOptions() {
        // 状态筛选是服务端过滤、type 是客户端过滤，故状态下拉用全类型并集（feature/improvement 状态集相同），切 tab 无需重建
        const sel = document.getElementById('siFStatus');
        let statuses = [];
        if (META && META.statusLabels) {
            const set = new Set(); Object.values(META.statusLabels).forEach(arr => arr.forEach(s => set.add(s))); statuses = [...set];
        }
        const cur = sel.value;
        sel.innerHTML = '<option value="">全部状态</option>' + statuses.map(s => `<option value="${esc(s)}" ${cur === s ? 'selected' : ''}>${esc(s)}</option>`).join('');
    }

    // ---- 列表加载 ----
    let siListSeq = 0;
    async function siLoadList() {
        const seq = ++siListSeq;                                 // J：请求序号，回来时若非最新则丢弃（防并发筛选乱序覆盖）
        const params = new URLSearchParams();
        // I：不带 type 过滤——siList 含全类型，type 在客户端过滤，保证各 tab 计数准确
        const st = document.getElementById('siFStatus').value; if (st) params.set('status', st);
        const sys = document.getElementById('siFSystem').value; if (sys) params.set('system', sys);
        const prio = document.getElementById('siFPriority').value; if (prio) params.set('priority', prio);
        if (isAdmin()) {
            const asg = document.getElementById('siFAssigned').value; if (asg) params.set('assigned', asg);
            if (document.getElementById('siFVoided').checked) params.set('include_voided', '1');
        }
        const r = await siApi('/sys-issues?' + params.toString());
        if (seq !== siListSeq) return;                           // J：已有更新的请求发出，丢弃过时结果
        if (!r.ok) { siApiErr(r, '加载列表失败'); return; }
        siList = (r.data && r.data.items) || [];
        siRenderTypeTabs();
        siRenderStats();
        siRenderTable();
    }

    // 前端统一补齐：顶部统计卡与其他列表页一致，提供"全部 + 4 组状态"筛选，默认选中"全部"；
    //   "返工累计"保留纯指标，不参与筛选，避免把 reopen_count（累计次数）误装成状态维度。
    function siRenderStats() {
        const vis = siVisibleTypeList().filter(i => i.status !== '已作废');
        // 组全集覆盖守卫（codex API 审 MED-1 配套）：出现未归任何组的状态 → console.warn 提示补组，
        //   防未来后端新增状态时重现"点组卡后该单消失"缺口（不阻断渲染，未知态仍计入"全部"）
        const grouped = new Set(Object.values(SI_STATUS_GROUPS).flat());
        vis.forEach(i => { if (!grouped.has(i.status)) console.warn(`[siRenderStats] 状态「${i.status}」未归入任何统计组（SI_STATUS_GROUPS），点组卡后该单不可见，请补组`); });
        const stats = [
            { key: '', bg: '#f3f4f6', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>', label: '全部', n: vis.length },
            { key: 'active', bg: '#dbeafe', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/></svg>', label: '进行中', n: vis.filter(i => SI_STATUS_GROUPS.active.includes(i.status)).length },
            { key: 'acceptance', bg: '#fef3c7', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#92400e" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>', label: '待验收', n: vis.filter(i => SI_STATUS_GROUPS.acceptance.includes(i.status)).length },
            { key: 'release', bg: '#ccfbf1', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2"><path d="M12 2v12"/><path d="M5 9l7-7 7 7"/><path d="M5 20h14"/></svg>', label: '待上线', n: vis.filter(i => SI_STATUS_GROUPS.release.includes(i.status)).length },
            { key: 'done', bg: '#d1fae5', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#065f46" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>', label: '已完成', n: vis.filter(i => SI_STATUS_GROUPS.done.includes(i.status)).length },
            { key: 'paused', bg: '#fef9c3', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#854d0e" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="10" y1="9" x2="10" y2="15"/><line x1="14" y1="9" x2="14" y2="15"/></svg>', label: '暂缓/拒绝', n: vis.filter(i => SI_STATUS_GROUPS.paused.includes(i.status)).length },
            { key: null, bg: '#fee2e2', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>', label: '返工累计', n: vis.reduce((a, i) => a + (i.reopen_count || 0), 0) },
        ];
        document.getElementById('siStatsRow').innerHTML = stats.map((s) => {
            const classes = ['u-stat-card'];
            if (s.key === null) classes.push('static');
            if (s.key !== null && s.key === siActiveStat) classes.push('active');
            if (s.key === '' && siActiveStat === '') classes.push('active');
            const onClick = s.key === null ? '' : ` onclick="siSetStatFilter('${s.key}')"`
            return `<div class="${classes.join(' ')}"${onClick}><div class="u-stat-icon" style="background:${s.bg};">${s.icon}</div><div class="u-stat-info"><div class="u-stat-num">${s.n}</div><div class="u-stat-label">${s.label}</div></div></div>`;
        }).join('');
    }

    // ===== 表头排序 + 分页（前端统一：共享层 UnifyHelpers）=====
    const SI_SORT_FIELD_TYPES = {
        id: 'number',
        type: 'string',
        title: 'string',
        system_name: 'string',
        priority: 'statusOrder',
        status: 'statusOrder',
        assigned_to_name: 'string',
        created_by_name: 'string',
        dev_estimated_at: 'date',
        created_at: 'date',
    };
    // 状态业务序（与 siRenderStats 分组方向一致：进行中→待验收→待上线→已完成→暂缓/拒绝；已作废排末尾）
    // codex API 审 MED-2（2026-07-10）：补 已暂缓/已拒绝 显式序——共享排序对未知状态给 99 会
    //   排到已作废之后，与"已作废排末尾"注释矛盾；显式放已生效后、已作废前。
    const SI_STATUS_SORT_ORDER = {
        待处理: 0, 待评估: 1, 已排期: 2, 开发中: 3, 处理中: 4,
        待验证: 5, 待验收: 6, 待上线: 7,
        已上线: 8, 已关闭: 9, 已生效: 10,
        已暂缓: 11, 已拒绝: 12,
        已作废: 13,
    };
    const sysIterationSorter = UnifyHelpers.attachTableSort({
        tableSelector: '#sysIterationListTable',
        fieldTypes: SI_SORT_FIELD_TYPES,
        statusOrder: { priority: { P0: 0, P1: 1, P2: 2, P3: 3 }, status: SI_STATUS_SORT_ORDER },
        getList: () => siVisibleList(),
        render: renderSysIterationRows,
        defaultSort: { field: 'id', dir: 'desc' },
        pagination: { containerSelector: '#sysIterationPagination' },
    });

    // 外部入口保持原名 siRenderTable()，零改动既有调用点（siSetType/siLoadList）
    function siRenderTable() {
        sysIterationSorter.render();
    }

    // C1（多开发协作与 commit 留痕重构 v2.9 §13 S1）：列表负责人列多人展示——item.dev_roster_names 是后端
    //   json_group_array 的 JSON 数组字符串（按 user_id 升序在册成员名，如 '["张三","李四"]'）；无在册成员
    //   （旧数据/D_PRE 阶段未指派）回退 assigned_to_name（兼容不动）。人多截断显前 2 名 + "等+N"，悬浮 title
    //   显全量，不做排序/筛选增强（C1 红线）。
    //   ⚠️ LOW-1（89 号审）：字段值协议是 JSON 数组，非逗号拼接明文——display_name 无"禁逗号"约束，人名可能
    //   本身含英文逗号，split(',') 会把单个含逗号的名字错拆成两截，故用 JSON.parse；解析失败（脏数据/协议
    //   变更）时防御性回退 assigned_to_name，不抛错。
    const SI_DEV_ROSTER_MAX_SHOW = 2;
    function siDevRosterCellHtml(item) {
        let names = [];
        try {
            const parsed = item.dev_roster_names ? JSON.parse(item.dev_roster_names) : [];
            if (Array.isArray(parsed)) names = parsed.filter(s => typeof s === 'string' && s.trim()).map(s => s.trim());
        } catch (_) { names = []; }   // 解析失败防御性回退 assigned_to_name，不抛错
        if (!names.length) {
            return item.assigned_to_name ? esc(item.assigned_to_name) : '<span class="si-muted">—</span>';
        }
        if (names.length <= SI_DEV_ROSTER_MAX_SHOW) return esc(names.join('、'));
        const shown = names.slice(0, SI_DEV_ROSTER_MAX_SHOW).join('、');
        const rest = names.slice(SI_DEV_ROSTER_MAX_SHOW);
        return `${esc(shown)}<span class="si-dev-roster-more" title="${esc(rest.join('、'))}">等+${rest.length}</span>`;
    }

    function renderSysIterationRows(list) {
        const tb = document.getElementById('siTbody');
        if (!list.length) {
            tb.innerHTML = `<tr><td colspan="10" class="si-empty">${isAdmin() ? '暂无数据' : '暂无指派给你的单据'}</td></tr>`;
            return;
        }
        tb.innerHTML = list.map(i => {
            const flags =
                (i.scope_changed ? `<span class="si-flag scope">范围变更</span>` : '') +
                (i.reopen_count ? `<span class="si-flag reopen">返工×${i.reopen_count}</span>` : '') +
                (i.blocked ? `<span class="si-flag blocked">受阻</span>` : '');
            const lineage = i.origin_issue_id ? `<span class="si-flag lineage">🔁基于#${i.origin_issue_id}</span>` : '';
            return `<tr onclick="siOpenDrawer(${i.id})">
                <td>#${i.id}</td>
                <td><span class="u-type-tag ${esc(i.type)}">${esc(siTypeLabel(i.type))}</span></td>
                <td><span class="u-pri ${esc(i.priority)}">${esc(i.priority)}</span></td>
                <td><span class="u-status-badge si-s-${siStatusClass(i.status)}">${esc(i.status)}</span></td>
                <td>${esc(i.title)}${lineage}${flags}</td>
                <td>${esc(i.system_name)}<span class="si-muted"> · ${esc(i.module_name || '—')}</span></td>
                <td>${siDevRosterCellHtml(i)}</td>
                <td>${esc(i.created_by_name || '—')}</td>
                <td>${i.dev_estimated_at ? esc(siFmtDT(i.dev_estimated_at)) : '<span class="si-muted">—</span>'}</td>
                <td class="si-muted">${esc(siFmtDT(i.created_at))}</td>
            </tr>`;
        }).join('');
    }

    function siFmtDT(v) {
        if (!v) return '—';
        // 复用 app.js 统一日期格式化（本地时间），失败原样返回
        try { const s = formatDateTimeUnified(v, 'full'); return s === '无效时间' ? v : s; } catch (e) { return v; }
    }

    // ============================================================
    // 详情抽屉
    // ============================================================
    async function siOpenDrawer(id) {
        siOpenId = id;
        document.getElementById('siOverlay').classList.add('open');
        document.getElementById('siDrawer').classList.add('open');
        document.getElementById('siDBody').innerHTML = '<div class="si-empty">加载中…</div>';
        // #siDActions 已随样式统一并入 siDBody 动态渲染（不再是 foot 里的固定 DOM）——上面把 siDBody 设为"加载中"
        //   即已清空操作栏；loading 态不再单独 getElementById('siDActions')（此刻它尚未渲染=null→innerHTML 报错）。
        await siRenderDrawer(id);
    }
    function siCloseDrawer() {
        siOpenId = null; siDetail = null;
        document.getElementById('siOverlay').classList.remove('open');
        document.getElementById('siDrawer').classList.remove('open');
    }

    async function siRenderDrawer(id) {
        const r = await siApi('/sys-issues/' + id);
        if (!r.ok) { siApiErr(r, '加载详情失败'); if (r.status === 404 || r.status === 403) siCloseDrawer(); return; }
        if (siOpenId !== id) return;                          // 快速切单防错位
        siDetail = r.data;
        const iss = r.data.issue;

        document.getElementById('siDTitle').innerHTML = `#${iss.id} ${esc(iss.title)}`;
        document.getElementById('siDMeta').innerHTML =
            `<span class="u-type-tag ${esc(iss.type)}">${esc(siTypeLabel(iss.type))}</span>` +
            `<span class="u-status-badge si-s-${siStatusClass(iss.status)}">${esc(iss.status)}</span>` +
            `<span class="u-pri ${esc(iss.priority)}" title="${SI_PRIORITY_HELP_TEXT}">${esc(iss.priority)}</span>` +
            (iss.scope_changed ? `<span class="si-flag scope">· 经历范围变更</span>` : '') +
            (iss.reopen_count ? `<span class="si-flag reopen">· 返工×${iss.reopen_count}</span>` : '') +
            (iss.blocked ? `<span class="si-flag blocked">· 受阻中</span>` : '');

        // 血缘
        let lineageHtml = '';
        if (r.data.origin_issue) {
            const o = r.data.origin_issue;
            lineageHtml += `<div class="si-lineage">📌 基于 <a onclick="siOpenDrawer(${o.id})">#${o.id}《${esc(o.title)}》</a> 迭代而来</div>`;
        }
        if (r.data.derived_issues && r.data.derived_issues.length) {
            const links = r.data.derived_issues.map(d => `<a onclick="siOpenDrawer(${d.id})">#${d.id}</a>`).join('、');
            lineageHtml += `<div class="si-lineage">🔁 已衍生 ${r.data.derived_issues.length} 个迭代需求（${links}）</div>`;
        }
        // ⑤ 双描述展示（写读同源）：派生原因（建单人派生时填）+ 修复缺口说明（开发首提填）——仅有值时显示，纯复盘素材
        if (iss.derive_reason) lineageHtml += `<div class="si-lineage">📝 派生原因：${esc(iss.derive_reason)}</div>`;
        if (iss.fix_gap_note) lineageHtml += `<div class="si-lineage">🔧 修复缺口说明：${esc(iss.fix_gap_note)}</div>`;

        // 基本信息
        let feas = '';
        if (iss.needs_feasibility) {
            feas =
                `<div class="u-kv-item"><label>可行性结论</label><div class="v">${iss.feasibility_conclusion ? esc(iss.feasibility_conclusion) : '<span class="si-muted">待评估</span>'}</div></div>` +
                `<div class="u-kv-item"><label>受阻</label><div class="v">${iss.blocked ? '<span style="color:#b91c1c;font-weight:600">是</span>' : '否'}</div></div>` +
                (iss.feasibility_requirement_confirm ? `<div class="u-kv-item full"><label>需求确认</label><div class="v">${esc(iss.feasibility_requirement_confirm)}</div></div>` : '') +
                (iss.feasibility_risk ? `<div class="u-kv-item full"><label>风险/条件</label><div class="v">${esc(iss.feasibility_risk)}</div></div>` : '') +
                (iss.blocked && iss.blocked_reason ? `<div class="u-kv-item full"><label>受阻原因</label><div class="v">${esc(iss.blocked_reason)}</div></div>` : '');
        }
        // ④a §7 关联修正单号软展示（不跳转；后端 best-effort 软查回 related_correction 状态）
        let relCorrRow = '';
        if (iss.related_correction_no) {
            const rc = r.data.related_correction;
            // codex 30 M-2 消歧：显式展示匹配方式（纯数字优先按修正单 ID / 否则按 OA 号），避免全数字 OA 号撞 id 时误读
            const byTxt = rc && rc.matched_by === 'oa_number' ? '按 OA 号匹配' : (rc && rc.matched_by === 'id' ? '按修正单 ID 匹配' : '');
            let hint = '';
            if (rc && rc.status === 'voided') hint = ` <span style="color:#b91c1c">（对应修正单已作废${byTxt ? '·' + byTxt : ''}）</span>`;
            else if (rc && rc.status === 'not_found') hint = ' <span style="color:#b45309">（未找到对应修正单，可能已删除或为外部单号）</span>';
            else if (rc && rc.status === 'active') hint = ` <span class="si-muted">（修正单 #${rc.id} 有效${byTxt ? '·' + byTxt : ''}）</span>`;
            relCorrRow = `<div class="u-kv-item full"><label>关联修正单号</label><div class="v">${esc(iss.related_correction_no)}${hint}<span class="si-muted" style="margin-left:6px;font-size:11px">软引用·不跳转</span></div></div>`;
        }
        const info = `<div class="u-detail-section"><h3>基本信息</h3><div class="u-kv-grid">
            <div class="u-kv-item"><label>所属系统</label><div class="v">${esc(iss.system_name)}</div></div>
            <div class="u-kv-item"><label>模块</label><div class="v">${esc(iss.module_name || '—')}</div></div>
            <div class="u-kv-item"><label>来源</label><div class="v">${esc(iss.source || '—')}</div></div>
            <div class="u-kv-item"><label>建单人</label><div class="v">${esc(iss.created_by_name || '—')}</div></div>
            <div class="u-kv-item"><label>预计完成时间</label><div class="v">${iss.dev_estimated_at ? esc(siFmtDT(iss.dev_estimated_at)) : '<span class="si-muted">未回填</span>'}</div></div>
            <div class="u-kv-item"><label>期望完成(deadline)</label><div class="v">${iss.deadline ? esc(iss.deadline) : '<span class="si-muted">—</span>'}</div></div>
            <div class="u-kv-item"><label>需求方</label><div class="v">${siRequesterText(iss)}</div></div>
            <div class="u-kv-item"><label>上线批次</label><div class="v">${iss.release_id ? ('#' + iss.release_id) : '<span class="si-muted">—</span>'}</div></div>
            ${iss.type === 'bug' ? `<div class="u-kv-item"><label>上线执行人</label><div class="v">${iss.release_assignee_name ? esc(iss.release_assignee_name) : '<span class="si-muted">未指定</span>'}</div></div>` : ''}
            <div class="u-kv-item"><label>创建时间</label><div class="v">${esc(siFmtDT(iss.created_at))}</div></div>
            ${feas}
            ${relCorrRow}
            <div class="u-kv-item full"><label>描述</label><div class="v">${iss.description ? esc(iss.description) : '—'}</div></div>
        </div></div>`;

        // C1→C7（多开发协作与 commit 留痕重构 v2.9 §13 S1 / §11 前端骨架）：开发成员——全在册 chip（去主次，
        //   无「主开发」字样，is_primary 仅作只读小标记「代表」）+ 各自 dev_status 徽标 + commit 记录小表。
        //   C7 起按四布尔升级为读写（siCaps 本次刷新，siRenderActions 复用同一份，不重复计算）。
        siCaps = siComputeCaps(iss, r.data.dev_assignees, r.data.dev_commits);
        const devMembers = `<div class="u-detail-section"><h3>开发成员</h3>${siRenderDevMemberChips(r.data.dev_assignees, siCaps, iss)}</div>`;
        const devCommitsBlock = `<div class="u-detail-section"><h3>Commit 记录</h3>${siRenderDevCommits(r.data.dev_commits, siCaps)}</div>`;

        // 演进时间线
        const tl = `<div class="u-detail-section"><h3>演进时间线</h3>${siRenderTimeline(r.data.timeline || [], r.data.attachments || [])}</div>`;

        // 附件区
        const att = siRenderAttachments(r.data);

        // 通知区（C4：bug 4 类手动通知 + 三能力；非 bug 仍只读三侧展示）——可见方=admin/白名单对接人/主开发本人
        //   （主开发新增于 C4：其可发 notify-creator + 查自己通知行的已读，故须能看到本区）。
        const canSeeNotify = isAdmin() || (iss.type === 'bug' && currentUser && (isSiBugLiaison(currentUser.id) || (Number(iss.assigned_to) === Number(currentUser.id) && currentUser.id > 0)));
        const notify = canSeeNotify ? siRenderNotify(iss, r.data.dev_assignees) : '';

        // 讨论群（§5 bug 流拉群；已建才展示，留痕：议题 + 拉群时间）
        let chat = '';
        if (iss.dingtalk_open_conversation_id) {
            chat = `<div class="u-detail-section"><h3>讨论群</h3><div class="u-kv-grid">
                <div class="u-kv-item full"><label>群名称</label><div class="v">${esc(iss.dingtalk_chat_name || '—')}</div></div>
                <div class="u-kv-item full"><label>拉群议题</label><div class="v">${iss.dingtalk_chat_desc ? esc(iss.dingtalk_chat_desc) : '—'}</div></div>
                <div class="u-kv-item"><label>拉群时间</label><div class="v">${iss.dingtalk_chat_created_at ? esc(siFmtDT(iss.dingtalk_chat_created_at)) : '—'}</div></div>
            </div><div class="si-note-box">钉钉群已建，请到钉钉客户端查看。钉钉无解散接口，用完由群主（示例用户A）在客户端手动解散。</div></div>`;
        }

        // C-orch：上线编排独立区块（2026-07-07 样式统一：从底部操作区拆出，置于「基本信息」与「通知」之间）。
        const orchBlock = siRenderReleaseOrchBlock(iss);

        // 抽屉 body 顺序（对齐 Data_Correction 抽屉范式；C1 新增「开发成员」「Commit 记录」插入基本信息之后）：
        //   血缘 → 操作栏(顶) → 基本信息 → 开发成员 → Commit 记录 → 上线编排 → 通知 → 讨论群 → 时间线 → 附件
        document.getElementById('siDBody').innerHTML =
            lineageHtml + '<div class="u-action-bar" id="siDActions"></div>' + info + devMembers + devCommitsBlock + orchBlock + notify + chat + tl + att;

        // 操作区（填充 body 顶部的 #siDActions 占位）
        siRenderActions(iss);
    }

    // C-orch：上线编排区块「是否有内容」的单一判据（MED-2 codex 43：抽出供 siRenderActions 兜底 + 本区块共享，
    //   杜绝两处条件分叉）——bug+待上线 ∧（admin 有指定/换按钮 ∨ 已指定上线开发→执行按钮或"等待 X"gate）。
    //   ⭐ 契约（codex 43 复审 LOW）：本函数返回 true 时 siRenderReleaseOrchBlock 必产出非空内容——两者须维持
    //     「hasContent ⟺ 区块非空」（与区块末尾 `!gate && !btns 返回空` 等价：非 admin 且未指定 release_assignee 时为空）；
    //     日后在区块内加 gate/权限分支或临时 return 时须同步维持此不变量。
    //   数据模型（codex 43 复审 MED-1）：release_assignee_id 是 INTEGER 外键、写入全走 parsePositiveId（恒 null 或正整数），
    //     故 Number(...)>0 与区块内 `iss.release_assignee_id`(truthy)/isReleaseExecutor(Number 比较) 在该数据模型下等价，
    //     无脏字符串（'7a'/'07' 等）风险；不在渲染层做额外归一化（YAGNI，字段类型放宽时再议）。
    function siReleaseOrchHasContent(iss) {
        return iss.type === 'bug' && iss.status === '待上线' && (isAdmin() || Number(iss.release_assignee_id) > 0);
    }
    // C-orch：上线编排独立区块（§2.3）——仅 bug + 待上线态出现；含 gate 引导 + 双角色按钮
    //   （admin 指定/换执行开发 · 被指定执行开发本人执行上线）。2026-07-07 样式统一从 siRenderActions 底部操作区拆出。
    function siRenderReleaseOrchBlock(iss) {
        if (!siReleaseOrchHasContent(iss)) return '';
        const isAdminUser = isAdmin();
        const isReleaseExecutor = currentUser && Number(iss.release_assignee_id) === Number(currentUser.id) && currentUser.id > 0;
        let gate = '';
        if (isAdminUser && !iss.release_assignee_id) {
            gate = `<div class="si-gate-hint">📌 请先「指定上线开发」，由其执行 hotfix/发版。</div>`;
        } else if (iss.release_assignee_id && !isReleaseExecutor) {
            gate = `<div class="si-gate-hint">⏳ 等待「${esc(iss.release_assignee_name || '')}」执行上线（hotfix/发版）。</div>`;
        } else if (isReleaseExecutor) {
            gate = `<div class="si-gate-hint">✅ 你已被指定为本单上线开发，可执行 hotfix（不发版直接上线）或发版（建批次填版本号）。</div>`;
        }
        let btns = '';
        if (isAdminUser) {
            btns += iss.release_assignee_id
                ? `<button class="u-btn-secondary u-btn-sm" onclick="siModalAssignReleaseDev(true)">换执行开发</button>`
                : `<button class="u-btn-secondary u-btn-sm" onclick="siModalAssignReleaseDev(false)">指定上线开发</button>`;
        }
        if (isReleaseExecutor) {
            btns += `<button class="u-btn-primary u-btn-sm" onclick="siModalExecuteRelease()">执行上线</button>`;
        }
        if (!gate && !btns) return '';   // 兜底：非 admin 非 executor 且无引导时不渲染空区块
        return `<div class="u-detail-section"><h3>上线编排</h3>
            <div class="u-action-bar" style="margin-bottom:0">${gate}${btns}</div>
        </div>`;
    }

    function siRequesterText(iss) {
        const parts = [];
        if (iss.requester_dept) parts.push(esc(iss.requester_dept));
        if (iss.requester_name) parts.push(esc(iss.requester_name));
        let s = parts.join(' · ');
        if (iss.requester_phone) s += ' ' + esc(iss.requester_phone);
        return s || '<span class="si-muted">—</span>';
    }

    // ---- 时间线渲染（event_type + action_code → label/color；submit 挂本轮交付附件） ----
    const SI_TL_LABEL = {
        created: '建单', assign: '指派', reassign: '改派', estimate: '回填预计',
        submit: '交付', return: '打回', release: '上线', reopen: '重开', derive: '派生',
        scope_change: '范围变更', feasibility: '可行性评估', blocked: '标记受阻', unblock: '解除受阻', note: '备注',
        schedule: '排期', accept: '验收通过', close: '关闭', hold: '暂缓', resume: '恢复',
        reactivate: '重新激活', issue_reject: '拒绝', void: '作废', effected: '已生效',
        set_release_flag: '填发版信息',   // F-3：set-release-flag 写 status_change+action_code，补前端标签防裸英文
        confirm_online_norelease: '确认上线（不发版）'   // L-1：release 事件带此 action_code 时区分「不发版直接上线」（批次/hotfix 发版仍显「上线」）
    };
    const SI_TL_CLS = {
        created: 'si-tl-amber', derive: 'si-tl-amber',
        schedule: 'si-tl-indigo', assign: 'si-tl-indigo', reassign: 'si-tl-indigo', estimate: 'si-tl-indigo', feasibility: 'si-tl-indigo', set_release_flag: 'si-tl-indigo',
        submit: 'si-tl-blue',
        return: 'si-tl-red', reopen: 'si-tl-red', issue_reject: 'si-tl-red', blocked: 'si-tl-red',
        accept: 'si-tl-green', release: 'si-tl-green', effected: 'si-tl-green', close: 'si-tl-green', unblock: 'si-tl-green', confirm_online_norelease: 'si-tl-green',
        scope_change: 'si-tl-orange',
        hold: 'si-tl-gray', resume: 'si-tl-gray', void: 'si-tl-gray', reactivate: 'si-tl-gray', note: 'si-tl-gray'
    };
    function siRenderTimeline(list, atts) {
        if (!list.length) return '<div class="si-muted">暂无演进记录</div>';
        return '<div class="si-timeline">' + list.map(e => {
            // L-1（codex 复审）：release 事件也优先识别 action_code——「确认上线·不发版」(confirm_online_norelease)
            //   与批次/hotfix 发版都写 event_type='release'，只有前者带 action_code，需区分标签保留审计可见性。
            const key = (e.event_type === 'status_change' || e.event_type === 'release') ? (e.action_code || e.event_type) : e.event_type;
            const label = SI_TL_LABEL[key] || key;
            const cls = SI_TL_CLS[key] || 'si-tl-gray';
            const roundTxt = (e.event_type === 'submit' && e.round_no) ? ('·第' + e.round_no + '轮') : '';
            // submit 挂本轮 delivery 附件
            let attHtml = '';
            if (e.event_type === 'submit' && e.round_no != null) {
                const files = (atts || []).filter(a => a.attachment_type === 'delivery' && a.round_no === e.round_no);
                if (files.length) {
                    attHtml = '<span class="si-tl-att">' + files.map(a =>
                        `<a onclick="siDownloadAtt(${siOpenId},${a.id})">📎${esc(a.original_name || a.file_name)}</a>`).join('') + '</span>';
                }
            }
            const flow = (e.from_status && e.to_status && e.from_status !== e.to_status)
                ? `<span class="si-tl-to"> →${esc(e.to_status)}</span>` : '';
            return `<div class="si-tl-item">
                <div class="si-tl-time">${esc(siFmtDT(e.created_at))}</div>
                <div class="si-tl-dot"></div>
                <div class="si-tl-body">
                    <span class="si-tl-evt ${cls}">${esc(label)}${roundTxt}</span>${e.summary ? esc(e.summary) : ''}${flow}
                    <span class="si-tl-op"> · ${esc(e.operator_name || '-')}</span>
                    ${attHtml}
                </div>
            </div>`;
        }).join('') + '</div>';
    }

    // ---- C1（多开发协作与 commit 留痕重构 v2.9 §13 S1）：开发成员 chip + commit 记录小表 ----
    //   C7：由纯读升级为读写——协调人 chip 级操作（开脱/恢复）+ commit 小表行内编辑（编辑/删除/补充），
    //   均按 §11 四布尔门禁，纯 UI 镜像，真闸在后端。
    const SI_DEV_STATUS_LABEL = { pending: '待提交', code_submitted: '已提交', no_code: '无代码', excused: '已开脱' };
    const SI_COMMIT_COMPONENT_LABEL = { frontend: '前端', backend: '后端' };
    // SYS_DEV 族状态快照（feature/improvement=开发中；bug=处理中）——SYS_DEV∪SYS_VERIFY 复用既有
    // SI_ATT_DEV_OR_VERIFY_STATUSES（附件区先定义，函数体内引用不受声明顺序影响，脚本整体先解析完再在
    // DOMContentLoaded 后执行）。冻结族=非 D_PRE/DEV/VERIFY 的其余状态，复用既有 SI_ATT_TERMINAL_STATUSES
    // 叠加「待上线」（对齐方案 §4.0 SYS_FROZEN_STATUSES=RELEASE∪非发布终态）。
    const SI_DEV_FAMILY_STATUSES = ['开发中', '处理中'];
    const SI_FROZEN_STATUSES = ['已上线', '已关闭', '已拒绝', '已作废', '待上线'];

    // §11 四布尔（后端同源，仅前端 UI 镜像，真闸在后端各端点内部断言）：
    //   canSubmit=在册∧pending∧SYS_DEV；canEditCommits=当前在册∧存在本人名下行∧SYS_DEV∪SYS_VERIFY（仅管既有行
    //   PUT/DELETE）；canAddCommit=当前在册实例 dev_status='code_submitted'∧SYS_DEV∪SYS_VERIFY（不复用
    //   canEditCommits）；canCoordinateMember=对接人∨admin。
    function siComputeCaps(iss, devAssignees, devCommits) {
        const uid = currentUser ? Number(currentUser.id) : null;
        const list = devAssignees || [];
        const myRow = (uid && uid > 0) ? (list.find(d => Number(d.user_id) === uid) || null) : null;
        const isCoordinator = isAdmin() || !!(currentUser && iss.type === 'bug' && isSiBugLiaison(currentUser.id));
        const inDevFamily = SI_DEV_FAMILY_STATUSES.includes(iss.status);
        const inDevOrVerifyFamily = SI_ATT_DEV_OR_VERIFY_STATUSES.includes(iss.status);
        const hasMyCommitRow = !!(uid && (devCommits || []).some(c => Number(c.dev_user_id) === uid));
        return {
            myRow,
            isCoordinator,
            isRosterMember: !!myRow,
            canSubmit: !!(myRow && myRow.dev_status === 'pending' && inDevFamily),
            canEditCommits: !!(myRow && inDevOrVerifyFamily && hasMyCommitRow),
            canAddCommit: !!(myRow && myRow.dev_status === 'code_submitted' && inDevOrVerifyFamily),
            canCoordinateMember: isCoordinator,
        };
    }

    // 全在册 chip：user_name + dev_status 徽标；is_primary 仅作只读小标记「代表」（不得有任何授权暗示文案，
    //   方案 §11 前端骨架——去主次，禁「主开发」字样）；no_code 的 chip 用 title 属性挂 no_code_reason（悬浮可见，
    //   不占用可视空间）。C7：协调人（canCoordinateMember）在 pending 成员 chip 上加「开脱」、excused 成员 chip
    //   上加「恢复」小按钮；chip 列表下方非冻结态显示「管理开发成员」入口（复用 siModalReassign 的 member_ids
    //   全集编辑器，声明式一个入口覆盖 add/remove，不逐个调 dev-assignees 端点）。
    function siRenderDevMemberChips(devAssignees, caps, iss) {
        const list = (!devAssignees || !devAssignees.length)
            ? '<div class="si-muted">暂无指派开发</div>'
            : '<div class="si-dev-chip-list">' + devAssignees.map(d => {
                const statusKey = d.dev_status || 'pending';
                const statusLabel = SI_DEV_STATUS_LABEL[statusKey] || esc(statusKey);
                const titleAttr = (statusKey === 'no_code' && d.no_code_reason) ? ` title="${esc(d.no_code_reason)}"` : '';
                const primaryMark = d.is_primary ? '<span class="si-dev-primary-mark">代表</span>' : '';
                let act = '';
                if (caps && caps.canCoordinateMember) {
                    if (statusKey === 'pending') act = `<span class="si-dev-chip-act" onclick="siModalExcuseMember(${d.id})">开脱</span>`;
                    else if (statusKey === 'excused') act = `<span class="si-dev-chip-act" onclick="siModalSupersedeExcuse(${d.id})">恢复</span>`;
                }
                return `<span class="si-dev-chip"${titleAttr}>${esc(d.user_name || ('#' + d.user_id))}${primaryMark}<span class="si-dev-status-badge ${esc(statusKey)}">${statusLabel}</span>${act}</span>`;
            }).join('') + '</div>';
        const manageBtn = (caps && caps.canCoordinateMember && !SI_FROZEN_STATUSES.includes(iss.status))
            ? `<div style="margin-top:8px"><button class="u-btn-secondary u-btn-sm" onclick="siModalReassign(siDetail.issue)">管理开发成员</button></div>` : '';
        return list + manageBtn;
    }
    // commit 记录小表：开发/component（前端/后端）/commit_ref/时间；含 removed 实例的行（方案 §8 快照口径同源，
    //   后端 GET 已按 id 升序返回，前端不再排序）。C7：本人行按 canEditCommits 加「编辑/删除」，表下按
    //   canAddCommit（独立判定，不复用 canEditCommits）加「补充 commit」按钮。
    function siRenderDevCommits(devCommits, caps) {
        const uid = currentUser ? Number(currentUser.id) : null;
        const rows = (devCommits || []).map(c => {
            const isMine = !!(uid && Number(c.dev_user_id) === uid);
            const canEditThis = !!(caps && caps.canEditCommits && isMine);
            const acts = canEditThis
                ? `<span class="si-commit-act" onclick="siModalEditCommit(${c.id})">编辑</span><span class="si-commit-act danger" onclick="siModalDeleteCommit(${c.id})">删除</span>`
                : '';
            return `<tr>
                <td>${esc(c.dev_user_name || ('#' + c.dev_user_id))}</td>
                <td>${SI_COMMIT_COMPONENT_LABEL[c.component] || esc(c.component)}</td>
                <td>${esc(c.commit_ref)}</td>
                <td>${esc(siFmtDT(c.created_at))}</td>
                <td>${acts}</td>
            </tr>`;
        }).join('');
        const addBtn = (caps && caps.canAddCommit) ? `<div style="margin-top:8px"><button class="u-btn-secondary u-btn-sm" onclick="siModalAddCommit()">+ 补充 commit</button></div>` : '';
        if (!devCommits || !devCommits.length) return '<div class="si-muted">暂无 commit 记录</div>' + addBtn;
        return `<div class="u-corr-table-wrap"><table class="si-commit-table"><thead><tr><th>开发</th><th>组件</th><th>commit_ref</th><th>时间</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${addBtn}`;
    }

    // 统一自定义错误文案（commit 行编辑三端点，§10 错误码集合 = COMMIT_SCOPE/INVALID_STATUS/VALIDATION/
    //   GATE_INVARIANT；siApiErr 默认优先取 r.data.error，后端本就给了可读中文，故仅对「值得改写为更贴合
    //   UI 场景措辞」的 3 码定制，INVALID_STATUS 及其余码按后端 message 原样显示——任务书要求的"统一走
    //   siApiErr 但对这几个码给定制文案"落地方式：先查码表命中则短路 showToast，未命中回落 siApiErr）。
    const SI_COMMIT_ERR_TEXT = {
        NOT_ROSTERED: '你已不在册，无法操作',
        COMMIT_SCOPE: '仅本人 commit 行可编辑/删除',
        GATE_INVARIANT: '已提交（code_submitted）状态下至少需保留 1 条 commit',
    };
    function siCommitApiErr(r) {
        if (r && r.aborted) return null;
        const code = r && r.data && r.data.code;
        if (code && SI_COMMIT_ERR_TEXT[code]) { showToast(SI_COMMIT_ERR_TEXT[code], 'error'); return null; }
        return siApiErr(r);
    }

    // ---- 附件区（C5：附件授权改造，方案 §5.4「附件口径统一表」+ round_no 遗产②/③ 清理）----
    //   展示层近似判断——扁平字符串集合，非按 type 精确索引族常量（后端 status-families.js 才是权威，按 type
    //   精确索引）；用于按钮可见性/删除按钮显隐，误差后果仅"按钮多显/少显"，无安全含义，真拒绝以后端 403/409 为准。
    const SI_ATT_TERMINAL_STATUSES = ['已上线', '已关闭', '已拒绝', '已作废'];   // 对齐 SYS_TERMINAL_STATUSES（不含"待上线"）
    const SI_ATT_DEV_OR_VERIFY_STATUSES = ['开发中', '处理中', '待验证'];        // 对齐 SYS_DEV∪SYS_VERIFY
    function siRenderAttachments(data) {
        const iss = data.issue;
        const all = data.attachments || [];
        const spec = all.filter(a => a.attachment_type === 'spec');
        // round_no 遗产②（M-P4）：C3 起唯一 submit 不再绑 round_no（恒 NULL），旧"round_no != null"过滤会让本页
        //   交付物永久展示为空（真实缺陷，非本次引入）——附件不再按轮次分组/过滤，全部 active 交付物平铺展示
        //   （后端已按 id 升序=上传时间序返回，前端不再二次排序）。
        const delivery = all.filter(a => a.attachment_type === 'delivery');
        const screenshots = all.filter(a => a.attachment_type === 'screenshot');
        const devAssignees = data.dev_assignees || [];
        // C5（§5.4）：在册 = 当前用户出现在（后端已过滤 removed_at IS NULL 的）dev_assignees 列表——isOwnerDev 保留
        //   旧名但语义随本次改造升级为"在册"（原仅比对单人 assigned_to，多开发 roster 下会漏判非代表协作成员，
        //   造成"后端已放行、前端按钮不显示"的写读语义漂移，随附件授权改造一并对齐）。
        const isOwnerDev = !!(currentUser && devAssignees.some(d => Number(d.user_id) === currentUser.id));
        // 协调人=对接人∪admin（§0），与后端 isSysCoordinator 同构；isSiBugLiaison 已在文件顶部定义（示例发布者/示例对接人白名单）。
        const isCoordinator = isAdmin() || !!(currentUser && iss.type === 'bug' && isSiBugLiaison(currentUser.id));

        function attList(arr, delType) {
            if (!arr.length) return '<div class="si-muted" style="font-size:12px">无</div>';
            return arr.map(a => {
                const canDel = siCanDeleteAtt(iss, a, isOwnerDev, isCoordinator);
                return `<div class="si-att-item">
                    <a class="si-att-name" onclick="siDownloadAtt(${iss.id},${a.id})">📎 ${esc(a.original_name || a.file_name)}</a>
                    <span class="si-att-meta">${a.round_no != null ? '第' + a.round_no + '轮 · ' : ''}${a.uploaded_by_name ? esc(a.uploaded_by_name) : ''}</span>
                    ${canDel ? `<span class="si-att-del" onclick="siDeleteAtt(${iss.id},${a.id})">删除</span>` : ''}
                </div>`;
            }).join('');
        }

        let html = '<div class="u-detail-section"><h3>附件</h3>';
        // 需求材料 spec（C5：协调人=对接人∨admin 上传，∉终态）
        html += `<div style="margin-bottom:10px"><div style="font-size:12px;color:#6b7280;margin-bottom:4px;font-weight:600">需求材料（spec）</div>${attList(spec)}`;
        if (META_OK && isCoordinator && !SI_ATT_TERMINAL_STATUSES.includes(iss.status)) {
            html += `<div class="si-upload-box"><input type="file" id="siSpecFile" multiple>
                <button class="u-btn-secondary u-btn-sm" onclick="siUploadAtt(${iss.id},'spec','siSpecFile')">上传需求材料</button></div>`;
        }
        html += '</div>';
        // 交付物 delivery（C5·对抗审 C 回填：在册∨协调人，开发中/处理中/待验证均可传——之前只读展示无上传入口，
        //   是真实功能缺口：附件区唯一的落库入口只有 siModalSubmit 弹窗内的两阶段 attachment_ids 绑定，而该
        //   绑定语义随 round_no 退场已失效（见下方拆除说明），意味着后端已放行的 delivery 上传在 C5 之前的前端
        //   完全没有入口可点。补齐与 spec/screenshot 同构的上传框，不再是"只读展示"）
        html += `<div style="margin-bottom:10px"><div style="font-size:12px;color:#6b7280;margin-bottom:4px;font-weight:600">交付物（delivery）</div>${attList(delivery)}`;
        if (META_OK && (isOwnerDev || isCoordinator) && SI_ATT_DEV_OR_VERIFY_STATUSES.includes(iss.status)) {
            html += `<div class="si-upload-box"><input type="file" id="siDeliveryFile" multiple>
                <button class="u-btn-secondary u-btn-sm" onclick="siUploadAtt(${iss.id},'delivery','siDeliveryFile')">上传交付物</button></div>`;
        }
        html += '</div>';
        // 截图 screenshot（C5：在册∨协调人，开发中/处理中/待验证均可传，原仅"开发本人·开发中"过窄）
        html += `<div><div style="font-size:12px;color:#6b7280;margin-bottom:4px;font-weight:600">补充截图（screenshot）</div>${attList(screenshots)}`;
        if (META_OK && (isOwnerDev || isCoordinator) && SI_ATT_DEV_OR_VERIFY_STATUSES.includes(iss.status)) {
            html += `<div class="si-upload-box"><input type="file" id="siShotFile" multiple>
                <button class="u-btn-secondary u-btn-sm" onclick="siUploadAtt(${iss.id},'screenshot','siShotFile')">上传截图</button></div>`;
        }
        html += '</div>';
        html += '</div>';
        return html;
    }
    function siCanDeleteAtt(iss, a, isOwnerDev, isCoordinator) {
        if (!META_OK) return false;
        // C5（§5.4）：删除 = (上传者∨协调人∨admin) ∧ 状态∉SYS_TERMINAL——spec/delivery/screenshot 统一公式。
        //   round_no 遗产③：旧"已绑定(round_no NOT NULL)不可删"改判"终态不可删"（isAdmin() 已含于 isCoordinator）。
        if (SI_ATT_TERMINAL_STATUSES.includes(iss.status)) return false;
        if (isCoordinator) return true;
        // 历史参与者（曾在 dev_assignees 但当前已移除）即便是本人上传也无删除权（§0 line33）——前端 isOwnerDev
        // 已限定"当前在册"，故此处 isOwnerDev && uploaded_by 命中即天然满足该裁定，无需额外判断。
        return isOwnerDev && currentUser && a.uploaded_by === currentUser.id;
    }

    // ---- 通知区（通知改造 C4：bug 4 类手动通知+三能力；变更流仍只读三侧自动派发展示） ----
    // 通知状态文字化（对齐 Data_Correction 通知栏色彩语言：✅已通知 / 📖已读 / ⚠️失败 / —未发送）。
    //   通知时刻+已读时刻双显，对齐 Data_Correction 范式；notified_at 缺失时回退只显已读/已通知。
    function siNotifyStatusText(status, readAt, notifiedAt) {
        if (status === 'sent') {
            if (readAt) {
                return notifiedAt
                    ? `<span style="color:#059669;">📖 已读 · 通知于 ${esc(siFmtDT(notifiedAt))} · 已读于 ${esc(siFmtDT(readAt))}</span>`
                    : `<span style="color:#059669;">📖 已读 · 于 ${esc(siFmtDT(readAt))}</span>`;
            }
            return notifiedAt
                ? `<span style="color:#059669;">✅ 已于 ${esc(siFmtDT(notifiedAt))} 通知</span>`
                : `<span style="color:#059669;">✅ 已通知</span>`;
        }
        if (status === 'failed') return `<span style="color:#dc2626;">⚠️ 通知失败，可重试</span>`;
        if (status === 'no_phone') return `<span style="color:#b45309;">— 无手机号，无法通知</span>`;
        return `<span style="color:#9ca3af;">— 未发送钉钉通知</span>`;   // not_sent / null
    }
    // 单行组装（对齐 Data_Correction .notify-row）：左标签 si-nr-label + 右内容 si-nr-body（文字状态 + 操作按钮）+ 可选提示行
    function siNotifyRowHtml(label, status, readAt, notifiedAt, buttonsHtml, extraNote) {
        return `<div class="u-notify-row"><span class="u-nr-label">${label}</span><span class="u-nr-body">${siNotifyStatusText(status, readAt, notifiedAt)}${buttonsHtml || ''}</span></div>` +
            (extraNote ? `<div class="u-hint" style="margin:-2px 0 6px">${extraNote}</div>` : '');
    }

    // 开发侧（逐 dev，通知改造 C3 子表）：主开发/协作开发各自一行，各自独立 notify_status/read_at + 三能力。
    //   can_send/can_resend 共用同一按钮（label 按 notify_status 是否 sent 切换「发送/重发」，端点本就是同一 POST）；
    //   can_query_read=admin/白名单/主开发本人（read-status handler 内判定，四侧统一，不看工单状态）。
    function siRenderDevNotifyRows(iss, devAssignees, canOperateDev, canQueryRead) {
        if (!devAssignees || !devAssignees.length) {
            return `<div class="u-notify-row"><span>开发</span><span class="si-muted">暂无指派开发</span></div>`;
        }
        const sendable = SI_NOTIFY_DEV_STATUSES.includes(iss.status);
        return devAssignees.map(d => {
            const tag = d.is_primary ? '（主）' : '（协作）';
            const label = `开发 ${esc(d.user_name || ('#' + d.user_id))}${tag}`;
            let btns = '';
            if (canOperateDev && sendable) {
                btns += `<button class="u-btn-secondary u-nb-btn" onclick="siNotifyDevSend(${d.user_id})">${d.notify_status === 'sent' ? '重新通知' : '发送通知'}</button>`;
            }
            if (canQueryRead && d.notify_status === 'sent' && d.notify_message_key) {
                btns += `<button class="u-btn-secondary u-nb-btn" onclick="siQueryReadStatus('dev', ${d.user_id})">查询已读</button>`;
            }
            return siNotifyRowHtml(label, d.notify_status, d.read_at, d.notified_at, btns);
        }).join('');
    }

    // 对接人侧（仅 path B 建单有意义；relay_notified_user_id 为空=非 path B，不渲染该行）。仅 admin 可发（后端 requireAdmin）。
    function siRenderRelayNotifyRow(iss, canOperateRelay, canQueryRead) {
        if (!iss.relay_notified_user_id) return '';
        const label = `对接人 ${esc(iss.relay_notified_user_name || ('#' + iss.relay_notified_user_id))}`;
        const sendable = SI_NOTIFY_RELAY_STATUSES.includes(iss.status);
        let btns = '';
        if (canOperateRelay && sendable) {
            btns += `<button class="u-btn-secondary u-nb-btn" onclick="siNotifyRelayClick()">${iss.relay_notify_status === 'sent' ? '重新通知' : '发送通知'}</button>`;
        }
        if (canQueryRead && iss.relay_notify_status === 'sent' && iss.relay_notify_message_key) {
            btns += `<button class="u-btn-secondary u-nb-btn" onclick="siQueryReadStatus('relay')">查询已读</button>`;
        }
        return siNotifyRowHtml(label, iss.relay_notify_status, iss.relay_read_at, iss.relay_notified_at, btns);
    }

    // 建单人侧：权限=admin/白名单/主开发本人（notify-creator handler 内判定）；self-guard 由 siNotifyManual 内识别 skipped 淡提示。
    function siRenderCreatorNotifyRow(iss, canOperateCreator, canQueryRead) {
        const label = `建单人 ${esc(iss.created_by_name || ('#' + iss.created_by))}`;
        const sendable = SI_NOTIFY_CREATOR_STATUSES.includes(iss.status);
        let btns = '';
        if (canOperateCreator && sendable) {
            btns += `<button class="u-btn-secondary u-nb-btn" onclick="siNotifyCreatorClick()">${iss.creator_notify_status === 'sent' ? '重新通知' : '发送通知'}</button>`;
        }
        if (canQueryRead && iss.creator_notify_status === 'sent' && iss.creator_notify_message_key) {
            btns += `<button class="u-btn-secondary u-nb-btn" onclick="siQueryReadStatus('creator')">查询已读</button>`;
        }
        return siNotifyRowHtml(label, iss.creator_notify_status, iss.creator_read_at, iss.creator_notified_at, btns);
    }

    // 上线执行开发侧（release_assignee，通知改造 follow-up 2026-07-07）：仅 admin 可发（notify-release-executor: requireAdmin）；
    //   未指定上线开发（release_assignee_id 空）不渲染该行。sendable=待上线；byId 无快照，重发/查已读同 creator 范式。
    function siRenderReleaseExecutorNotifyRow(iss, canOperateReleaseExecutor, canQueryRead) {
        if (!iss.release_assignee_id) return '';
        const label = `上线开发 ${esc(iss.release_assignee_name || ('#' + iss.release_assignee_id))}`;
        const sendable = SI_NOTIFY_RELEASE_EXECUTOR_STATUSES.includes(iss.status);
        let btns = '';
        if (canOperateReleaseExecutor && sendable) {
            btns += `<button class="u-btn-secondary u-nb-btn" onclick="siNotifyReleaseExecutorClick()">${iss.release_assignee_notify_status === 'sent' ? '重新通知' : '发送通知'}</button>`;
        }
        if (canQueryRead && iss.release_assignee_notify_status === 'sent' && iss.release_assignee_notify_message_key) {
            btns += `<button class="u-btn-secondary u-nb-btn" onclick="siQueryReadStatus('release_executor')">查询已读</button>`;
        }
        return siNotifyRowHtml(label, iss.release_assignee_notify_status, iss.release_assignee_read_at, iss.release_assignee_notified_at, btns);
    }

    // 业务方侧（byPhone 两套规则，§4.2/§6.1）：首发依赖当前 requester_phone；已发送过后重发/查已读依赖快照
    //   requester_notify_phone_snapshot（发后改号仍可对旧快照操作）。历史无快照（status=sent 但快照空，迁移前旧数据）
    //   → 前端出提示文案，不出按钮（避免必然触发 HISTORICAL_SNAPSHOT_MISSING 400）。
    function siRenderRequesterNotifyRow(iss, canOperateRequester, canQueryRead) {
        const label = `业务方 ${siRequesterText(iss)}`;
        const hasSnapshot = !!iss.requester_notify_phone_snapshot;
        const hasCurrentPhone = !!iss.requester_phone;
        const sendableStatus = SI_NOTIFY_REQUESTER_STATUSES.includes(iss.status);
        // codex41 L-4：首发 vs 重发的判据是「有无收件人快照」，不是 status==='sent'——后端发送时即固化快照，
        //   message_key_missing 边界会落 status='failed' 但快照已固化、后端仍能按快照重发（原按 sent 判会在
        //   随后清空当前手机号时把可重发场景误藏成「无手机号」）。有快照→按快照重发（不看当前号）；无快照→首发依赖当前号。
        const historicalNoSnapshot = iss.requester_notify_status === 'sent' && !hasSnapshot;   // 迁移前旧数据（生产 0 行），无快照不支持重发/查已读
        let btns = '', extraNote = '';
        if (canOperateRequester && sendableStatus) {
            if (hasSnapshot) {
                btns += `<button class="u-btn-secondary u-nb-btn" onclick="siNotifyRequesterClick()">重新通知</button>`;
            } else if (historicalNoSnapshot) {
                extraNote = '<span class="si-muted">历史记录无快照，不支持重发/查已读</span>';
            } else if (hasCurrentPhone) {
                btns += `<button class="u-btn-secondary u-nb-btn" onclick="siNotifyRequesterClick()">发送通知</button>`;
            } else {
                extraNote = '<span class="si-muted">无手机号，无法通知</span>';
            }
        }
        if (canQueryRead && iss.requester_notify_status === 'sent' && iss.requester_notify_message_key && hasSnapshot) {
            btns += `<button class="u-btn-secondary u-nb-btn" onclick="siQueryReadStatus('requester')">查询已读</button>`;
        }
        return siNotifyRowHtml(label, iss.requester_notify_status, iss.requester_read_at, iss.requester_notified_at, btns, extraNote);
    }

    function siRenderNotify(iss, devAssignees) {
        if (iss.type !== 'bug') {
            // 变更流：只读三侧展示（自动派发，无手动按钮）——保留旧行为。
            return `<div class="u-detail-section"><h3>钉钉通知（三侧独立）</h3>
                ${siNotifyRowHtml('开发侧（指派/改派/打回/重开）', iss.notify_status, iss.read_at, iss.notified_at, '')}
                ${siNotifyRowHtml('需求方侧（回填预计/已上线）', iss.requester_notify_status, iss.requester_read_at, iss.requester_notified_at, '')}
                ${siNotifyRowHtml('建单人侧', iss.creator_notify_status, iss.creator_read_at, iss.creator_notified_at, '')}
                <div style="font-size:11px;color:#9ca3af;margin-top:6px">通知在各动作完成后自动派发；本页只读展示送达状态。</div>
            </div>`;
        }
        // bug 流：4 类手动通知（通知改造 C4）。权限镜像后端（§4.2 权限矩阵，前端仅控按钮显隐，真闸在后端）：
        const isAdminUser = isAdmin();
        const uid = currentUser && currentUser.id;
        const isBugLiaison = currentUser && isSiBugLiaison(uid);
        const isPrimaryDev = currentUser && Number(iss.assigned_to) === Number(uid) && uid > 0;
        const canOperateDev = isAdminUser || isBugLiaison;              // notify-developer: requireAdminOrBugLiaison
        const canOperateRelay = isAdminUser;                             // notify-relay: requireAdmin
        const canOperateCreator = isAdminUser || isBugLiaison || isPrimaryDev;   // notify-creator: handler 内判定
        const canOperateRequester = isAdminUser || isBugLiaison;        // notify-requester: requireAdminOrBugLiaison
        const canOperateReleaseExecutor = isAdminUser;                   // notify-release-executor: requireAdmin（仅 admin）
        const canQueryRead = isAdminUser || isBugLiaison || isPrimaryDev;   // read-status handler 内判定，五侧统一

        return `<div class="u-detail-section"><h3>钉钉通知（5 类独立·手动触发）</h3>
            ${siRenderDevNotifyRows(iss, devAssignees || [], canOperateDev, canQueryRead)}
            ${siRenderRelayNotifyRow(iss, canOperateRelay, canQueryRead)}
            ${siRenderCreatorNotifyRow(iss, canOperateCreator, canQueryRead)}
            ${siRenderRequesterNotifyRow(iss, canOperateRequester, canQueryRead)}
            ${siRenderReleaseExecutorNotifyRow(iss, canOperateReleaseExecutor, canQueryRead)}
            <div style="font-size:11px;color:#9ca3af;margin-top:6px">bug 通知均<b>手动触发</b>——点对应「发送/重发」按钮；「查已读」查询钉钉已读回执。</div>
        </div>`;
    }

    // ============================================================
    // 操作区（meta 驱动 + 角色 + 单据标志精化）
    // ============================================================
    function siRenderActions(iss) {
        const box = document.getElementById('siDActions');
        if (!META_OK) { box.innerHTML = '<span class="si-muted">只读模式：状态动作暂不可用</span>'; return; }
        if (iss.status === '已作废') { box.innerHTML = '<span class="si-muted">单据已作废，只读。</span>'; return; }  // G：作废单只读，不出 void/derive（后端对已作废再 void 会重复写 timeline）
        const flows = (META.typeFlows && META.typeFlows[iss.type]) || [];
        const isAdminUser = isAdmin();
        // C7 契约裁定点：W06 类动作（estimate/feasibility/blocked）与 submit 原按单一 assigned_to 门控，
        // 与 C3 起后端 assertDevMember（任一在册成员）已不同源（§0 去主次核心不变量：assigned_to/is_primary
        // 禁作授权源，方案 §3.6）——改按 siCaps 在册身份判定，不再用 iss.assigned_to 单人比对。isOwnerDev
        // 变量名沿用（下方 gate 提示/chatBtn 既有引用），语义已升级为"在册成员"而非"单一代表"。
        const isRosterMember = !!(siCaps && siCaps.isRosterMember);
        const isOwnerDev = isRosterMember;
        // ④a bug 对接人白名单：bug 单的 assign/reassign 对白名单对接人（示例发布者/示例对接人）放行——与后端
        //   requireAdminOrBugLiaison + roleGuard='admin_or_bug_liaison' 同源；前端只放这两个动作，其余 admin 动作仍仅 admin。
        const isBugLiaison = currentUser && iss.type === 'bug' && isSiBugLiaison(currentUser.id);
        // C-orch 上线编排（待上线态双角色按钮 + gate）已于 2026-07-07 样式统一拆到独立区块 siRenderReleaseOrchBlock，
        //   本操作区不再涉及 release_assignee，故原 isReleaseExecutor 声明一并移除。

        const acts = [];
        for (const f of flows) {
            const a = f.action;
            if (a === 'create') continue;
            // C-orch：assign-release-dev / execute-release 抑制出通用循环——两者可见性/权限模型与其余 meta
            //   动作不同（admin 万能 vs 仅被指定执行人），改走 siRenderActions 末尾的自定义双角色渲染（§6）。
            if (a === 'assign-release-dev' || a === 'execute-release') continue;
            const hit = (f.from === '*') || (Array.isArray(f.from) && f.from.includes(iss.status));
            if (!hit) continue;
            const devAction = SI_DEV_ACTIONS.has(a);
            // ④a 对接人放行契约（codex 30 M-1 显式化）：对接人可见动作 = type='bug'(isBugLiaison) ∧ action∈{assign,reassign}
            //   （**动作名硬编码在此处，不依赖 flows 配置**——将来给 bug 流加新动作/改 flows 也不会扩大对接人放行范围）
            //   ∧ 状态由共享 hit(from 命中，见上方) 收窄（assign 仅待处理 / reassign 仅处理中·待验证）。
            //   ⚠️ 前端是 UI 镜像**非授权源**：真闸在后端 requireAdminOrBugLiaison + roleGuard + reassign handler type 精判；
            //     即便前端误显，点击也会被后端 403，故此处硬编码 action 白名单已足，不再复制后端 from 集合（避免第二处真相源漂移）。
            const liaisonAction = isBugLiaison && (a === 'assign' || a === 'reassign');
            if (devAction) {
                // submit 专属再叠 canSubmit（本人 dev_status=pending 逐人判定）——多开发场景下本人已提交但
                // 其他成员未完成时，主状态仍留在 SYS_DEV，仅按族状态判会让已提交成员继续看到「提交」按钮，
                // 点击必 409 INVALID_STATUS；estimate/feasibility/blocked 三个 W06 动作不分 dev_status，
                // 任一在册成员均可填（§5.3 W06 白名单），故仍用 isRosterMember。
                if (a === 'submit') { if (!(siCaps && siCaps.canSubmit)) continue; }
                else if (!isRosterMember) continue;
            }
            else if (!isAdminUser && !liaisonAction) continue;

            // 开发态 / 批次精化（needs_feasibility / blocked / dev_estimated_at / release_id）
            if (a === 'estimate' && iss.needs_feasibility) continue;             // 需评估的走 feasibility
            if (a === 'feasibility' && (!iss.needs_feasibility || iss.blocked)) continue;  // F：受阻时不出评估（后端 409 ISSUE_BLOCKED）
            if (a === 'blocked' && (!iss.needs_feasibility || iss.blocked)) continue;
            if (a === 'unblock' && !iss.blocked) continue;
            if (a === 'publish' && iss.release_id) continue;                      // C：已挂批次(release_id)的单只能经批次面板发布（hotfix 后端 409 ISSUE_NOT_HOTFIXABLE，仅变更流仍用）
            // C-orch 清理：publish/confirm-online-norelease/set_release_flag 三条 bug 专属 needs_release 分支已随
            // v1.6 §2.3 [C-1] 从 BUG_FLOW_TRANSITIONS 整体退场（meta.typeFlows['bug'] 不再含这三个 action，本循环对
            // bug 恒不会命中），原对应的 3 行 continue 守卫纯属死代码，一并删除（task §5 第②点清理要求）。
            if (a === 'submit') {
                if (iss.blocked) continue;
                if (!iss.dev_estimated_at) continue;                            // 闸门①
                // B：需评估单，结论未出或为"不可行"都不能提交（后端 400 FEASIBILITY_NOT_FEASIBLE）
                if (iss.needs_feasibility && (!iss.feasibility_conclusion || iss.feasibility_conclusion === '不可行')) continue;
            }
            acts.push(a);
        }

        // 闸门 / 引导提示
        let gate = '';
        if (isOwnerDev && iss.status === '开发中') {
            if (iss.blocked) gate = `<div class="si-gate-hint">⛔ 当前受阻中，请联系管理员「解除受阻」后再继续。</div>`;   // A：解除受阻是 admin 权限，开发无权
            else if (iss.needs_feasibility && iss.feasibility_conclusion === '不可行') gate = `<div class="si-gate-hint">⛔ 评估结论「不可行」，请联系建单人处置（作废 / 派生），暂不能提交交付。</div>`;  // B
            else if (iss.needs_feasibility && !iss.feasibility_conclusion) gate = `<div class="si-gate-hint">⚠️ 闸门：本单需先完成「可行性评估」（含预计完成时间），才能提交交付。</div>`;
            else if (!iss.dev_estimated_at) gate = `<div class="si-gate-hint">⚠️ 闸门①：请先「回填预计完成时间」，才能提交交付。</div>`;
        } else if (isAdminUser && iss.status === '待上线' && iss.release_id) {
            gate = `<div class="si-gate-hint">📦 已加入批次 #${iss.release_id}，请在「批次管理」中发布。</div>`;   // C（变更流；bug 走 release_assignee 体系不再挂此批次面板）
        }
        // C-orch bug 待上线态的四个引导分支（指定/等待/可执行）已随上线编排一起移入 siRenderReleaseOrchBlock，本操作区不再重复。

        const btns = acts.map(a => {
            const label = (META.actions && META.actions[a]) || a;
            let lbl = label;
            if (a === 'estimate' && iss.dev_estimated_at) lbl = '修改预计完成';   // estimate 已回填改文案
            else if (a === 'publish') lbl = '单条上线';                          // C：publish 映射 hotfix-publish，纠正 meta label"批次发布"的误导
            const cls = SI_DANGER_ACTIONS.has(a) ? 'u-btn-danger' : (SI_SEC_ACTIONS.has(a) ? 'u-btn-secondary' : 'u-btn-primary');
            return `<button class="${cls} u-btn-sm" onclick="siDoAction('${a}')">${esc(lbl)}</button>`;
        }).join('');

        // 拉群讨论（§5 bug 流旁路动作，非 meta transition；type=bug + 指派后非终态 + 未建群 + admin||owner-dev）
        let chatBtn = '';
        if (iss.type === 'bug' && (isAdminUser || isOwnerDev) && SI_CHAT_STATUSES.includes(iss.status) && !iss.dingtalk_open_conversation_id) {
            chatBtn = `<button class="u-btn-secondary u-btn-sm" onclick="siDoAction('create-chat')">拉群讨论</button>`;
        }
        // C4：通知按钮全部搬进详情页「通知」区（siRenderNotify，逐类三能力），本操作区不再放通知按钮
        //   （旧 ④b-1 notifyBtns 已退场；bug 流手动通知见 siRenderNotify + siNotifyDevSend/siNotifyRelayClick/
        //   siNotifyCreatorClick/siNotifyRequesterClick）。

        // C-orch 上线编排按钮（指定/换执行开发·执行上线）已拆到 siRenderReleaseOrchBlock 独立区块，本操作区不再渲染。
        // MED-2（codex 43）：上线编排区块确有内容时（siReleaseOrchHasContent 同源判据），顶部操作栏即便无通用动作
        //   也不出"无可执行动作"兜底（避免与下方区块按钮 UI 冲突）。用同一判据杜绝"顶部抑制兜底、下方区块却也空"的
        //   分叉——主开发看未指定上线开发的待上线单时 orchBlock 空 → 此处判 false → 仍显示"无可执行动作"（准确）。
        const fallback = siReleaseOrchHasContent(iss) ? '' : '<span class="si-muted">当前状态/身份下无可执行动作</span>';
        // 删除任务（admin 专用·物理删除·不可逆·2026-07-07）：始终对 admin 可见（危险区）；守卫（有派生子单 /
        //   已挂批次）由 siDeleteIssue 前置镜像 + 后端 DELETE 守卫双重兜底——前端非授权源，真闸在后端。
        let adminDelBtn = '';
        if (isAdminUser) adminDelBtn = `<button class="u-btn-danger u-btn-sm" onclick="siDeleteIssue()">删除任务</button>`;
        box.innerHTML = gate + ((btns + chatBtn + adminDelBtn) || fallback);
    }

    // ============================================================
    // 动作分发 → 弹框收集字段 → 调端点
    // ============================================================
    function siDoAction(action) {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        switch (action) {
            case 'schedule': return siModalSchedule(iss);
            case 'assign': return siModalAssign(iss);
            case 'reassign': return siModalReassign(iss);
            case 'create-chat': return siModalCreateChat(iss);
            // C4：notify-developer/notify-relay/notify-creator/notify-requester 已从本操作区迁移到详情页
            //   「通知」区（siRenderNotify），改由 siNotifyDevSend/siNotifyRelayClick/siNotifyCreatorClick/
            //   siNotifyRequesterClick 各自读 siDetail 直调，不再经本 switch。
            case 'estimate': return siModalEstimate(iss);
            case 'feasibility': return siModalFeasibility(iss);
            case 'blocked': return siModalReason(iss, 'blocked', '标记受阻', '受阻原因', '/blocked');
            case 'unblock': return siModalReason(iss, 'unblock', '解除受阻', '解除说明', '/unblock');
            case 'submit': return siModalSubmit(iss);
            case 'accept': return siConfirmSimple(iss, 'accept', '确认验收通过？', '/accept');
            case 'return': return siModalReason(iss, 'return', '验收打回', '打回原因', '/return');
            case 'close': return siConfirmSimple(iss, 'close', '确认关闭（观察期结束）？', '/close');
            case 'hold': return siModalReason(iss, 'hold', '暂缓', '暂缓原因', '/hold');
            case 'resume': return siConfirmSimple(iss, 'resume', '确认恢复到暂缓前的状态？', '/resume');
            case 'reactivate': return siModalReason(iss, 'reactivate', '重新激活', '重新激活原因', '/reactivate');
            case 'issue_reject': return siModalReason(iss, 'issue_reject', '拒绝', '拒绝原因', '/issue-reject');
            case 'void': return siModalReason(iss, 'void', '作废', '作废原因', '/void');
            case 'reopen': return siModalReason(iss, 'reopen', '重开（返工）', '重开原因', '/reopen');
            case 'publish': return siModalHotfix(iss);            // 单条上线走 hotfix-publish（仅变更流仍用；bug 已退场用 C-orch）
            // C-orch 清理：set_release_flag/confirm-online-norelease 随 v1.6 [C-1] 整体退场，meta.typeFlows 不再
            // 产生这两个 action，acts 数组不会含它们，本两条 case 已不可达——一并删除（task §5 死代码清理要求）。
            case 'derive': return siModalDerive(iss);
            default: showToast('未知动作：' + action, 'error');
        }
    }

    // 刷新详情 + 列表
    async function siAfterAction() { await siLoadList(); if (siOpenId) await siRenderDrawer(siOpenId); }

    // C4 bug 流手动通知（POST notify-relay/notify-creator/notify-requester；按后端回的落库状态 toast + 刷新详情看通知区）。
    //   iss 不作参数——一律读 siDetail.issue（本区按钮全部内联在通知区行内，onclick 字符串里传不了对象引用，
    //   与 siDoAction 系列一致的「读全局 siDetail」范式）。
    let siNotifyInflight = false;   // codex31 M-3/ultracode txn：inflight 守卫防双击/重复点导致重复钉钉推送 + read_at 重复重置
    async function siNotifyManual(endpoint, label, statusKey, errKey) {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        if (siNotifyInflight) return;
        siNotifyInflight = true;
        try {
            const r = await siApi('/sys-issues/' + iss.id + '/' + endpoint, { method: 'POST' });
            if (!r.ok) { siApiErr(r); return; }
            if (r.data && r.data.skipped) { showToast(label + '：无需通知自己', 'info'); await siAfterAction(); return; }   // self-guard（notify-creator，M-2）
            const st = r.data && r.data[statusKey];
            if (st === 'sent') showToast(label + '：钉钉已发送', 'success');
            else if (st === 'failed') showToast(label + '：发送失败（' + ((r.data && r.data[errKey]) || '未知') + '）', 'error');
            else showToast(label + '：已触发', 'success');
            await siAfterAction();
        } finally { siNotifyInflight = false; }
    }
    function siNotifyRelayClick() { return siNotifyManual('notify-relay', '通知对接人', 'relay_notify_status', 'relay_notify_error'); }
    function siNotifyCreatorClick() { return siNotifyManual('notify-creator', '通知建单人', 'creator_notify_status', 'creator_notify_error'); }
    function siNotifyRequesterClick() { return siNotifyManual('notify-requester', '通知报障人', 'requester_notify_status', 'requester_notify_error'); }
    function siNotifyReleaseExecutorClick() { return siNotifyManual('notify-release-executor', '通知上线开发', 'release_assignee_notify_status', 'release_assignee_notify_error'); }

    // 开发侧逐 dev 通知（notify-developer 带 dev_user_id，定位子表活动行；同一 inflight 守卫）
    async function siNotifyDevSend(devUserId) {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        if (siNotifyInflight) return;
        siNotifyInflight = true;
        try {
            const r = await siApi('/sys-issues/' + iss.id + '/notify-developer', { method: 'POST', body: { dev_user_id: devUserId } });
            if (!r.ok) { siApiErr(r); return; }
            const st = r.data && r.data.notify_status;
            if (st === 'sent') showToast('通知开发：钉钉已发送', 'success');
            else if (st === 'failed') showToast('通知开发：发送失败（' + ((r.data && r.data.notify_error) || '未知') + '）', 'error');
            else showToast('通知开发：已触发', 'success');
            await siAfterAction();
        } finally { siNotifyInflight = false; }
    }

    // 查已读（GET notify-read-status?type=dev|relay|creator|requester|release_executor[&dev_user_id=]）——五侧共用一个查询函数。
    //   历史无快照（HISTORICAL_SNAPSHOT_MISSING）按契约出提示非报错；其余错误走通用 siApiErr。
    async function siQueryReadStatus(type, devUserId) {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        let path = '/sys-issues/' + iss.id + '/notify-read-status?type=' + type;
        if (type === 'dev') path += '&dev_user_id=' + devUserId;
        const r = await siApi(path);
        if (!r.ok) {
            if (r.data && r.data.code === 'HISTORICAL_SNAPSHOT_MISSING') { showToast('历史记录无快照，不支持查已读', 'info'); return; }
            siApiErr(r, '查已读失败'); return;
        }
        const d = r.data || {};
        if (d.read) showToast('已读' + (d.read_at ? '（' + esc(d.read_at) + '）' : ''), 'success');
        else if (d.read_status === 'recipient_unresolved') showToast('收件人钉钉号未解析，暂无法判断已读', 'warning');
        else showToast('尚未读', 'info');
        await siAfterAction();
    }

    // ---- 通用「原因」弹框 ----
    function siModalReason(iss, action, title, label, path) {
        siModal(title, [
            fTextarea('reason', label, '', true, '必填，trim 后非空')
        ], async v => {
            if (!v.reason.trim()) { showToast(label + '必填', 'error'); return false; }
            const r = await siApi('/sys-issues/' + iss.id + path, { method: 'POST', body: { reason: v.reason.trim() } });
            if (!r.ok) { siApiErr(r); return false; }
            showToast(title + '完成', 'success'); return true;
        });
    }
    function siConfirmSimple(iss, action, prompt, path) {
        siModal(prompt, [note(prompt)], async () => {
            const r = await siApi('/sys-issues/' + iss.id + path, { method: 'POST', body: {} });
            if (!r.ok) { siApiErr(r); return false; }
            showToast('操作完成', 'success'); return true;
        }, '确定');
    }

    // 物理删除迭代单（admin·不可逆·2026-07-07）：二次确认后 DELETE /sys-issues/:id → 级联清主表+三子表+附件文件。
    //   前置镜像后端守卫①（有派生子单则直接拦，省一次弹框往返）；守卫②（已挂批次）由后端 409 兜底、siApiErr 直出。
    //   note() 不转义 → iss.title 必须 esc()；换行用 <br>（\n 在 div 内折叠）。成功后关抽屉 + 刷列表。
    function siDeleteIssue() {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        const hasDerived = siDetail && siDetail.derived_issues && siDetail.derived_issues.length > 0;
        if (hasDerived) { showToast('该单已派生出子单，不可删除（请先处理派生链）', 'error'); return; }
        siModal(
            '删除任务 #' + iss.id,
            [note(`确认物理删除迭代单 #${iss.id}「${esc(iss.title || '')}」？<br><br>此操作<b>不可恢复</b>，将一并清除该单的：状态历史、附件（含文件）、协作开发、四方通知记录。`)],
            async () => {
                const r = await siApi('/sys-issues/' + iss.id, { method: 'DELETE' });
                if (!r.ok) { siApiErr(r); return false; }
                showToast('已删除', 'success');
                siCloseDrawer();
                siLoadList();
                return true;
            },
            '确认删除'
        );
    }

    function siModalSchedule(iss) {
        siModal('排期', [
            fSelect('priority', SI_PRIORITY_LABEL, ['P0', 'P1', 'P2', 'P3'], iss.priority || 'P2'),
            fDate('deadline', '期望完成时间（选填）', iss.deadline || '')
        ], async v => {
            const body = { priority: v.priority };
            if (v.deadline) body.deadline = v.deadline;
            const r = await siApi('/sys-issues/' + iss.id + '/schedule', { method: 'POST', body });
            if (!r.ok) { siApiErr(r); return false; }
            showToast('已排期', 'success'); return true;
        });
    }

    // C5：协作开发多选 picker（镜像 siModalCreateChat 1105 附近的 checkbox 多选范式）。
    //   preselectedIds=当前在册协作 user_id 数组（勾选态回显）；提交时读取走 #siMBody 局部 query
    //   （codex32 M-1 教训：不用全局 document，siModal 每次替换其 innerHTML）。
    function siCollaboratorPickerHtml(preselectedIds) {
        const pre = new Set((preselectedIds || []).map(Number));
        const opts = siUsers.filter(u => u.role !== 'viewer').map(u =>
            `<label class="si-chk-row"><input type="checkbox" class="si-collab-chk" value="${u.id}" ${pre.has(Number(u.id)) ? 'checked' : ''}><span class="si-chk-text">${esc(u.display_name || u.username)}</span></label>`
        ).join('');
        return `<div class="u-form-group"><label>协作开发（可多选，仅收通知不参与状态机）</label>
            <div style="max-height:150px;overflow:auto;border:1px solid #e5e7eb;border-radius:6px;padding:6px">${opts || '<span class="si-muted">无可选用户</span>'}</div>
        </div>`;
    }
    function siReadCollabChkIds(excludeId) {
        const mbody = document.getElementById('siMBody');
        if (!mbody) return [];
        return [...mbody.querySelectorAll('.si-collab-chk:checked')].map(x => parseInt(x.value, 10)).filter(id => id && id !== excludeId);
    }

    function siModalAssign(iss) {
        // C5：assign 扩主+协作多选（多开发模型：主 DRI 单选走状态机 + N 协作子表仅收通知，两者同一事务原子写，
        //   见 index.js applyDevAssigneeDiff）。协作预选=空（assign 仅在「待处理」态，尚无在册协作历史）。
        siModal('指派开发', [
            fUserSelect('assigned_to', '主开发（DRI）', null),
            { k: null, html: siCollaboratorPickerHtml([]) },
            note('指派后转「开发中/处理中」，钉钉通知主开发。协作开发仅收通知、不参与状态机流转，请先由主开发回填预计完成时间。')
        ], async v => {
            if (!v.assigned_to) { showToast('请选择主开发人员', 'error'); return false; }
            const primaryId = parseInt(v.assigned_to, 10);
            const collaboratorIds = siReadCollabChkIds(primaryId);   // 防主协重复：客户端静默剔除同 id（后端亦有 ASSIGNEE_DUPLICATE 兜底）
            const body = { assigned_to: primaryId };
            if (collaboratorIds.length) body.collaborator_ids = collaboratorIds;
            const r = await siApi('/sys-issues/' + iss.id + '/assign', { method: 'POST', body });
            if (!r.ok) { siApiErr(r); return false; }

    // C7 重做（方案 v2.9 §3 reassign 段 + §10 API 契约）：旧「换主/留主改协作」二分语义随 C2 后端全语义
    //   重写整段退场——新契约=声明式最终在册名单（member_ids，无主次之分）+ reason 必填。同一函数兼两个
    //   入口：① 操作栏「改派」按钮（meta flows 驱动，bug 对接人/admin 可见）② 详情「开发成员」区协调人
    //   「管理开发成员」按钮（canCoordinateMember，任意迭代类型）——两处语义完全一致，不重复实现（任务
    //   ④ 提示"复用②的多选编辑器思路"，本次直接同一函数覆盖，非另建 modal）。
    //   M3 乐观锁（94 号对抗审复核 backlog，C7 回填）：进弹窗时快照当前在册 user_id 集合作
    //   expected_member_ids 一并提交，后端 409 REASSIGN_STALE 时前端刷新重拉（防协调人 A/B 并发改派互相覆盖）。
    function siModalReassign(iss) {
        const devAssignees = (siDetail && siDetail.dev_assignees) || [];
        const expectedMemberIds = devAssignees.map(d => Number(d.user_id));
        const pre = new Set(expectedMemberIds);
        const pickerHtml = `<div class="u-form-group"><label>开发成员（勾选=最终在册名单，去主次·无「主开发」）</label>
            <div style="max-height:180px;overflow:auto;border:1px solid #e5e7eb;border-radius:6px;padding:6px">
            ${siUsers.filter(u => u.role !== 'viewer').map(u =>
                `<label class="si-chk-row"><input type="checkbox" class="si-member-chk" value="${u.id}" ${pre.has(Number(u.id)) ? 'checked' : ''}><span class="si-chk-text">${esc(u.display_name || u.username)}</span></label>`
            ).join('') || '<span class="si-muted">无可选用户</span>'}
            </div></div>`;
        siModal('管理开发成员', [
            { k: null, html: pickerHtml },
            fTextarea('reason', '调整原因', '', true, '必填：本次名单调整的原因，trim 1..200'),
            note('勾选=最终在册名单：取消勾选=移除，新勾选=加入。当前主状态要求至少 1 名在册开发时，名单不能清空为 0。若他人已先一步调整，本次提交会被拒绝并自动刷新为最新名单。')
        ], async v => {
            const reason = (v.reason || '').trim();
            if (!reason || reason.length > 200) { showToast('调整原因必填（trim 1..200）', 'error'); return false; }
            const mbody = document.getElementById('siMBody');
            const memberIds = [...mbody.querySelectorAll('.si-member-chk:checked')].map(x => parseInt(x.value, 10)).filter(Boolean);
            const body = { member_ids: memberIds, reason, expected_member_ids: expectedMemberIds };
            const r = await siApi('/sys-issues/' + iss.id + '/reassign', { method: 'POST', body });
            if (!r.ok) {
                if (r.status === 409 && r.data && r.data.code === 'REASSIGN_STALE') {
                    siApiErr(r, '开发名单已被他人修改，已为你刷新');
                    siCloseModal();
                    await siAfterAction();
                    return false;
                }
                siApiErr(r);   // VALIDATION（no-op）/LAST_ASSIGNEE 等其余码后端 error 文案已足够清晰，原样透出
                return false;
            }
            showToast('开发成员已更新', 'success'); return true;
        });
    }

    async function siModalCreateChat(iss) {
        // ④b-2：拉群前拉候选（有手机号的系统用户 ∪ 报障人），做成多选下拉，发起人手动挑谁入群
        const cr = await siApi('/sys-issues/' + iss.id + '/chat-candidates');
        if (!cr.ok) { siApiErr(cr, '获取候选成员失败'); return; }
        const cand = (cr.data && cr.data.candidates) || [];
        const baseM = (cr.data && cr.data.base_members) || [];
        const reqInfo = (cr.data && cr.data.requester) || { eligible: false, name: '' };
        const baseNames = baseM.map(b => esc(b.display_name)).join('、') || '群主/建单人/开发/你';
        const pickerHtml = `<div class="u-form-group"><label>可选拉入成员（有手机号的系统用户，手动勾选）</label>
            <div style="max-height:150px;overflow:auto;border:1px solid #e5e7eb;border-radius:6px;padding:6px">
              ${cand.length ? cand.map(u => `<label class="si-chk-row"><input type="checkbox" class="si-mp-chk" value="${u.id}"><span class="si-chk-text">${esc(u.display_name)}</span></label>`).join('') : '<span class="si-muted">无其他可选成员（无绑手机号的系统用户）</span>'}
