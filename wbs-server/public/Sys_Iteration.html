        //   （release_executor 行 2026-07-30 起转纯只读展示无任何按钮，不再参与本组判定。）
        const canQueryRead = isAdminUser || (currentUser && isSiIntakeLiaison(uid)) || isBoundLiaisonForNotify;   // dev / creator / requester 三通道
        const canQueryReadAdminOnly = isAdminUser;                              // relay 通道

        return `<div class="u-detail-section"><h3>钉钉通知（独立·手动触发）</h3>
            ${siRenderIntakeNotifyRow(iss, isAdminUser, isAdminUser)}
            ${siRenderTechLeadNotifyRow(iss)}
            ${siRenderHoldCreatorNotifyRow(iss)}
            ${siRenderDevNotifyRows(iss, devAssignees || [], canOperateDev, canQueryRead)}
            ${siRenderResumeNotifyRow(iss, devAssignees || [])}
            ${siRenderRelayNotifyRow(iss, canOperateRelay, canQueryReadAdminOnly)}
            ${siRenderCreatorNotifyRow(iss, canOperateCreator, canQueryRead)}
            ${siRenderRequesterNotifyRow(iss, canOperateRequester, canQueryRead)}
            ${siRenderReleaseExecutorNotifyRow(iss)}
            <div class="u-nt-muted" style="font-size:11px;margin-top:6px">bug 通知均<b>手动触发</b>——点对应「发送/重发」按钮；「查已读」查询钉钉已读回执。</div>
        </div>`;
    }

    // ⭐ 角色权限重构 C4·184 号预审 PH-1（用户裁定，撤销原"整单终局"世界模型）：hasTechLeadComment
    //   改**轮内**判定——`tech_lead_notify_request_event_id` 标识"当前轮"，timeline.id 单调递增，
    //   旧轮意见的 id 必小于新轮 request 事件 id，天然按序隔轮（与后端 tech-lead-comment/
    //   resend-tech-consult/cancel-consult 三处同一口径，见 index.js 对应端点注释）。
    //   ⚠️ NULL 防御：`iss.tech_lead_notify_request_event_id` 为 NULL（无活动轮）时不能只靠
    //   `Number(t.id) > Number(null)`（Number(null)===0，任何正 id 都会被误判"大于"，把"无活动轮"
    //   误判成"当前轮有意见"）——显式先判 `!= null` 短路。
    //   ⚠️ 前提哨兵：依赖 detail 端点 timeline 全量返回（无分页）；若日后分页，须改读后端权威字段
    //   has_tech_lead_comment，不能再扫前端 timeline 数组。
    //   ⭐ S5 通知手动化：提到函数级复用（原内联在 siRenderActions 顶部），siRenderTechLeadNotifyRow /
    //   siRenderDrawer 的红条判断同样需要这条口径，不再各写一份（防两份拷贝漂移，同 PH-1 去重精神）。
    // 195 定点审 2M 收口：活动咨询=两列均非空（与后端 [3.6] 守卫同口径）——红条/琥珀条/按钮过滤三处共用，
    //   退化态（单列非空·仅 SQL 篡改可造）按"无活动咨询"处理，三处口径一致不再各查各的。
    function siHasActiveConsult(iss) { return !!(iss && iss.tech_lead_id && iss.tech_lead_notify_request_event_id); }
    function siHasTechLeadComment(iss) {
        return ((siDetail && siDetail.timeline) || []).some(t =>
            t.action_code === 'tech_lead_comment' && iss.tech_lead_notify_request_event_id != null
                && Number(t.id) > Number(iss.tech_lead_notify_request_event_id));
    }

    // ============================================================
    // 操作区（meta 驱动 + 角色 + 单据标志精化）
    // ============================================================
    function siRenderActions(iss) {
        const box = document.getElementById('siDActions');
        if (!META_OK) { box.innerHTML = '<span class="si-muted">只读模式：状态动作暂不可用</span>'; return; }
        if (iss.status === '已作废') { box.innerHTML = '<span class="si-muted">单据已作废，只读。</span>'; return; }  // G：作废单只读，不出 void/derive（后端对已作废再 void 会重复写 timeline）
        const flows = (META.typeFlows && META.typeFlows[iss.type]) || [];
        const isAdminUser = isAdmin();
        // C7 契约裁定点：W06 类动作（estimate/feasibility/blocked）与 submit 原按单一 assigned_to 门控，
        // 与 C3 起后端 assertDevMember（任一在册成员）已不同源（§0 去主次核心不变量：assigned_to/is_primary
        // 禁作授权源，方案 §3.6）——改按 siCaps 在册身份判定，不再用 iss.assigned_to 单人比对。isOwnerDev
        // 变量名沿用（下方 gate 提示/chatBtn 既有引用），语义已升级为"在册成员"而非"单一代表"。
        const isRosterMember = !!(siCaps && siCaps.isRosterMember);
        const isOwnerDev = isRosterMember;
        // ⭐⭐ [对接人绑单收口 2026-08-10·用户拍板] 操作权身份从「受理人白名单[13]」改**本单绑定对接人**——
        //   与后端 C10 绑单精判同源（引擎 isBoundLiaison / assign·reassign handler isBoundLiaisonEligibleOrAdmin）。
        //   旧判据两面都错：非[13] 的绑定对接人看不到按钮（后端能过·前端不渲染），示例对接人在非名下单上
        //   看得到按钮（点击 403 NOT_BOUND_LIAISON=死按钮）。
        //   （历史沿革：C1 曾从「bug 白名单∧type=bug」改「[13]∧全类型」；isSiBugLiaison 常量仍服务
        //     path B relay 收件人正交语义，与操作权无关。）
        // 受理排期改造 C7：绑定对接人 / 建单人身份（前端权限门·镜像后端 §5.3）
        const isBoundLiaisonUser = isSiBoundLiaison(iss);
        const isCreatorUser = !!(currentUser && Number(iss.created_by) === Number(currentUser.id) && Number(currentUser.id) > 0);
        // C-orch 上线编排（待上线态双角色按钮 + gate）已于 2026-07-07 样式统一拆到独立区块 siRenderReleaseOrchBlock，
        //   本操作区不再涉及 release_assignee，故原 isReleaseExecutor 声明一并移除。
        // hasTechLeadComment 已提到函数级共享 siHasTechLeadComment（S5 通知手动化·防两份拷贝漂移，
        //   见该函数头注释；原 PH-1 内联实现逐字迁移，判定口径不变）。
        const hasTechLeadComment = siHasTechLeadComment(iss);

        const acts = [];
        for (const f of flows) {
            const a = f.action;
            if (a === 'create') continue;
            // C-orch：assign-release-dev / execute-release 抑制出通用循环——两者可见性/权限模型与其余 meta
            //   动作不同（admin 万能 vs 仅被指定执行人），改走 siRenderActions 末尾的自定义双角色渲染（§6）。
            if (a === 'assign-release-dev' || a === 'execute-release') continue;
            // ⭐ 角色权限重构 C4·184 号预审 HIGH（换轮合法化，PH-1 用户裁定）：原"本单已有意见即不出现
            //   request_tech_consult"的 continue 已删除——新世界模型下，当前轮已有意见后 admin/受理人
            //   **可以**直接再发起新一轮咨询（旧意见留在 timeline 作历史），不再是终局动作。
            // ⭐ 用户 2026-07-28 手测拍板（入口互斥）：**活动咨询未回复期间隐藏本按钮**——选定示例发布者后
            //   入口转到通知区（发送/重发）与「取消咨询」（换人先取消再发起）；当前轮已回复后按钮**重现**
            //   （PH-1 换轮入口保留·再咨询一轮）。三态：无咨询→显 / 咨询中未回复→隐 / 已回复→显。
            if (a === 'request_tech_consult' && siHasActiveConsult(iss) && !siHasTechLeadComment(iss)) continue;
            const hit = (f.from === '*') || (Array.isArray(f.from) && f.from.includes(iss.status));
            if (!hit) continue;
            // S4·§6.1：改用类型感知的 siIsDevAction（bug 的 hold 是开发动作，变更流的 hold 仍归 admin 分支）。
            const devAction = siIsDevAction(a, iss.type);
            // ⭐ C1 协调人放行契约：受理人可见动作 = action∈{assign,reassign}（**全类型**·不再限 type='bug'）
            //   （动作名硬编码在此处，不依赖 flows 配置——将来加新动作/改 flows 也不会扩大放行范围）
            //   ∧ 状态由共享 hit(from 命中，见上方) 收窄。
            //   ⚠️ 前端是 UI 镜像**非授权源**：真闸在后端 requireIntakeLiaison 粗筛 + handler 的
            //     isBoundLiaisonEligibleOrAdmin 绑单精判；即便前端误显，点击也会被后端 403。
            const liaisonAction = isBoundLiaisonUser && (a === 'assign' || a === 'reassign');
            if (devAction) {
                // submit 专属再叠 canSubmit（本人 dev_status=pending 逐人判定）——多开发场景下本人已提交但
                // 其他成员未完成时，主状态仍留在 SYS_DEV，仅按族状态判会让已提交成员继续看到「提交」按钮，
                // 点击必 409 INVALID_STATUS；estimate/feasibility/blocked 三个 W06 动作不分 dev_status，
                // 任一在册成员均可填（§5.3 W06 白名单），故仍用 isRosterMember。
                // S4：bug 的 hold 口径是「任一活跃在册成员 ∨ admin」（口径 #6，同后端 assertBugHoldActor）——
                //   本分支其余动作只判 isRosterMember（无 admin 兜底，因为它们本就是纯开发自助动作，admin
                //   不需要代填），hold 是本分支里唯一需要额外 OR 上 admin 的例外，不能沿用 else 分支的单一判断。
                // ⚠️ S4 补强（codex 239 审 M-1，主会话核实成立）：hold 改判后端下发的 iss.can_bug_hold 能力位
                //   （与写路径真闸 assertBugHoldActor 同一谓词 canBugHold），不再用 isRosterMember（siCaps 读
                //   可见性判定，不含 removed_at IS NULL / dev_status != 'excused' 收紧）∨ isAdminUser 顶替——
                //   否则已移除/已 excuse 的历史成员会在前端多看到「暂缓」按钮（点击后端 403 拦下，安全无虞，
                //   但显隐本身是拿读权限冒充写权限）。can_bug_hold 已含 admin 判断，不需要再 OR isAdminUser。
                if (a === 'submit') { if (!(siCaps && siCaps.canSubmit)) continue; }
                else if (a === 'hold') { if (!iss.can_bug_hold) continue; }
                else if (!isRosterMember) continue;
            }
            // 受理排期改造 C7：受理门动作前端权限门（镜像后端 §5.3·前端非授权源·点击被后端 403 兜底）
            // [对接人绑单收口 2026-08-10] admin∨绑定本人；另镜像引擎 isUnboundAcceptClaim——存量空单（无绑定
            //   对接人）的 intake_accept 对任一 eligible 候选放行（受理即认领/代管，C10 P7-A）。
            else if (SI_INTAKE_LIAISON_ACTIONS.has(a)) {
                const unboundClaim = a === 'intake_accept' && iss.intake_liaison_id == null && isSiEligibleLiaisonRole();
                if (!(isAdminUser || isBoundLiaisonUser || unboundClaim)) continue;
            }
            else if (SI_CREATOR_ACTIONS.has(a)) { if (!(isAdminUser || isCreatorUser)) continue; }               // resubmit_intake/edit_in_revision = admin∨建单人
            else if (!isAdminUser && !liaisonAction) continue;   // change_intake_mode + 其余 admin 动作 = 仅 admin

            // ⭐ 角色权限重构 C0（codex 复审 MED-3）：change_intake_mode **整体下线**——受理门已焊死为全类型必经，
            //   "切换受理模式"语义消失，后端一律 409 INTAKE_MODE_SWITCH_DISABLED。此处无条件隐藏按钮，
            //   否则新页面会留一个**必然失败**的死按钮。
            //   ⚠️ 只隐藏入口、不删 siModalChangeIntakeMode 函数与路由：后端 409 需继续服务**已缓存的旧页面**
            //     （阶段1 语义），阶段2 同发布批次再连函数、路由、meta 动作一并删除。
            //   （原逻辑是"已过受理门才隐藏"，C0 后条件退化为恒真，直接写成无条件更诚实。）
            if (a === 'change_intake_mode') continue;
            // set_scheduled_start（C10 末次审 #7·codex149）：设值须 dev_estimated_at 非空（后端 SCHEDULED_START_REQUIRES_ESTIMATE），
            //   清除不须 estimate。按钮可见条件=「有 estimate 可设值」∨「有 scheduled_start 可清除」——两者皆空时按钮无有效操作
            //   （设值必 409·无值可清），隐藏以消除条件性死按钮（原为保留按钮+gate 引导·改为直接隐藏）。开发态 gate 仍引导先回填。
            if (a === 'set_scheduled_start' && !iss.dev_estimated_at && !iss.scheduled_start) continue;
            // 开发态 / 批次精化（needs_feasibility / blocked / dev_estimated_at / release_id）
            if (a === 'estimate' && iss.needs_feasibility) continue;             // 需评估的走 feasibility
            if (a === 'feasibility' && (!iss.needs_feasibility || iss.blocked)) continue;  // F：受阻时不出评估（后端 409 ISSUE_BLOCKED）
            if (a === 'blocked' && (!iss.needs_feasibility || iss.blocked)) continue;
            if (a === 'unblock' && !iss.blocked) continue;
            // C-orch 清理：publish/confirm-online-norelease/set_release_flag 三条 bug 专属 needs_release 分支已随
            // v1.6 §2.3 [C-1] 从 BUG_FLOW_TRANSITIONS 整体退场（meta.typeFlows['bug'] 不再含这三个 action，本循环对
            // bug 恒不会命中），原对应的 3 行 continue 守卫纯属死代码，一并删除（task §5 第②点清理要求）。
            // 上线体统一重构 C3 第2批（⑧）：原 `if (a==='publish' && iss.release_id) continue` 守卫一并删除——
            //   随 C3 后端删除 CHANGE_FLOW_TRANSITIONS 的 publish 条目（见 transitions.js 处注释），'publish'
            //   永远不会再出现在 flows/acts 里，本守卫已是不可达死代码。「应急上线」改为类型统一的独立按钮
            //   （见下方 hotfixBtn，脱离 meta 驱动的 acts 循环），不再受这条守卫影响。
            if (a === 'submit') {
                if (iss.blocked) continue;
                if (!iss.dev_estimated_at) continue;                            // 闸门①
                // B：需评估单，结论未出或为"不可行"都不能提交（后端 400 FEASIBILITY_NOT_FEASIBLE）
                if (iss.needs_feasibility && (!iss.feasibility_conclusion || iss.feasibility_conclusion === '不可行')) continue;
                // [C7-fix MED-3] 工期闸：C7 起 submit 对 feature/improvement × nf 两值全查工期
                //   （后端 index.js handleDevSubmit 的 EFFORT_REQUIRED / EFFORT_INVALID 两码）。前端不镜像
                //   这条判据就会留一个**必然 400 的死按钮**——本单最典型的受害者正是本地 5 张 nf=0 存量
                //   在途单（有预计完成、无工期），它们点下去只会吃一个报错。遵循本文件既有「条件性死按钮
                //   一律隐藏 + gate 提示引导」范式（同 :2822 set_scheduled_start 的处置）。
                if (siEffortGateBlocked(iss)) continue;
            }
            acts.push(a);
        }

        // 闸门 / 引导提示
        let gate = '';
        if (isOwnerDev && iss.status === '开发中') {
            if (iss.blocked) gate = `<div class="si-gate-hint">⛔ 当前受阻中，请联系管理员「解除受阻」后再继续。</div>`;   // A：解除受阻是 admin 权限，开发无权
            else if (iss.needs_feasibility && iss.feasibility_conclusion === '不可行') gate = `<div class="si-gate-hint">⛔ 评估结论「不可行」，请联系建单人处置（作废 / 派生），暂不能提交交付。</div>`;  // B
            else if (iss.needs_feasibility && !iss.feasibility_conclusion) gate = `<div class="si-gate-hint">⚠️ 闸门：本单需先完成「可行性评估」（含预计完成时间），才能标记开发完成。</div>`;
            else if (!iss.dev_estimated_at) gate = `<div class="si-gate-hint">📋 两步完成开发：<b>第 1 步</b> 先「回填预计完成时间」 → <b>第 2 步</b> 回填后即可「标记我的开发完成」。（当前在第 1 步）</div>`;
            // [C7-fix MED-3] 工期缺失/异常的引导：排在 dev_estimated_at 之后——nf=0 时两个字段同在估时弹窗
            //   填，缺时间必然也缺工期，上一条已覆盖；本条真正服务的是"时间已填、工期还空"的**存量在途单**
            //   （C7 上线时本地 5 张就是这个形态）。文案入口与后端 :5525 的 effortEntry 分岔逐字一致：
            //   nf=1 → 可行性评估；nf=0 → 估时。
            else if (siEffortGateBlocked(iss)) {
                const entry = iss.needs_feasibility ? '可行性评估' : '回填预计完成（估时）';
                const isDirty = siEffortIsDirty(iss);   // [C7-fix2 L2] 判据与 siEffortGateBlocked 的"缺失"段同源（纯空白不算脏值）
                // [C8-fix K2] 原文案对脏值场景说"本单还缺「工期（人日）」（当前值 X 不合法…）"——**自相矛盾**：
                //   既说"缺"又说"当前值是 X"，读者不知道到底填没填。两种成因文案整句分开写，不共用开头。
                gate = isDirty
                    ? `<div class="si-gate-hint">⚠️ 闸门：本单「工期（人日）」值不合法（当前值 ${esc(String(iss.estimated_effort_days))}，须为 0.5 的整数倍且在 (0, 365]），请在「${entry}」中改正后再标记开发完成。</div>`
                    : `<div class="si-gate-hint">⚠️ 闸门：本单还缺「工期（人日）」，请在「${entry}」中补填后再标记开发完成。</div>`;
            }
        } else if (isAdminUser && iss.status === '待上线' && iss.release_id) {
            // 上线体统一重构 C3 第2批（⑨）：旧文案"请在批次管理中发布"是单阶段旧语义遗留——C3 收窄后本步骤
            //   只完成"建单/加单"，真正发布要等被通知的值班执行人调用 /execute（两阶段，§6.7）。改为准确指向
            //   「批次管理」查看/安排上线（而非"发布"），并直接给可点深链，不用再让甲方自己去列表里找。
            gate = `<div class="si-gate-hint">📦 已建上线单 #${iss.release_id}，请到「上线单管理」安排/查看上线进度。${siCanOpenRelease(iss) ? `<button class="u-btn-secondary u-btn-sm" style="margin-left:6px" onclick="siGotoBatchDetail(${iss.release_id})">前往上线单</button>` : ''}</div>`;
        } else if (iss.status === '待受理') {
            // 受理排期改造 C8：受理阶段角色引导（判定镜像后端资格·前端提示非授权源）
            // ⭐ C2.5b 微调：受理门语义已重定义为排期/指派入口（方案 §3）——退回的理由只能是"信息不全"。
            // ⭐⭐ 角色权限重构 v2.1（C2.5 撤销）：预沟通段废除，原「待商议」分支的引导内容（判断需求合理性/
            //   可视需要发起技术负责人沟通/技术负责人回复提示）并入本态，全类型统一（不再按 type 分流——
            //   bug 与变更流的 request_tech_consult 均在本态可用，见 sysTechConsultGateStatus）。
            //   拒绝的角色按类型分岔：变更流须**受理人**操作且要求当前轮已有技术负责人评估意见；bug 仍
            //   admin 操作、无此前置（镜像后端 §3 issue_reject 权限交叉矩阵；按钮可见性见下方 acts 过滤）。
            const isTechLeadForThisGate = !!(currentUser && isSiTechLead(currentUser.id) && Number(iss.tech_lead_id) === Number(currentUser.id));
            if (isTechLeadForThisGate && !hasTechLeadComment) {
                gate = `<div class="si-gate-hint">💬 本单已就你发起技术负责人沟通，请在下方「回复评估意见」提交你的最终判断（一条不可变）。</div>`;
            } else if (isAdminUser || isBoundLiaisonUser || (iss.intake_liaison_id == null && isSiEligibleLiaisonRole())) {
                const rejectHint = iss.type === 'bug' ? '「拒绝」写明原因' : '「拒绝」（须已有技术负责人评估意见，原因必填）';
                gate = `<div class="si-gate-hint">📥 本单待受理：请判断需求合理性/可行性，可视需要「发起技术负责人沟通」协助判断。<b>可做</b> → 「受理通过」进入指派（变更流指派前需先补填 OA 号）；<b>不该做 / 做不了</b> → ${rejectHint}；<b>信息不全</b> → 「退回修改」。</div>`;
            }
            else gate = `<div class="si-gate-hint">⏳ 本单已提交，等待对接人受理确认。</div>`;
        } else if (iss.status === '待修改') {
            if (isAdminUser || isCreatorUser) gate = `<div class="si-gate-hint">✏️ 本单已退回修改：请「编辑内容」修改后「重新提交受理」。</div>`;
            else gate = `<div class="si-gate-hint">⏳ 本单已退回，等待建单人修改后重新提交受理。</div>`;
        } else if (iss.status === '待对接测试') {
            // [工期对接测试与风险等级拆分 方案 v1.1 §7·C4b] 两视角引导：开发侧提醒去通知区喊人来测；
            //   对接人/admin 侧提示测试后的两条出路。
            if (isAdminUser || isBoundLiaisonUser) gate = `<div class="si-gate-hint">🧪 本单待对接测试：请验证开发交付内容。<b>通过</b> → 「对接测试通过」进入待验收；<b>有问题</b> → 「对接测试打回」注明原因，退回开发返工。</div>`;
            else if (isOwnerDev) gate = `<div class="si-gate-hint">🧪 本单待对接测试：开发已完成交付，请到下方「钉钉通知」区点击「发送通知」提醒对接人测试。</div>`;
        }
        // C-orch bug 待上线态的四个引导分支（指定/等待/可执行）已随上线编排一起移入 siRenderReleaseOrchBlock，本操作区不再重复。

        const btns = acts.map(a => {
            const label = (META.actions && META.actions[a]) || a;
            let lbl = label;
            if (a === 'estimate' && iss.dev_estimated_at) lbl = '修改预计完成';   // estimate 已回填改文案
            // [C6·方案 v3.4 §6.5] close 按钮文案改「归档」，与状态展示层「已归档」（siStatusDisplay）对齐——
            //   只改本处前端展示文案，不动后端 META.actions.close='关闭'（该 label 同时服务历史 timeline
            //   action_code 渲染，两类流的既有「关闭」历史行仍应如实显示动作原文，不随本次改名回溯改写）。
            if (a === 'close') lbl = '归档';
            // [C3 第2批] 原 `a === 'publish'` 分支已删除——'publish' 不会再出现在 acts 里（同上方守卫移除注释）。
            const cls = SI_DANGER_ACTIONS.has(a) ? 'u-btn-danger' : (SI_SEC_ACTIONS.has(a) ? 'u-btn-secondary' : 'u-btn-primary');
            return `<button class="${cls} u-btn-sm" onclick="siDoAction('${a}')">${esc(lbl)}</button>`;
        }).join('');

        // 上线体统一重构 C3 第2批（⑦⑧任务B-②）：「应急上线」独立按钮——脱离 meta 驱动的 acts 循环（原
        //   'publish' TRANSITIONS 条目已删，见 transitions.js），改为**类型统一**的直接入口：待上线 +
        //   尚未挂上线单 + 类型∈RELEASABLE_TYPES（镜像后端同名常量 bug/feature/improvement，config 不进）
        //   即可发起，admin 专属（镜像后端 hotfix-publish 的 requireAdmin）。全类型可见的依据=方案 §6.7/附录 A：
        //   hotfix-publish 对三可发布类型一视同仁、仅 config 负例。[主会话验收更正 2026-07-29] bug 并非只有
        //   本按钮一条建单路：bug 现与 feature/improvement 完全同源，可无条件经 add-issues 直接进普通批次
        //   （2026-07-29 双闸拆除，见 index.js add-issues 路由处注释）——本按钮是应急口，非唯一口。
        let hotfixBtn = '';
        if (isAdminUser && iss.status === '待上线' && !iss.release_id
            && (iss.type === 'bug' || iss.type === 'feature' || iss.type === 'improvement')) {
            hotfixBtn = `<button class="u-btn-primary u-btn-sm" onclick="siModalHotfix(siDetail.issue)">应急上线</button>`;
        }

        // 拉群讨论（§5 bug 流旁路动作，非 meta transition；type=bug + 指派后非终态 + 未建群 + admin||owner-dev）
        let chatBtn = '';
        if (iss.type === 'bug' && (isAdminUser || isOwnerDev) && SI_CHAT_STATUSES.includes(iss.status) && !iss.dingtalk_open_conversation_id) {
            chatBtn = `<button class="u-btn-secondary u-btn-sm" onclick="siDoAction('create-chat')">拉群讨论</button>`;
        }
        // C4：通知按钮全部搬进详情页「通知」区（siRenderNotify，逐类三能力），本操作区不再放通知按钮
        //   （旧 ④b-1 notifyBtns 已退场；bug 流手动通知见 siRenderNotify + siNotifyDevSend/siNotifyRelayClick/
        //   siNotifyCreatorClick/siNotifyRequesterClick）。

        // C-orch 上线编排按钮（指定/换执行开发·执行上线）已拆到 siRenderReleaseOrchBlock 独立区块，本操作区不再渲染。
        // MED-2（codex 43）：上线编排区块确有内容时（siReleaseOrchHasContent 同源判据），顶部操作栏即便无通用动作
        //   也不出"无可执行动作"兜底（避免与下方区块按钮 UI 冲突）。用同一判据杜绝"顶部抑制兜底、下方区块却也空"的
        //   分叉——主开发看未指定上线开发的待上线单时 orchBlock 空 → 此处判 false → 仍显示"无可执行动作"（准确）。
        const fallback = siReleaseOrchHasContent(iss) ? '' : '<span class="si-muted">当前状态/身份下无可执行动作</span>';
        // 删除任务（admin 专用·物理删除·不可逆·2026-07-07）：始终对 admin 可见（危险区）；守卫（有派生子单 /
        //   已挂批次）由 siDeleteIssue 前置镜像 + 后端 DELETE 守卫双重兜底——前端非授权源，真闸在后端。
        let adminDelBtn = '';
        if (isAdminUser) adminDelBtn = `<button class="u-btn-danger u-btn-sm" onclick="siDeleteIssue()">删除任务</button>`;
        // ⭐ 角色权限重构 v2.1（C2.5 撤销）：技术负责人评估意见 + 取消咨询——两个自持端点（谓词硬编码
        //   「待受理」+ 本人门/admin∨受理人门，历史沿革：C3 落地时曾硬编码「待商议」，随预沟通段撤销回归
        //   「待受理」），不经 meta/typeFlows 的通用 roleGuard 模型，独立渲染（同 chatBtn/adminDelBtn 范式）。
        //   前端仅镜像展示，真闸在后端。
        let techLeadBtns = '';
        // hasTechLeadComment 已在 acts 循环之前声明（本函数顶部，codex Round-C 审），此处直接复用，
        // 不再重复计算（避免"同一函数里两份独立算出同一件事"的漂移风险）。
        const isTechLeadForThis = !!(currentUser && isSiTechLead(currentUser.id) && Number(iss.tech_lead_id) === Number(currentUser.id));
        if (iss.status === '待受理' && iss.tech_lead_id && !hasTechLeadComment) {
            if (isTechLeadForThis) techLeadBtns += `<button class="u-btn-primary u-btn-sm" onclick="siModalTechLeadComment()">回复评估意见</button>`;
            if (isAdminUser || isBoundLiaisonUser) techLeadBtns += `<button class="u-btn-secondary u-btn-sm" onclick="siCancelConsult()">取消咨询</button>`;
        }
        // ⭐ 角色权限重构 C3 补丁（方案 §4-C3"失败可重试补发入口"）：已有评估意见 + 仍在待受理 →
        //   admin/该单绑定对接人/本单技术负责人 均可点「重发评估通知」（镜像后端 tech-lead-comment/resend-notify
        //   的 isBoundLiaisonEligibleOrAdmin∨selfTechLead，C10-fix M2 起绑单）。
        if (iss.status === '待受理' && hasTechLeadComment && (isAdminUser || isBoundLiaisonUser || isTechLeadForThis)) {
            techLeadBtns += `<button class="u-btn-secondary u-btn-sm" onclick="siResendTechLeadCommentNotify()">重发评估通知</button>`;
        }
        // ⭐ 角色权限重构 v2.1 §4（OA 号补填入口）：仅 admin 可见（只有 admin/建单人能进 OA 系统，对接人与
        //   开发团队看不到 OA 号——用户澄清的信息可达性事实）；状态∈§4 允许集时才出（前端镜像 siOaFillable，
        //   真闸在后端 set-oa-number 端点的 SYS_OA_ALLOWED_STATUSES 判定）。指派后仍可改，故不因已有值隐藏。
        let oaBtn = '';
        if (isAdminUser && siOaFillable(iss)) {
            oaBtn = `<button class="u-btn-secondary u-btn-sm" onclick="siOpenSetOaNumber()">${iss.oa_number ? '修改' : '补填'} OA 号</button>`;
        }
        box.innerHTML = gate + ((btns + hotfixBtn + chatBtn + adminDelBtn + techLeadBtns + oaBtn) || fallback);
    }

    // ============================================================
    // 动作分发 → 弹框收集字段 → 调端点
    // ============================================================
    function siDoAction(action) {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        switch (action) {
            // 受理排期改造：schedule 退场（case + siModalSchedule 函数一并删·端点返 409 SCHEDULE_DISABLED）
            case 'assign': return siModalAssign(iss);
            case 'reassign': return siModalReassign(iss);
            case 'create-chat': return siModalCreateChat(iss);
            // （C2.5 撤销·方案 v2.1）"预沟通通过"这一 case 已删（meta 无该 action·c7 孤儿守卫锚点）——
            //   OA 号回填改经独立入口 siOpenSetOaNumber（受理通过后，见详情页「补填 OA 号」按钮）。
            // 受理排期改造 C7：受理门 + 排期动作分发
            // [工期对接测试与风险等级拆分 方案 v1.1 §3.4/§7·C5] feature 单受理须同时判定风险等级——
            //   改走专用弹窗 siModalIntakeAccept；improvement/bug 仍走既有零输入确认（siConfirmSimple）。
            case 'intake_accept': return siModalIntakeAccept(iss);
            // ⭐ C2.5b（方案 §3 受理门语义重定义）：退回弹窗写明本动作的边界——"不该做"应在「待受理」态用「拒绝」，
            //   两道门的判断标准不写清就会混用（方案原文点名要求此提示）。
            case 'intake_return': return siModalReason(iss, 'intake_return', '退回修改', '退改原因', '/intake-return',
                '退回修改<b>仅用于单据信息不全 / 需求描述不清</b>，退回后由建单人补充并重新提交受理。<br>若判断是"这个需求不该做"，请勿用退回——变更类需求应在「待受理」阶段用「拒绝」处理。');
            case 'resubmit_intake': return siConfirmSimple(iss, 'resubmit_intake', '确认修改完成、重新提交受理？', '/resubmit-intake');
            case 'edit_in_revision': return siModalEditInRevision(iss);
            case 'change_intake_mode': return siModalChangeIntakeMode(iss);
            case 'request_tech_consult': return siModalRequestTechConsult(iss);
            case 'set_scheduled_start': return siModalSetScheduledStart(iss);
            // C4：notify-developer/notify-relay/notify-creator/notify-requester 已从本操作区迁移到详情页
            //   「通知」区（siRenderNotify），改由 siNotifyDevSend/siNotifyRelayClick/siNotifyCreatorClick/
            //   siNotifyRequesterClick 各自读 siDetail 直调，不再经本 switch。
            case 'estimate': return siModalEstimate(iss);
            case 'feasibility': return siModalFeasibility(iss);
            case 'blocked': return siModalReason(iss, 'blocked', '标记受阻', '受阻原因', '/blocked');
            case 'unblock': return siModalReason(iss, 'unblock', '解除受阻', '解除说明', '/unblock');
            case 'submit': return siModalSubmit(iss);
            case 'accept': return siModalAccept(iss);
            case 'return': return siModalReason(iss, 'return', '验收打回', '打回原因', '/return');
            // [工期对接测试与风险等级拆分 方案 v1.1 §7·C4b] 对接测试通过/打回——对接人视角两按钮。
            //   [方案 D22-④·批2 2026-08-06] pass 改带测试说明文本框（凭证二选一：本轮已传附件可留空，
            //   否则须填）——见 siModalLiaisonTestPass；return 原因必填不变（同 return/reopen 等既有
            //   "打回类"动作复用 siModalReason，不新写一套弹窗）。
            case 'liaison_test_pass': return siModalLiaisonTestPass(iss);
            case 'liaison_test_return': return siModalReason(iss, 'liaison_test_return', '对接测试打回', '打回原因', '/liaison-test-return');
            case 'close': return siConfirmSimple(iss, 'close', '确认归档（观察期结束）？', '/close');
            case 'hold': return siModalReason(iss, 'hold', '暂缓', '暂缓原因', '/hold');
            // S4（bug暂缓方案 §6.2/§6.3）：resume 改走专用弹窗 siModalResume——不再走 siConfirmSimple。
            //   ⚠️ codex 238 risk-1：siConfirmSimple（下方定义处）恒传 body:{}，S1 给 resume 加 reason 必填
            //   后，两流的「恢复」按钮若继续走它会必 400（前端已不可用）。**改法取舍**：siConfirmSimple 被
            //   accept/close/intake_accept/resubmit_intake 等 5+ 处"确认即走、无需任何输入"的动作复用，
            //   给它加"可选 payload"能力要改函数签名+触达全部既有调用点（改动面大、且这些调用点本就不需要
            //   payload，白改）；resume 本就需要理由必填 + 可选附件两步链，这是它独有的复杂表单需求，
            //   不是"resume 恰好也想传个 body"这种轻量场景。故选**独立弹窗**（siModalResume，同 hold 的
            //   siModalReason 独立处理同一类问题——本就是既有范式，非新发明），siConfirmSimple 本体不动，
            //   零回归其余调用点。
            case 'resume': return siModalResume(iss);
            case 'reactivate': return siModalReason(iss, 'reactivate', '重新激活', '重新激活原因', '/reactivate');
            case 'issue_reject': return siModalReason(iss, 'issue_reject', '拒绝', '拒绝原因', '/issue-reject');
            case 'void': return siModalReason(iss, 'void', '作废', '作废原因', '/void');
            case 'reopen': return siModalReason(iss, 'reopen', '重开（返工）', '重开原因', '/reopen');
            // C-orch 清理：set_release_flag/confirm-online-norelease 随 v1.6 [C-1] 整体退场，meta.typeFlows 不再
            // 产生这两个 action，acts 数组不会含它们，本两条 case 已不可达——一并删除（task §5 死代码清理要求）。
            // 上线体统一重构 C3 第2批：原 publish 分支（旧 switch-case 语法，调 siModalHotfix）一并删除——
            //   publish 已不再是 meta action（见上方 acts 循环处注释），siModalHotfix 现由独立按钮 hotfixBtn
            //   直接调用，不再经 siDoAction 用该 action 名分发。siModalHotfix 函数本体保留（仍是唯一调用点）。
            //   [注：本注释故意不写出字面 case 语法，防 verify-sys-intake-schedule-c7.js 的正则式静态扫描
            //   把注释误判成真实 case 分支——该脚本按文本模式抓 siDoAction 函数体，不区分代码与注释。]
            case 'derive': return siModalDerive(iss);
            default: showToast('未知动作：' + action, 'error');
        }
    }

    // 刷新详情 + 列表
    async function siAfterAction() { await siLoadList(); if (siOpenId) await siRenderDrawer(siOpenId); }

    // ===== 〔通知统一 N3-2〕R3 兜底 + S15 发送中 disabled 的两个共享件 =====
    //   为什么抽出来：A 类删 toast 的 11 个调用点（T1/T4/T5/T6/T8/T11/T12/T13/T14/T15/T16）走的是同一套
    //   「锁按钮 → 发送判定 → 独立刷新段 → 哨兵判定 → 抽屉版兜底」流程，逐点手写必然漂移（Collab 的 B1
    //   静默就是"六个调用点里有一条链路的哨兵集合算错"造出来的）。
    //
    // ① siLockNotifyBtns(sel)：〔S15·J23〕点击即禁用并改「发送中…」，返回按钮集合与还原闭包。
    //    选择器一律**限定在 #siDBody 内**——通知按钮全部由 siRenderDrawer 渲进抽屉体（现场已逐个核对：
    //    siNotifyRelayClick/CreatorClick/RequesterClick/IntakeClick/HoldCreatorClick/LiaisonTestClick/
    //    DevSend/ResumeDevClick/siResendTechConsult 共 11 个渲染点全在 siRender*NotifyRow 里，弹窗/操作栏
    //    零命中），限定域是防将来有人把同名 onclick 复制进 siModal 时把弹窗按钮误锁进来。
    //    ⚠️ 五个调用点一律把它写在 `try` **里面**：本函数走 querySelectorAll，选择器写错会抛
    //    SyntaxError；若在 `siNotifyInflight = true` 之后、`try` 之前抛，finally 不会执行 ⇒ inflight
    //    永久卡 true ⇒ **全页通知按钮点了都没反应**，还得刷新页面才恢复。放进 try 里，抛了也能复位。
    function siLockNotifyBtns(sel) {
        const btns = Array.from(document.querySelectorAll('#siDBody ' + sel));
        btns.forEach(b => { b.dataset.originalText = b.textContent; b.disabled = true; b.textContent = '发送中…'; });
        return {
            btns,
            // 刷新成功时按钮节点已被整体重渲染替换（isConnected=false），此时既不需要也不能还原；
            //   只有"刷新没生效/失败提前 return"的路径才需要把按钮从「发送中…」放回原文案。
            restore() {
                btns.forEach(b => {
                    if (!b.isConnected) return;
                    b.disabled = false;
                    if (b.dataset.originalText) { b.textContent = b.dataset.originalText; delete b.dataset.originalText; }
                });
            },
            // 兜底文案里的 `{行标签}`：优先取按钮上的 data-nr-label（渲染时就写死了「开发 张三」这类含人名的
            //   行标签，比在这里按 siDetail 重算一遍标签逻辑可靠——重算＝同一份标签规则写两遍必漂移）。
            label(fallback) { return (btns[0] && btns[0].dataset.nrLabel) || fallback; },
        };
    }

    // ② siRefreshAfterNotify(lock, label, opts)：〔R3·J11/J12〕**独立刷新段**——与"发送结果判定段"分离。
    //    本页 R3 形态（矩阵 §1 页级事实）：siAfterAction 无 try/catch、siApi/authFetch 也没有 ⇒ 异常一路
    //    冒泡；但**光靠 catch 判不全**——siLoadList(!r.ok) 与 siRenderDrawer(!r.ok / siOpenId!==id) 都是
    //    **静默 return 不抛**，那两条路径下 catch 永远捕不到而行内确实没刷新。故判定主源＝**DOM 哨兵**
    //    （siRenderDrawer 末尾 `siDBody.innerHTML = …` 是整体替换 :2133 ⇒ 刷新成功则捕获到的按钮节点
    //    必然 isConnected=false），try/catch 只负责把冒泡异常止在这里、不打断后续判定。
    //    〔哨兵集合与自摘节点〕Collab 的 B1 教训是"哨兵集合里混进了会被 remove() 摘掉的节点 ⇒ every 恒假
    //      ⇒ 兜底永不触发"。本页现场核对结论：**通知按钮无任何自摘路径**（无 Collab 那种 `oldErr.remove()`
    //      的错误框、无按钮级 DOM 删除），故 lock.btns 可整体用作哨兵集合，无需过滤——这条是**登记的核对
    //      结论**不是"没想过"；将来若给本页加错误框/重试按钮之类会被 remove 的节点，必须在这里补 filter。
    //    〔空集合退锚点·S3 修正〕按钮集合为空时（按钮被上一次渲染隐藏、或选择器漏改）退锚点判定。
    //      ⚠️ **锚点不能取 `#siDBody` 本身**——那是个**恒真常量不是哨兵**：siRenderDrawer 改的是它的
    //      `innerHTML`，容器元素本体从不被替换，`isConnected` 永远 true ⇒ 一律判 stale ⇒ 按钮集合一空就
    //      必弹兜底（初版就是这么写的，属"看起来在判定、其实没判"的假哨兵）。
    //      现改**捕它的第一个子节点**：`innerHTML = …` 会把旧子节点整批摘出文档 ⇒ 旧 firstElementChild
    //      的 isConnected 由 true 变 false，是**真会变的信号**。子节点也取不到（body 空）时才落
    //      显式 `stale = true` 的 fail-loud 常量——那一条是**有意的常量**，注释里就这么写，不冒充哨兵。
    //    〔sentOk＝动词槽·B1 修正〕原实现把 sentOk 当"要不要发兜底"的开关，于是 `st==='failed'` 走默认
    //      true ⇒ **发送失败 + 刷新失败会弹「已发送，详情刷新失败」＝谎报成功**（Collab B2' 同款形态，
    //      本页四个 A 删点全中）。现在 sentOk **只决定动词**，兜底本身**恒发**：
    //        sentOk=true  → `{行标签}：已发送，详情刷新失败，可重开抽屉查看`
    //        sentOk=false → `{行标签}：发送未成功，详情刷新失败，可重开抽屉查看`（动词对齐真实动作·Collab 先例）
    //      "失败不静默"红线两头都要守：既不能把失败说成成功，也不能因为失败就什么都不说。
    //      **本函数没有"消音"选项**——已有独家 toast 的 A' 分支走下面的 siRefreshQuiet，不从这里开口子。
    //    返回值＝刷新是否生效（true=行内已是新态）。
    async function siRefreshAfterNotify(lock, label, opts) {
        const o = opts || {};
        const sentOk = o.sentOk !== false;
        const stale = await siRefreshAndDetectStale(lock);
        //   〔J12·§6.6 ①〕本页 11 个 A 类调用点全部宿主在**抽屉**（siDrawer）⇒ 一律**抽屉版**兜底文案；
        //   批次执行人两行（T32/T34）宿主是 siBatchOverlay 弹层，走弹层版、不经本函数（见 siExecutorRowNotify）。
        if (stale) showToast(`${label}：${sentOk ? '已发送' : '发送未成功'}，详情刷新失败，可重开抽屉查看`, 'error');
        return !stale;
    }

    // ③ siRefreshQuiet(lock)：**A' 分支专用**——该分支已经弹过自己的独家 toast（幂等提示/并发变更/聚合计数
    //    /siApiErr 失败提示），只需要"刷新 + 还原按钮"，不能再叠一条兜底（叠了不是重复就是自相矛盾：
    //    「3 人已发送」后面跟一句「发送未成功」）。
    //    ⚠️ **它不是 siRefreshAfterNotify 的消音开关**：允许用它的前提是**这条分支上确实已经 showToast 过**。
    //    现有调用点（改动时请同步这份清单）——**6 个调用点覆盖 7 条分支**（数字刻意分开写：writeback 的
    //    dry_run 与"发送+留痕双失败"两条分支落在同一句 `else await siRefreshQuiet(lock)` 上，是 1 个调用点）：
    //      ① siNotifyManual · skipped          ② siNotifyManual · superseded
    //      ③ siNotifyLiaisonTestClick · !r.ok（siNotifyErr 已提示）   ④ 同 · concurrent_changed
    //      ⑤ 同 · writeback 非 sent_externally（dry_run／双失败两分支共用）
    //      ⑥ siNotifyResumeDevClick · 聚合五态
    //    每处上文都有它自己的 showToast（③ 是 siNotifyErr 内部必发）——**这是准用 quiet 的前提，有静态断言守着**。
    async function siRefreshQuiet(lock) { return !(await siRefreshAndDetectStale(lock)); }

    // 刷新 + 哨兵判定的共同体（两个出口共用，避免判定逻辑写两份漂移）。返回 true＝刷新**没生效**。
    async function siRefreshAndDetectStale(lock) {
        const body = document.getElementById('siDBody');
        const anchorChild = body ? body.firstElementChild : null;   // S3：捕**会被 innerHTML 换掉的子节点**
        const sentinel = (lock && lock.btns.length) ? lock.btns : (anchorChild ? [anchorChild] : []);
        try { await siAfterAction(); } catch (e) { /* 冒泡异常止于此；成败判定交给下面的哨兵 */ }
        const stale = sentinel.length ? sentinel.every(n => n.isConnected) : true;   // 空集合＝判不了＝fail-loud 常量
        if (lock) lock.restore();
        return stale;
    }

    // 〔S1〕通知域专用错误出口——非 ok 响应的原因走**冻结映射表**（J8），不再 siApiErr 直出后端 `error` 原文。
    //   ⚠️ **只接通知域 7 个调用点**（siNotifyManual／siNotifyLiaisonTestClick／siNotifyDevSend／
    //   siNotifyResumeDevClick／siResendTechConsult 各 1 + siExecutorRowNotify 2）：`siApiErr` 本体维持不动，
    //   它还服务本页**另外 54 个**非通知 CRUD 调用点（现场计数，非估数），那些端点的错误码根本不在本次冻结
    //   的映射表里，硬接会把「变更流单据 OA 流程号必填」这类精确提示统统压成「未知原因」＝信息倒退
    //   （裁定 3③ 口径）。两个出口并存**是有意的口径差，不是遗漏**：
    //   通知域＝文案受冻结表管辖、禁透传；非通知域＝沿用后端原文。矩阵 T42 已按此登记。
    function siNotifyErr(r) {
        if (r && r.aborted) return null;   // 401 已在 authFetch 内 logout，不再叠提示（同 siApiErr 首行）
        showToast('通知失败（' + siErrText(r, r.data) + '）', 'error');
        return null;
    }

    // 〔D6·S16〕查已读结果框 id —— 命名规则对齐 Data_Correction 的 `corrReadBox_{key}[_{rid}]`（矩阵 S16）。
    //   只在**渲染了「查询已读」按钮的那一行**才拼容器（矩阵："6 处查已读按钮旁新增结果框 span"）：
    //   已读固化后按钮随行隐藏、容器也一并消失，正好让 siQueryReadStatus 的"刷新后 box 还在不在"成为
    //   判定刷新是否生效的第二重信号（详见该函数注释）。
    function siReadBoxId(type, devUserId) { return 'siReadBox_' + type + (devUserId != null ? '_' + devUserId : ''); }

    // C4 bug 流手动通知（POST notify-relay/notify-creator/notify-requester；按后端回的落库状态 toast + 刷新详情看通知区）。
    //   iss 不作参数——一律读 siDetail.issue（本区按钮全部内联在通知区行内，onclick 字符串里传不了对象引用，
    //   与 siDoAction 系列一致的「读全局 siDetail」范式）。
    let siNotifyInflight = false;   // codex31 M-3/ultracode txn：inflight 守卫防双击/重复点导致重复钉钉推送 + read_at 重复重置
    // 〔N3-2〕签名新增第 5 参 btnSel（本行发送按钮的选择器）：S15 的发送中 disabled 与 R3 的哨兵集合都要它。
    //   label 形参此后只作**兜底名**——真正用于 toast/兜底的是按钮上的 `data-nr-label`（含人名的行标签），
    //   取不到才退回这个静态通道名（S17：静态名也已从「通知报障人」等动词式改成行标签措辞）。
    async function siNotifyManual(endpoint, label, statusKey, errKey, btnSel) {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        if (siNotifyInflight) return;
        siNotifyInflight = true;
        let lock = null, rowLabel = label;
        try {
            lock = siLockNotifyBtns(btnSel);   // 放 try 内：抛了也能复位 inflight
            rowLabel = lock.label(label);
            const r = await siApi('/sys-issues/' + iss.id + '/' + endpoint, { method: 'POST' });
            if (!r.ok) { siNotifyErr(r); lock.restore(); return; }   // 〔S1〕非 ok 沿现状不刷新 ⇒ 须自行把按钮放回原文案
            // 〔矩阵 T2·A' 留〕自指跳过：后端什么也没发、行内零变化 ⇒ toast 是唯一反馈通道，保留。
            //   刷新照跑（现状行为·低优先不动），但走 **siRefreshQuiet**：本分支上一行刚弹过独家 toast，
            //   再叠一句「发送未成功，详情刷新失败」既重复又误导（压根没发起过发送，也没有什么可刷新的）。
            if (r.data && r.data.skipped) { showToast(rowLabel + '：无需通知自己', 'info'); await siRefreshQuiet(lock); return; }   // self-guard（notify-creator，M-2）
            const st = r.data && r.data[statusKey];
            // ⭐ 角色权限重构 C0（codex 四轮审 MED-2）：superseded = 后端回写被"收件人围栏"拒绝，
            //   即单据在发送期间已进入新一轮（通知目标被清/换人），本次投递**未计入当前轮次**。
            //   必须先于 st 分支判断：此时 relay_notify_status 返回的是**当前落库值**而非本次结果，
            //   按 st 渲染会给出误导性的"已发送"。文案如实说明"外部消息可能已送达"（§14 业务接受项）。
            //   ⚠️ 严格 === true（codex 五轮审 LOW）：本函数被四个通知端点共用，将来任一端点若返回
            //     字符串 "false" 或同名异义字段，truthy 判断会误入本分支给出不匹配文案。
            if (r.data && r.data.superseded === true) {
                // 〔矩阵 T3·A' 留〕行会刷但语义不对应（行内显示的是当前轮的状态，不是本次投递的结果）⇒ toast 保留。
                //   〔J8〕删掉 `r.data.message` 后端原文透传：改用**冻结映射表 §5 已登记的固定文案**
                //   （`superseded` → 「该单已进入新一轮，本次通知未计入当前轮次」，与后端现文案逐字一致）。
                //   sentOk:false 同 skipped——"未计入当前轮次"不能被兜底句改口成"已发送"。
                showToast(rowLabel + '：该单已进入新一轮，本次通知未计入当前轮次', 'warning');
                await siRefreshQuiet(lock);   // 上一行已是独家 toast，不叠兜底
                return;
            }
            // 〔矩阵 T4/T5/T6·A 类删〕三分支 toast 全删——行内对应通道行的状态句就是反馈：
            //   sent → `✅ 已于 {时间} 通知`／failed → `⚠️ 通知失败（{原因}），可重试`（S2 已把
            //   `*_notify_error` 一路传进 siNotifyStatusText，§1.1b 落死四列后端必写、详情 SELECT * 必带）／
            //   其余 status → 状态句照刷。**T5 的后端原文透传（`r.data[errKey]` 直出）随本次删除一并消失**
            //   （J8 五处透传之一），原因文案统一由行内失败句走冻结映射表产出。
            //   ⚠️ **errKey 形参自本批起无任何消费点**（如实登记，不是漏改）：它随 T5 的透传一起失去了唯一
            //     读点。保留的理由只有一个——五个调用点因此仍是一张完整的**通道契约表**
            //     （端点 / 行标签 / status 字段 / error 字段 / 按钮选择器），加第 6 个通道时照着填即可；
            //     删掉它，"这个通道的失败原因落在哪一列"这条信息就只剩注释里有。**若审查认为死参数应删，
            //     删它是安全的**（五个调用点去掉第 4 个实参即可，无其他连带）。
            // 〔B1·sentOk 动词门控〕`st` 在这里**复活**（原本删完三分支后成了未消费变量）：
            //   它只有 `'sent'` 才算真发成功。`failed`／其余 status 走「发送未成功」版兜底——
            //   否则"发送失败 + 刷新失败"会弹出「已发送，详情刷新失败」＝谎报成功（B2' 同族）。
            await siRefreshAfterNotify(lock, rowLabel, { sentOk: st === 'sent' });
        } finally { siNotifyInflight = false; }
    }
    // 〔S17〕静态兜底名从动词式（通知对接人/通知报障人…）改为**行标签措辞**——运行时优先取按钮
    //   data-nr-label（`对接人 张三` 这类含人名的完整行标签），这里的值只在按钮取不到时兜底。
    //   尤其 requester：原 toast 说「通知报障人」而行标签是「业务方 …」，同一件事两种叫法（S17 点名项）。
    function siNotifyRelayClick() { return siNotifyManual('notify-relay', '对接人', 'relay_notify_status', 'relay_notify_error', '.u-nb-btn[onclick="siNotifyRelayClick()"]'); }
    function siNotifyCreatorClick() { return siNotifyManual('notify-creator', '建单人', 'creator_notify_status', 'creator_notify_error', '.u-nb-btn[onclick="siNotifyCreatorClick()"]'); }
    function siNotifyRequesterClick() { return siNotifyManual('notify-requester', '业务方', 'requester_notify_status', 'requester_notify_error', '.u-nb-btn[onclick="siNotifyRequesterClick()"]'); }
    // 建单优化批 C1 §4 改动点2·前端 C2：通知对接人受理（响应体字段 intake_notify_status/intake_notify_error，
    //   与 recordSysIntakeNotify 落库列同名）——标签用"通知对接人受理"而非"通知对接人"，与既有 relay
    //   通道的"通知对接人"（siNotifyRelayClick）区分，防两条 toast 文案混淆成同一件事。
    function siNotifyIntakeClick() { return siNotifyManual('notify-intake', '对接人受理', 'intake_notify_status', 'intake_notify_error', '.u-nb-btn[onclick="siNotifyIntakeClick()"]'); }
    // 对接测试通知（工期对接测试与风险等级拆分 方案 v1.1 §6/§7·C4b）：不能复用 siNotifyManual——① 需在
    //   body 携带 expected_cycle（详情 DTO liaison_test_cycle_no，方案 §6"DTO 契约"唯一来源，周期令牌防
    //   reopen-ABA）；② 响应多一个 concurrent_changed 分支（写回 CAS 被并发覆盖，外部消息可能已送达但
    //   本次未计入库内状态，同 relay 通道 superseded 分支的姊妹语义，文案分开写以免混淆两种不同的并发情形）。
    async function siNotifyLiaisonTestClick() {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        if (siNotifyInflight) return;
        siNotifyInflight = true;
        let lock = null, rowLabel = '对接测试';
        try {
            lock = siLockNotifyBtns('.u-nb-btn[onclick="siNotifyLiaisonTestClick()"]');   // 放 try 内：抛了也能复位 inflight
            rowLabel = lock.label('对接测试');
            const r = await siApi('/sys-issues/' + iss.id + '/notify-liaison-test', { method: 'POST', body: { expected_cycle: iss.liaison_test_cycle_no } });
            // [281 号对抗审 R10+N1 采纳] 原先 !r.ok 直接 return，按钮态停留在旧渲染上——504/409 这类
            // "结果未知/并发冲突"响应后端状态其实已经变了（如 sending 未超窗、或已被别的请求抢占），
            // 不刷新会让用户对着一颗过期的按钮反复点击、反复撞同一个错误。统一 siApiErr 提示后补一次
            // siAfterAction() 刷新详情，按钮态随后端真实态重算。
            //   ⚠️〔N3-2 登记·不得"顺手统一"成 return 不刷新〕本行与其余通道的 `!r.ok → return` **刻意不同**，
            //     是 281 号对抗审 R10 的采纳项：该端点 504/409 后端状态已变，刷新是收益不是负收益。
            //     sentOk:false ——这条路径没发成功，兜底句不得说"已发送"（siApiErr 已给出失败提示）。
            if (!r.ok) { siNotifyErr(r); await siRefreshQuiet(lock); return; }   // 〔S1〕siNotifyErr 已提示 ⇒ 刷新走 quiet 不叠兜底
            if (r.data && r.data.concurrent_changed === true) {
                // 〔矩阵 T7·A' 留〕行会刷但语义不对应（显示的是当前落库态，不是本次投递结果）
                showToast(rowLabel + '：该单状态已并发变化，请查看当前通知状态', 'warning');
                await siRefreshQuiet(lock);   // 上一行已是独家 toast
                return;
            }
            // [codex 278/279 号审 M-3/H-1] writeback_failed:true——结果回写失败，但"外部是否真的发出去了"
            // 分两种，前端提示与是否劝阻重发必须分叉，不能一刀切：
            //   sent_externally===true：钉钉消息已确认发出，只是回写失败——绝不能诱导用户重新点击
            //   （=真实双发），记入会话级 Set 供行内持续显示「请勿重发」红字。
            //   sent_externally===false：外部发送本就明确失败（同时回写也失败）——**不该劝阻重发**，
            //   这次确定没送达，用户理应能补发；只做独立提示，不记入持续警示 Set。
            if (r.data && r.data.writeback_failed === true) {
                let wbDeletedToast = false;   // 本支是否属于「A 类删了 toast」⇒ 决定走 AfterNotify 还是 Quiet
                if (r.data.sent_externally === true) {
                    siLiaisonTestWritebackFailedIds.add(siLiaisonTestWarnKey(iss.id, iss.liaison_test_cycle_no));
                    // 〔矩阵 T8·A 类删〕这条 toast 删除：同一句话已由**行内驻留红字**承担
                    //   （siRenderLiaisonTestNotifyRow 的 siLiaisonTestWritebackFailedIds 分支，逐字同文案且
                    //   **持续驻留**，比 3 秒 toast 强）。上面那行 add() 正是这条驻留红字的开关，必须留。
                    //   注意：本分支后端状态其实**停在 sending**（回写失败），行内会变化 ⇒ 满足 A 类判据；
                    //   刷新失败时 sentOk:true 的抽屉版兜底能兜住"发出去了但界面没动静"
                    //   （本支 `sent_externally===true` ＝钉钉确认已发出，说「已发送」属实）。
                    wbDeletedToast = true;
                } else if (r.data.dry_run === true) {
                    // [281 号对抗审 N1] dry-run 下 sent_externally 恒为 false（未真实外呼），不属于上面
                    // "确定没送达可补发"的常规语义，措辞单独区分，避免用户误以为这是一次真实发送失败。
                    // 〔矩阵 T9·A' 留〕行内无该分支表达（行内只有"沿用旧态"）⇒ toast 是唯一反馈。
                    showToast('演练回写失败（演练·未真实发送），约 10 分钟后可重试', 'error');   // 〔J20·D-2〕
                } else {
                    // 〔矩阵 T10·A' 留〕同上，行内无"发送+留痕双失败"的表达
                    showToast('发送失败且留痕失败，可稍后重试或联系管理员', 'error');
                }
                // A 支（sent_externally）toast 已删 ⇒ 必须有兜底；另两支是 A' 留（上面刚弹过独家 toast）⇒ quiet
                if (wbDeletedToast) await siRefreshAfterNotify(lock, rowLabel, { sentOk: true });
                else await siRefreshQuiet(lock);
                return;
            }
            // 〔矩阵 T11/T12/T13·A 类删〕三分支 toast 全删——行内对接测试行即反馈：
            //   sent → 状态句 `✅ 已于 {时间} 通知`，且 dry-run 由**行标签后缀**「（演练·未真实发送）」
            //          承担（D-1 判据 message_key 前缀 `dryrun-`，刷新后必然带上）⇒ 演练信息不丢；
            //   failed → 行内 `⚠️ 通知失败（{原因}），可重试`（S2 已接 liaison_test_notify_error·§1.1b 落死）
            //          ⇒ 原 toast 里 `liaison_test_notify_error` 的**后端原文透传**随之消失（J8 五处之一）；
            //   其余 status → 状态句照刷。
            // 〔B1〕把被删分支的 status 读回来只为**定兜底动词**：failed/其余态刷新失败时说「发送未成功」，
            //   不能沿用「已发送」（本页四个 A 删点同款修法）。
            const st = r.data && r.data.liaison_test_notify_status;
            await siRefreshAfterNotify(lock, rowLabel, { sentOk: st === 'sent' });
        } finally { siNotifyInflight = false; }
    }
    // S4（bug暂缓方案 §7.3）：暂缓通知建单人——响应体形状（含 skipped 自我保护分支）与既有四通道
    //   notify-relay/creator/requester/intake 完全一致（同样落 creator_notify_* 列），直接复用 siNotifyManual，
    //   不另写一份。409（如 NOTIFY_CLAIM_CONFLICT）走 siApiErr 统一友好提示，本函数不需要额外分支。
    function siNotifyHoldCreatorClick() { return siNotifyManual('notify-hold-creator', '暂缓通知建单人', 'creator_notify_status', 'creator_notify_error', '.u-nb-btn[onclick="siNotifyHoldCreatorClick()"]'); }

    // 开发侧逐 dev 通知（notify-developer 带 dev_user_id，定位子表活动行；同一 inflight 守卫）
    async function siNotifyDevSend(devUserId) {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        if (siNotifyInflight) return;
        siNotifyInflight = true;
        // 逐 dev 行按钮：onclick 实参就是 user_id，**用全等属性选择器**不用 `^=` 前缀——
        //   `siNotifyDevSend(1` 是 `siNotifyDevSend(12)` 的前缀，前缀匹配会一次锁住两行（同 DCorr 的右界符教训）。
        let lock = null, rowLabel = '开发';
        try {
            lock = siLockNotifyBtns(`.u-nb-btn[onclick="siNotifyDevSend(${devUserId})"]`);   // 放 try 内：抛了也能复位 inflight
            rowLabel = lock.label('开发');
            const r = await siApi('/sys-issues/' + iss.id + '/notify-developer', { method: 'POST', body: { dev_user_id: devUserId } });
            if (!r.ok) { siNotifyErr(r); lock.restore(); return; }   // 〔S1〕沿现状：非 ok 不刷新
            // 〔矩阵 T14/T15/T16·A 类删〕三分支 toast 全删——该 dev 行状态句即反馈（failed 带 `（{原因}）`，
            //   S2 已把子表 `notify_error` 传进渲染，DEV_ASSIGNEES_SELECT_COLS 显式含该列）。
            //   T15 原来的 `r.data.notify_error` 直出（J8 五处透传之一）随删除消失。
            const st = r.data && r.data.notify_status;   // 〔B1〕读回来只为定兜底动词
            await siRefreshAfterNotify(lock, rowLabel, { sentOk: st === 'sent' });
        } finally { siNotifyInflight = false; }
    }

    // S4（bug暂缓方案 §7.3）：重启通知开发（批量）——响应体形状 {id, results, dev_assignees} 与逐 dev 通知
    //   notify-developer（单条 notify_status）不同，不能复用 siNotifyManual，单独实现。results 里
    //   skipped:true 的行（claim_conflict）不算失败——只是"这次没抢到"（已被并发请求认领或已 sent），
    //   不单独提示，仅在 ok:false 且非 skipped 时计入失败数。
    async function siNotifyResumeDevClick() {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        if (siNotifyInflight) return;
        siNotifyInflight = true;
        let lock = null, rowLabel = '重启通知开发（批量）';
        try {
            lock = siLockNotifyBtns('.u-nb-btn[onclick="siNotifyResumeDevClick()"]');   // 放 try 内：抛了也能复位 inflight
            rowLabel = lock.label('重启通知开发（批量）');
            const r = await siApi('/sys-issues/' + iss.id + '/notify-resume-dev', { method: 'POST' });
            if (!r.ok) { siNotifyErr(r); lock.restore(); return; }   // 〔S1〕
            const results = (r.data && r.data.results) || [];
            const okCount = results.filter(x => x.ok).length;
            const failCount = results.filter(x => !x.ok && !x.skipped).length;
            // 〔矩阵 T17/T18/T19·A'（R1 聚合）留 + J10 五态改造〕批量聚合 toast 一律保留——聚合计数
            //   （N/M）在行内无处显示（重启行只有"全部已通知/尚有未通知"两句），逐人状态另在各 dev 行更新。
            //   **J10 是非零行为变更**：原三分支把"全失败"也落在第一分支，显 `0 人成功，N 人失败` + warning；
            //   方案 §2.1 R1 表要求全失败单列一态、文案 `{N} 人均发送失败（可重试）`、级别 **error**
            //   （方案里"与 SI 现状语义一致、聚合面零行为变更"那句注记已被 J10 明文作废）。
            if (failCount > 0 && okCount === 0) showToast(`${rowLabel}：${failCount} 人均发送失败（可重试）`, 'error');
            else if (failCount > 0) showToast(`${rowLabel}：${okCount} 人成功，${failCount} 人失败（可重试）`, 'warning');
            else if (okCount > 0) showToast(`${rowLabel}：${okCount} 人已发送`, 'success');
            // R1 表第 4 态「无新增（幂等）」：okCount=failCount=0，全部 results 都是 skipped（claim_conflict/已 sent）。
            // R1 表第 5 态「空目标 `没有可通知的对象`」**本页前端不可达 ⇒ 不实现**（矩阵 J10 标 mock-only）：
            //   重启行在 roster 为空时整行不渲染（siRenderResumeNotifyRow 的 `if (!roster.length) return ''`），
            //   按钮根本不存在；且后端 roster 空走 409 RESUME_NOTIFY_NO_ROSTER 从 !r.ok 出去。
            //   若真收到空 results（后端契约变化），会落进下面这条 info——那是"没发出去任何一条"的诚实描述，
            //   不是把空目标当成功。**不新建一条永远走不到的 `没有可通知的对象` 分支**（同 S3/P13 死分支口径）。
            else showToast(`${rowLabel}：无新增发送（可能已被其他请求认领）`, 'info');
            // 聚合 toast 已是独家反馈 ⇒ 走 quiet，不再叠一句兜底
            //   （聚合语义下无论「已发送」还是「发送未成功」都指代不明：N 个人里成了几个？说不清就不说；
            //    "失败不静默"由上面那条**必发**的五态聚合 toast 承担，不存在静默口）。
            await siRefreshQuiet(lock);
        } finally { siNotifyInflight = false; }
    }

    // 查已读（GET notify-read-status?type=dev|relay|creator|requester|release_executor[&dev_user_id=]）——共用一个查询函数
    //   （release_executor 通道 2026-07-30 起前端已无触发点——该行转纯只读展示；后端查询通道保留）。
    //
    // ===== 〔D6 · 矩阵 T20-T23/T43 · 方案 §3.3〕结果从 toast 切**行内驻留结果框** =====
    //   为什么：查已读是"看状态"不是"做动作"，结果应当能对照着行内的通知时间反复看，而不是飘 3 秒就没。
    //   与其余四页（DCorr/DC/IL/IT）对齐，用同一个 `.u-nr-read-result` 容器与同一套六态文案。
    //
    // ⚠️⚠️ 本次改造的**头号陷阱**（与 Data_Collab 已修的那条 HIGH 完全同构，必须写在这里）：
    //   原实现在函数末尾**无条件** `await siAfterAction()`。一旦把结果写进行内结果框，这个无条件刷新
    //   就变成"结果框写进去 → siRenderDrawer 整体重渲染 `siDBody.innerHTML` → 刚写的结果框被连根摘掉"，
    //   症状是**查一次已读，结果闪一下就没了**，且因为要卡在渲染时序上、极难复现（Collab 那条是
    //   "红框挂上 → openDetail 摘掉"，同一个模子）。
    //   ⇒ 铁律：**只有「已读」态才刷新**（该态后端刚 UPDATE 固化了 read_at，刷新是把行内换成权威固化
    //     显示 `📖 已读 · …`，是真收益）；查询中/未读/无法查询/查询失败四态**后端零状态变化，刷新纯负收益**，
    //     一律只写结果框、**不得调 siAfterAction**。改动这里前先想清楚这条。
    //
    //   持久化边界（J18·§1.3）：本函数覆盖的 5 个通道里 **intake 无 `intake_notified_at` 列** ⇒ 该通道
    //     行内固化后只能出**单时刻** `📖 已读 · 于 {已读时间}`（由 siRenderIntakeNotifyRow 传 null 保证）；
    //     结果框本身按 §3.3 就是"即时回执·单时刻简式"，五通道同一句，不区分。
    //   闭口（J7）：本端点**从不产出 `unread_expired`**（全仓唯一产出点是 Data_Collab 查已读），故
    //     不实现「超窗口未读」态——不是遗漏，是**显式闭口**，补了就是又一条死分支。
    //   登记（S15 边界）：抽屉侧 5 颗「查询已读」按钮**有意不做点击禁用**——S15/J23 管的是"发送中"
    //     （发送有真实副作用，连点＝多条钉钉推送），而查已读是只读查询、固化 read_at 幂等，连点最多多打
    //     一次远程读；且结果框立刻显示「查询中…」已是在途反馈。与四页基准实现 Data_Correction
    //     `queryReadStatus` 保持一致（那边同样不禁用）——本任务的目的就是让五页同款，不在这里单开特例。
    //     批次执行人侧那颗有禁用，是它自己的 L4 既有防线，保留不动。
    async function siQueryReadStatus(type, devUserId) {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        const boxId = siReadBoxId(type, type === 'dev' ? devUserId : undefined);
        const box = document.getElementById(boxId);
        if (box) box.innerHTML = '<span class="u-nt-idle">查询中…</span>';   // §3.3 态①
        let path = '/sys-issues/' + iss.id + '/notify-read-status?type=' + type;
        if (type === 'dev') path += '&dev_user_id=' + devUserId;
        let r;
        try { r = await siApi(path); }
        catch (e) { if (box) box.innerHTML = '<span class="u-nt-fail">⚠️ 查询失败（网络异常）</span>'; return; }
        if (!r.ok) {
            // 〔T20〕历史无快照＝契约内的"查不了"，不是报错 → §3.3 态⑤「无法查询」；
            // 〔T43〕其余非 ok → §3.3 态⑥「查询失败（{原因}）」，原因走**冻结映射表五级回退**，
            //        不再 siApiErr 直出后端 `error` 原文（J8）。
            // 结果框挂不上时回落 toast，绝不静默。〔S1/J8〕文案与结果框态⑥同源，原因走冻结映射表——
            //   这里也属**通知域**，不能退回 siApiErr 直出后端 error 原文。
            if (!box) { showToast('查询失败（' + siErrText(r, r.data) + '）', 'error'); return; }
            if (r.data && r.data.code === 'HISTORICAL_SNAPSHOT_MISSING') {
                box.innerHTML = '<span class="u-nt-warn">⚠️ 历史记录无快照，无法查询已读</span>';
            } else {
                box.innerHTML = `<span class="u-nt-fail">⚠️ 查询失败（${esc(siErrText(r, r.data))}）</span>`;
            }
            return;
        }
        const d = r.data || {};
        if (d.read) {
            // §3.3 态②「已读」——**唯一触发固化刷新的分支**（后端本次请求已 UPDATE read_at 落库）。
            //   先把结论写进结果框（刷新失败时它就是保底），再刷新。
            //   时间过 siFmtDT 归一（后端 read_at 是 `toLocaleString('zh-CN')` 原始串，同页所有时间展示都归一）。
            const readTxt = d.read_at ? esc(siFmtDT(d.read_at)) : '—';
            if (box) box.innerHTML = `<span class="u-nt-ok">📖 已读 · 于 ${readTxt}</span>`;
            // 结果框挂不上（DOM 与预期不符）⇒ 回落 toast，与下面两处 `!box` 同一条纪律：宁可飘一条，也不静默。
            else showToast(`📖 已读 · 于 ${d.read_at ? siFmtDT(d.read_at) : '—'}`, 'success');
            // 〔§6.6 ②·DCorr :2788-2795 探测范式〕**靠 DOM 哨兵不靠 catch**：siRenderDrawer 的失败路径
            //   （!r.ok / siOpenId 变了）是静默 return 不抛，catch 捕不到。判据＝刷新后**这个 box 还在不在、
            //   还是不是我刚写的那句**：
            //     · 刷新成功 ⇒ siDBody 整体重渲染；且 read_at 已固化 ⇒ 该行「查询已读」按钮随之隐藏、
            //       结果框容器一并不再渲染 ⇒ 重新 getElementById 必为 null；
            //     · 刷新没生效 ⇒ 旧 box 节点原样挂着、文本仍是我刚写的「📖 已读 · 于 …」
            //       ⇒ 追加保底尾巴，让"查询结果 + 刷新失败"两件事都留在用户眼前（§6.6 ② 明确**不发 toast**：
            //         宿主是抽屉、结果框就在眼前，且 siRenderDrawer 失败路径自己已经弹过 siApiErr）。
            try { await siAfterAction(); } catch (e) { /* 冒泡异常止于此，判定交给下面的哨兵 */ }
            const boxAfter = document.getElementById(boxId);
            if (boxAfter && boxAfter.textContent.indexOf('📖 已读') === 0) {
                boxAfter.innerHTML = `<span class="u-nt-ok">📖 已读 · 于 ${readTxt}（详情刷新失败，可重开抽屉）</span>`;
            }
            return;
        }
        if (!box) {   // 非已读态且结果框挂不上 ⇒ 回落 toast（同上：宁可飘一条，也不静默）
            showToast(d.read_status === 'recipient_unresolved' ? '收件人未解析，无法查询已读' : '尚未读取', 'warning');
            return;
        }
        if (d.read_status === 'recipient_unresolved') {
            box.innerHTML = '<span class="u-nt-warn">⚠️ 收件人未解析，无法查询已读</span>';   // §3.3 态⑤
        } else {
            box.innerHTML = '<span class="u-nt-warn">⏳ 尚未读取</span>';   // §3.3 态③（`👀` 收编为 `⏳`）
        }
    }

    // ---- 通用「原因」弹框 ----
    // ⭐ C2.5b：加可选第 6 参 trustedNoteHtml——弹窗顶部说明块（如 intake_return 的"信息不全非否决"语义提示）。
    //   其余调用点不传 = undefined = 不渲染，零影响。
    //   ⚠️ 可信 HTML 通道（note() 直拼模板串不转义，最终进 innerHTML）：仅允许传静态字面量，
    //     禁止拼接用户输入/接口响应数据——否则形成 DOM XSS（codex 审 177 号 L-2：参数名带 trusted 前缀立约束）。
    function siModalReason(iss, action, title, label, path, trustedNoteHtml) {
        siModal(title, [
            ...(trustedNoteHtml ? [note(trustedNoteHtml)] : []),
            fTextarea('reason', label, '', true, '必填，trim 后非空')
        ], async v => {
            if (!v.reason.trim()) { showToast(label + '必填', 'error'); return false; }
            const r = await siApi('/sys-issues/' + iss.id + path, { method: 'POST', body: { reason: v.reason.trim() } });
            if (!r.ok) { siApiErr(r); return false; }
            showToast(title + '完成', 'success'); return true;
        });
    }
    // ⭐ 角色权限重构 v2.1 §4（OA 号补填入口）：受理通过后、单据进入 §4 显式允许状态集内时，admin 可回填
    //   OA 流程号——变更流指派前必填（assign 的 OA 前置守卫），bug 可选（D2）。指派后仍可改（纠错窗口，
    //   timeline 留痕可审计）。同值再提交=200 no-op（服务端比对制，不重复留痕）。
    //   历史沿革：本函数原名 siModalPreDiscussPass，服务已撤销的 C2.5 预沟通通过端点；C2.5 撤销后复用
    //   同一套 siModal 结构改造为本入口（endpoint 改 set-oa-number，语义改为"补填"非"通过预沟通"）。
    //   ⚠️ 校验与后端 assertSysOaNumber **逐字同源**（1-20 位纯数字）：前端先挡省一次往返，
    //     但真闸在后端（前端非授权源）。两处若哪天要改口径，必须同批改（写读同源）。
    function siModalSetOaNumber(iss) {
        siModal('补填 OA 号 #' + iss.id, [
            note('受理通过后回填 OA 立项流程号。<br>' + (iss.type === 'bug' ? 'bug 单 OA 号可选，仅供台账关联使用。' : '变更流单据<b>指派开发前必填</b>，否则「指派」会被后端拒绝。') + '<br>已有号时可覆盖（覆盖会留痕）；填入相同号不产生变更。'),
            fText('oa_number', 'OA 流程号', iss.oa_number || '', iss.type !== 'bug', '1-20 位纯数字（业务方 OA 需求流程的单号）' + (iss.type === 'bug' ? '，可留空' : '，必填'))
        ], async v => {
            const oa = (v.oa_number || '').trim();
            if (!oa) {
                // bug 单 OA 可选（D2）：留空视为"本次不填"，不调用后端（assertSysOaNumber 对空值恒拒绝，
                //   调了必 400）；变更流单据前面已挡必填，理论到不了这里，双重保险仍保留判断。
                if (iss.type !== 'bug') { showToast('变更流单据 OA 流程号必填', 'error'); return false; }
                showToast('未填写，已跳过', 'success'); return true;
            }
            if (!/^\d{1,20}$/.test(oa)) { showToast('OA 流程号须为 1-20 位纯数字', 'error'); return false; }
            const r = await siApi('/sys-issues/' + iss.id + '/set-oa-number', { method: 'POST', body: { oa_number: oa } });
            if (!r.ok) { siApiErr(r); return false; }
            showToast('OA 流程号已保存', 'success'); return true;
        });
    }
    // 无参分发包装（与 siCancelConsult/siResendTechLeadCommentNotify 同一范式，供按钮 onclick 直调）。
    function siOpenSetOaNumber() {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        siModalSetOaNumber(iss);
    }
    // ⭐ [C9 无 commit 单验收直翻·方案 v1.7 §10.1] 验收通过专用弹窗——从通用 siConfirmSimple 分出来，
    //   只为两件事：① 事前告知"这单会直接上线"（无 commit 单 accept 后不再经批次，验收人得先知道）；
    //   ② 事后如实回显 deleted_commit_count（N>0 时）。
    //   ⚠️ **前端不判定直翻**：是否直翻由后端准入四条件在写事务内决定（DB 为准，297-M1），前端拿到响应
    //     才知道结果。事前提示用的是"可能"的措辞，不是承诺——单据在你点确认的这一刻可能刚被人补了 commit。
    function siModalAccept(iss) {
        // 事前预告只在"前端已知信息足以判断很可能直翻"时才出：详情响应的 dev_commits 为空 ∧ 本单未挂批次。
        //   ⚠️ **数据取自 `siDetail.dev_commits` 不是 `iss.dev_commits`**（[C9-fix H1]）：详情端点响应体里
        //     `issue` 与 `dev_commits` 是**兄弟键**（`{ issue: {...}, dev_commits: [...], dev_assignees: [...] }`，
        //     见 siOpenDetail 的 `siDetail = r.data; const iss = r.data.issue;` 与 siRenderDevCommits 的取值），
        //     `iss.dev_commits` 恒 undefined ⇒ 原写法的 `Array.isArray(undefined)` 恒 false ⇒ 预告**从未出现过**
        //     （死代码）。`release_id` 则确实在 issue 上（同文件多处 `iss.release_id`），故仍从 iss 取。
        //   ⚠️ 注释写实（[C9-fix H1] 订正，原写"判据故意宽松（宁可少提示也不误报）"与实际相反）：
        //     · **不宽松**——修好后本判据（零 commit ∧ 无 release_id）与后端准入条件①②**等价**
        //       （evaluateNoCommitDirectOnline：commits 行数=0 ∧ 无 active 批次关联）。唯一比后端严的情形是
        //       "release_id 指向一条已被删除/非 active 的批次行"：后端 NOT EXISTS 判定为可直翻、前端不提示
        //       ⇒ 这一格是"少提示"，无害。
        //     · **存在 stale 误报窗口**——判据读的是打开详情那一刻的快照。详情打开后、点确认前，若他人给本单
        //       补了 commit（或把它加进批次），后端会在写事务内按最新 DB 判定为不直翻、落「待上线」，
        //       而前端这条提示是照旧要弹的。成功回调**只按响应体 online_source 判断**实际结果（见下方 if），
        //       不复用本变量——真判定永远在服务端（297-M1「只信数据库」）。
        //   ⭐⭐ [C9-fix2 M3·文案改条件式] 原提示写「验收通过后将直接标记为「已上线」」，并在上面这段注释里
        //     声称"措辞用『将』而非承诺"——**这两句是矛盾的**（codex 316 M3 实证）：中文里"验收通过后将 X"
        //     就是承诺句式，读者不会把"将"读成"可能"。而它恰恰会在上述 stale 窗口里说错话：用户看到"将直接
        //     上线"、点了确认、结果单据落到「待上线」，提示与结果对不上，且用户无从知道中间发生了什么。
        //     现改为**显式条件式**——把提示的前提（"若确认时仍无 commit 且未挂 active 批次"）和另一种结局
        //     （"否则进入待上线"）都写在句子里。这样无论后端最终怎么判，这句话都是真的，stale 窗口不再是
        //     "会说错话的窗口"而只是"两个分支里走了另一个"。声称与实现对齐，注释也随之改写（[[feedback_comment_is_review_input]]）。
        const likelyDirect = Array.isArray(siDetail && siDetail.dev_commits) && siDetail.dev_commits.length === 0 && !iss.release_id;
        const notes = [note('确认验收通过？')];
        if (likelyDirect) {
            notes.push(note('ℹ️ 本单当前没有任何 commit 提交记录，也未挂上线批次。<b>若确认时该单仍无在案 commit 且未挂 active 上线批次</b>，验收通过后将<b>直接标记为「已上线」</b>（无提交免上线），不再需要安排上线批次；<b>否则</b>照常进入「待上线」等待安排批次。最终以服务端判定为准。'));
        }
        siModal('确认验收通过？', notes, async () => {
            const r = await siApi('/sys-issues/' + iss.id + '/accept', { method: 'POST', body: {} });
            if (!r.ok) { siApiErr(r); return false; }
            const d = r.data || {};
            if (d.online_source === 'no_commit_acceptance') {
                // N=0 不显示（§10.1 逐字）——只有真发生过删除提交动作才提示，避免给正常单加噪音
                // ⭐ [C9 对抗审 codex 317·M2] 文案用「发生过 N 次删除提交动作」而非「N 条已删提交记录」：
                //   deleted_commit_count 是 delete-commit **动作次数**（同一 commit 反复删会累计），
                //   "N 条记录/N 条提交"会被读成"有 N 条不同的提交"，与后端语义（见 index.js:2388）不符。
                const n = Number(d.deleted_commit_count) || 0;
                showToast(
                    n > 0
                        ? `已验收并直接标记「已上线」（无提交免上线）。该单曾发生过 ${n} 次删除提交动作，本次按无 active commit 免上线。`
                        : '已验收并直接标记「已上线」（无提交免上线）',
                    'success'
                );
            } else {
                showToast('操作完成', 'success');
            }
            return true;
        }, '确定');
    }
    function siConfirmSimple(iss, action, prompt, path) {
        siModal(prompt, [note(prompt)], async () => {
            const r = await siApi('/sys-issues/' + iss.id + path, { method: 'POST', body: {} });
            if (!r.ok) { siApiErr(r); return false; }
            showToast('操作完成', 'success'); return true;
        }, '确定');
    }
    // [工期对接测试与风险等级拆分 方案 v1.1 §3.4/§7·C5] 受理通过——feature/improvement 单需同时判定
    //   风险等级（技术风险，对接人视角，一级/二级/三级），与端点 intake-accept 的 risk_level 必填闸同源
    //   （服务端才是真闸，前端仅体验层拦截）。⭐ 用户拍板批1改造B（2026-08-06）：判据从"仅 feature"
    //   扩到"feature∨improvement"——原「非 feature 不涉及风险等级」表述已废止，现只有 bug 沿用既有
    //   零输入确认弹窗（siConfirmSimple，行为完全不变，body 恒 {}），不把风险等级控件泄漏给 bug。
    //   ⭐ 用户拍板批1改造A：值域「高/中/低」全仓改名为「一级/二级/三级」。默认选中「三级」（用户拍板=
    //   前端默认体验，服务端必填闸不变，仍可手动切回「请选择」触发必选拦截，见下方 T6 回归覆盖）。
    //   ⚠️ [codex 290 号 M-1 收口] 默认值不是"人工评估过"的证据：必填闸门只能证明请求确实携带了一个
    //   合法 risk_level 值，无法区分"用户看过三个选项、判断后主动选三级"与"用户没细看，留用默认值直接
    //   点了确定"——这两种情况在服务端/审计留痕层面完全无法区分。若未来需要"是否经人工评估"这一信号
    //   （如统计口径/责任认定），须另设机制（例如去掉预选默认值、强制用户显式点选），本次不做，仅如实
    //   标注这条局限，不在注释里声称"必填=已确认人工评估"。
    function siModalIntakeAccept(iss) {
        if (iss.type !== 'feature' && iss.type !== 'improvement') {
            return siConfirmSimple(iss, 'intake_accept', '确认受理通过？受理后单据进入指派/处理阶段。', '/intake-accept');
        }
        siModal('受理通过 #' + iss.id, [
            note('受理后单据进入指派阶段。请同时判定本单风险等级（技术风险，对接人视角）。'),
            // [C8·方案 v1.7 §9.2 末条] label 挂三级口径问号徽章（SI_RISK_LEVEL_LABEL 内含 si-help）——
            //   本弹窗是全站**唯一**渲染"风险等级选择"的表单（建单/编辑表单均无该字段，风险等级由受理门
            //   判定，见 :3288 注释），故徽章只此一处即全覆盖。范式与 SI_PRIORITY_LABEL 完全一致。
            { k: 'risk_level', html: `<div class="u-form-group"><label>${SI_RISK_LEVEL_LABEL} <span class="u-req">*</span></label><select id="f_risk_level"><option value="">请选择</option><option value="一级">一级</option><option value="二级">二级</option><option value="三级" selected>三级</option></select></div>` }
        ], async v => {
            const riskLevel = (v.risk_level || '').trim();
            if (!riskLevel) { showToast('请选择风险等级', 'error'); return false; }
            const r = await siApi('/sys-issues/' + iss.id + '/intake-accept', { method: 'POST', body: { risk_level: riskLevel } });
            if (!r.ok) { siApiErr(r); return false; }
            showToast('受理通过', 'success'); return true;
        }, '确定');
    }
    // [方案 D22-④·批2 2026-08-06] 对接测试通过——凭证二选一：本轮（进入本轮待对接测试之后）新上传的
    //   附件 或 当场填写的测试说明，至少其一，服务端才是真闸（LIAISON_TEST_PASS_EVIDENCE_REQUIRED）。
    //   前端不预判"本轮是否已有合格附件"（需要额外查询、且与后端判定口径重复维护两份），只给占位提示 +
    //   把服务端拒绝时的文案透传给用户（siApiErr 已读 r.data.error，自动带出"请上传测试截图或填写测试
    //   说明"）。test_note 留空且服务端判定本轮无凭证附件时会被拒，用户据提示回来补填或先去传附件。
    function siModalLiaisonTestPass(iss) {

            note('确认对接测试通过？通过后单据进入「待验收」。'),

        ], async v => {
            const testNote = (v.test_note || '').trim();
            const body = testNote ? { test_note: testNote } : {};
            const r = await siApi('/sys-issues/' + iss.id + '/liaison-test-pass', { method: 'POST', body });

    // S4（bug暂缓方案 20260803 v0.4 §6.2）：重启弹窗——理由必填 + 附件可选，两步链范式（先 resume JSON
    //   提交拿结果 → 再 FormData 上传 spec 附件，同 siOpenCreate 的 C5 两步链/siOpenUploadModal 的上传范式，
    //   非另造一套）。附件类型沿用 spec 既有白名单 SI_SPEC_ALLOWED_EXTS（口径 #8，不收窄为仅图片——证据
    //   可能是日志/Excel样本/录屏）。上传失败**不回滚** resume（口径 #11·两步链下系统层面本就无法保证
    //   "重启必有证据"，best-effort，同建单 siOpenCreate 失败只拼提示到 msg 的处理方式）。
    //   picker key='resume-spec'——关弹窗时的统一 reset 见 siCloseModal（已把该 key 加入批量 reset 数组）。
    function siModalResume(iss) {
        const key = 'resume-spec';
        siPickerReset(key);
        siModal('重启 #' + iss.id, [
            fTextarea('reason', '重启原因', '', true, '必填，trim 后非空'),
            { k: null, html: `<div class="u-form-group"><label>补充证据材料（选填，图片/PDF/Excel/Word/csv/txt/md，单个≤20MB，最多5个）</label>
                ${siFilePickerHtml(key, '选择文件')}
                <div class="u-hint">证据非强制：两步链下上传失败不影响重启本身生效，失败会提示到详情页补传。</div></div>`
            },
        ], async v => {
            const reason = (v.reason || '').trim();
            if (!reason) { showToast('重启原因必填', 'error'); return false; }
            const selectedFiles = siPickerFiles(key).slice();   // 快照，防 onConfirm 期间数组被并发改动（同 create-spec 范式）
            const r = await siApi('/sys-issues/' + iss.id + '/resume', { method: 'POST', body: { reason } });
            if (!r.ok) { siApiErr(r); return false; }   // resume 本身失败：不进第二步，弹窗保留(已选文件不丢)供重试
            let msg = '重启完成';
            let hasFailure = false;
            if (selectedFiles.length > 0) {
                let uploadOk = false;
                try {
                    const fd = new FormData();
                    fd.append('attachment_type', 'spec');
                    selectedFiles.forEach(f => fd.append('files', f));
                    const uploadR = await siApi(`/sys-issues/${iss.id}/attachments`, { method: 'POST', body: fd, isForm: true });
                    uploadOk = !!(uploadR && uploadR.ok);
                } catch (e) { console.error('[系统迭代] 重启后上传证据材料异常：', e); uploadOk = false; }
                if (!uploadOk) {
                    hasFailure = true;   // resume 本身已生效，上传失败只降级提示，不算整体操作失败（对齐建单两步链的 hasFailure 语义）
                    msg += `；${selectedFiles.length} 个证据材料上传失败，请到详情页补传`;
                }
            }
            showToast(msg, hasFailure ? 'warning' : 'success');
            return true;   // siModal 框架统一 siCloseModal()（含 resume-spec picker reset）+ siAfterAction()
        }, '确定');
    }

    // 物理删除迭代单（admin·不可逆·2026-07-07）：二次确认后 DELETE /sys-issues/:id → 级联清主表+三子表+附件文件。
    //   前置镜像后端守卫①（有派生子单则直接拦，省一次弹框往返）；守卫②（已挂批次）由后端 409 兜底、siApiErr 直出。
    //   note() 不转义 → iss.title 必须 esc()；换行用 <br>（\n 在 div 内折叠）。成功后关抽屉 + 刷列表。
    //   ⭐ 角色权限重构 C2a（方案 v1.7 §4-C2a）：**删除原因必填**（后端 trim 1..200，经 body 传，缺失/超长 400 VALIDATION）。
    //     后端同 commit 把单据整行 + timeline 全部行 + 附件清单快照进 sys_issue_delete_audit（先写审计再删，同事务），
    //     这里填的 reason 就是那条审计行的「为什么删」。校验与后端逐字同源（1..200），前端先挡省一次往返。
    function siDeleteIssue() {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        const hasDerived = siDetail && siDetail.derived_issues && siDetail.derived_issues.length > 0;
        if (hasDerived) { showToast('该单已派生出子单，不可删除（请先处理派生链）', 'error'); return; }
        siModal(
            '删除任务 #' + iss.id,
            [
                note(`确认物理删除迭代单 #${iss.id}「${esc(iss.title || '')}」？<br><br>此操作<b>不可恢复</b>，将一并清除该单的：状态历史、附件（含文件）、协作开发名册、commit 留痕、开发事件记录、各方通知记录。<br>删除动作本身会留审计记录（含操作人、时间、原因，以及上述全部内容的快照）。`),
                fTextarea('reason', '删除原因', '', true, '必填：trim 1..200')
            ],
            async v => {
                const reason = (v.reason || '').trim();
                if (!reason || reason.length > 200) { showToast('删除原因必填（trim 1~200字）', 'error'); return false; }
                const r = await siApi('/sys-issues/' + iss.id, { method: 'DELETE', body: { reason } });
                if (!r.ok) { siApiErr(r); return false; }
                showToast('已删除', 'success');
                siCloseDrawer();
                siLoadList();
                return true;
            },
            '确认删除'
        );
    }

    // 开发成员多选 picker（镜像 siModalCreateChat 1105 附近的 checkbox 多选范式）。

    function siCollaboratorPickerHtml(preselectedIds, label) {

        ).join('');

    // C7 重做（方案 v2.9 §3 reassign 段 + §10 API 契约）：旧「换主/留主改协作」二分语义随 C2 后端全语义
    //   重写整段退场——新契约=声明式最终在册名单（member_ids，无主次之分）+ reason 必填。同一函数兼两个
    //   入口：① 操作栏「改派」按钮（meta flows 驱动，bug 对接人/admin 可见）② 详情「开发成员」区协调人
    //   「管理开发成员」按钮（canCoordinateMember，任意迭代类型）——两处语义完全一致，不重复实现（任务
    //   ④ 提示"复用②的多选编辑器思路"，本次直接同一函数覆盖，非另建 modal）。
    //   M3 乐观锁（94 号对抗审复核 backlog，C7 回填）：进弹窗时快照当前在册 user_id 集合作
    //   expected_member_ids 一并提交，后端 409 REASSIGN_STALE 时前端刷新重拉（防协调人 A/B 并发改派互相覆盖）。
    function siModalReassign(iss) {
        const devAssignees = (siDetail && siDetail.dev_assignees) || [];
        const expectedMemberIds = devAssignees.map(d => Number(d.user_id));
        const pre = new Set(expectedMemberIds);
        const pickerHtml = `<div class="u-form-group"><label>开发成员（勾选=最终在册名单，去主次·无「主开发」）</label>
            <div style="max-height:180px;overflow:auto;border:1px solid #e5e7eb;border-radius:6px;padding:6px">
            ${siUsers.filter(u => u.role !== 'viewer').map(u =>

            note('勾选=最终在册名单：取消勾选=移除，新勾选=加入。当前主状态要求至少 1 名在册开发时，名单不能清空为 0。若他人已先一步调整，本次提交会被拒绝并自动刷新为最新名单。')
        ], async v => {

            const mbody = document.getElementById('siMBody');

            const r = await siApi('/sys-issues/' + iss.id + '/reassign', { method: 'POST', body });

                if (r.status === 409 && r.data && r.data.code === 'REASSIGN_STALE') {
                    siApiErr(r, '开发名单已被他人修改，已为你刷新');

                    await siAfterAction();

    async function siModalCreateChat(iss) {

        const cr = await siApi('/sys-issues/' + iss.id + '/chat-candidates');
        if (!cr.ok) { siApiErr(cr, '获取候选成员失败'); return; }
        const cand = (cr.data && cr.data.candidates) || [];

            const mbody = document.getElementById('siMBody');

            const r = await siApi('/sys-issues/' + iss.id + '/create-chat', { method: 'POST', body: { chat_desc: desc, member_user_ids: memberIds, include_requester: includeReq } });
            if (!r.ok) { siApiErr(r); return false; }

    // F2（估时/可行性弹窗回填提示）：dev_estimated_at 是整单单值，任一在册开发可填、后填覆盖先填——
    //   弹窗打开时先告诉填写者"当前值是谁、何时填的"，帮其判断是否要覆盖。事件源=siCurTimeline
    //   （详情端点原样 ORDER BY id 升序返回，见 index.js 详情查询处），从数组末尾往前找第一条
    //   event_type 为 'estimate' 或 'feasibility' 的事件即为最新一条。
    //   ⚠️〔F3b·F2-LOW-1〕本函数**依赖**该顺序、不自行排序——若将来对 timeline 先过滤/重排（如按
    //   event_type 分组、按其它键排序），"数组末尾=最新"这条假设会失效，须同步改本函数的取值方向。
    //   iss.dev_estimated_at 为空，或 timeline 里找不到匹配事件（异常存量：如直接 SQL 写入未经过
    //   这两个端点），均不显示——不伪造。
    //   返回值供 siModal fields 数组的 `{ k: null, html }` 占位项直接使用（同 note() 范式，siModal
    //   的 onConfirm 收集器按 `if (f.k)` 跳过 k=null 的项，见 note() 定义处）。
    function siEstimateFilledHint(iss) {
        if (!iss || !iss.dev_estimated_at) return '';
        const list = siCurTimeline || [];
        let ev = null;
        for (let i = list.length - 1; i >= 0; i--) {
            if (list[i].event_type === 'estimate' || list[i].event_type === 'feasibility') { ev = list[i]; break; }
        }
        if (!ev) return '';
        // 〔codex 329 终判条件①·归因降级〕文案不写「当前值由谁填写」——timeline 事件与现值之间无逐值校验
        //   （人工修库/数据修复等场景最新事件未必是现值真实来源），改为「最近一次估时/评估」的事实表述，
        //   信息量不减（正常路径两者恒一致）但不做因果归因声称。
        return `<div class="u-hint" style="margin-bottom:10px">最近一次估时/评估由 ${esc(ev.operator_name || '—')} 于 ${esc(siFmtDT(ev.created_at))} 填写</div>`;
    }

    function siModalEstimate(iss) {
        // [C7 工时评估补全·方案 v1.7 §9.1] 工期字段在本弹窗只对 feature/improvement 显示且必填。
        //   本弹窗的调用点已由 needs_feasibility 门控（见动作可见性 `if (a === 'estimate' && iss.needs_feasibility) continue;`）
        //   ——能打开这个弹窗的 feature/improvement 必然是 nf=0，正是 C7 给 estimate 端点新开的工期写点面。
        //   bug/config 不显示该字段也不提交该键（后端适用面闸对这两类"传值即拒" 400 EFFORT_NOT_APPLICABLE，
        //   前端多传一个 null 都会被拒，故必须是"不带这个键"而不是"带 null"）。
        const effortApplicable = iss.type === 'feature' || iss.type === 'improvement';
        // F6（估时并发乐观锁前端接线·B1 后端 e7ecffd）：expected 只能取详情 GET 原文，打开弹窗这一刻
        // 闭包捕获——onConfirm 是异步回调，用户可能盯着弹窗看半天才点确定，其间 siDetail 可能已被别的
        // 操作（甚至本页其它抽屉刷新）整体重新赋值；若 onConfirm 里现读 `siDetail.issue.dev_estimated_at`
        // 而不是这里捕获的值，等于拿"提交那一刻的值"当"打开那一刻的值"送去比对，乐观锁语义整个失效。
        // 字节级严格等值（后端同款口径，见 index.js /estimate 端点 :8072 注释）——不经 siToLocalInput/
        // siFmtDT/timeline summary 等任何转手，就是这里原样存的 GET 响应字段值。空值传 null（后端
        // null↔null 相等，未指派/存量清空场景不会误判 stale）。
        const expectedAtOpen = iss.dev_estimated_at || null;
        const fields = [];
        // F2：字段上方插入"最近一次估时/评估由谁于何时填写"提示（无匹配 timeline 事件或 dev_estimated_at 为空则不插）
        const estimateHintHtml = siEstimateFilledHint(iss);
        if (estimateHintHtml) fields.push({ k: null, html: estimateHintHtml });
        fields.push(fDateTime('dev_estimated_at', '预计完成时间', siToLocalInput(iss.dev_estimated_at), true));   // D2：第 4 参=必填星号（本字段真必填，闸门①）
        if (effortApplicable) {
            // 文案/校验/控件参数与可行性评估弹窗（siModalFeasibility）逐字一致——同一个字段在两个入口
            // 必须长一样，否则用户会以为是两回事。
            // ⚠️ C7-fix H1 订正：C7 落地时这句"逐字一致"是**声称超实现**——那时 siModalFeasibility 的
            //   hint 还在按 `iss.type === 'feature'` 输出"必填/选填"，improvement 走进去看到的是"选填"。
            //   H1 把那边也改成恒必填后，这句话才真正成立（两处 hint 均为「必填：0.5 的整数倍，(0, 365]」，
            //   空值校验与数值校验也已同形）。留此注为记：注释是审查输入，声称与实现必须同批对齐。
            fields.push(fNumber('estimated_effort_days', '工期（人日）', iss.estimated_effort_days,
                true, '必填：0.5 的整数倍，(0, 365]', { step: '0.5', min: '0.5', max: '365' }));
        }
        fields.push(note('⚠️ 闸门①：必须先回填预计完成时间' + (effortApplicable ? '与工期（人日）' : '') + '才能提交交付；时间不能早于指派时刻。'));
        siModal(iss.dev_estimated_at ? '修改预计完成' : '回填预计完成', fields, async v => {
            if (!v.dev_estimated_at) { showToast('请填写预计完成时间', 'error'); return false; }
            const body = { dev_estimated_at: siFromLocalInput(v.dev_estimated_at), expected_dev_estimated_at: expectedAtOpen };
            if (effortApplicable) {
                // 校验口径与后端 normalizeSysEffortDays/DDL CHECK 同源（有限数、0<v≤365、0.5 整数倍），
                // 与 siModalFeasibility 内同款分支逐字对齐；前端先拦一道，服务端仍是权威校验。
                const effortRaw = (v.estimated_effort_days || '').trim();
                if (effortRaw === '') { showToast('请填写工期（人日）', 'error'); return false; }
                const n = Number(effortRaw);
                if (!Number.isFinite(n) || n <= 0 || n > 365 || Math.round(n * 2) !== n * 2) {
                    showToast('工期须为 0.5 的整数倍，且在 (0, 365] 范围内', 'error'); return false;
                }
                body.estimated_effort_days = n;
            }
            const r = await siApi('/sys-issues/' + iss.id + '/estimate', { method: 'POST', body });
            if (!r.ok) {
                // F6：ESTIMATE_STALE 专门分支——不能走下面通用 siApiErr(r)+return false 那条路：弹窗留着、
                // expected 值不变 ⇒ 用户什么都不改直接重点确定，还是同一个过期 expected，还是 409，死循环。
                // 必须主动关弹窗+刷新，让用户带着最新值重新走一遍（同既有 siModalReassign 的 REASSIGN_STALE
                // 分支范式，:4328-4333——手动 siCloseModal()+siAfterAction() 后 return false，防 siModal
                // 包装层的 `if(keep){siCloseModal();await siAfterAction();}` 再重复一遍关闭+刷新）。
                // ⚠️ 故意不走 siApiErr(r)——那会优先显示后端 r.data.error 原文「...请刷新后重试」，盖过这里
                // 要传达的"已经帮你刷新了"这层信息，故直接 showToast 指定文案。
                if (r.data && r.data.code === 'ESTIMATE_STALE') {
                    showToast('预计完成时间已被他人更新，已刷新为最新值，请重新确认', 'error');
                    siCloseModal();
                    await siAfterAction();
                    return false;
                }
                siApiErr(r); return false;
            }
            // [C7-fix LOW-6] unchanged 文案按 effortApplicable 分岔：bug/config 本就没有工期字段，
            //   对他们说"且工期未变"是无中生有的信息（后端对这两类连该键都不回带，见 index.js effortApplicable）。
            showToast(
                r.data && r.data.unchanged
                    ? (effortApplicable ? '未变更（同分钟归一化且工期未变）' : '时间未变（同分钟归一化）')
                    : '已回填，钉钉已通知需求方',
                'success'
            );
            return true;
        });
    }

    function siModalFeasibility(iss) {
        // [C7 工时评估补全·方案 v1.7 §9.1·C7-fix H1] 工期在本弹窗**恒必填**——本弹窗只对
        //   needs_feasibility=1 的 feature/improvement 打开（见调用点门控），而 C7 起这两类在 nf=1 下都必填
        //   （后端判据 index.js `['feature','improvement'].includes(row.type) && effortValue === null`）。
        //   C2 的「feature 必填 / improvement 选填」口径已随 C7 废止，前端不再按 type 分岔：留着
        //   `iss.type === 'feature'` 会让 improvement 的用户看到"选填"、留空提交、再被后端 400 打回——
        //   前端校验比后端**松**是最坏的一种不一致（拦不住还骗人）。
        // F6（估时并发乐观锁前端接线）：同 siModalEstimate 同款闭包捕获，理由/口径逐字一致（该函数定义处
        // 已有完整注释，不重复）。
        const expectedAtOpen = iss.dev_estimated_at || null;
        // F2：字段上方插入"最近一次估时/评估由谁于何时填写"提示（无匹配 timeline 事件或 dev_estimated_at 为空则不插）
        const feasibilityHintHtml = siEstimateFilledHint(iss);
        const feasibilityFields = [];
        if (feasibilityHintHtml) feasibilityFields.push({ k: null, html: feasibilityHintHtml });
        feasibilityFields.push(
            fSelect('conclusion', '评估结论', ['可行', '有条件可行', '不可行'], '可行'),
            fTextarea('requirement_confirm', '需求确认', '', true, '必填：对需求的理解与确认，≤500'),
            fDateTime('dev_estimated_at', '预计完成时间', siToLocalInput(iss.dev_estimated_at), true),   // D2：第 4 参=必填星号（本字段真必填，闸门①）
            fNumber('estimated_effort_days', '工期（人日）', iss.estimated_effort_days,
                true, '必填：0.5 的整数倍，(0, 365]', { step: '0.5', min: '0.5', max: '365' }),
            fTextarea('risk', '风险/前置条件', '', false, '「有条件可行 / 不可行」时必填，≤1000'),
            note('⚠️ 本单需可行性评估：评估通过（可行/有条件可行）后方可继续提交交付。')
        );
        siModal('可行性评估', feasibilityFields, async v => {
            if (!v.conclusion) { showToast('请选择评估结论', 'error'); return false; }
            if (!v.requirement_confirm.trim()) { showToast('需求确认必填', 'error'); return false; }
            if (!v.dev_estimated_at) { showToast('预计完成时间必填', 'error'); return false; }
            if ((v.conclusion === '有条件可行' || v.conclusion === '不可行') && !v.risk.trim()) { showToast('该结论下风险/前置条件必填', 'error'); return false; }
            // [C7-fix H1] 工期校验：与后端 normalizeSysEffortDays/DDL CHECK 同口径——有限数、0<v≤365、
            // 0.5 整数倍；恒必填（前端先拦一道，服务端仍是权威校验，不因此省略）。与 siModalEstimate 的
            // 同款分支现已**逐字一致**（同一字段两个入口不该长得不一样）。
            const effortRaw = (v.estimated_effort_days || '').trim();
            if (effortRaw === '') { showToast('请填写工期（人日）', 'error'); return false; }
            const effortValue = Number(effortRaw);
            if (!Number.isFinite(effortValue) || effortValue <= 0 || effortValue > 365 || Math.round(effortValue * 2) !== effortValue * 2) {
                showToast('工期须为 0.5 的整数倍，且在 (0, 365] 范围内', 'error'); return false;
            }
            const body = { conclusion: v.conclusion, requirement_confirm: v.requirement_confirm.trim(), dev_estimated_at: siFromLocalInput(v.dev_estimated_at), expected_dev_estimated_at: expectedAtOpen };
            if (v.risk.trim()) body.risk = v.risk.trim();
            body.estimated_effort_days = effortValue;
            const r = await siApi('/sys-issues/' + iss.id + '/feasibility', { method: 'POST', body });
            if (!r.ok) {
                // F6：ESTIMATE_STALE 专门分支——同 siModalEstimate 同款范式（该函数定义处有完整理由注释，
                // 不重复）：故意不走 siApiErr(r)，主动关弹窗+刷新+return false 防死循环与包装层重复处理。
                if (r.data && r.data.code === 'ESTIMATE_STALE') {
                    showToast('预计完成时间已被他人更新，已刷新为最新值，请重新确认', 'error');
                    siCloseModal();
                    await siAfterAction();
                    return false;
                }
                siApiErr(r); return false;
            }
            showToast('已提交可行性评估', 'success'); return true;
        });
    }

    // ── 受理排期改造 C7 + 建单优化批 C3（方案 20260731_v1.2 §6）：编辑窗口两档扩展 ──────────────────
    //   edit_in_revision（两档白名单字段·§6.1）：镜像后端字段白名单·未知字段后端 400·空标题拦。
    //   B 档（开发中/处理中）后端剔除 needs_feasibility——前端同步隐藏该项，不提交该字段（否则触发后端
    //   EDIT_NEEDS_FEASIBILITY_LOCKED_IN_TIER_B 400，属可预期的前后端口径一致，非 bug，但体验上应提前不显示）。
    function siModalEditInRevision(iss) {
        const systems = (META && META.bizSystems) || [];
        const isChangeFlow = (iss.type === 'feature' || iss.type === 'improvement');
        // B 档按流分档（§6.1·codex C3 审 L-3）：变更流看「开发中」、bug 流看「处理中」——不用无条件 OR
        //   （虽然两态在状态机里互斥，同 or 结果一致，但按流精判更贴合后端 EDIT_TIER_B_CHANGE/EDIT_TIER_B_BUG 的语义，不依赖"两态互斥"这条隐含前提）。
        const isDevTier = isChangeFlow ? (iss.status === '开发中') : (iss.status === '处理中');
        // ⭐ codex 248 HIGH-1：存量 deadline 是纯日期，预填要补 T00:00（否则控件空着、保存即静默清空原值），
        //   但**预填 ≠ 该写回库**。保存体若无条件带上 deadline，用户只改标题、根本没碰这个字段，也会把
