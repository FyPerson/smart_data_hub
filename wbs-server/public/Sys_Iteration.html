        const submitCompleteHint = iss.type === 'feature'
            ? '仅标记<b>你本人</b>的开发项完成；全部在册开发都完成后，本单通常进入「待对接测试」（若对接人当前不可用等情形会直接跳至「待验收」，视对接人状态而定），对接测试通过后再进入「待验收」。'
            : '仅标记<b>你本人</b>的开发项完成；全部在册开发都完成后，本单才自动进入「待验收」。';
        const fields = [{ k: null, html: `<div class="u-hint" style="margin-bottom:8px">${submitCompleteHint}</div>` }, { k: null, html: modeHtml }];
        if (needGap) fields.push(fTextarea('fix_gap_note', '修复缺口说明', '', true, '必填：上一版修复缺口在哪（复盘素材，不作考核）'));
        if (needGap) fields.push(note('⚠️ 派生自 bug 的修复单首次提交需额外填写「修复缺口说明」。'));

        siModal('标记我的开发完成', fields, async v => {
            const mode = document.querySelector('input[name="si-submit-mode"]:checked').value;
            const body = { mode };
            // [工期对接测试与风险等级拆分 方案 v1.1 §3.3·C3] 提交双勾——三类型通用，必勾才能提交（服务端
            // 硬闸兜底 SELF_TESTED_REQUIRED/TEST_ENV_DEPLOYED_REQUIRED，前端先拦一道给及时反馈）。放在
            // mode 无关的最前面校验，与后端 validateSubmitBody 的检查顺序一致。
            const selfTestedChecked = !!(document.getElementById('siSubmitSelfTested') && document.getElementById('siSubmitSelfTested').checked);
            if (!selfTestedChecked) { showToast('请先勾选"已完成自测"', 'error'); return false; }
            const testEnvDeployedChecked = !!(document.getElementById('siSubmitTestEnvDeployed') && document.getElementById('siSubmitTestEnvDeployed').checked);
            if (!testEnvDeployedChecked) { showToast('请先勾选"已上测试库"', 'error'); return false; }
            body.self_tested = true;
            body.test_env_deployed = true;
            // [B4·C6] bug 产生原因——mode 无关字段（两种提交方式都必填，字段区恒显不随 mode 隐藏，见上方
            //   modeHtml）。校验口径与后端 validateSubmitBody 逐字对齐（trim 后非空 + Unicode 码点数 ≤500）；
            //   非 bug 单不渲染该字段、body 不带该键——带了会撞后端 BUG_CAUSE_NOT_APPLICABLE 400（适用面闸
            //   与本字段的"传了就报错"对称，同 fix_gap_note/effort 等既有字段的"不适用不传"惯例）。
            if (iss.type === 'bug') {
                const bugCauseNote = (document.getElementById('siSubmitBugCauseNote') && document.getElementById('siSubmitBugCauseNote').value || '').trim();
                if (!bugCauseNote) { showToast('请填写 bug 产生原因', 'error'); return false; }
                if ([...bugCauseNote].length > 500) { showToast('bug 产生原因不能超过 500 字', 'error'); return false; }
                body.bug_cause_note = bugCauseNote;
            }
            if (needGap) {
                const gap = (v.fix_gap_note || '').trim();
                if (!gap) { showToast('修复缺口说明必填', 'error'); return false; }
                body.fix_gap_note = gap;
            }
            if (mode === 'no_code') {
                const reason = (document.getElementById('siSubmitNoCodeReason').value || '').trim();
                if (!reason || reason.length > 500) { showToast('无代码交付原因必填（trim 1~500字）', 'error'); return false; }
                body.no_code_reason = reason;
            } else {
                // commit 记录改造（2026-07-19）：前端组/后端组两固定分组，组固定 component、组内多行。
                //   收集两组所有非空行 → commits 数组（后端天然支持多行，同 component 去重限制已一并从前后端删除，
                //   仅保留后端自然键查重防「同实例+component+ref」完全重复行）。空白行静默跳过。
                const commits = [];
                // [C11·§10.3] 只遍历本单实际渲染的分组（命中单组系统=['backend']·非命中=['frontend','backend']）。
                //   单组系统提交的 component=backend，与后端 allowed_components / 服务端强制归一一致（服务端仍会兜底归一）。
                for (const component of submitGroups) {
                    const inputs = document.querySelectorAll('#siSubmitRows-' + component + ' .si-commit-row input[type="text"]');
                    for (const inp of inputs) {
                        const ref = (inp.value || '').trim();
                        if (!ref) continue;   // 空白行静默跳过（不强制填满所有行）
                        if (ref.length > 200) { showToast('commit_ref 不能超过 200 字', 'error'); return false; }
                        commits.push({ component, commit_ref: ref });
                    }
                }
                // 「至少一行」约束延续到分组模型：至少一条有效数据才允许提交（用户 2026-07-19 补充）。
                if (!commits.length) { showToast(submitSingleGroup ? `请至少填写 1 条「${submitGroupLabel}」` : '请在前端组或后端组至少填写 1 条 commit 记录', 'error'); return false; }
                body.commits = commits;
            }
            // P4 工作说明（选填·两模式均可）：trim 后 ≤1000 字（Unicode 码点计·与后端 validateSubmitBody 一致）；
            //   空白不拼字段（后端 undefined→落 null）。仅有值时加入 body。
            const workNote = (document.getElementById('siSubmitWorkNote') && document.getElementById('siSubmitWorkNote').value || '').trim();
            if ([...workNote].length > 1000) { showToast('工作说明不能超过 1000 字', 'error'); return false; }
            if (workNote) body.work_note = workNote;
            const r = await siApi('/sys-issues/' + iss.id + '/submit', { method: 'POST', body });
            if (!r.ok) {
                if (r.status === 409) {
                    // 409（重复提交/状态已变）：按钮已在 siModal 通用框架内点击即禁用，此处额外关弹窗 + 重拉
                    // 详情，让用户按本人最新 dev_status 看到真实已提交态，不停留在过期表单里重复尝试。
                    siApiErr(r, '提交状态已变化，已为你刷新最新数据');
                    siCloseModal();
                    await siAfterAction();
                } else {
                    siApiErr(r);
                }
                return false;
            }
            const toMain = r.data && r.data.main_status;
            // P2（务实简化·无暂存批次）：submit 成功后，若选了佐证附件则顺带上传为 delivery（复用现有 POST /attachments·
            //   即时落 active）。弱一致：附件上传失败不回滚已成功的 submit（单人手动·概率极低），仅 toast 提示可去附件区重传。
            const submitFiles = siPickerFiles('submit-delivery');
            let attMsg = '';
            if (submitFiles.length) {
                const fd = new FormData();
                fd.append('attachment_type', 'delivery');
                for (const f of submitFiles) fd.append('files', f);
                const ar = await siApi('/sys-issues/' + iss.id + '/attachments', { method: 'POST', body: fd, isForm: true });
                if (ar.ok) { siPickerReset('submit-delivery'); attMsg = '，附件已上传'; }
                else { attMsg = '，但附件上传失败（可到附件区重传）'; }
            }
            showToast((toMain === '待验证' ? '已标记完成，全部开发完成 → 转「待验收」'
                : (toMain === '待对接测试' ? '已标记完成，全部开发完成 → 转「待对接测试」（对接人测试通过后进入待验收）'
                : '已标记你的开发完成（等待其他开发完成）')) + attMsg, submitFiles.length && attMsg.includes('失败') ? 'info' : 'success');
            return true;
        });
        // commit 记录改造：siModal 已同步渲染 modeHtml（含分组容器），此处按 siSubmitRowState 铺初始行。
        //   [C11] 按实际分组铺行（命中单组系统只有 backend 一组）。
        for (const g of submitGroups) siRenderSubmitRows(g);
    }
    // 提交方式切换：commits/no_code 两块显隐互斥
    function siSubmitModeChanged() {
        const checked = document.querySelector('input[name="si-submit-mode"]:checked');
        const mode = checked ? checked.value : 'commits';
        const cBox = document.getElementById('siSubmitCommitsBox');
        const nBox = document.getElementById('siSubmitNoCodeBox');
        if (cBox) cBox.style.display = mode === 'commits' ? '' : 'none';
        if (nBox) nBox.style.display = mode === 'no_code' ? '' : 'none';
    }
    // commit 行编辑器（commit 记录改造 2026-07-19）：前端组/后端组两固定分组，组固定 component（无下拉），
    //   组内动态加/删行。每组容器 #siSubmitRows-<component>，行内仅一个 commit_ref 输入 + 删除；组内至少留 1 行
    //   （删到只剩 1 行时删除按钮隐藏，避免整组清空后无入口再加行；真实「至少 1 条」由提交时业务校验兜底）。
    // 软提示（不拦截）：前端组填了像 SVN 版本号（纯数字 / r 数字）→ 提示「前端组通常填 GIT commit」；
    //   后端组填了像 GIT commit（7~40 位纯 hex）→ 提示「后端组通常填 SVN 版本号」。分寸=宽松，只对「明显填反」
    //   的强特征提示，不误伤分支名/tag/短哈希/带前缀的特殊引用（故 GIT 特征取 ≥7 位纯 hex，SVN 特征取纯数字/r数字）。
    //   ⭐ S4（GIT/SVN 口径对调，2026-08-04 用户拍板）：正确口径改为「前端组填 GIT commit，后端组填
    //   SVN 版本号」，此前全反了。SI_GIT_HASH_RE / SI_SVN_REV_RE 两个正则定义本身不变（GIT hash 与
    //   SVN rev 的形态特征没变），改的是它们应用到哪一组——见下方 siCommitWarnFor。
    const SI_GIT_HASH_RE = /^[0-9a-fA-F]{7,40}$/;     // GIT commit：7~40 位十六进制
    const SI_SVN_REV_RE = /^r?\d+$/;                  // SVN 版本号：纯数字 或 r 前缀数字（如 12345 / r12345）
    // codex LOW（2026-07-19）：纯数字也属于 hex，会同时匹配两个正则——合法的 7 位以上 SVN 版本号（如 1234567）
    //   若不排除 SVN 特征会被误报「看起来像 GIT」。GIT 判定必须排除 SVN 特征（纯数字/r数字），宁可漏掉
    //   纯数字 GIT 哈希（罕见），也不误伤正确填入的 SVN 版本号——契合「只提示明显填反」口径。
    //   ⭐ S4：GIT **误填**判定现在挂在**后端组**——对调后后端组应填 SVN，所以是在后端组检测"是否误填
    //   了像 GIT 的值"（不是"后端该填 GIT"）。排除子句跟着 GIT 判定一起从 frontend 分支移到 backend
    //   分支——否则正确填写的 7 位以上纯数字 SVN 版本号会被误报「看起来像 GIT」。
    function siCommitWarnFor(component, ref) {
        const v = (ref || '').trim();
        if (!v) return '';
        if (component === 'frontend' && SI_SVN_REV_RE.test(v)) return '这看起来像 SVN 版本号；前端组通常填 GIT commit（不影响提交）';
        if (component === 'backend' && SI_GIT_HASH_RE.test(v) && !SI_SVN_REV_RE.test(v)) return '这看起来像 GIT commit；后端组通常填 SVN 版本号（不影响提交）';
        return '';
    }
    // 组内行渲染：为每组按当前行数渲染输入行 + 软提示位；idempotent，按 rows 状态数组重建 DOM。
    let siSubmitRowState = { frontend: [''], backend: [] };   // 每组的行文本快照（打开弹窗时重置，见 siModalSubmit）
    function siRenderSubmitRows(component) {
        const box = document.getElementById('siSubmitRows-' + component);
        if (!box) return;
        const rows = siSubmitRowState[component];
        const placeholder = component === 'frontend' ? 'GIT commit（1~200字）' : 'SVN 版本号（1~200字）';
        box.innerHTML = rows.map((val, i) => {
            const warn = siCommitWarnFor(component, val);
            const delBtn = rows.length > 1 ? `<span class="si-commit-row-del" onclick="siSubmitRemoveRow('${component}',${i})">删除</span>` : '';
            return `<div class="si-commit-row">
                        <input type="text" value="${esc(val)}" placeholder="${placeholder}" oninput="siSubmitRowInput('${component}',${i},this.value)">
                        ${delBtn}
                    </div>${warn ? `<div class="si-commit-warn">${esc(warn)}</div>` : ''}`;
        }).join('');
    }
    // 输入回调：更新状态快照 + 仅在软提示态变化时重渲染（避免每次按键重建 DOM 丢焦点）。
    function siSubmitRowInput(component, idx, value) {
        siSubmitRowState[component][idx] = value;
        const box = document.getElementById('siSubmitRows-' + component);
        if (!box) return;
        const rowEls = box.querySelectorAll('.si-commit-row');
        if (!rowEls[idx]) return;
        // 软提示紧跟在该行 .si-commit-row 之后（若存在）——按需增删该单个提示节点，不整组重渲染（保住输入焦点）。
        const nextEl = rowEls[idx].nextElementSibling;
        const existingWarn = (nextEl && nextEl.classList.contains('si-commit-warn')) ? nextEl : null;
        const warnText = siCommitWarnFor(component, value);
        if (warnText) {
            if (existingWarn) { existingWarn.textContent = warnText; }
            else { const d = document.createElement('div'); d.className = 'si-commit-warn'; d.textContent = warnText; rowEls[idx].insertAdjacentElement('afterend', d); }
        } else if (existingWarn) {
            existingWarn.remove();
        }
    }
    function siSubmitAddRow(component) {
        siSubmitRowState[component].push('');
        siRenderSubmitRows(component);
    }
    function siSubmitRemoveRow(component, idx) {
        if (siSubmitRowState[component].length <= 1) return;   // 组内至少留 1 行
        siSubmitRowState[component].splice(idx, 1);
        siRenderSubmitRows(component);
    }

    // C7：commit 行内编辑三入口（canEditCommits 管既有行 PUT/DELETE；canAddCommit 独立判定管补充 POST）。
    function siModalAddCommit() {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        // [C11·§10.3] 命中单组系统：不出组件下拉，component 固定 backend（服务端仍会兜底归一）；commit_ref 标签用 group_label。
        const single = !!(iss && iss.single_commit_group);
        const groupLabel = (iss && iss.group_label) || '版本号';
        const fields = single
            ? [fText('commit_ref', groupLabel + '（SVN·trim 1~200 字）', '', true, '')]
            : [fSelectMap('component', '组件', ['frontend', 'backend'], 'frontend', SI_COMMIT_COMPONENT_LABEL),
               fText('commit_ref', 'commit_ref（前端 GIT / 后端 SVN）','', true, 'trim 后 1~200 字')];
        siModal(single ? ('补充' + groupLabel) : '补充 commit', fields, async v => {
            const ref = (v.commit_ref || '').trim();
            if (!ref || ref.length > 200) { showToast('commit_ref 必填（trim 1~200字）', 'error'); return false; }
            const component = single ? 'backend' : v.component;
            const r = await siApi('/sys-issues/' + iss.id + '/dev/commits', { method: 'POST', body: { component, commit_ref: ref } });
            if (!r.ok) { siCommitApiErr(r); return false; }
            showToast('已补充', 'success'); return true;
        });
    }
    function siModalEditCommit(commitId) {
        const iss = siDetail && siDetail.issue;
        const row = siDetail && (siDetail.dev_commits || []).find(c => c.id === commitId);
        if (!iss || !row) return;
        // [C11·§10.3] 命中单组系统：不出组件下拉，component 固定 backend（含把历史 frontend 行归一为 backend，服务端兜底）。
        const single = !!(iss && iss.single_commit_group);
        const groupLabel = (iss && iss.group_label) || '版本号';
        const fields = single
            ? [fText('commit_ref', groupLabel + '（SVN·trim 1~200 字）', row.commit_ref, true, '')]
            : [fSelectMap('component', '组件', ['frontend', 'backend'], row.component, SI_COMMIT_COMPONENT_LABEL),
               fText('commit_ref', 'commit_ref（前端 GIT / 后端 SVN）',row.commit_ref, true, 'trim 后 1~200 字')];
        siModal(single ? ('编辑' + groupLabel) : '编辑 commit', fields, async v => {
            const ref = (v.commit_ref || '').trim();
            if (!ref || ref.length > 200) { showToast('commit_ref 必填（trim 1~200字）', 'error'); return false; }
            const component = single ? 'backend' : v.component;
            const r = await siApi('/sys-issues/' + iss.id + '/dev/commits/' + commitId, { method: 'PUT', body: { component, commit_ref: ref } });
            if (!r.ok) { siCommitApiErr(r); return false; }
            showToast('已更新', 'success'); return true;
        });
    }
    function siModalDeleteCommit(commitId) {
        const iss = siDetail && siDetail.issue;
        if (!iss) return;
        siModal('删除 commit', [
            fTextarea('reason', '删除原因', '', true, '必填：trim 1..200'),
            note('⚠️ 若该行所属实例为「已提交」（code_submitted），删除后该实例须仍保留至少 1 条 commit，否则会被拒绝。')
        ], async v => {
            const reason = (v.reason || '').trim();
            if (!reason || reason.length > 200) { showToast('删除原因必填（trim 1~200字）', 'error'); return false; }
            const r = await siApi('/sys-issues/' + iss.id + '/dev/commits/' + commitId, { method: 'DELETE', body: { reason } });
            if (!r.ok) { siCommitApiErr(r); return false; }
            showToast('已删除', 'success'); return true;
        });
    }

    // C7：成员管理入口——chip 级开脱/恢复（协调人）。二者是与 reassign 正交的业务动作（reason 留痕的具名
    // 状态转移，非"加/减名单"），不并入 siModalReassign（详见完成报告"取舍说明"）。
    function siModalExcuseMember(assigneeId) {
        const iss = siDetail && siDetail.issue;
        const d = siDetail && (siDetail.dev_assignees || []).find(x => x.id === assigneeId);
        if (!iss || !d) return;
        siModal('开脱开发（' + (d.user_name || ('#' + d.user_id)) + '）', [
            fTextarea('reason', '开脱原因', '', true, '必填：trim 1..200'),
            note('开脱后该成员本次不再参与本单开发完成态统计；如需恢复请用 chip 上的「恢复」（supersede-excuse）。')
        ], async v => {
            const reason = (v.reason || '').trim();
            if (!reason || reason.length > 200) { showToast('开脱原因必填（trim 1~200字）', 'error'); return false; }
            const r = await siApi('/sys-issues/' + iss.id + '/dev-assignees/' + assigneeId + '/excuse', { method: 'POST', body: { reason } });
            if (!r.ok) { siApiErr(r); return false; }
            showToast('已开脱', 'success'); return true;
        });
    }
    function siModalSupersedeExcuse(assigneeId) {
        const iss = siDetail && siDetail.issue;
        const d = siDetail && (siDetail.dev_assignees || []).find(x => x.id === assigneeId);
        if (!iss || !d) return;
        // 契约澄清（对齐后端实际实现，非任务书字面"新人选择"）：supersede-excuse body 仅 reason，后端固定
        // 为同一 user_id 生成新的 pending 实例（方案 §4.2 步骤4：INSERT 新行复制旧实例 issue_id+user_id）——
        // "换成另一个人"不是本端点语义，那属于 reassign（移除该 excused 成员 + 加入新成员）。
        siModal('恢复开脱（' + (d.user_name || ('#' + d.user_id)) + '）', [
            fTextarea('reason', '恢复原因', '', true, '必填：trim 1..200'),
            note('恢复后该成员生成新的在册实例（pending），沿用原开发本人，重新参与完成态统计。若要换成另一个人，请用「管理开发成员」。')
        ], async v => {
            const reason = (v.reason || '').trim();
            if (!reason || reason.length > 200) { showToast('恢复原因必填（trim 1~200字）', 'error'); return false; }
            const r = await siApi('/sys-issues/' + iss.id + '/dev-assignees/' + assigneeId + '/supersede-excuse', { method: 'POST', body: { reason } });
            if (!r.ok) { siApiErr(r); return false; }
            showToast('已恢复', 'success'); return true;
        });
    }

    // C-orch 清理：siModalSetReleaseFlag（填发版信息）已删除——其唯一调用方 siDoAction case 'set_release_flag'
    //   已随 v1.6 [C-1] 退场移除，且对应后端端点 POST /:id/set-release-flag 现对 bug 恒 409
    //   LEGACY_RELEASE_FLOW_DISABLED、对 feature/improvement 因 findTransition 恒 null 而 409
    //   SET_RELEASE_FLAG_STATUS_INVALID——该端点对所有 type 均已无生效路径，纯死代码（task §5 清理要求）。

    // 上线体统一重构 C3 第2批（方案 §6.7 两阶段语义）：⑤⑥⑦ 三处均围绕同一个过时假设——旧文案把
    //   hotfix-publish 说成"一步发布并通知需求方"，但 C3 收窄后它只完成①"建应急上线单 + 加单 + 安排值班
    //   开发"，真正翻「已上线」要等被通知的值班开发调用 /execute（两阶段）。标题/note/toast 三处同步改写为
    //   "返回即已安排"口径；术语按方案 §6.7 标题「应急通道」+ 建单人语境统一为「应急上线」（原「单条上线
    //   （hotfix）」易与「批次发布」混淆，且"hotfix"内部黑话不该露在按钮上）。
    // 应急上线（hotfix-publish，C5 重写方案 §4.5 第1条·登记清单②）：两步——①填上线说明 ②选执行人（复用
    //   选人弹窗组件，releaseId 传 null——hotfix 尚未建批次，候选端点按当日排班取默认值）。C2b 起本端点
    //   内部不再自动定人/自动发通知，通知整体移出，建完批次后到批次详情逐人发送。
    function siModalHotfix(iss) {
        siModal('应急上线（第 1 步·上线说明）', [
            fTextarea('release_note', '上线说明', '', true, '必填，≤1000'),
            fText('version_tag', '版本号（选填）', '', false, '选填，≤100'),
            note('⚠️ 闸门③：应急上线需填说明（版本号选填，C6 已去必填）。下一步选择执行人后建应急上线单——'
                + '发布仍由值班开发本人确认执行，非本次操作直接完成。批量/非应急上线请用「上线单管理」。')
        ], async v => {
            const releaseNote = v.release_note.trim();
            if (!releaseNote) { showToast('上线说明必填', 'error'); return false; }
            const versionTag = v.version_tag.trim();
            // C5 预筛 MED-1+L3：先 await 取候选清单，再关第 1 步弹窗——若先关弹窗再取，请求失败时用户刚填
            // 的说明/版本号就白丢了，还要重填一遍。取失败：toast 提示 + return false（siModal 既有约定：
            // onConfirm 返回 false 不关弹窗，字段值原样保留）。
            const cr = await siApi('/sys-releases/executor-candidates');
            if (!cr.ok) { siApiErr(cr, '加载执行人候选清单失败'); return false; }
            siCloseModal();
            // 栈外（setTimeout 0）打开选人弹窗——避开 siModal 包装器的收尾动作：本次 siModal() 调用的
            // onConfirm resolve 后，包装器会**同步**把确认按钮 `btn.disabled = false` 复位；若在同一轮
            // 事件循环里立刻同步打开下一个 siModal()（选人弹窗），两次调用共享同一个 #siMConfirm 元素，
            // 新弹窗里 siExecPickerUpdateHint() 刚设好的"人数不足置灰"状态会被旧调用收尾时那行复位覆盖
            // 掉。setTimeout(...,0) 把"打开下一个弹窗"推到下一个宏任务，等旧调用栈（含那行复位）跑完。
            setTimeout(() => {
                siExecutorPickerRender(cr.data || {}, async (ids) => {
                    const r = await siApi('/sys-issues/' + iss.id + '/hotfix-publish', { method: 'POST', body: { release_note: releaseNote, version_tag: versionTag, executors: ids } });
                    // C3 第2批任务C：409（已发布、混用应急口等）后端 error 已是完整可读文案，siApiErr 直出即可。
                    if (!r.ok) { siApiErr(r); return false; }
                    const d = r.data || {};
                    if (d.idempotent) {
                        // idempotent 分支（后端：某行 sending/sent）没有 hint 字段，本地给一句通用文案即可。
                        showToast('该单已在应急上线单 ' + (d.release_no || ('#' + d.release_id)) + ' 中，通知已在处理中，无需重复发起', 'warning');
                    } else if (d.hint) {
                        // C2b 裁定项①后果（登记清单③）：hint 分支直用后端文案（子表聚合语义算出的提示，如"请
                        // 到批次详情逐人发通知"），不再本地拼"安排上线重新发送"这类恒错误指引的旧话术。
                        showToast(d.hint, 'warning');
                    } else if (d.created_new) {
                        // C2b：通知整体移出本端点，首次调用只落执行人子表，不发任何通知（无"全部发送"这回事）。
                        showToast('已建应急上线单 ' + (d.release_no || '') + '，请到批次详情逐人发送通知', 'success');
                    } else {
                        showToast('已处理，请到「上线单管理」查看', 'warning');
                    }
                    siCloseModal();
                    await siLoadList();
                    if (d.release_id) siGotoBatchDetail(d.release_id);
                    return false;
                });
            }, 0);
            return false;
        });
    }

    function siModalDerive(iss) {
        const typeOpts = siTypeKeys();
        // ⑤ §4/M5：从 bug 单派生时新单默认 bug（前端预选，后端 origin=bug 时亦兜底默认）；派生原因仅 bug 语境必填（Q1）
        const originIsBug = iss.type === 'bug';
        const defType = (originIsBug && typeOpts.includes('bug')) ? 'bug' : (typeOpts[0] || 'feature');
        const reasonRequired = originIsBug;
        siModal('派生迭代（基于本单新建）', [
            fSelectMap('type', '新单类型', typeOpts, defType, SI_TYPE_LABEL),
            fText('title', '新单标题', iss.title + '（迭代）', true),
            fSelectMap('system_name', '所属系统', (META && META.bizSystems) || [], iss.system_name, null),
            fSelect('source', '来源', ['业务方', '内部', '生产故障'], iss.source || '业务方'),
            fText('module_name', '模块（选填）', iss.module_name || ''),
            // ⑤ Q2：derive_reason 取代旧 derive_note（既落新单 derive_reason 列、又作 derive 时间线说明）
            fTextarea('derive_reason', reasonRequired ? '派生原因' : '派生原因（选填）', '', reasonRequired,
                reasonRequired ? '必填：为什么上线后又派生（复盘素材，不作考核）' : '选填：为什么在原单基础上迭代')
        ], async v => {
            if (!v.title.trim()) { showToast('标题必填', 'error'); return false; }
            if (reasonRequired && !v.derive_reason.trim()) { showToast('派生自 bug 的单需填写派生原因', 'error'); return false; }
            const body = { type: v.type, title: v.title.trim(), system_name: v.system_name, source: v.source };
            if (v.module_name.trim()) body.module_name = v.module_name.trim();
            if (v.derive_reason.trim()) body.derive_reason = v.derive_reason.trim();
            const r = await siApi('/sys-issues/' + iss.id + '/derive', { method: 'POST', body });
            if (!r.ok) { siApiErr(r); return false; }
            showToast('已派生新单 #' + (r.data && r.data.id), 'success');
            if (r.data && r.data.id) { siCloseModal(); await siLoadList(); siOpenDrawer(r.data.id); return false; }
            return true;
        });

    //   受理门焊死为全类型必经后，「建单即指派开发」「建单即指定通知对接人」两条路径在后端已被

    // 建单表单的 type 联动显隐（无框架响应式绑定，手动挂 onchange + 首次渲染后立即校正一次）。
    //   ⚠️ 原名 siToggleCreateAssignMode——assign 区移除后本函数只剩 needs_feasibility 一项职责，随之改名，
    //     免得留一个名不副实的函数误导后来者（调用点：本文件 f_type.onchange + 弹窗渲染后首次校正）。
    function siToggleCreateTypeFields() {
        const typeSel = document.getElementById('f_type');
        if (!typeSel) return;
        // config-hide（§211 收尾）：needs_feasibility 仅 feature/improvement 适用 → bug/config 隐藏勾选框。
        //   后端建单已 400 FEASIBILITY_NOT_APPLICABLE 拒非变更类；此处消前端死勾坑 + 隐藏时清勾（防 feature 勾选后切 bug 的 stale 勾选提交致 400）。
        const nfChk = document.getElementById('f_needs_feasibility');
        if (nfChk) {
            const showNf = ['feature', 'improvement'].includes(typeSel.value);
            const nfWrap = nfChk.closest('.u-form-group');
            if (nfWrap) nfWrap.style.display = showNf ? '' : 'none';
            if (!showNf) nfChk.checked = false;
        }

    // 建单优化批 C3b（方案 20260801_v1.3 §6c 设计点3）：「本单无需 OA 号」勾选框默认状态联动——
    //   需求方三字段（部门/姓名/电话）全空 → 默认勾选；任一非空 → 默认不勾；用户手动点过勾选框后
    //   （change 事件）联动即停止覆盖（"联动只设初始/未触碰态"，不是持续同步）。
    function siWireOaExemptLinkage() {
        const chk = document.getElementById('f_oa_exempt');
        const deptEl = document.getElementById('f_requester_dept');
        const nameEl = document.getElementById('f_requester_name');
        const phoneEl = document.getElementById('f_requester_phone');
        if (!chk) return;
        let touched = false;
        chk.addEventListener('change', () => { touched = true; });
        const typeEl = document.getElementById('f_type');
        const syncDefault = () => {
            if (touched) return;
            // [OA 豁免默认·improvement 覆盖联动·2026-08-10 用户拍板（#20 触发）] 优化类单默认勾选「本单
            //   无需 OA 号」，需求方三字段是否填写不再取消勾——生产实证 8 张 improvement 里 7 张豁免；
            //   唯一反例 #19（走了 OA 立项的优化）靠建单人手动取消勾（touched 后联动即停，机制不变）。
            //   两条已知代价（拍板时如实摆过）：①反例型单漏取消勾 → 详情显示「无需 OA」且无补号琥珀提醒
            //   （兜底=admin 补号入口不因豁免隐藏 :3575 + 后端号与豁免正交放行）②exempt=1 不再恒等于
            //   「主动声明」（默认勾与主动勾在数据上不可分）。bug/feature 维持原三字段联动。
            if (typeEl && typeEl.value === 'improvement') { chk.checked = true; return; }
            // codex 219 L-1：deptEl.value 补 .trim()，与 name/phone 口径统一（select 空占位项值本恒为
            // ''，此处统一处理只为消除三字段判空逻辑的形式不一致，非修复已知可复现 bug）。
            const allEmpty = !(deptEl && deptEl.value.trim()) && !(nameEl && nameEl.value.trim()) && !(phoneEl && phoneEl.value.trim());
            chk.checked = allEmpty;
        };
        if (deptEl) deptEl.addEventListener('change', syncDefault);
        if (nameEl) nameEl.addEventListener('input', syncDefault);
        if (phoneEl) phoneEl.addEventListener('input', syncDefault);
        // type 切换也要重算默认（addEventListener 与既有 onchange=siToggleCreateTypeFields 属性赋值共存，
        //   互不覆盖）——improvement↔其他类型来回切换时，未触碰态下勾选默认随之切换。
        if (typeEl) typeEl.addEventListener('change', syncDefault);
        syncDefault();   // 弹窗打开时按当前 type 与需求方三字段（恒空）定初始态
    }

    async function siDownloadAtt(issueId, attId) {

        // E：文件名优先取已加载详情里的 original_name（权威、无需解析 Content-Disposition，中文名不丢）
        let name = '';
        if (siDetail && Array.isArray(siDetail.attachments)) {
            const att = siDetail.attachments.find(a => String(a.id) === String(attId));   // ML-1：id 类型强制，数字/字符串都命中权威文件名
            if (att) name = att.original_name || att.file_name || '';
        }
        if (!name) {
            // 兜底：优先解析 RFC5987 的 filename*=UTF-8''（中文名走这条），再回退 filename="..."
            const dispo = res.headers.get('Content-Disposition') || '';
            let m = /filename\*=(?:UTF-8'')?([^;\r\n]+)/i.exec(dispo);
            if (m) { try { name = decodeURIComponent(m[1].trim().replace(/^["']|["']$/g, '')); } catch (e) { name = m[1]; } }
            else { m = /filename="?([^";\r\n]+)"?/i.exec(dispo); if (m) name = m[1]; }
        }
        if (!name) name = 'attachment';
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

        // 上线体统一重构 C2b 第2批（用户 2026-07-29 实测后提出）：区间批量设置——接后端 POST /sys-duty-roster-batch，
        //   逐日复用单日「软删旧行+插新行」调班语义、同一事务内跑完整区间（全成或全不成，见后端端点注释）。

        // 区间合并展示（2026-07-30 用户提出）：按月/长区间排班时逐日一行可读性差——「连续日期 + 同一值班人」

    // 连续同人合并分组（纯展示层）：输入 GET /sys-duty-roster 的 items（唯一活跃值班保证每天 ≤1 行），
    //   输出区间段数组。断段条件=值班人变化 或 日期不连续；备注差异**不**断段（段行提示"N 种"，展开逐日可见）。
    //   日期 +1 天用 UTC 数值运算（duty_date 经后端 CHECK date(x,'+0 days') 归一化，恒 YYYY-MM-DD）。
    function siGroupDutyRuns(items) {
        const sorted = [...items].sort((a, b) => (a.duty_date < b.duty_date ? -1 : a.duty_date > b.duty_date ? 1 : 0));
        const nextDay = (s) => {
            const [y, m, d] = s.split('-').map(Number);
            const t = new Date(Date.UTC(y, m - 1, d + 1));
            return `${t.getUTCFullYear()}-${String(t.getUTCMonth() + 1).padStart(2, '0')}-${String(t.getUTCDate()).padStart(2, '0')}`;
        };
        const runs = [];
        for (const it of sorted) {
            const cur = runs[runs.length - 1];
            if (cur && Number(cur.user_id) === Number(it.user_id) && nextDay(cur.to) === it.duty_date) {
                cur.to = it.duty_date; cur.days++; cur.items.push(it);
                if (it.note && !cur.notes.includes(it.note)) cur.notes.push(it.note);
            } else {
                runs.push({ from: it.duty_date, to: it.duty_date, days: 1, user_id: it.user_id, user_name: it.user_name, notes: it.note ? [it.note] : [], items: [it] });
            }
        }
        return runs;
    }
    function siToggleDutyRun(ri) {
        const subs = document.querySelectorAll(`.si-duty-sub-${ri}`);
        const arrow = document.getElementById(`siDutyRunArrow${ri}`);
        const show = subs.length && subs[0].style.display === 'none';
        subs.forEach(el => { el.style.display = show ? '' : 'none'; });
        if (arrow) arrow.textContent = show ? '▾' : '▸';
    }

    async function siDutyRosterRefresh() {
        const from = document.getElementById('siDutyFrom').value;
        const to = document.getElementById('siDutyTo').value;
        if (!from || !to) { showToast('请选择完整区间', 'error'); return; }
        // LOW-1（codex 198 审采纳）：前端本地先校验区间，给明确提示 + 不发请求；后端同款校验保留不动、仍是权威
        // （本地校验只是省一次往返，绝不能替代后端——两处判据须保持一致，diffDays 算法同后端 GET 端点）。
        if (to < from) { showToast('结束日期不能早于开始日期', 'error'); return; }
        const [fy, fm, fd] = from.split('-').map(Number);
        const [ty, tm, td] = to.split('-').map(Number);
        const diffDays = Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(fy, fm - 1, fd)) / 86400000);
        if (diffDays > 365) { showToast('区间最长 366 天', 'error'); return; }   // 与后端 GET 上限同步（2026-07-30 自 93 天放宽）
        await siLoadDutyRoster(from, to);
    }

    // C2b 第2批：单日表单 + 批量表单共用同一份候选人缓存/过滤逻辑——两个 select 若存在都填充，任一不存在的
    //   （对应表单未渲染，如只读预览态）安全跳过（无 DOM 时直接 no-op）。
    async function siPopulateDutyUserSelects() {
        const selNew = document.getElementById('siDutyNewUser');
        const selBatch = document.getElementById('siDutyBatchUser');
        if (!selNew && !selBatch) return;
        if (!siDutyRosterUsersCache) {
            const r = await siApi('/users/active');
            siDutyRosterUsersCache = (r.ok && Array.isArray(r.data)) ? r.data : [];
        }
        // 前端过滤 role∈(admin,viewer)——提升可用性（不让对接人选到必然被后端资格闸 400 的目标），
        // 真闸仍在后端 POST /sys-duty-roster(-batch) 资格闸（实时读库，不信这层前端过滤）。
        const eligible = siDutyRosterUsersCache.filter(u => u.role !== 'admin' && u.role !== 'viewer');
        const optsHtml = eligible.length
            ? eligible.map(u => `<option value="${u.id}">${esc(u.display_name || u.username)}</option>`).join('')
            : '<option value="">（无可选人员）</option>';
        if (selNew) selNew.innerHTML = optsHtml;
        if (selBatch) selBatch.innerHTML = optsHtml;
    }

    async function siSubmitDutyRoster() {
        const dutyDate = document.getElementById('siDutyNewDate').value;
        const userId = Number(document.getElementById('siDutyNewUser').value);
        const note = document.getElementById('siDutyNewNote').value;
        if (!dutyDate) { showToast('请选择排班日期', 'error'); return; }
        if (!userId) { showToast('请选择值班人', 'error'); return; }
        const r = await siApi('/sys-duty-roster', { method: 'POST', body: { duty_date: dutyDate, user_id: userId, note: note || undefined } });
        if (!r.ok) { siApiErr(r, '排班失败'); return; }
        showToast(r.data.replaced ? `已调班（原值班人：${r.data.replaced}）` : '排班成功', 'success');
        await siLoadDutyRoster(document.getElementById('siDutyFrom').value, document.getElementById('siDutyTo').value);
    }

    // 区间批量设置（POST /sys-duty-roster-batch，C2b 第2批）：本地先校验区间（from≤to + ≤62 天），
    //   给明确提示 + 不发请求；后端同款校验保留、仍是权威（本地校验只省一次往返，diffDays 算法同既有
    //   siDutyRosterRefresh 写法，Date.UTC 基准防时区/DST 误差）。
    async function siSubmitDutyRosterBatch() {
        const from = document.getElementById('siDutyBatchFrom').value;
        const to = document.getElementById('siDutyBatchTo').value;
        const userId = Number(document.getElementById('siDutyBatchUser').value);
        const note = document.getElementById('siDutyBatchNote').value;
        if (!from || !to) { showToast('请选择完整批量区间', 'error'); return; }
        if (to < from) { showToast('结束日期不能早于开始日期', 'error'); return; }
        const [fy, fm, fd] = from.split('-').map(Number);
        const [ty, tm, td] = to.split('-').map(Number);
        const diffDays = Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(fy, fm - 1, fd)) / 86400000);
        // codex 200 审 LOW-2：非标准日期串会让 Date.UTC 产出 NaN——后端权威校验仍在，这里只为提示一致
        if (!Number.isFinite(diffDays) || diffDays < 0) { showToast('日期无效或结束日早于开始日', 'error'); return; }
        if (diffDays > 61) { showToast('批量设置区间最长 62 天', 'error'); return; }
        if (!userId) { showToast('请选择值班人', 'error'); return; }
        if (!confirm(`确认将 ${from} ~ ${to}（共 ${diffDays + 1} 天）全部设为该值班人？已有排班将被调班覆盖。`)) return;
        const r = await siApi('/sys-duty-roster-batch', { method: 'POST', body: { date_from: from, date_to: to, user_id: userId, note: note || undefined } });
        if (!r.ok) { siApiErr(r, '批量设置失败'); return; }
        const replacedCount = ((r.data && r.data.items) || []).filter(it => it.replaced).length;
        showToast(`批量设置成功，共 ${(r.data && r.data.count) || 0} 天${replacedCount ? '（含 ' + replacedCount + ' 天调班覆盖）' : ''}`, 'success');
        await siLoadDutyRoster(document.getElementById('siDutyFrom').value, document.getElementById('siDutyTo').value);
    }

    async function siRemoveDutyRoster(id) {
        if (!confirm('确认移除该排班？')) return;
        const r = await siApi(`/sys-duty-roster/${id}`, { method: 'DELETE' });
        if (!r.ok) { siApiErr(r, '移除失败'); return; }
        showToast('已移除', 'success');
        await siLoadDutyRoster(document.getElementById('siDutyFrom').value, document.getElementById('siDutyTo').value);
    }

    // ============================================================
    // [已退场 2026-07-30·用户裁定] C-orch 上线编排批量面板（siOpenReleaseOrch / siRenderReleaseOrchPanel /

    async function siRenderBatchList() {
        // [C9 前端块·codex 206 审 MED-4] 接入 siAuditGen（同 siOpenBatchDetail 处注释，这是它的对称
        // 视图——"从详情返回列表"同样是进入一个新视图，必须同样 +1，否则详情侧一条晚到的旧响应仍会
        // 通过令牌比对，把刚返回的列表覆盖掉，同 siBackToDeleteAuditList 处已有的先例道理）。
        siAuditGen++;
        const myGen = siAuditGen;
        document.getElementById('siBatchHead').textContent = '上线单管理';
        document.getElementById('siBatchBody').innerHTML = '<div class="si-empty">加载中…</div>';
        // C2b 第2批：入口对接人也可达（见 GET /sys-releases 权限放开注释），「+ 新建上线单」调用 POST /sys-releases
        // 仍是 requireAdmin，故本按钮维持 admin 专属，对接人不应看到会必然 403 的死按钮。
        document.getElementById('siBatchFoot').innerHTML = `<button class="u-btn-secondary" onclick="siCloseBatch()">关闭</button>${isAdmin() ? '<button class="u-btn-primary" onclick="siModalCreateBatch()">+ 新建上线单</button>' : ''}`;
        // [C9 二次收口·codex 207 审 MED-2] try/catch 兜异常路径——同 siLoadDutyRoster 处注释：siApi 不兜
        // fetch() 自身抛出的网络异常，此前无 try/catch 会让视图卡死在「加载中…」。本函数不递归调用自己，
        // catch 分支直接就地显示失败文案即可（不像 siOpenBatchDetail 那样需要"回退到列表"这条退路）。
        let r;
        try {
            r = await siApi('/sys-releases');
        } catch (netErr) {
            if (myGen !== siAuditGen || !document.getElementById('siBatchOverlay').classList.contains('open')) return;
            document.getElementById('siBatchBody').innerHTML = '<div class="si-empty">加载失败：网络异常，请重试</div>';
            return;
        }
        if (myGen !== siAuditGen || !document.getElementById('siBatchOverlay').classList.contains('open')) return;
        if (!r.ok) { document.getElementById('siBatchBody').innerHTML = '<div class="si-empty">加载失败</div>'; siApiErr(r); return; }
        const items = (r.data && r.data.items) || [];
        // 执行人入口批（2026-07-31）：mine 视角（后端 scope 字段，非 admin/对接人=只返回"执行人=我"的批次）——
        //   标题改「我的上线单」；空态不引导"新建"（普通用户无建单权，页脚按钮本就 admin 专属不受影响）。
        const isMine = !!(r.data && r.data.scope === 'mine');
        if (isMine) document.getElementById('siBatchHead').textContent = '我的上线单';
        if (!items.length) { document.getElementById('siBatchBody').innerHTML = `<div class="si-empty">${isMine ? '暂无指派给你的上线单' : '暂无上线单，点右下角「新建上线单」'}</div>`; return; }
        document.getElementById('siBatchBody').innerHTML = items.map(b => {
            const badge = b.status === '已发布' ? '<span class="si-release-badge done">已发布</span>' : '<span class="si-release-badge plan">计划中</span>';
            const hot = b.is_hotfix ? ' · <span style="color:#b45309">hotfix</span>' : '';
            // [C7·方案 §6.6b] 列表视图可见标记：与详情页横幅同一套判据（source='degraded'），列表只给
            // 一枚醒目角标（非整条变红——列表信息密度不宜每条都放大段文案），点进详情页看完整提示。
            const degradedBadge = b.degraded ? ' · <span style="color:#b91c1c;font-weight:600" title="成员历史记录不完整，快照缺失或损坏，已回落时间线重建">🔴 历史记录不完整</span>' : '';
            // 执行人入口批（2026-07-31）：待执行徽章——「计划中 ∧ 已通知」即"等执行人动手"态，mine 视角
            //   置醒目提示（这正是执行人打开面板要找的东西）；all 视角同一判据顺带展示（admin 一眼扫出
            //   哪些批次已通知待执行）。C5 订正：旧批次级单列 release_assignee_notify_status/name 已随
            //   C4b H1 退场冻结（恒 not_sent/NULL），改读列表端点已有的 executor_notify_summary 聚合——
            //   sent（全体已通知）/partial（部分已通知）都算"有事要看"。执行人姓名列表**不再展示**——
            //   列表端点未返回逐人姓名（多人场景一行装不下，且加这个字段超出本批"后端改动仅限详情端点"
            //   的纪律范围），要看具体是谁、通知到哪一步，点进详情页的执行人区块（唯一权威展示位）。
            // L7（待执行徽标精度）：mine 视角再叠「本人行未 done」——本人确认上线完成后其个人「待执行」徽标
            //   熄灭，即使同批其他执行人未完成（各执行人各自视角）。后端 mine 视角 DTO 下发 my_executor_done
            //   （见 index.js GET /sys-releases，唯一 done 语义源=本人在册行 exec_status='done'）。all 视角 myDone
            //   恒 false（后端不下发该字段 + 此处 isMine 门控双保险），维持批次级聚合徽标不变，admin/对接人
            //   全局 oversight 不受影响。
            const myDone = isMine && b.my_executor_done === true;
            const awaitingExec = b.status === '计划中' && ['sent', 'partial'].includes(b.executor_notify_summary) && !myDone;
            const execBadge = awaitingExec ? ' · <span style="color:#b45309;font-weight:600">⏳ 待执行</span>' : '';
            const assigneeMeta = '';
            return `<div class="si-batch-item" onclick="siOpenBatchDetail(${b.id})">
                <div><span class="si-batch-no">${esc(b.release_no)}</span> ${badge}${hot}${execBadge}${degradedBadge}</div>
                <div class="si-batch-meta">${esc(b.title || '（无标题）')}${b.version_tag ? ' · ' + esc(b.version_tag) : ''} · 含 ${b.issue_count || 0} 单${assigneeMeta}${b.released_at ? ' · 发布于 ' + esc(siFmtDT(b.released_at)) : ''}</div>
            </div>`;
        }).join('');
    }

    // ============================================================

            //   ① **failed / 无 message_key 的行是"有意允许查"的**，不是漏防：端点首个分支
            //      `if (!row.mk) return res.json({read_status:'no_message_key'})` 是 **200 正常态**，其上方
            //      注释明写"这是刻意的设计选择，不是历史遗留……'还没发/发了没人读/读了'是同一枚举维度上的
            //      三种正常态，不该有一种单独被 400 特殊对待"。D6 之后这条正常态在结果框里渲染成
            //      「⚠️ 尚无有效发送记录，无法查询已读」，正是该设计想要的诚实回答。
            //   ② **stale 行查询有真实意义**：它是"发过、后来过期需重发"，message_key 还在，端点会真去钉钉
            //      活查，能查回旧消息是否被读过——收成 `ns==='sent'` 会把这条真能力砍掉。
            //   ③ 建议里的 `e.notify_message_key` 判据**在本页根本取不到**：批次详情 payload 的 executors
            //      SELECT 只有 `id, user_id, user_name, notify_status, exec_status, read_at`（index.js:10388），
            //      不含 message_key ⇒ 要加这个条件必须改后端，而本任务对后端**只核对不修改**。
            //   ⇒ 维持 `ns !== 'not_sent' && ns !== 'sending'`。**登记一处与抽屉侧的口径差**：抽屉侧五通道
            //      都带 `!read_at`（已读后隐藏查询按钮·用户 2026-07-19 拍板），本行没有 —— 已读行仍显示按钮，
            //      点了走后端 `cached` 快路径返回同一时刻，无害但多一次点击。**本批不改**（属显隐行为变更、
            //      矩阵未列），留作观察项；要改只需在本条件补 `&& !e.read_at`（read_at 在 payload 里，可实现）。
            if (planning && isAdmin() && !isDone && ns !== 'not_sent' && ns !== 'sending' && uidOk) {
                btns += ` <button class="u-btn-secondary u-btn-sm" id="siExecReadBtn${releaseId}_${uidNum}" onclick="siExecutorRowReadStatus(${releaseId},${uidNum})">查询已读</button>`;
                readBoxId = `siExecReadBox_${releaseId}_${uidNum}`;   // 〔D6·S16〕命名规则同 corrReadBox_{key}_{rid}
            }
            // 〔D6·S16〕本行是 si-att-item（nowrap flex）不是 u-notify-row ⇒ 加 si-exec-row 修饰类让结果框
            //   能独占一行（容器适配见页内 CSS 注释）；结果框只在渲染了查已读按钮时才挂。
            return `<div class="si-att-item si-exec-row">
                <span class="si-att-name">${rowLabel}</span>
                <span class="si-release-badge ${cls}">${esc(label)}</span>${doneTag}${readTag}
                ${btns}${readBoxId ? `<span class="u-nr-read-result" id="${readBoxId}"></span>` : ''}
            </div>`;
        }).join('');
        return `<div class="u-detail-section"><h3>执行人（${executors.length}）</h3>${rowsHtml}</div>`;
    }
    // 行级发通知（C2，行级唯一发送入口：首发/重发/失败重试同端点按行状态分支，无群发）。L2（codex 预筛）：
    // timeline_failed===true 时成功 toast 附加留痕失败提示——发送这个动作本身成功了（notify_status 已落库），
    // 只是账面留痕这步单独失败，不该假装什么都没发生，也不该让整次操作因此报错（事实已发生，账面描述另算，
    // 同 MED-3/300-L1 一脉相承的既有设计）。L5：并发变更（NOTIFY_CONCURRENT_CHANGED）也刷新详情——这条
    // 分支恰恰意味着"这一行的状态已经变了"，最该刷新的就是它，此前遗漏刷新会让页面继续显示旧状态。
    async function siExecutorRowNotify(releaseId, userId) {
        // 〔矩阵 §1.2·J4 长句〕本 confirm 首发/重发/重试**共用一颗按钮**，0b-1 终裁"保留现状语义、不拆两句、
        //   只把文案套模板" ⇒ 前半句保留现状（对首发也说得通），后半句补长句模板的承诺部分。
        //   长句前提**已核实**：本通道后端 preempt CAS 抢占时即 `read_at = NULL`（index.js:11083），
        //   承诺"旧已读记录清除"属实（不是未经核实的行为承诺）。
        if (!confirm('确认发送钉钉执行通知？\n将以本次为最新一次通知，旧已读记录清除。')) return;
        // 全等属性选择器（不用 `^=` 前缀）：`siExecutorRowNotify(9,1` 是 `…(9,12)` 的前缀，前缀匹配会一次锁两行。
        const btnEl = document.querySelector(`#siBatchBody .u-btn-sm[onclick="siExecutorRowNotify(${releaseId},${userId})"]`);
        const rowLabel = (btnEl && btnEl.dataset.nrLabel) || ('执行人#' + userId);
        // 〔S15·J23〕本按钮此前**全程不禁用**（同页 siExecutorRowReadStatus 的 L4 早有这道防线，发送侧漏了）——
        //   钉钉外呼是真实副作用，连点＝多条重复推送。恢复用 isConnected 守卫：read 分支刷新后节点已是孤儿。
        const btnOrigText = btnEl ? btnEl.textContent : '';
        if (btnEl) { btnEl.disabled = true; btnEl.textContent = '发送中…'; }
        const restoreExecBtn = () => { if (btnEl && btnEl.isConnected) { btnEl.disabled = false; btnEl.textContent = btnOrigText; } };
        const r = await siApi('/sys-releases/' + releaseId + '/executors/' + userId + '/notify', { method: 'POST' });
        if (!r.ok) {
            // 〔S1〕两处非 ok 出口改通知域专用出口（原因走冻结映射表，不再直出后端 `error` 原文）
            if (r.data && r.data.code === 'NOTIFY_CONCURRENT_CHANGED') { siNotifyErr(r); await siOpenBatchDetail(releaseId); restoreExecBtn(); return; }
            siNotifyErr(r); restoreExecBtn(); return;
        }
        const d = r.data || {};
        const tlSuffix = d.timeline_failed ? '（留痕写入失败，已记录日志）' : '';
        // 〔N3-fix2·MED-1〕批次侧兜底口径**对齐抽屉侧 B1**：兜底不再由 sentOk 决定发不发（那正是抽屉侧
        //   被拦下的谎报形态），改成 `sentOk` 定动词、`quiet` 定发不发；quiet 只给**兜底句会说谎或自相
        //   矛盾**的分支，且每处都在下面逐条写明理由（quiet 清单）。
        let sentOk = false, quiet = false;
        if (d.concurrent_changed) {
            // 〔矩阵 T31·A' 留〕行会刷但语义不对应（显示的是被别人改成的态，不是本次结果）
            showToast('通知状态已并发变更，请刷新后重试' + tlSuffix, 'warning');
            // 〔quiet 清单·**不列入**〕这条 toast 的内容是"请刷新后重试"，而紧接着的自动刷新恰好失败了 ⇒
            //   兜底句「发送未成功，批次详情刷新失败」与它**互补且直接可执行**，不是重复也不矛盾。
        } else if (d.notify_status === 'sent') {
            // 〔矩阵 T32·A 类删〕成功 toast 删除——行内徽标 not_sent→「已通知」即反馈。
            // ⚠️〔N3-2 现场裁定·待主会话追认〕**两个附加信号例外保留**：`dry_run` 与 `timeline_failed`
            //    在本行的行内表达里**无处安放**——执行人行的状态位是 `si-release-badge` 徽章族，§3.2 对它
            //    显式闭口（文案与样式沿现状不动），六个 label 里既没有"演练"也没有"留痕失败"。按矩阵自己的
            //    A/A' 分界判据（「toast 含行内无处安放的额外信息 → A' 留」）+ M7 拆行口径（同一调用点分支
            //    处置不同即拆行），把 T32 拆成两支：**普通 sent 删**（本条）／**带附加信号的 sent 留**。
            //    矩阵 T32 行只写了"删"、未处理这两个 payload——若整条删掉，dry-run 演练下用户将**完全看不到
            //    "这次没真发"**（工单侧对接测试行有行标签后缀 D-1 兜着，执行人行没有任何等价物）。
            //    文案零新造：沿用现状串 + J20/D-4 冻结后缀。主会话若裁定"矩阵优先、整条删"，删掉这两行 if 即可。
            if (d.dry_run || d.timeline_failed) showToast('已通知' + (d.dry_run ? '（演练·未真实发送）' : '') + tlSuffix, 'success');   // 〔J20·D-4〕
            // 〔S2 + MED-1·quiet 清单第 1 条〕**演练走 quiet**：这条分支上「已发送」和「发送未成功」
            //   **两个动词都是谎**——钉钉根本没外呼（不能说已发送），但演练记录确实成功落库、行内徽标真的
            //   变成了「已通知」（也不能说发送未成功）。上面那条例外 toast 已经如实说了
            //   「已通知（演练·未真实发送）」，是本分支的独家反馈 ⇒ 不静默，只是不叠一句必错的兜底。
            quiet = !!d.dry_run;
            // sentOk 仍按 S2 置 false 作**降级防线**：万一将来有人把 quiet 拿掉，退化成「发送未成功」
            //   （较轻的错），而不是退回 S2 拦下的「已发送」（对着演练宣布真发了＝较重的错）。
            sentOk = !d.dry_run;
        } else if (d.notify_status === 'failed') {
            // 〔矩阵 T33·A' 留·记原因〕徽标只会变成「发送失败」四个字，徽章族闭口 ⇒ 行内没有位置显示原因，
            //   删了就丢信息。〔J8〕原来 `d.notify_error` 直出后端英文枚举（no_phone/token_expired/…），
            //   现走冻结映射表 §7 reason 档译成中文；未登记值落「未知原因」，绝不外显后端码。
            showToast('发送失败（' + siErrText(null, { reason: d.notify_error }) + '）' + tlSuffix, 'error');
            // 〔MED-1·quiet 清单·**不列入**〕sentOk 保持 false ⇒ 兜底走「发送未成功」版。与这条失败 toast
            //   **互补不重复**：一条说"为什么没发成"，一条说"界面还没刷新到最新态"，且两句动词一致不矛盾。
        } else {
            // 〔矩阵 T34·A 类删〕「已处理」删除——徽标照刷即反馈；tlSuffix 同 T32 例外保留（无行内位置）
            if (d.timeline_failed) showToast('已处理' + tlSuffix, 'success');
            sentOk = true;
        }
        // 〔R3·§6.6 ①弹层版〕宿主是 siBatchOverlay（overlay 弹层不是抽屉）⇒ 用**弹层版**兜底文案。
        //   判据用 siOpenBatchDetail 的返回值不用 DOM 哨兵（原因见该函数头注释：body 在 await 前就被清空）。
        const refreshed = await siOpenBatchDetail(releaseId);
        restoreExecBtn();   // 刷新成功时节点已是孤儿（守卫内 isConnected 直接跳过），失败时把按钮从「发送中…」放回来
        // 〔MED-1〕与抽屉侧 siRefreshAfterNotify 同一口径：**刷新失败即出兜底**（quiet 清单除外），
        //   sentOk 只选动词。四支归属：普通 sent→已发送／其他 status→已发送／failed→发送未成功／
        //   concurrent→发送未成功；唯一 quiet＝dry_run（理由见上）。
        if (!refreshed && !quiet) showToast(`${rowLabel}：${sentOk ? '已发送' : '发送未成功'}，批次详情刷新失败，可重新打开批次详情查看`, 'error');
    }
    // 行级查已读（read_status 五值枚举单套判定，方案 §4.5 第2条尾注·登记清单④）：no_message_key/dry_run/
    // recipient_unresolved/read/unread——不再有旧批次级"未发送即 400"这条独立错误码语义需要兼容。
    // L4（codex 预筛）：点击即禁用按钮至请求返回（finally 恢复）——钉钉已读查询是真实外呼（同步远程接口），
    // 连点会打出多次不必要的外呼，与"发通知"按钮防重复点击同一顾虑。
    // ===== 〔D6 · 矩阵 T35-T40/T44 · 方案 §3.3〕结果同样从 toast 切**行内驻留结果框** =====
    //   六态文案与 siQueryReadStatus / 其余四页逐字同源（原因短语取自冻结映射表 §6.5 read_status 段）。
    //   ⚠️ 同一条铁律：**只有「已读」态才 siOpenBatchDetail 刷新**（后端刚固化 read_at ⇒ 行内 readTag 换成
    //     权威显示）；unread/no_message_key/dry_run/recipient_unresolved/未知/查询失败六条**后端零状态变化**，
    //     只写结果框、不刷新——刷新会把刚写进去的结果连容器一起冲掉（本函数原本就没在这几支刷新，此处是
    //     把"为什么不能顺手补上"写死，防后人"统一一下"）。
    //   〔J18·§1.3〕本通道前端不展示 notified_at ⇒ **单时刻正式模板**，结果框只出 `📖 已读 · 于 {已读时间}`。
    async function siExecutorRowReadStatus(releaseId, userId) {
        const btnEl = document.getElementById('siExecReadBtn' + releaseId + '_' + userId);
        const boxId = `siExecReadBox_${releaseId}_${userId}`;
        const box = document.getElementById(boxId);
        if (box) box.innerHTML = '<span class="u-nt-idle">查询中…</span>';   // §3.3 态①
        if (btnEl) btnEl.disabled = true;
        // 结果框写入统一走这里：挂不上（DOM 与预期不符）就回落 toast，绝不静默。
        const put = (html, toastMsg, toastLvl) => { if (box) box.innerHTML = html; else showToast(toastMsg, toastLvl || 'warning'); };
        try {
            const r = await siApi('/sys-releases/' + releaseId + '/executors/' + userId + '/read-status');
            // 〔T44〕非 ok → §3.3 态⑥「查询失败（{原因}）」，原因走冻结映射表五级回退（J8·不再 siApiErr 直出原文）
            if (!r.ok) { put(`<span class="u-nt-fail">⚠️ 查询失败（${esc(siErrText(r, r.data))}）</span>`, '查询已读失败', 'error'); return; }
            const d = r.data || {};
            switch (d.read_status) {
                // L6（codex 预筛）：read_at 来自后端 SQL-side datetime('now','localtime') 计算的原始时间字符串，
                // 展示前须走 siFmtDT 归一格式 + esc 转义（同批次内其余时间字段展示范式一致，读接口这里之前漏了）。
                case 'read': {   // §3.3 态②「已读」——唯一触发刷新的分支
                    const readTxt = d.read_at ? esc(siFmtDT(d.read_at)) : '—';
                    put(`<span class="u-nt-ok">📖 已读 · 于 ${readTxt}</span>`, `📖 已读 · 于 ${d.read_at ? siFmtDT(d.read_at) : '—'}`, 'success');
                    // 〔§6.6 ②〕刷新失败时结果框保底。本面板的 box **一定活不过刷新**（siOpenBatchDetail 开头
                    //   就把 siBatchBody 清成「加载中…」）⇒ 下面这段在当前实现里是**防御性**的：只有将来
                    //   siOpenBatchDetail 改成不清空 body 时才会命中。§6.6 ② 明确本行**不发 toast**——
                    //   刷新的三条失败路径（网络异常 / !r.ok / 令牌过期）siOpenBatchDetail 自己都已给出提示，
                    //   且 read_at 已固化在后端，重开批次详情就能看到「已读 {时间}」徽标，结果并没有丢。
                    await siOpenBatchDetail(releaseId);
                    const boxAfter = document.getElementById(boxId);
                    if (boxAfter && boxAfter.textContent.indexOf('📖 已读') === 0) {
                        boxAfter.innerHTML = `<span class="u-nt-ok">📖 已读 · 于 ${readTxt}（批次详情刷新失败，可重新打开批次详情）</span>`;
                    }
                    break;
                }
                // §3.3 态③「窗口内未读」（`👀` 收编为 `⏳`）。超窗态 unread_expired 本端点无产出（J7）⇒ 不实现。
                case 'unread': put('<span class="u-nt-warn">⏳ 尚未读取</span>', '尚未读取'); break;
                // §3.3 态⑤「无法查询」＝ `⚠️ {原因}，无法查询已读`，原因短语取自冻结映射表 §6.5：
                //   no_message_key→尚无有效发送记录 / dry_run→演练发送（未真实外呼）/ recipient_unresolved→收件人未解析
                case 'no_message_key': put('<span class="u-nt-warn">⚠️ 尚无有效发送记录，无法查询已读</span>', '尚无有效发送记录，无法查询已读'); break;
                case 'dry_run': put('<span class="u-nt-warn">⚠️ 演练发送（未真实外呼），无法查询已读</span>', '演练发送（未真实外呼），无法查询已读'); break;   // 〔D-5〕属"无法查询原因"非发送后缀
                case 'recipient_unresolved': put('<span class="u-nt-warn">⚠️ 收件人未解析，无法查询已读</span>', '收件人未解析，无法查询已读'); break;
                // 枚举外的值＝契约漂移，按 §3.3 态⑥「查询失败」处理（原因落映射表兜底「未知原因」）
                default: put('<span class="u-nt-fail">⚠️ 查询失败（未知原因）</span>', '查询失败（未知原因）', 'error');
            }
        } catch (e) {
            put('<span class="u-nt-fail">⚠️ 查询失败（网络异常）</span>', '查询失败（网络异常）', 'error');
        } finally {
            // 若期间发生刷新（read 分支的 siOpenBatchDetail 会重绘整个区块），旧按钮元素已从 DOM 摘除，
            // 这里的 disabled=false 落在一个孤儿节点上是无害的空操作，不需要额外判断。
            if (btnEl) btnEl.disabled = false;
        }
    }

    // ============================================================
    // 执行人选人弹窗（C5 新组件·方案 §4.5 第1条）：两处复用——「安排上线」siReleaseSetExecutorsModal
    // 与应急一键 siModalHotfix，不写两份。releaseId 为 null 时（hotfix 尚未建批次前）候选端点不带
    // ?release_id=，按当日排班取默认值（方案 §4.5 第1条·后端端点 1 注释）。
    // C5 预筛 MED-1+L3+L9：拆成"取候选"（siExecutorPickerModal，fetch+render 一步到位，供
    // siReleaseSetExecutorsModal 在批次面板上下文里调用）与"纯渲染"（siExecutorPickerRender，不发请求）
    // 两段——siModalHotfix 自己先 fetch（第 1 步弹窗仍开着时探路，失败保留用户已填内容不关弹窗），成功后
    // 才调用渲染段，不重复请求同一份候选数据。
    // ============================================================
    async function siExecutorPickerModal(releaseId, onConfirmIds) {
        const myGen = siAuditGen;
        const qs = releaseId ? ('?release_id=' + encodeURIComponent(releaseId)) : '';
        const r = await siApi('/sys-releases/executor-candidates' + qs);
        // L9（codex 预筛）：await 后补 siAuditGen/overlay 双检查（同 :4914 一带 siOpenBatchDetail 先例纪律）
        // ——本函数固定由批次详情面板内的 siReleaseSetExecutorsModal 调用，releaseId 恒非空、siBatchOverlay
        // 恒应处于打开态，故直接检查这枚共享令牌；若未来出现不依赖该 overlay 的新调用方，需重新评估。
        if (myGen !== siAuditGen || !document.getElementById('siBatchOverlay').classList.contains('open')) return;
        if (!r.ok) { siApiErr(r, '加载执行人候选清单失败'); return; }
        siExecutorPickerRender(r.data || {}, onConfirmIds);
    }
    // 纯渲染段：候选数据由调用方备好（siExecutorPickerModal 或 siModalHotfix 各自 fetch 后传入），本函数
    // 本身不发请求，可在任意上下文（含无 siBatchOverlay 的抽屉/独立流程）安全调用。
    function siExecutorPickerRender(candidatesData, onConfirmIds) {
        const d = candidatesData || {};
        // L10（codex 预筛）：候选清单缓存降为函数内局部变量——原模块级 let 从未被 siExecPickerFilter 等
        // 其他函数读取（过滤走 DOM data-name 属性），没有跨函数共享状态的必要。
        const candidates = d.items || [];
        const defaultSet = new Set((d.selected_by_default || []).map(Number));
        const skipped = d.skipped_defaults || [];
        // v1.4（codex 254-C LOW-3）：跳过不再静默——非阻断提示条，展示后端给的具体原因，不自行推断资格。
        const skippedHtml = skipped.length
            ? `<div class="si-gate-hint" style="margin-bottom:8px">${skipped.map(s => esc(s.reason)).join('；')}</div>`
            : '';
        const rowsHtml = candidates.map(u => {
            // L8（codex 预筛）：候选 id 防御对齐 :4963 先例——正常路径 users.id 恒合法整数，此处是防御性
            // 一致（万一候选数据源未来混进脏值，不产出 value="NaN" 的勾选框）。
            const uidNum = Number(u.id);
            if (!Number.isSafeInteger(uidNum)) return '';
            // 309-M2（codex 回卷）：默认勾选补 u.eligible 联合判据——后端 selected_by_default[] 本身已过
            // hasReleaseEligibility 筛过（resolveDefaultCandidate 不合格者进 skipped_defaults 不进这个
            // 数组），这里是防御性双保险，不依赖"后端这份契约永远不会有别的路径污染"这个单点假设：disabled
            // 行绝不允许同时带 checked（disabled+checked 的 checkbox 在 DOM 层面仍会被 :checked 选择器
            // 命中，若真出现会在下方确认收集阶段被 !c.disabled 兜底过滤，但显示层先自己把关更直接）。
            const checked = (u.eligible && defaultSet.has(uidNum)) ? 'checked' : '';
            const disabled = u.eligible ? '' : 'disabled';
            const reasonHtml = u.eligible ? '' : `<span class="si-muted" style="margin-left:6px">（${esc(u.disabled_reason || '无上线执行资格')}）</span>`;
            return `<label class="si-chk-row si-chk-row-wide si-exec-pick-row" data-name="${esc((u.display_name || '').toLowerCase())}">
                <input type="checkbox" class="si-exec-pick-chk" value="${uidNum}" ${checked} ${disabled} onchange="siExecPickerUpdateHint()">
                <span class="si-chk-text">${esc(u.display_name || ('用户#' + uidNum))}</span>${reasonHtml}
            </label>`;
        }).join('');
        siModal('选择上线执行人', [
            { k: null, html: `<div class="u-form-group">
                <label>执行人（至少选择 1 名）</label>
                <input type="text" id="siExecPickSearch" placeholder="按姓名搜索" oninput="siExecPickerFilter()" style="margin-bottom:8px">
                ${skippedHtml}
                <div id="siExecPickList" style="max-height:320px;overflow-y:auto">${rowsHtml || '<span class="si-muted">无候选人员</span>'}</div>
                <div id="siExecPickHint" class="u-hint" style="margin-top:6px"></div>
            </div>` }
        ], async () => {
            // 309-M2：收集时叠加 !c.disabled 过滤——disabled 的 checkbox 理论上不该带 checked，但
            // querySelectorAll('.si-exec-pick-chk:checked') 在 DOM 层面并不因 disabled 而排除匹配（disabled
            // 只影响用户交互/表单提交，不影响 :checked 这个纯属性选择器），这里是收集侧的第二道防线。
            const ids = [...document.querySelectorAll('.si-exec-pick-chk:checked')].filter(c => !c.disabled).map(c => parseInt(c.value, 10));
            if (ids.length < 1) { showToast('至少选择 1 名执行人', 'error'); return false; }
            return await onConfirmIds(ids);

    function siExecPickerFilter() {

            row.style.display = (!kw || (row.dataset.name || '').includes(kw)) ? '' : 'none';
        });
    }
    // 选不足 1 人时确认按钮置灰 +「至少选择 1 名执行人」提示（用户拍板决策 7 第三次修正·方案 v1.7 二订：
    // 执行人下限 2→1）。⚠️ v1.3 改口径：不写"上线需前后端
    // 各一人"——系统并不校验职能组合（决策 3 终局），说"各一人"是承诺了做不到的事；三修后下限本身也
    // 降到 1 人，这条既有告诫依然成立，不受影响。
    function siExecPickerUpdateHint() {
        // 312-M1（codex 合并前建议）：计数口径须与提交时收集逻辑（下方 siModal onConfirm 回调，
        // `[...querySelectorAll('.si-exec-pick-chk:checked')].filter(c => !c.disabled)`）完全一致——
        // 门禁判定用的是"过滤掉 disabled 后"的计数，不能只数 :checked。正常路径下 disabled 行不会带
        // checked（309-M2 双重防御已堵住渲染层与收集层），本处口径不一致此前不会被真实触发，属于
        // 防御性一致而非现存漏洞，但两处判据不同源本身是隐患——万一防御层失效，这里的置灰/提示会
        // 基于错误计数，与提交时真正收集到的人数对不上。
        const n = [...document.querySelectorAll('.si-exec-pick-chk:checked')].filter(c => !c.disabled).length;
        const hint = document.getElementById('siExecPickHint');
        const btn = document.getElementById('siMConfirm');
        if (!hint || !btn) return;
        if (n < 1) {
            hint.textContent = `已选 ${n} 人——至少选择 1 名执行人`;
            hint.style.color = '#b45309';
            btn.disabled = true;
        } else {
            hint.textContent = `已选 ${n} 人`;
            hint.style.color = '';
            btn.disabled = false;
        }
    }

    // 安排上线（C5 重写，方案 §4.5 第1条）：先弹选人 → 确认后**只调 PUT executors 保存集合，不发任何
    // 通知**（决策 4/v1.2 修正——上一版方案曾写"确认后 PUT+notify 两步"，与"无群发按钮"矛盾，已订正）。
    async function siReleaseSetExecutorsModal(releaseId) {
        await siExecutorPickerModal(releaseId, async (ids) => {
            const r = await siApi('/sys-releases/' + releaseId + '/executors', { method: 'PUT', body: { user_ids: ids } });
            if (!r.ok) { siApiErr(r, '设置执行人失败'); return false; }
            const d = r.data || {};
            showToast(d.changed === false ? '执行人未变化' : '已设置执行人，请到下方逐人发送通知', d.changed === false ? 'warning' : 'success');
            siCloseModal(); await siOpenBatchDetail(releaseId); return false;
        });
    }

    // 撤销上线安排（cancel-schedule，§6.8）：C5 后端已删除"仅 sent/stale/failed 才可撤销"旧聚合闸——任何
    //   「计划中」批次都可撤销（R6 解锁通道），子表全体软删，不回带旧代次。在册已有 done 行时后端 409
    //   CONFIRM_DISCARD_DONE_REQUIRED + done_executor_names，前端补弹二次确认框带 confirm_discard_done:true
    //   重试（不静默丢弃已完成确认这件事）。
    function siReleaseCancelScheduleModal(releaseId) {
        siModal('撤销上线安排', [
            fTextarea('reason', '撤销原因', '', true, '必填，trim 后 1-200 字'),
            note('撤销后当前全部执行人的通知与确认状态将整体重置；需由<b>管理员</b>重新「安排上线」选人（该按钮仅 admin 可见，对接人自己没有这个权限）。')
        ], async v => {
            const reason = v.reason.trim();
            if (!reason) { showToast('撤销原因必填', 'error'); return false; }
            if (reason.length > 200) { showToast('撤销原因超长（≤200）', 'error'); return false; }
            const r = await siApi('/sys-releases/' + releaseId + '/cancel-schedule', { method: 'POST', body: { reason } });
            if (!r.ok) {
                if (r.data && r.data.code === 'CONFIRM_DISCARD_DONE_REQUIRED') {
                    siCloseModal();
                    siReleaseCancelScheduleDiscardModal(releaseId, reason, (r.data.done_executor_names || []));
                    return false;
                }
                siApiErr(r, '撤销上线安排失败'); return false;
            }
            showToast('已撤销上线安排' + (r.data && r.data.old_assignee_name ? '（原执行人：' + r.data.old_assignee_name + '）' : ''), 'success');
            siCloseModal(); await siOpenBatchDetail(releaseId); return false;

    }
    function siReleaseCancelScheduleDiscardModal(releaseId, reason, doneNames) {
        siModal('确认丢弃已完成确认', [
            note('以下执行人已确认完成上线，撤销将丢弃其确认结果：' + doneNames.map(n => esc(n)).join('、') + '。此操作会在时间线留痕，不可撤回。')
        ], async () => {
            const r = await siApi('/sys-releases/' + releaseId + '/cancel-schedule', { method: 'POST', body: { reason, confirm_discard_done: true } });
            if (!r.ok) { siApiErr(r, '撤销上线安排失败'); return false; }
            const d = r.data || {};
            showToast('已撤销上线安排（已丢弃 ' + (d.discarded_done_count != null ? d.discarded_done_count : doneNames.length) + ' 条完成确认）', 'warning');
            siCloseModal(); await siOpenBatchDetail(releaseId); return false;
        }, '确认丢弃并撤销');
    }

    // 确认上线完成（我这部分）（execute，§6.4/§6.10，C5 重写方案 §4.5 第3条）：仅本人在册执行人可见可点，
    //   事务内实时资格复核（403 兜底）。executor_row_id 取自 siBatchDetailExecutors 里本人那一行的行 id
    //   （§4.1a 代次语义——必须传行 id，不许服务端自己查一行，否则代次保证会丢）。最后一人
    //   （pending_count===1）二次确认文案 + 同弹窗内上线说明必填框（M4）；收到 RELEASE_NOTE_REQUIRED
    //   （并发导致前端误判自己不是最后一人）时补弹专填说明的弹窗再重试，不报死错。
    function siReleaseExecuteModal(releaseId) {
        const rel = siBatchDetailRel || {};
        const executors = siBatchDetailExecutors || [];
        const uid = currentUser ? Number(currentUser.id) : null;
        const myRow = uid ? executors.find(e => Number(e.user_id) === uid) : null;
        if (!myRow) { showToast('你不是本批次在册执行人，或页面已过期，请刷新', 'error'); return; }
        const pendingCount = executors.filter(e => e.exec_status === 'pending').length;
        const isLast = pendingCount === 1;
        const hasNote = !!(rel.release_note && rel.release_note.trim());
        const fields = [];
        if (isLast) {
            fields.push(note('你是最后一个确认人，点击后批次将翻「已上线」。'));
            fields.push(fTextarea('release_note', hasNote ? '上线说明（留空沿用上线单已填）' : '上线说明', '', !hasNote, hasNote ? '留空则用上线单已填值' : '必填，≤1000'));
            fields.push(fText('version_tag', '版本号（选填，留空沿用上线单已填）', ''));
        } else {
            fields.push(note('确认后还差 ' + (pendingCount - 1) + ' 人，批次仍「计划中」。'));
        }
        siModal('✅ 确认上线完成（我这部分）', fields, async v => {
            const body = { executor_row_id: myRow.id };
            if (isLast) {
                const noteVal = (v.release_note || '').trim();
                if (!hasNote && !noteVal) { showToast('上线说明必填', 'error'); return false; }
                if (noteVal) body.release_note = noteVal;
                if (v.version_tag && v.version_tag.trim()) body.version_tag = v.version_tag.trim();
            }

            if (!r.ok) {
                if (r.data && r.data.code === 'RELEASE_NOTE_REQUIRED') {

                }

            siExecuteApplyResult(r.data || {});

        });
    }
    // 并发导致前端误判自己不是最后一人的补救弹窗（方案 §4.5 第3条）：单独出一个只要求填上线说明的弹窗，
    //   不报死错、不需要用户重新走一遍完整确认流程。
    function siReleaseExecuteRetryNoteModal(releaseId, executorRowId) {
        siModal('填写上线说明（你已成为最后一个确认人）', [

            if (!r.ok) { siApiErr(r, '确认上线失败'); return false; }

            siCloseModal(); await siLoadList(); await siOpenBatchDetail(releaseId); return false;
        });
    }
    // execute 响应形状（C3）：released 统一布尔（是否因本次确认触发发布），released_issue_ids 另挂新键
    //   （不复用裸 released 当数组）。三分支互斥判序：already（幂等回显，响应无 count 字段）优先于
    //   released（本次真触发发布，才有 count）——原判序若先判 released 会把"已 done 的人对着已发布批次
    //   重复点"错吞进"已上线 N 单"分支却拿不到 count（该响应形状没有这个字段，只会显示空白），已订正。
    function siExecuteApplyResult(d) {
        // L2（codex 预筛）：timeline_failed===true 时附加留痕失败提示——只有"非最后一人"分支的响应会带
        // 这个字段（已上线/已幂等两分支各自走不同留痕路径，未透出该字段），本人这次确认这个动作本身已经
        // 成功落库（exec_status=done），只是账面 timeline 这步单独失败，同 siExecutorRowNotify 处一致的
        // "事实已发生，账面描述另算"处理原则。
        const tlSuffix = d.timeline_failed ? '（留痕写入失败，已记录日志）' : '';
        if (d.already) showToast('你已确认过（幂等），' + (d.released ? '批次已发布' : '批次仍待其余人确认'), 'warning');
        else if (d.released) showToast('已上线 ' + (d.count != null ? d.count : '') + ' 单', 'success');
        else showToast('已确认，还差 ' + (d.pending_count != null ? d.pending_count : '') + ' 人' + tlSuffix, 'success');
    }

    // 改计划上线日期（update-planned-date，§6.11 原语④，C2b 第2批新增前端入口）：admin，仅 planning 可见。
    //   ⚠️ 文案据后端真实行为写死（先读 index.js update-planned-date + applyReleaseChange 源码确认，非猜测）：

    async function siModalAddToBatch(releaseId, batchFamily) {
        // 候选 = 待上线 + 未挂批次（列表接口按 status 拉，release 为空）
        const r = await siApi('/sys-issues?' + new URLSearchParams({ status: '待上线' }).toString());
        if (!r.ok) { siApiErr(r); return; }
        // F-1（写读同源）：候选口径与后端 add-issues 闸门对齐——排除 config、批次族别已定时只留同族
        //   （bug 批次只收 bug / change 批次只收 feature·improvement），免得勾了后端 409。
        //   [上线体统一重构] bug 的 `needs_release===1` 过滤条件已随后端双闸拆除一并删除（2026-07-29 主会话
        //   裁定选项 A）——后端 add-issues 不再对 bug 要求 needs_release=1（该列已转只读残留，见 index.js
        //   needs_release 列定义处说明），此处若继续过滤会让 bug 在 UI 上永远选不出来（needs_release 恒
        //   NULL），静默架空后端已放行的能力，故一并删除，非新增改动。
        const bf = batchFamily || '';
        const cands = ((r.data && r.data.items) || []).filter(i =>
            !i.release_id && i.type !== 'config'
            && (!bf || siReleaseFamily(i.type) === bf));
        if (!cands.length) { showToast(bf ? `没有可加入本上线单（${bf === 'bug' ? 'bug' : '功能/优化'}）的「待上线」单据` : '没有可加入的「待上线」单据', 'warning'); return; }
        const opts = cands.map(i => `<label class="si-chk-row si-chk-row-wide"><input type="checkbox" class="si-add-chk" value="${i.id}"> #${i.id} <span class="u-type-tag ${siTypeClass(i.type)}">${esc(siTypeLabel(i.type))}</span> ${esc(i.title)}</label>`).join('');
        siModal('加入上线单', [{ k: null, html: `<div class="u-form-group"><label>选择待上线单据</label><div style="max-height:320px;overflow-y:auto">${opts}</div></div>` }], async () => {
            const ids = [...document.querySelectorAll('.si-add-chk:checked')].map(c => parseInt(c.value, 10));
            if (!ids.length) { showToast('请至少选择一个单据', 'error'); return false; }
            const rr = await siApi('/sys-releases/' + releaseId + '/add-issues', { method: 'POST', body: { issue_ids: ids } });
            if (!rr.ok) { siApiErr(rr); return false; }
            showToast('已加入 ' + (rr.data && rr.data.count) + ' 单', 'success');
            siCloseModal(); siOpenBatchDetail(releaseId); return false;
        }, '加入');
    }

    // 执行人移单（2026-07-31 用户拍板·执行人移单四口径）：仅被通知的值班执行人本人可用，原因必填——
    //   与 admin 的 siRemoveFromBatch（无需原因）各自独立入口，可见条件见 siOpenBatchDetail 成员行注释。
