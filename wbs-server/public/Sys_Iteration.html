    }
    // C5d（详情页体验优化批·时间线渲染层三合一）：W-GATE 存量转译白名单——B3 上线（commit a75e9ea）前
    //   写入的历史行，summary 唯一硬编码定值无变量（精确等值匹配，非 LIKE；出处 docs/local/系统迭代/
    //   时间线写入点码表_20260810.md §W-GATE 存量转译白名单，逐字核对自 git 历史版本 index.js 该行字面量）。
    //   B3 之后新写入的行 summary 已是人话（写入端 mirrorSummary 计算，见 index.js :2873-2879），不会再
    //   产出这个值，故本判断只对存量行生效，不影响新行（新行走后面 else 兜底分支原样 esc 显示）。
    const SI_TL_WGATE_LEGACY_SUMMARY = 'W-GATE 自动门禁转移（成员在册完成态变化）';
    function siRenderTimeline(list, atts) {
        if (!list.length) return '<div class="si-muted">暂无演进记录</div>';
        return '<div class="si-timeline">' + list.map(e => {
            // L-1（codex 复审）：release 事件也优先识别 action_code——「确认上线·不发版」(confirm_online_norelease)
            //   与批次/hotfix 发版都写 event_type='release'，只有前者带 action_code，需区分标签保留审计可见性。
            const isReleaseScope = e.event_type === 'scope_change' && !!SI_TL_RELEASE_SCOPE_LABEL[e.action_code];
            const key = (e.event_type === 'status_change' || e.event_type === 'release') ? (e.action_code || e.event_type)
                : (isReleaseScope ? e.action_code : e.event_type);
            const label = SI_TL_RELEASE_SCOPE_LABEL[key] || SI_TL_LABEL[key] || key;
            const cls = SI_TL_RELEASE_SCOPE_CLS[key] || SI_TL_CLS[key] || 'si-tl-gray';
            const roundTxt = (e.event_type === 'submit' && e.round_no) ? ('·第' + e.round_no + '轮') : '';
            // submit 挂本轮 delivery 附件
            let attHtml = '';
            if (e.event_type === 'submit' && e.round_no != null) {
                const files = (atts || []).filter(a => a.attachment_type === 'delivery' && a.round_no === e.round_no);
                if (files.length) {
                    attHtml = '<span class="si-tl-att">' + files.map(a =>
                        `<a onclick="siDownloadAtt(${siOpenId},${a.id})">📎${esc(a.original_name || a.file_name)}</a>`).join('') + '</span>';
                }
            }
            const flow = (e.from_status && e.to_status && e.from_status !== e.to_status)
                ? `<span class="si-tl-to"> →${esc(siStatusDisplay(e.to_status))}</span>` : '';
            // release_published：折叠——原生 <details> 默认收起，摘要行只给三个人读得懂的字段。
            //   C5c（详情页体验优化批·发布留痕展开视图结构化）：点开后不再是裸 JSON——commits 渲染成
            //   开发/组件/commit_ref 小表，顶部一行「发布时状态」，原始 JSON 降为小表下方的二级折叠
            //   （审计原文不丢，只是不再是展开区第一眼看到的东西）。解析失败（info.ok===false）分支
            //   维持现状不动——那种情况下 info.commits/statusAtPublish 恒 null，走不到结构化这条路径。
            //   （esc() 后再拼进 <pre>，不走 innerHTML 之外的第二次 DOM 赋值，字符串已按 HTML 语境转义，无 XSS 风险）。
            let summaryHtml;
            if (key === 'release_published' && e.summary) {
                const info = siFormatReleasePublishedSummary(e.summary);

                } else {
                    summaryHtml = `<details class="si-tl-release-json"><summary>${esc(info.brief)}</summary><pre>${esc(info.raw)}</pre></details>`;
                }

                // C5d 存量转译（写入端半见 index.js :2873-2879 B3 commit a75e9ea）：本判断只服务 B3 上线前写入的
                // 存量行——新行 summary 已是人话，走不到这条精确等值分支。方向感知、译文与写入端 W_GATE_SKIP_SUMMARY/
                // mirrorSummary 逐字一致，不重新发明措辞：
                //   ① mirrorActionCode 非空（两个 skip 码）优先——同写入端"①②优先于③④"判定顺序；
                //   ② 否则按 to_status 是否落在 DEV 族（SI_DEV_FAMILY_STATUSES，出处见该常量声明处——
                //      查证 routes/sys-iteration/status-families.js:55-59 SYS_DEV_STATUSES）判方向：DEV 族=回弹
                //      （新 pending 成员打破全完成态），否则（VERIFY/LIAISON_TEST）=前进（全部完成）。
                //      该判据不依赖 issue.type——enteringForward=false 分支穷尽只剩 DEV[0] 一种可能
                //      （同 index.js :2866-2869 注释），故 DEV 族并集足够判向。
                let translated;
                if (e.action_code === 'liaison_test_skip_excused') translated = '在册开发全员开脱，跳过对接测试自动流转';
                else if (e.action_code === 'liaison_test_skip_liaison') translated = '对接人不可用，跳过对接测试自动流转';
                else if (SI_DEV_FAMILY_STATUSES.includes(e.to_status)) translated = '出现新的待提交成员，自动退回开发中';
                else translated = '全部在册开发已完成，自动流转';
                // title 挂原文——机制名"W-GATE 自动门禁转移"不丢，悬浮可查（审计要求）。
                summaryHtml = `<span title="${esc(e.summary)}">${esc(translated)}</span>`;
            } else if (e.event_type === 'note' && e.action_code === 'notify_sent' && e.summary) {
                // C5b 噪音折叠①：message_key/(idN) 对人类读者是噪音，凭证价值走 title 悬浮保留（不丢，只挪）。
                //   正则依据（码表§message_key/(idN) 噪音写入点·index.js :12454 recordSysNotifyTimeline）：
                //   成功形态含「（message_key=…）」（全角括号，唯一模板）；失败形态是「（失败=…）」——不含
                //   字面量"message_key="，正则天然不命中，失败原因原样留在正文（当场要看到，不折叠）。
                const folded = e.summary.replace(/（message_key=[^）]*）/, '').replace(/\(id\d+\)/, '');
                summaryHtml = `<span title="${esc(e.summary)}">${esc(folded)}</span>`;
            } else if (e.event_type === 'note' && (e.action_code === 'request_tech_consult' || e.action_code === 'cancel_consult') && e.summary) {
                // C5b 噪音折叠②：同样摘除 (id数字)，title 挂原文。两个 action_code 的 summary 模板不完全相同
                //   （cancel_consult 的两个写点未必含 (idN)），正则不命中时是安全 no-op，非本条断言范围。
                const folded = e.summary.replace(/\(id\d+\)/, '');
                summaryHtml = `<span title="${esc(e.summary)}">${esc(folded)}</span>`;
            } else if (e.event_type === 'estimate' && e.summary) {
                // C5b 噪音折叠③：estimate 行 summary 是裸值（index.js :8022 estMin，无标签），加前缀让读者知道
                // 这是"预计完成"时刻而非其它时间字段——存量与新行同渲染路径，一并受益，无需回填历史数据。
                summaryHtml = esc('预计完成：' + e.summary);
            } else if (e.event_type === 'created' && e.summary && [...e.summary].length > 60) {
                // C5b 噪音折叠④：建单描述原文可能很长，时间线正文只给前 60 字摘要，title 挂全文。
                //   ≤60 字符不动（下面 else 分支覆盖，不重复判断）。
                //   〔F8·LOW-3〕码点口径而非 UTF-16 码元：裸 `.length`/`.slice()` 按 UTF-16 码元计数，
                //   代理对字符（多数 emoji）占 2 个码元，从中间切开会劈开代理对，渲染出 U+FFFD 替换
                //   字符——改用 `[...e.summary]` 展开成码点数组再判长/切片/join，对齐全仓其余长度口径
                //   （work_note 上限 1000、bug_cause_note 上限 500 均按 `[...s].length` 码点计数）。
                summaryHtml = `<span title="${esc(e.summary)}">${esc([...e.summary].slice(0, 60).join('') + '…')}</span>`;
            } else {
                summaryHtml = e.summary ? esc(e.summary) : '';
            }
            return `<div class="si-tl-item${isReleaseScope ? ' si-tl-release-scope' : ''}"${isReleaseScope && siTlHideReleaseScope ? ' style="display:none"' : ''}>
                <div class="si-tl-time" title="${esc(siFmtDTSec(e.created_at))}">${esc(siFmtDT(e.created_at))}</div>
                <div class="si-tl-dot"></div>
                <div class="si-tl-body">
                    <span class="si-tl-evt ${cls}">${esc(label)}${roundTxt}</span>${summaryHtml}${flow}
                    <span class="si-tl-op"> · ${esc(e.operator_name || '-')}</span>
                    ${attHtml}
                </div>
            </div>`;
        }).join('') + '</div>';
    }
    // 上线体统一重构 C2b（199 审 MED-3「过滤」半：一个上线单在 reopen+再发布多轮循环后，同一 issue 的时间线
    //   会累积多条 release_add/remove/date_change/schedule_cancel/published——五类事件对"当前进展"的叙事
    //   价值低于建单/指派/提交/验收等主线事件，默认仍全部显示（不默默丢信息），提供一个可选过滤开关按需隐藏。

    let siTlHideReleaseScope = false;

    // ---- C1（多开发协作与 commit 留痕重构 v2.9 §13 S1）：开发成员 chip + commit 记录小表 ----
    //   C7：由纯读升级为读写——协调人 chip 级操作（开脱/恢复）+ commit 小表行内编辑（编辑/删除/补充），
    //   均按 §11 四布尔门禁，纯 UI 镜像，真闸在后端。
    const SI_DEV_STATUS_LABEL = { pending: '待提交', code_submitted: '已提交', no_code: '无代码', excused: '已开脱' };
    // 〔S5a-fix MED-6〕开发成员态的 class 片段白名单 + gate（S0 甲8 收口）。
    //   原写法 `${esc(statusKey)}` 里 statusKey 来自 `d.dev_status || 'pending'`（后端原值），
    //   esc 只防注入不防"产出没有规则的 class"；与 siTypeClass / siStatusClass 同款范式。
    const SI_DEV_STATUS_CLASS = Object.freeze({
        pending: 'pending', code_submitted: 'code_submitted', no_code: 'no_code', excused: 'excused',
    });
    function siDevStatusClass(k) {
        if (Object.prototype.hasOwnProperty.call(SI_DEV_STATUS_CLASS, k)) return SI_DEV_STATUS_CLASS[k];
        UnifyHelpers.warnBadgeOnce('Sys_Iteration.siDevStatusClass', k);
        return '';
    }
    const SI_COMMIT_COMPONENT_LABEL = { frontend: '前端', backend: '后端' };
    // SYS_DEV 族状态快照（feature/improvement=开发中；bug=处理中）——SYS_DEV∪SYS_VERIFY 复用既有
    // SI_ATT_DEV_OR_VERIFY_STATUSES（附件区先定义，函数体内引用不受声明顺序影响，脚本整体先解析完再在
    // DOMContentLoaded 后执行）。冻结族=非 D_PRE/DEV/VERIFY 的其余状态，复用既有 SI_ATT_TERMINAL_STATUSES
    // 叠加「待上线」（对齐方案 §4.0 SYS_FROZEN_STATUSES=RELEASE∪非发布终态）。
    // 〔C5d 复用〕siRenderTimeline 的 W-GATE 存量转译方向判据也读这个常量（同一份并集字面量，不重复定义）——
    // 二次核实出处 routes/sys-iteration/status-families.js:55-59 `SYS_DEV_STATUSES = { feature:['开发中'],
    // improvement:['开发中'], bug:['处理中'] }`，并集恰为 ['开发中','处理中']，与此处字面量一致。
    const SI_DEV_FAMILY_STATUSES = ['开发中', '处理中'];
    const SI_FROZEN_STATUSES = ['已上线', '已关闭', '已拒绝', '已作废', '待上线'];

    // §11 四布尔（后端同源，仅前端 UI 镜像，真闸在后端各端点内部断言）：
    //   canSubmit=在册∧pending∧SYS_DEV；canEditCommits=当前在册∧存在本人名下行∧SYS_DEV∪SYS_VERIFY（仅管既有行
    //   PUT/DELETE）；canAddCommit=当前在册实例 dev_status='code_submitted'∧SYS_DEV∪SYS_VERIFY（不复用
    //   canEditCommits）；canCoordinateMember=受理人∨admin（全类型）。
    //   ⭐ 角色权限重构 C4（方案 §4-C4 残余核实·2026-07-27）：isCoordinator 由旧口径「type==='bug' 且对接人
    //   白名单」改为「受理人[13]∨admin·全类型」——与后端 isSysCoordinator（routes/sys-iteration/index.js，
    //   dev-assignees 的加人/移除/开脱/换轮恢复等端点在用）同源（行号会随改动漂移，故不在此列具体行号）。
    //   此前的 type==='bug' 分支是 C1 前的残留：C1 已把后端 isSysCoordinator 改成全类型 admin∨isSysIntakeLiaison，
    //   前端这份拷贝没跟上，导致受理人在变更流单上看不到「开脱/恢复」「管理开发成员」按钮——不是没权限，
    //   是前端没显示（点了会 200，因为压根显示不出来）。
    function siComputeCaps(iss, devAssignees, devCommits) {
        // ⭐ [对接人绑单收口 2026-08-10] isCoordinator（→canCoordinateMember=开脱/恢复/管理成员按钮，**写路径**）
        //   由「admin∨白名单[13]」改绑单镜像「admin∨本单绑定对接人」——后端 dev-assignees 族 C10 起已是
        //   isBoundLiaisonEligibleOrAdmin，旧判据会给示例对接人在非名下单渲染死按钮（点击 403 NOT_BOUND_LIAISON）。
        const uid = currentUser ? Number(currentUser.id) : null;
        const list = devAssignees || [];
        const myRow = (uid && uid > 0) ? (list.find(d => Number(d.user_id) === uid) || null) : null;
        const isCoordinator = isAdmin() || isSiBoundLiaison(iss);
        const inDevFamily = SI_DEV_FAMILY_STATUSES.includes(iss.status);
        const inDevOrVerifyFamily = SI_ATT_DEV_OR_VERIFY_STATUSES.includes(iss.status);
        const hasMyCommitRow = !!(uid && (devCommits || []).some(c => Number(c.dev_user_id) === uid));
        return {
            myRow,
            isCoordinator,
            isRosterMember: !!myRow,
            canSubmit: !!(myRow && myRow.dev_status === 'pending' && inDevFamily),
            canEditCommits: !!(myRow && inDevOrVerifyFamily && hasMyCommitRow),
            canAddCommit: !!(myRow && myRow.dev_status === 'code_submitted' && inDevOrVerifyFamily),
            canCoordinateMember: isCoordinator,
        };
    }

    // 全在册 chip：user_name + dev_status 徽标；is_primary 仅作只读小标记「代表」（不得有任何授权暗示文案，
    //   方案 §11 前端骨架——去主次，禁「主开发」字样）。
    //   ⚠️ S3（四件①+④，2026-08-05）：no_code_reason 原设计"用 title 属性挂（悬浮可见，不占用可视空间）"
    //   已被用户 2026-08-05 明确推翻——无代码交付=没有 commit 可追溯，那段文字是唯一交付凭证，藏在
    //   tooltip 里等于实质没留痕。现改为正文块（见下方 noCodeBlock，同 work_note 范式），title 属性
    //   保留但降级为冗余展示（正文块才是主载体，title 只是顺手的悬浮速览，不再是唯一可见途径）。
    //   C7：协调人（canCoordinateMember）在 pending 成员 chip 上加「开脱」、excused 成员 chip
    //   上加「恢复」小按钮；chip 列表下方非冻结态显示「管理开发成员」入口（复用 siModalReassign 的 member_ids
    //   全集编辑器，声明式一个入口覆盖 add/remove，不逐个调 dev-assignees 端点）。
    function siRenderDevMemberChips(devAssignees, caps, iss, noCodeRecords, bugCauseRecords) {
        const list = (!devAssignees || !devAssignees.length)
            ? '<div class="si-muted">暂无指派开发</div>'
            : '<div class="si-dev-chip-list">' + devAssignees.map(d => {
                const statusKey = d.dev_status || 'pending';
                // 〔S5a-fix2 H2〕文案侧与 class 侧配对保护，一处 esc 罩住两条路径。
                //   原写法 `SI_DEV_STATUS_LABEL[statusKey] || esc(statusKey)` 有两个洞：
                //     ① 取值走**原型链** —— statusKey='constructor'/'toString' 会拿到继承来的函数，
                //        它是真值，于是 `||` 右边的 esc 分支根本不执行，函数源码被原样插进 innerHTML；
                //     ② 已知态的 label 虽是字面量（安全），但"安全"依赖读者去核对 map 内容，
                //        不如让转义成为无条件的出口。
                //   hasOwnProperty 关掉原型链，外层 esc 让未知态原值必然被转义。
                const statusLabel = esc(Object.prototype.hasOwnProperty.call(SI_DEV_STATUS_LABEL, statusKey)
                    ? SI_DEV_STATUS_LABEL[statusKey] : statusKey);
                // title 仅冗余（正文块 noCodeBlock 才是主载体，见上方函数头注释）
                const titleAttr = (statusKey === 'no_code' && d.no_code_reason) ? ` title="${esc(d.no_code_reason)}"` : '';
                const primaryMark = '';   // 「代表」小标记按用户要求移除（后端 electRepresentative 仍自动选代表·仅前端不展示）
                // 逐人完成时刻：仅 code_submitted/no_code 两态展示（pending 未完成；excused 语义是「被开脱」
                //   非「已完成」，即便 resolved_at 有值也不展示）；resolved_at 空则整个 span 不渲染，不留占位。
                //   title 到秒（siFmtDTSec）、正文到分（siFmtDT），同 D13 审计类显示口径。
                const timeSpan = ((statusKey === 'code_submitted' || statusKey === 'no_code') && d.resolved_at)
                    ? `<span class="si-dev-chip-time" title="${esc(siFmtDTSec(d.resolved_at))}">·${esc(siFmtDT(d.resolved_at))}</span>` : '';
                // 提交双勾留痕回显（写侧=submit 弹窗「提交前确认」双必勾·v1.139.0 C3 落事件 payload_json；
                //   读侧=详情端 strictBoolFromJsonExtract 严格布尔）：仅 code_submitted/no_code 两态且两键均严格
                //   === true 才显示——历史行（v1.139 前无此键）/脏数据读 null 不显示，不替写侧背书；态门同
                //   timeSpan 的两态（codex 337 LOW-1：timeSpan 另有 resolved_at 非空条件、本处刻意不加——留痕
                //   锚定「事件里勾了」非「有提交时间」，脏行缺时间不连带隐藏承诺），防打回后残留事件把
                //   「已自测」错挂到 pending 成员。恒真信息不进时间线
                //   （每条 submit 必双 true，进时间线是纯重复），只按人挂 chip 供验收打回时回看承诺留痕。
                const checklistSpan = ((statusKey === 'code_submitted' || statusKey === 'no_code') && d.self_tested === true && d.test_env_deployed === true)
                    ? `<span class="si-dev-chip-time" title="提交前确认留痕：该成员最近一次提交时勾选「已完成自测」「已上测试库」">·已自测·已上测试库</span>` : '';
                let act = '';
                if (caps && caps.canCoordinateMember) {
                    if (statusKey === 'pending') act = `<span class="si-dev-chip-act" onclick="siModalExcuseMember(${d.id})">开脱</span>`;
                    else if (statusKey === 'excused') act = `<span class="si-dev-chip-act" onclick="siModalSupersedeExcuse(${d.id})">恢复</span>`;
                }
                return `<span class="si-dev-chip"${titleAttr}>${esc(d.user_name || ('#' + d.user_id))}${primaryMark}<span class="si-dev-status-badge ${siDevStatusClass(statusKey)}">${statusLabel}</span>${timeSpan}${checklistSpan}${act}</span>`;
            }).join('') + '</div>';
        // P4：开发成员工作说明展示——每个提交时填了 work_note 的 dev 一行「姓名：说明（提交时刻）」。多开发各自独立
        //   （后端详情端按 dev_assignee 各取自己最近 submit 事件的 work_note·不覆盖）。仅有值的 dev 才渲染，无则整块不出。
        const wnItems = (devAssignees || [])
            .filter(d => d.work_note)
            .map(d => `<div class="si-worknote-item"><span class="si-worknote-who">${esc(d.user_name || ('#' + d.user_id))}</span>${d.work_note_submitted_at ? `<span class="si-muted" style="font-size:11px;margin-left:6px">${esc(siFmtDT(d.work_note_submitted_at))}</span>` : ''}<div class="si-worknote-text">${esc(d.work_note)}</div></div>`)
            .join('');
        const workNotesBlock = wnItems
            ? `<div class="si-worknote-block" style="margin-top:10px"><div class="si-worknote-title" style="font-size:12px;color:#6b7280;margin-bottom:4px">工作说明</div>${wnItems}</div>` : '';
        // S3（四件①+④）：无代码交付原因正文块——同上方 work_note 范式（姓名+时刻+文本），无值整块不出。
        //   时刻取 resolved_at（submit 端点 no_code 分支与 code_submitted 分支共用同一列写入，见
        //   routes/sys-iteration/index.js 的 submit 处理）。贴着开发成员条目、与工作说明同区展示。
        //   codex 262 L-1：过滤条件与渲染值统一走 trim 后的字符串——写入端 validateSubmitBody 的
        //   no_code 分支已 trim+拒绝空白（`reason = b.no_code_reason.trim()`、`!reason` 则 400），
        //   本处 trim 是双保险，防历史脏数据或未来新写入路径遗漏该校验时，纯空白值被 `&&` 的真值判断
        //   放过、渲染出一个看着有块实则空白的正文行。
        //   ⚠️ S4 段1收口（codex 264 号末次合并审 M-2）：数据源从 devAssignees（仅在册·removed_at IS
        //   NULL）改为 noCodeRecords（后端查该单**全部**历史实例，含已移出的）——返工场景下 remove+
        //   re-add 旧成员后，旧一轮的无代码交付说明不该跟着消失（四件④拍板：这是唯一交付凭证）。
        //   removed_at 非空的历史实例加「（已移出）」muted 后缀，让读者知道这是历史轮次的凭证而非
        //   当前在册成员；在册未移除的（removed_at 为空）照常不带后缀。
        const ncItems = (noCodeRecords || [])
            .map(d => {
                const reasonTrimmed = String(d.no_code_reason || '').trim();
                if (!reasonTrimmed) return '';   // 双保险（后端已过滤非空白，此处防御性兜底不新增行为）
                const removedTag = d.removed_at ? `<span class="si-muted">（已移出）</span>` : '';
                return `<div class="si-worknote-item"><span class="si-worknote-who">${esc(d.user_name || ('#' + d.user_id))}${removedTag}</span>${d.resolved_at ? `<span class="si-muted" style="font-size:11px;margin-left:6px">${esc(siFmtDT(d.resolved_at))}</span>` : ''}<div class="si-worknote-text">${esc(reasonTrimmed)}</div></div>`;
            })
            .join('');
        const noCodeBlock = ncItems
            ? `<div class="si-worknote-block" style="margin-top:10px"><div class="si-worknote-title" style="font-size:12px;color:#6b7280;margin-bottom:4px">无代码交付说明</div>${ncItems}</div>` : '';
        // [B4·C6·F8 MED-1 订正] bug 产生原因逐人展示——同 work_note 范式（姓名+文本一行，无时刻列，
        //   本次改动范围不含此项）。仅 iss.type==='bug' 且该记录有值时渲染；非 bug 单/无值——整块不出。
        //   数据源=bug_cause_records（详情 GET 顶层新增，后端查该单**全部**历史实例，含已移出的）。
        //   ⚠️ F7 首版曾用 devAssignees（仅在册）过滤，给的理由是"bug_cause_note 非 no_code 专属字段，
        //   不需要 noCodeRecords 扩展视角"——这是一句**非因果推理**（"是否只有 no_code 模式才写这个
        //   字段"与"要不要看得到历史轮次的记录"是两件不相关的事，前者为真不能推出后者不需要）。
        //   真实理由应对齐 noCodeRecords 同款裁定（codex 264 号末次合并审 M-2）：返工场景下 remove+
        //   re-add 旧成员后，旧一轮的 bug 产生原因同样不该跟着消失（唯一交付凭证，与 no_code_reason
        //   的裁定精神一致），故改用专属的 bug_cause_records 查询而非仅在册的 devAssignees。
        //   removed=true 的历史实例加「（已移出）」muted 后缀（同下方 ncItems 既有写法，本注释挪到这里
        //   之前 ncItems 已在上文定义），在册未移除的（removed=false）不带后缀。复用 .si-worknote-item
        //   族既有样式类，非另造。
        const bcItems = iss.type === 'bug' ? (bugCauseRecords || [])
            .map(d => {
                const noteTrimmed = String(d.bug_cause_note || '').trim();
                if (!noteTrimmed) return '';   // 双保险（后端已保证非空白，此处防御性兜底不新增行为，同 ncItems）
                const removedTag = d.removed ? `<span class="si-muted">（已移出）</span>` : '';
                return `<div class="si-worknote-item"><span class="si-worknote-who">${esc(d.user_name || ('#' + d.user_id))}${removedTag}</span><div class="si-worknote-text">${esc(noteTrimmed)}</div></div>`;
            })
            .join('') : '';
        const bugCauseBlock = bcItems
            ? `<div class="si-worknote-block" style="margin-top:10px"><div class="si-worknote-title" style="font-size:12px;color:#6b7280;margin-bottom:4px">bug 产生原因</div>${bcItems}</div>` : '';
        // C2c·对抗审 A（HIGH·2026-07-18）：manageBtn 是 reassign 的**第二个前端入口**（复用 siModalReassign→POST /reassign），
        //   显隐必须镜像 reassign.from（否则变更流 D_PRE 态显按钮但后端已去 D_PRE→点击必 409 死按钮）。原 !SI_FROZEN_STATUSES
        //   只排冻结态、不含变更流 D_PRE 三态，是与操作区入口①(transitions reassign.from)不同源的漏网。改为直接读
        //   META.typeFlows[type] 的 reassign.from（后端权威·天然 type 感知：bug 含待处理/变更流去 D_PRE），与后端
        //   memberActionFamiliesFor 同源、随 reassign.from 变化自动跟随。
        const reassignFlow = ((META && META.typeFlows && META.typeFlows[iss.type]) || []).find(f => f.action === 'reassign');
        const reassignHitsStatus = !!(reassignFlow && Array.isArray(reassignFlow.from) && reassignFlow.from.includes(iss.status));
        const manageBtn = (caps && caps.canCoordinateMember && reassignHitsStatus)
            ? `<div style="margin-top:8px"><button class="u-btn-secondary u-btn-sm" onclick="siModalReassign(siDetail.issue)">管理开发成员</button></div>` : '';
        return list + workNotesBlock + noCodeBlock + bugCauseBlock + manageBtn;
    }
    // commit 记录小表：开发/component（前端/后端）/commit_ref/时间；含 removed 实例的行（方案 §8 快照口径同源，
    //   后端 GET 已按 id 升序返回，前端不再排序）。C7：本人行按 canEditCommits 加「编辑/删除」，表下按
    //   canAddCommit（独立判定，不复用 canEditCommits）加「补充 commit」按钮。
    function siRenderDevCommits(devCommits, caps) {
        const uid = currentUser ? Number(currentUser.id) : null;
        // [C11·§10.3] 命中「不分前后端系统」→ 组件列一律显示 group_label（「版本号」），不显示 frontend/backend
        //   原始 component（含历史 frontend 行也合并进版本号组展示·不迁移数据）。判据取后端 DTO（唯一权威·
        //   前端不自行判定），非命中系统照旧显示「前端/后端」。列头随之切换「组件/版本号」。
        const single = !!(siDetail && siDetail.issue && siDetail.issue.single_commit_group);
        const groupLabel = (siDetail && siDetail.issue && siDetail.issue.group_label) || '版本号';
        const compHeader = single ? groupLabel : '组件';
        const rows = (devCommits || []).map(c => {
            const isMine = !!(uid && Number(c.dev_user_id) === uid);
            const canEditThis = !!(caps && caps.canEditCommits && isMine);
            const acts = canEditThis
                ? `<span class="si-commit-act" onclick="siModalEditCommit(${c.id})">编辑</span><span class="si-commit-act danger" onclick="siModalDeleteCommit(${c.id})">删除</span>`
                : '';
            const compCell = single ? esc(groupLabel) : (SI_COMMIT_COMPONENT_LABEL[c.component] || esc(c.component));
            return `<tr>
                <td>${esc(c.dev_user_name || ('#' + c.dev_user_id))}</td>
                <td>${compCell}</td>
                <td>${esc(c.commit_ref)}</td>
                <td>${esc(siFmtDT(c.created_at))}</td>
                <td>${acts}</td>
            </tr>`;
        }).join('');
        const addBtn = (caps && caps.canAddCommit) ? `<div style="margin-top:8px"><button class="u-btn-secondary u-btn-sm" onclick="siModalAddCommit()">+ 补充 ${single ? esc(groupLabel) : 'commit'}</button></div>` : '';
        if (!devCommits || !devCommits.length) return '<div class="si-muted">暂无 commit 记录</div>' + addBtn;
        return `<div class="u-corr-table-wrap"><table class="si-commit-table"><thead><tr><th>开发</th><th>${esc(compHeader)}</th><th>commit_ref</th><th>时间</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${addBtn}`;
    }

    // 统一自定义错误文案（commit 行编辑三端点，§10 错误码集合 = COMMIT_SCOPE/INVALID_STATUS/VALIDATION/
    //   GATE_INVARIANT；siApiErr 默认优先取 r.data.error，后端本就给了可读中文，故仅对「值得改写为更贴合
    //   UI 场景措辞」的 3 码定制，INVALID_STATUS 及其余码按后端 message 原样显示——任务书要求的"统一走
    //   siApiErr 但对这几个码给定制文案"落地方式：先查码表命中则短路 showToast，未命中回落 siApiErr）。
    const SI_COMMIT_ERR_TEXT = {
        NOT_ROSTERED: '你已不在册，无法操作',
        COMMIT_SCOPE: '仅本人 commit 行可编辑/删除',
        GATE_INVARIANT: '已提交（code_submitted）状态下至少需保留 1 条 commit',
    };
    function siCommitApiErr(r) {
        if (r && r.aborted) return null;
        const code = r && r.data && r.data.code;
        if (code && SI_COMMIT_ERR_TEXT[code]) { showToast(SI_COMMIT_ERR_TEXT[code], 'error'); return null; }
        return siApiErr(r);
    }

    // 对接人侧（仅 path B 建单有意义；relay_notified_user_id 为空=非 path B，不渲染该行）。仅 admin 可发（后端 requireAdmin）。

    // 建单人侧：权限=admin/白名单/主开发本人（notify-creator handler 内判定）；self-guard 由 siNotifyManual 内识别 skipped 淡提示。

        return siNotifyRowHtml(label, iss.creator_notify_status, iss.creator_read_at, iss.creator_notified_at, btns, undefined, iss.creator_notify_error);

    // S4（bug暂缓方案 §7.3）：重启通知开发行——仅 bug 单「处理中」态候选渲染，是否确为"本轮重启"由后端
    //   §7.3 锚点算法判定（前端不重复实现该算法，只提供入口；未命中时端点返 409 RESUME_ANCHOR_NOT_FOUND，

    function siRenderResumeNotifyRow(iss, devAssignees) {

        if (isAdminUser && !allSent) {

    }

    // 对接人受理侧（建单优化批 C1 §4 改动点2·前端 C2，方案 v1.2 §4.8）：仅「待受理」态渲染——回受理门

    //   常驻通知行口径对齐）。发送按钮维持仅受理段可点（过段再发"请受理"语义已失效，后端状态守卫本就
    //   只在「待受理」放行，未动）；查询已读全状态可用（条件不变：sent+message_key+未读）。
    function siRenderIntakeNotifyRow(iss, canOperateIntake, canQueryReadIntake) {
        const nameResolved = siIntakeLiaisonName(iss.intake_liaison_id);
        const label = `对接人受理 ${esc(nameResolved || (iss.intake_liaison_id ? ('#' + iss.intake_liaison_id) : '（存量单·发送时自动选定）'))}`;
        let btns = '', readBoxId = '';
        const intakeStatus = iss.intake_notify_status;

        //   异常值都会被误判为可操作态。现仅 not_sent/falsy（初始态）与 failed（可重发）两类命中；
        //   sent 与其余任何未知值均不渲染操作按钮（未知值只展示状态文本，不当作可操作态处理）。
        //   [D15] 新增 status==='待受理' 前置门——常驻化后本行会在任意状态渲染，发送/重发按钮必须收窄回
        //   仅受理段可点（此前靠外层 early return 隐式保证，现需显式判断）。
        if (iss.status === '待受理' && canOperateIntake && (intakeStatus === 'not_sent' || intakeStatus === 'failed' || !intakeStatus)) {

            //   是恢复可发的唯一途径；sent 即本轮终态，与 P1 拍板时的语义前提一致。
            const btnLabel = intakeStatus === 'failed' ? '重试' : '发送通知';   // 〔S10〕failed 后＝「重试」
            btns += `<button class="u-btn-secondary u-nb-btn" data-nr-label="${label}" onclick="siNotifyIntakeClick()">${btnLabel}</button>`;
        }
        // 已读态隐藏「查询已读」（同其余通道口径，用户 2026-07-19）。
        if (canQueryReadIntake && iss.intake_notify_status === 'sent' && iss.intake_notify_message_key && !iss.intake_read_at) {
            btns += `<button class="u-btn-secondary u-nb-btn" onclick="siQueryReadStatus('intake')">查询已读</button>`;

        //   〔J18·§1.3〕故本通道**只能出单时刻**：查已读命中已读后行内是 `📖 已读 · 于 {已读时间}`，不得宣称双时刻。
        return siNotifyRowHtml(label, iss.intake_notify_status, iss.intake_read_at, null, btns, undefined, iss.intake_notify_error, readBoxId);   // intake 无 notified_at 列（J18 单时刻）
    }

    // 对接测试侧（工期对接测试与风险等级拆分 方案 v1.1 §6/§7·C4b）：D19 触发主体=开发视角——权限=本单
    //   在册开发∨admin（镜像后端 assertLiaisonTestNotifyActor，非 canOperateIntake 那套 admin-only 池口径）。
    //   仅 feature 有该态；liaison_test_cycle_no=0（该单从未进入过待对接测试）不渲染本行——避免给直落
    //   验证/尚未走到该段的单挂一条永远空白的行；cycle_no>=1 后持续渲染（跨轮次留痕可见，同 dev/creator
    //   等既有通知行"持续展示、按态收发送按钮"范式，不因流转到「待验证」之后就消失）。
    //   D19 自指硬守卫：收件人=当前用户本人时前端也隐藏发送按钮（后端 403 SELF_NOTIFY_FORBIDDEN 是真闸，
    //   这里只是不给一个必 403 的死按钮）。
    // [codex 276 号审 M-2] sending 超窗判定——与后端 preemptLiaisonTestNotifySend 的 CAS 恢复窗口
    //   （index.js，10 分钟）同值，纯 UI 提示用途，不是权威判定——权威判定恒在后端 CAS；前端这里算错
    //   或算不了，最多是按钮可用性体验差一点（比如该能点的时候还是灰的），绝不会导致越权发送，因为
    //   即便前端误判成"可点"，真正拦截双发的是后端那条 CAS WHERE，不是这个函数。
    // [codex 277 号审 L-1 收口] 边界方向与后端对齐：后端 CAS 用 `attempt_started_at <=
    //   datetime('now','localtime','-10 minutes')`（即"已流逝时间 >= 10 分钟"才判定超窗允许抢占，
    //   `<=` 是闭区间，10:00 整这一刻本身就算超窗）；此前前端用严格 `>`（即"已流逝时间 > 10 分钟"，
    //   `10:00.000` 整这一刻还判"未超窗"），在 10 分钟整的极小窗口内会出现"后端已允许抢占、前端仍显示
    //   禁用"的方向不一致（button 态偏保守一侧，不是误放行，安全上无害，但体验上会让用户在那一瞬间
    //   看不到本该出现的按钮）。改 `>=` 与后端方向一致。⚠️ 本函数按浏览器本地时间解析（不处理时区/
    //   跨时区场景），前端与服务端假定同一时区（同项目既有惯例，见上）——若两端时钟/时区不一致导致本
    //   函数判断有误差，后端 CAS 仍是唯一权威闸门，不影响正确性，只影响这一颗按钮"看起来"该不该可点。
    // [281 号对抗审 N7 采纳] NULL started_at 方向修正：后端 preemptLiaisonTestNotifySend CAS
    //   （index.js :11132）把 `liaison_test_attempt_started_at IS NULL` 视为**立即可抢占**（与"已超 10
    //   分钟"同一 OR 分支），语义是"这行处于 sending 但没有留下有效的尝试起始时间，说明这次尝试本身
    //   不完整/已失去追踪依据，不该继续拿它当挡箭牌"。此前前端 !startedAt 时返回 false（=判定"未超窗"
    //   → 按钮永久禁用），方向与后端正相反：一旦真出现这种脏数据，用户会撞上一颗再也点不开的死按钮，
    //   只能等人工介入，而后端其实随时愿意放行。改为返回 true，方向对齐后端。
    function siLiaisonTestNotifySendingIsStale(startedAt) {
        if (!startedAt) return true;
        let s = String(startedAt);
        if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(s)) s = s.replace(' ', 'T');
        const d = new Date(s);
        if (isNaN(d.getTime())) return false;
        return (Date.now() - d.getTime()) >= 10 * 60 * 1000;
    }
    // [codex 278 号审 M-3] writeback_failed:true 会话级持续警示——该响应字段不落库（后端仍卡在 sending，
    //   没有专门的 DB 列记"回写失败过"），若不在前端记一笔，siAfterAction 重渲染后这条警示就随 toast
    //   消失、用户看不到任何解释，容易在按钮变灰后忍不住重新点击（=真实双发）。用一个会话内 Set 记录
    //   命中过的单号，siRenderLiaisonTestNotifyRow 重渲染时持续显示红字。
    // [codex 279 号审 M-2 收口] 键从裸 issue.id 改为 `${id}:${cycle_no}`——同一张单换轮（liaison_test_pass
    //   打回重开→重新进入待对接测试，cycle_no 递增）后，旧警示不该在新周期继续显示（新周期是全新的一次
    //   发送尝试，与上一轮的回写失败无关）。渲染时若当前状态已不是 sending，主动删掉该键（防 Set 无限
    //   增长，也让"同一单同一周期真的走出了 sending"之后不再有任何残留判断依据）。
    let siLiaisonTestWritebackFailedIds = new Set();
    function siLiaisonTestWarnKey(issueId, cycleNo) { return `${issueId}:${cycleNo}`; }
    function siRenderLiaisonTestNotifyRow(iss) {
        if (iss.type !== 'feature' || !(Number(iss.liaison_test_cycle_no) > 0)) return '';

        const canOperate = isAdminUser || isRosterDev;

        const ns = iss.liaison_test_notify_status;

        // 记录，行内追加「（演练）」，避免用户把演练态误读成真实已送达（detail 读镜像白名单已含
        // liaison_test_notify_message_key 列，直接可用，无需另补接口）。

        // [S12 双路审查 codex 287 号 M-2 收口] 本行读回执诚实占位——下方通知区共享文案（siRenderNotify
        // 底部"「查已读」查询钉钉已读回执"，:2653）是对整块 6 行通知的统一说明，但本通道**没有** ①
        // 「查询已读」按钮（上方 btns 只拼 发送/重发，从不拼查已读）② notify-read-status 端点的对应
        // channel 分支（liaison_test_read_at 全仓只有清空写点，无任何非 NULL 写入路径，见 index.js
