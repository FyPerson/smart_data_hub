        // 根据指标类型切换显示/隐藏公式和父指标字段
        function toggleMetricTypeFields(type) {
            const formulaGroup = document.getElementById('formulaGroup');
            const parentMetricGroup = document.getElementById('parentMetricGroup');
            const dependencyGroup = document.getElementById('dependencyGroup');

            if (type === 'composite') {
                formulaGroup.style.display = 'block';
                parentMetricGroup.style.display = 'flex';
                dependencyGroup.style.display = 'block';
                document.getElementById('parentMetricId').closest('.form-group').style.display = 'none';
                loadMetricOptions('dependencyIds');
            } else if (type === 'derived') {
                formulaGroup.style.display = 'none';
                parentMetricGroup.style.display = 'flex';
                dependencyGroup.style.display = 'none';
                document.getElementById('parentMetricId').closest('.form-group').style.display = 'block';
                loadMetricOptions('parentMetricId');
            } else {
                formulaGroup.style.display = 'none';
                parentMetricGroup.style.display = 'none';
                dependencyGroup.style.display = 'none';
            }
        }

        // 加载指标选项到下拉框（父指标）
        async function loadMetricOptions(selectId, filterType) {
            const token = localStorage.getItem('token');
            let url = '/api/metrics?status=active';
            if (filterType) url += `&metric_type=${filterType}`;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (selectId === 'parentMetricId') {
                    const select = document.getElementById(selectId);
                    const currentVal = select.value;
                    select.innerHTML = '<option value="">-- 选择父指标 --</option>';
                    (data.data || data || []).forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.id;
                        opt.textContent = `${m.metric_code} - ${m.metric_name}`;
                        select.appendChild(opt);
                    });
                    if (currentVal) select.value = currentVal;
                } else if (selectId === 'dependencyIds') {
                    // 缓存所有指标供搜索用
                    window._depMetricOptions = (data.data || data || []).map(m => ({
                        id: m.id, code: m.metric_code, name: m.metric_name
                    }));
                }
            } catch(e) { console.error('加载指标选项失败', e); }
        }

        // === 依赖指标搜索输入框逻辑 ===
        window._selectedDepIds = new Set();

        function clearDepSelection() {
            window._selectedDepIds = new Set();
            document.getElementById('depTags').innerHTML = '';
            document.getElementById('depSearchInput').value = '';
            document.getElementById('depDropdown').classList.remove('show');
        }

        function addDepTag(id, code, name) {
            if (window._selectedDepIds.has(id)) return;
            window._selectedDepIds.add(id);
            const tag = document.createElement('span');
            tag.className = 'dep-tag';
            tag.dataset.id = id;
            tag.innerHTML = `${name}<span class="dep-tag-remove" onclick="removeDepTag(${id})">&times;</span>`;
            document.getElementById('depTags').appendChild(tag);
        }

        function removeDepTag(id) {
            window._selectedDepIds.delete(id);
            const tag = document.querySelector(`.dep-tag[data-id="${id}"]`);
            if (tag) tag.remove();
        }

        (function initDepSearch() {
            document.addEventListener('DOMContentLoaded', () => {
                const input = document.getElementById('depSearchInput');
                const dropdown = document.getElementById('depDropdown');

                input.addEventListener('input', () => {
                    const q = input.value.trim().toLowerCase();
                    if (!q) { dropdown.classList.remove('show'); return; }
                    const opts = (window._depMetricOptions || []).filter(m =>
                        !window._selectedDepIds.has(m.id) &&
                        (m.code.toLowerCase().includes(q) || m.name.toLowerCase().includes(q))
                    );
                    if (opts.length === 0) {
                        dropdown.innerHTML = '<div class="dep-dropdown-empty">无匹配指标</div>';
                    } else {
                        dropdown.innerHTML = opts.slice(0, 10).map(m =>
                            `<div class="dep-dropdown-item" data-id="${m.id}" data-code="${m.code}" data-name="${m.name}">` +
                            `<span class="dep-item-code">${m.code}</span><span class="dep-item-name">${m.name}</span></div>`
                        ).join('');
                    }
                    dropdown.classList.add('show');
                });

                input.addEventListener('focus', () => {
                    if (input.value.trim()) input.dispatchEvent(new Event('input'));
                });

                dropdown.addEventListener('click', (e) => {
                    const item = e.target.closest('.dep-dropdown-item');
                    if (!item) return;
                    addDepTag(parseInt(item.dataset.id), item.dataset.code, item.dataset.name);
                    input.value = '';
                    dropdown.classList.remove('show');
                });

                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.dep-input-wrap')) dropdown.classList.remove('show');
                });
            });
        })();

        // 加载依赖关系并回填
        async function loadDependencies(metricId) {
            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`/api/metrics/${metricId}/dependencies`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const deps = await res.json();
                // 确保指标选项已加载后再回填
                const waitForOptions = () => {
                    if (window._depMetricOptions && window._depMetricOptions.length > 0) {
                        deps.forEach(d => addDepTag(d.id, d.metric_code, d.metric_name));
                    } else {
                        setTimeout(waitForOptions, 100);
                    }
                };
                waitForOptions();
            } catch(e) { console.error('加载依赖关系失败', e); }
        }

        // 监听指标类型切换
        document.getElementById('metricType').addEventListener('change', function() {
            toggleMetricTypeFields(this.value);
        });

        // 编辑指标
        async function editMetric(id) {
            const token = localStorage.getItem('token');
            const res = await fetch(`/api/metrics/${id}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const metric = await res.json();
            openModal(metric);
        }

        // 删除指标（仅管理员）
        async function deleteMetric(id) {
            const token = localStorage.getItem('token');

            // 拉取指标基本信息用于确认提示
            let code = '';
            let name = '';
            try {
                const metricRes = await fetch(`/api/metrics/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const metric = await metricRes.json();
                if (!metricRes.ok) {
                    alert(metric.error || '获取指标信息失败');
                    return;
                }
                code = metric.metric_code || '';
                name = metric.metric_name || '';
            } catch (e) {
                alert('网络错误: ' + e.message);
                return;
            }

            // 先查被依赖情况，如有下游引用则阻断
            try {
                const depRes = await fetch(`/api/metrics/${id}/dependents`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const dependents = await depRes.json();
                if (Array.isArray(dependents) && dependents.length > 0) {
                    const list = dependents.slice(0, 10).map(d => `  · ${d.metric_code} ${d.metric_name}`).join('\n');
                    const more = dependents.length > 10 ? `\n  ...还有 ${dependents.length - 10} 个` : '';
                    alert(`无法删除：该指标被 ${dependents.length} 个下游指标依赖。\n\n${list}${more}\n\n请先解除依赖，或将其状态改为"废弃"。`);
                    return;
                }
            } catch (e) {
                alert('检查依赖失败：' + e.message);
                return;
            }

            if (!confirm(`确定永久删除指标"${code} ${name}"？\n\n此操作不可恢复，将同时删除其标签关联、依赖关系与版本历史。\n如仅想停用，请使用"编辑"将状态改为"废弃"。`)) {
                return;
            }

            try {
                const res = await fetch(`/api/metrics/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await res.json();
                if (!res.ok) {
                    alert(result.error || '删除失败');
                    return;
                }
                loadMetrics();
                loadAssessMetrics();
            } catch (e) {
                alert('网络错误: ' + e.message);
            }
        }

        // 保存指标
        async function saveMetric() {
            const token = localStorage.getItem('token');
            const id = document.getElementById('metricId').value;

            const data = {
                metric_code: document.getElementById('metricCode').value.trim(),
                metric_name: document.getElementById('metricName').value.trim(),
                domain_id: document.getElementById('metricDomain').value || null,
                metric_type: document.getElementById('metricType').value,
                data_type: document.getElementById('metricDataType').value || null,
                unit: document.getElementById('metricUnit').value.trim() || null,
                biz_def: document.getElementById('metricBizDef').value.trim() || null,
                tech_def: document.getElementById('metricTechDef').value.trim() || null,
                dax_def: document.getElementById('metricDaxDef').value.trim() || null,
                source_table: document.getElementById('metricSourceTable').value.trim() || null,
                tag_ids: Array.from(document.querySelectorAll('.tag-checkbox:checked')).map(cb => parseInt(cb.value)),
                formula: document.getElementById('metricFormula').value.trim() || null,
                parent_metric_id: document.getElementById('parentMetricId').value || null,
                dependency_ids: Array.from(window._selectedDepIds || []),
                metric_category: editingCategory,
                assess_dept: editingCategory === 'assessment' ? (document.getElementById('metricAssessDept').value.trim() || null) : null,
                assess_note: editingCategory === 'assessment' ? (document.getElementById('metricAssessNote').value.trim() || null) : null
            };

            if (!data.metric_code || !data.metric_name) {
                alert('指标编码和名称为必填项');
                return;
            }

            if (id) {
                data.change_reason = document.getElementById('changeReason').value.trim() || '内容更新';
                data.status = document.getElementById('metricStatus').value;
            }

            try {
                const res = await fetch(id ? `/api/metrics/${id}` : '/api/metrics', {
                    method: id ? 'PUT' : 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await res.json();
                if (!res.ok) {
                    alert(result.error || '保存失败');
                    return;
                }

                closeModal();
                loadMetrics();
                loadAssessMetrics();
            } catch (e) {
                alert('网络错误: ' + e.message);
            }
        }

        // 显示版本历史
        async function showHistory(id) {
            const token = localStorage.getItem('token');

            // 获取当前指标信息
            const metricRes = await fetch(`/api/metrics/${id}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const metric = await metricRes.json();

            // 获取历史记录
            const historyRes = await fetch(`/api/metrics/${id}/history`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const history = await historyRes.json();

            const timeline = document.getElementById('historyTimeline');

            // 当前版本
            let html = `
                <div class="history-item current">
                    <div class="history-version">v${metric.version} (当前版本)</div>
                    <div class="history-meta">
                        ${metric.metric_code} - ${metric.metric_name}
                    </div>
                    ${metric.biz_def ? `<div class="history-reason">${escapeHtml(metric.biz_def)}</div>` : ''}
                </div>
            `;

            // 历史版本
            history.forEach(h => {
                html += `
                    <div class="history-item">
                        <div class="history-version">v${h.version}</div>
                        <div class="history-meta">
                            ${escapeHtml(h.metric_code)} - ${escapeHtml(h.metric_name)}<br>
                            修改人: ${escapeHtml(h.updated_by_name || '未知')} | ${formatDate(h.updated_at)}
                        </div>
                        ${h.change_reason ? `<div class="history-reason">变更原因: ${escapeHtml(h.change_reason)}</div>` : ''}
                    </div>
                `;
            });

            if (history.length === 0) {
                html += `<div class="empty-state" style="padding:20px;"><p>暂无历史版本</p></div>`;
            }

            timeline.innerHTML = html;
            document.getElementById('historyModal').classList.add('show');
        }

        // 关闭历史弹窗
        function closeHistoryModal() {
            document.getElementById('historyModal').classList.remove('show');
        }

        // 工具函数
        function formatSQL(text) {
            if (!text) return '';
            // 如果已有换行，直接返回转义结果
            if (text.includes('\n')) return escapeHtml(text);
            // 在主要SQL关键字前插入换行
            const keywords = /\b(SELECT|FROM|WHERE|AND|OR|LEFT JOIN|INNER JOIN|RIGHT JOIN|JOIN|ON|GROUP BY|ORDER BY|HAVING|LIMIT|UNION|INSERT|UPDATE|SET|VALUES|DELETE|CREATE|ALTER|DROP|INTO)\b/gi;
            let formatted = text.replace(keywords, (match, kw, offset) => {
                // SELECT 开头不加换行
                if (offset === 0) return match;
                return '\n' + match;
            });
            // AND/OR 缩进两个空格
            formatted = formatted.replace(/\n(AND|OR)\b/gi, '\n  $1');
            return escapeHtml(formatted);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
    </script>

    <!-- 代码放大模态框 -->
    <div class="code-modal-overlay" id="codeModalOverlay" onclick="if(event.target===this)closeCodeModal()">
        <div class="code-modal">
            <div class="code-modal-title" id="codeModalTitle"></div>
            <div class="code-modal-toolbar">
                <button onclick="copyModalCode()">复制</button>
                <button onclick="closeCodeModal()">关闭</button>
            </div>
            <pre id="codeModalPre"></pre>
        </div>
    </div>
    <script>
        function expandCode(btn, lang) {
            const sqlDiv = btn.closest('.md-sql');
            let code = '';
            sqlDiv.childNodes.forEach(node => {
                if (node.nodeType === 3) code += node.textContent;
                else if (!node.classList || (!node.classList.contains('sql-toolbar'))) code += node.textContent;
            });
            code = code.trim();
            document.getElementById('codeModalTitle').textContent = lang;
            const pre = document.getElementById('codeModalPre');
            pre.textContent = code;
            pre.className = lang === 'DAX' ? 'dax' : '';
            document.getElementById('codeModalOverlay').classList.add('show');
        }
        function closeCodeModal() {
            document.getElementById('codeModalOverlay').classList.remove('show');
        }
        function copyModalCode() {
            const code = document.getElementById('codeModalPre').textContent;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(code).then(() => showModalCopyOk());
            } else {
                const ta = document.createElement('textarea');
                ta.value = code;
                ta.style.cssText = 'position:fixed;left:-9999px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showModalCopyOk();
            }
        }
        function showModalCopyOk() {
            const btn = document.querySelector('.code-modal-toolbar button:first-child');
            const orig = btn.textContent;
            btn.textContent = '已复制!';
            btn.style.color = '#4ade80';
            setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 1500);
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCodeModal(); });
    </script>

</body>
