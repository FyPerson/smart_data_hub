<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建设总览 - 智数协同平台</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="assets/css/style.css?v=v1.117.0_fabdrag">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 高透玻璃层级 */
            --acrylic-bg: rgba(255,255,255,0.04);
            --acrylic-card: rgba(255,255,255,0.06);
            --acrylic-card-hover: rgba(255,255,255,0.1);
            --acrylic-border: rgba(255,255,255,0.18);
            --acrylic-border-hover: rgba(255,255,255,0.28);
            --acrylic-divider: rgba(255,255,255,0.08);
            /* Fluent 强调色 */
            --accent: #0078d4;
            --accent-light: #4cc2ff;
            --accent-bg: rgba(0,120,212,0.12);
            --accent-glow: rgba(0,120,212,0.25);
            /* 状态色 */
            --green: #6ccb5f;
            --green-bg: rgba(108,203,95,0.12);
            --amber: #fce100;
            --amber-bg: rgba(252,225,0,0.1);
            /* 文本层级 */
            --text-primary: rgba(255,255,255,0.95);
            --text-secondary: rgba(255,255,255,0.6);
            --text-tertiary: rgba(255,255,255,0.35);
            --text-disabled: rgba(255,255,255,0.18);
            /* Fluent 参数 */
            --font-body: 'Noto Sans SC', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
            --font-mono: 'IBM Plex Mono', 'Cascadia Code', monospace;
            --radius: 8px;
            --radius-lg: 12px;
            --blur: 30px;
        }

        body.dashboard-body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body);
            color: var(--text-secondary);
            overflow-x: hidden;
            background: #0a0f1a;
        }

        /* === 背景层（AI 生成的 3D 玻璃质感背景） === */
        .fluent-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: url('assets/images/dashboard-bg.png?v=2') center/cover no-repeat fixed;
        }

        /* Acrylic 噪点纹理 */
        .acrylic-noise {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }

        .acrylic-noise svg {
            width: 100%;
            height: 100%;
        }

        /* === 页面 === */
        .dashboard-page {
            position: relative;
            z-index: 1;
            padding: 88px 40px 48px;
            max-width: 1340px;
            margin: 0 auto;
        }

        /* === 主玻璃面板 === */
        .acrylic-panel {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(40px) saturate(150%) brightness(1.1);
            -webkit-backdrop-filter: blur(40px) saturate(150%) brightness(1.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-top-color: rgba(255,255,255,0.3);
            border-bottom-color: rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 32px;
            position: relative;
            overflow: hidden;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.18),
                inset 0 -1px 0 rgba(255,255,255,0.04),
                0 4px 0 0 rgba(40,65,120,0.1),
                0 6px 0 0 rgba(255,255,255,0.03),
                0 8px 24px rgba(0,0,0,0.15),
                0 20px 60px rgba(0,0,0,0.18);
        }

        /* 面板内顶部光晕（上亮下暗） */
        .acrylic-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 100%);
            pointer-events: none;
        }

        /* === 面板头部 === */
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        .panel-header h1 {
            font-size: 1.7em;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4), 0 0 20px rgba(100,160,255,0.08);
        }

        .panel-header-date {
            font-family: var(--font-mono);
            font-size: 0.72em;
            color: var(--text-tertiary);
            padding: 5px 12px;
            background: var(--acrylic-card);
            border: 1px solid var(--acrylic-border);
            border-radius: 6px;
        }

        /* === 顶部三栏 === */
        .top-row {
            display: grid;
            grid-template-columns: 1fr 260px 1fr;
            gap: 12px;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        /* === 玻璃子卡片 === */
        .fluent-card {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.03) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-top-color: rgba(255,255,255,0.22);
            border-bottom-color: rgba(255,255,255,0.06);
            border-radius: var(--radius-lg);
            position: relative;
            overflow: hidden;
            transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.1),
                0 2px 0 0 rgba(50,80,140,0.08),
                0 3px 0 0 rgba(255,255,255,0.03),
                0 4px 12px rgba(0,0,0,0.1);
        }

        .fluent-card:hover {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.04) 100%);
            border-color: rgba(255,255,255,0.25);
            border-top-color: rgba(255,255,255,0.32);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.15),
                0 6px 24px rgba(0,0,0,0.18),
                0 4px 0 -1px rgba(80,120,180,0.08);
            transform: translateY(-1px);
        }

        /* Reveal 高光 */
        .fluent-card .reveal-border {
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .fluent-card:hover .reveal-border {
            opacity: 1;
        }

        /* === 进度卡 === */
        .progress-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .progress-card-title {
            font-size: 0.78em;
            color: var(--text-tertiary);
            margin-bottom: 14px;
            font-weight: 500;
        }

        .progress-big-num {
            font-family: var(--font-mono);
            font-size: 3.6em;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3), 0 -1px 0 rgba(255,255,255,0.06);
        }

        .progress-big-num span {
            font-size: 0.35em;
            color: var(--text-tertiary);
            font-weight: 400;
        }

        .progress-sub {
            font-size: 0.75em;
            color: var(--text-tertiary);
            margin-bottom: 16px;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 4px;
            background: var(--accent);
            transition: width 2s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .progress-bar-label {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-family: var(--font-mono);
            font-size: 0.65em;
            color: var(--text-disabled);
        }

        /* === 中间指标 === */
        .metrics-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .metric-chip {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .metric-chip-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .metric-chip-icon svg {
            width: 18px;
            height: 18px;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .metric-chip-icon.mc-domains { background: var(--accent-bg); }
        .metric-chip-icon.mc-domains svg { stroke: var(--accent-light); }
        .metric-chip-icon.mc-online { background: var(--green-bg); }
        .metric-chip-icon.mc-online svg { stroke: var(--green); }
        .metric-chip-icon.mc-planned { background: var(--amber-bg); }
        .metric-chip-icon.mc-planned svg { stroke: var(--amber); }

        .metric-chip-body { flex: 1; }

        .metric-chip-value {
            font-family: var(--font-mono);
            font-size: 1.5em;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1;
        }

        .metric-chip-label {
            font-size: 0.7em;
            color: var(--text-tertiary);
            margin-top: 3px;
        }

        /* === 数据源 === */
        .source-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .source-card {
            padding: 16px 18px;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .source-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .source-dot.bms { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
        .source-dot.hrd { background: #a78bfa; box-shadow: 0 0 6px rgba(167,139,250,0.25); }

        .source-card-info { flex: 1; }

        .source-card-name {
            font-size: 0.82em;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1px;
        }

        .source-card-desc {
            font-size: 0.68em;
            color: var(--text-tertiary);
        }

        .source-card-badge {
            font-family: var(--font-mono);
            font-size: 0.68em;
            color: var(--text-tertiary);
            padding: 3px 8px;
            background: var(--acrylic-card);
            border-radius: 6px;
        }

        /* === 域区块 === */
        .domain-section {
            margin-top: 24px;
            position: relative;
            z-index: 1;
        }

        .domain-section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .domain-section-tag {
            font-family: var(--font-mono);
            font-size: 0.65em;
            font-weight: 500;
            letter-spacing: 2px;
            padding: 4px 12px;
            border-radius: 6px;
        }

        .domain-section-tag.dst-online {
            background: var(--green-bg);
            color: var(--green);
        }

        .domain-section-tag.dst-planned {
            background: var(--acrylic-card);
            color: var(--text-tertiary);
        }

        .domain-section-line {
            flex: 1;
            height: 1px;
            background: var(--acrylic-divider);
        }

        .domain-section-meta {
            font-family: var(--font-mono);
            font-size: 0.6em;
            color: var(--text-disabled);
            letter-spacing: 1px;
        }

        /* === 域卡片网格 === */
        .domain-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .domain-grid + .domain-section {
            margin-top: 28px;
        }

        /* === 域卡片 === */
        .domain-card {
            padding: 20px;
        }

        /* 已上线 - 左侧色条（贴合圆角） */
        .domain-card.online::after {
            content: '';
            position: absolute;
            left: 0;
            top: -1px;
            bottom: -1px;
            width: 4px;
            border-radius: var(--radius-lg) 0 0 var(--radius-lg);
            background: linear-gradient(180deg, var(--card-color), var(--card-glow));
            box-shadow: 0 0 10px var(--card-glow), 0 0 24px var(--card-glow);
        }

        .domain-card.online {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 100%);
            /* 厚度模拟：底部亮边 + 底部阴影 + 扩散阴影 */
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.12),
                0 3px 0 0 rgba(50,80,140,0.12),
                0 4px 0 0 rgba(255,255,255,0.04),
                0 6px 16px rgba(0,0,0,0.15);
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s, border-color 0.3s;
        }

        .domain-card.online:hover {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.11) 0%, rgba(255,255,255,0.04) 100%);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-2px);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.16),
                0 3px 0 0 rgba(50,80,140,0.15),
                0 5px 0 0 rgba(255,255,255,0.05),
                0 10px 30px rgba(0,0,0,0.2);
        }

        .domain-card.planned {
            opacity: 0.5;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.05),
                0 2px 0 0 rgba(40,60,100,0.06),
                0 3px 8px rgba(0,0,0,0.08);
        }

        .domain-card.planned:hover {
            opacity: 0.75;
            transform: translateY(-1px);
            background:
                linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 3px 0 0 rgba(40,60,100,0.08),
                0 6px 16px rgba(0,0,0,0.12);
        }

        /* 卡片头 */
        .card-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .domain-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .domain-card.online .domain-icon {
            background: var(--card-bg);
        }

        .domain-card.planned .domain-icon {
            background: rgba(255,255,255,0.03);
        }

        .domain-icon svg { width: 17px; height: 17px; }
        .domain-card.online .domain-icon svg { stroke: var(--card-color); }
        .domain-card.planned .domain-icon svg { stroke: var(--text-disabled); }

        .card-titles { flex: 1; min-width: 0; }

        .domain-name {
            font-size: 0.88em;
            font-weight: 600;
        }

        .domain-card.online .domain-name {
            color: var(--text-primary);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2), 0 -1px 0 rgba(255,255,255,0.04);
        }
        .domain-card.planned .domain-name { color: var(--text-tertiary); }

        .domain-sub {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
        }

        .domain-source-tag {
            font-family: var(--font-mono);
            font-size: 0.6em;
            padding: 1px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            background: rgba(255,255,255,0.04);
            color: var(--text-tertiary);
        }

        .domain-status-badge {
            font-size: 0.6em;
            padding: 1px 7px;
            border-radius: 4px;
            font-weight: 500;
        }

        .domain-card.online .domain-status-badge {
            background: var(--green-bg);
            color: var(--green);
        }

        .domain-card.planned .domain-status-badge {
            background: var(--acrylic-card);
            color: var(--text-disabled);
        }

        /* DWD 子表 */
        .dwd-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .dwd-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 5px 0;
        }

        .dwd-check {
            width: 15px;
            height: 15px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .dwd-row.online .dwd-check {
            background: var(--card-bg);
            border: 1px solid var(--card-glow);
        }

        .dwd-row.online .dwd-check svg {
            width: 9px;
            height: 9px;
            stroke: var(--card-color);
            stroke-width: 2.5;
            fill: none;
        }

        .dwd-row.planned .dwd-check {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .dwd-text {
            font-size: 0.78em;
        }

        .dwd-row.online .dwd-text { color: var(--text-secondary); }
        .dwd-row.planned .dwd-text { color: var(--text-disabled); }

        /* === 底部 === */
        .panel-footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid var(--acrylic-divider);
            position: relative;
            z-index: 1;
        }

        .panel-footer span {
            font-size: 0.65em;
            color: var(--text-disabled);
            letter-spacing: 2px;
        }

        /* === 响应式 === */
        @media (max-width: 1100px) {
            .top-row { grid-template-columns: 1fr 1fr; }
            .source-col { grid-column: 1 / 3; flex-direction: row; }
            .domain-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 900px) {
            .dashboard-page { padding: 80px 16px 32px; }
            .acrylic-panel { padding: 20px; border-radius: 12px; }
            .top-row { grid-template-columns: 1fr; }
            .source-col { flex-direction: column; grid-column: auto; }
            .progress-big-num { font-size: 2.8em; }
            .domain-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 500px) {
            .domain-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

    <script>
        const CHECK_SVG = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';

        const DOMAIN_COLORS = {
            contract:   { color: '#4cc2ff', glow: 'rgba(76,194,255,0.25)',  bg: 'rgba(76,194,255,0.1)' },
            bidding:    { color: '#ffb900', glow: 'rgba(255,185,0,0.25)',   bg: 'rgba(255,185,0,0.1)' },
            customer:   { color: '#b4a0ff', glow: 'rgba(180,160,255,0.25)', bg: 'rgba(180,160,255,0.1)' },
            legal:      { color: '#36d8b7', glow: 'rgba(54,216,183,0.25)',   bg: 'rgba(54,216,183,0.1)' },
            project:    { color: '#6b69d6', glow: 'rgba(107,105,214,0.25)', bg: 'rgba(107,105,214,0.1)' },
            invoice:    { color: '#0078d4', glow: 'rgba(0,120,212,0.25)',   bg: 'rgba(0,120,212,0.1)' },
            payment:    { color: '#e3008c', glow: 'rgba(227,0,140,0.25)',   bg: 'rgba(227,0,140,0.1)' },
            settlement: { color: '#d13438', glow: 'rgba(209,52,56,0.25)',   bg: 'rgba(209,52,56,0.1)' },
            hr:         { color: '#6ccb5f', glow: 'rgba(108,203,95,0.25)',  bg: 'rgba(108,203,95,0.1)' },
            salary:     { color: '#00cc6a', glow: 'rgba(0,204,106,0.25)',   bg: 'rgba(0,204,106,0.1)' },
            social:     { color: '#038387', glow: 'rgba(3,131,135,0.25)',   bg: 'rgba(3,131,135,0.1)' },
            approval:   { color: '#f7630c', glow: 'rgba(247,99,12,0.25)',   bg: 'rgba(247,99,12,0.1)' },
            injury:     { color: '#e81123', glow: 'rgba(232,17,35,0.25)',   bg: 'rgba(232,17,35,0.1)' },
        };

        const ICONS = {
            contract:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
            bidding:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
            customer:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
            legal:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1L1 7l11 6 11-6-11-6z"/><path d="M1 17l11 6 11-6"/><path d="M1 12l11 6 11-6"/></svg>',
            project:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
            invoice:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/></svg>',
            payment:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>',
            settlement: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
            hr:         '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
            salary:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H3v16h18V4z"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>',
            social:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
            approval:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
            injury:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
        };

        const domains = [
            { name: '合同域', key: 'contract', source: 'BMS', tables: [
                { label: '合同主表', status: 'online' }, { label: '合同变更表', status: 'online' }, { label: '续签链路表', status: 'online' },
            ]},
            { name: '招投标域', key: 'bidding', source: 'BMS', tables: [
                { label: '投标项目表', status: 'online' },
            ]},
            { name: '客户域', key: 'customer', source: 'BMS', tables: [
                { label: '客户管户表', status: 'online' }, { label: '客户拜访表', status: 'online' },
            ]},
            { name: '法务域', key: 'legal', source: 'BMS', tables: [
                { label: '劳动投诉表', status: 'online' }, { label: '劳动争议表', status: 'online' },
            ]},
            { name: '项目域', key: 'project', source: 'BMS', tables: [
                { label: '项目主表', status: 'planned' }, { label: '项目实施表', status: 'planned' },
                { label: '项目结项表', status: 'planned' }, { label: '人员调动表', status: 'planned' },
            ]},
            { name: '开票域', key: 'invoice', source: 'BMS', tables: [
                { label: '发票主表', status: 'planned' }, { label: '发票明细表', status: 'planned' },
            ]},
            { name: '收付款域', key: 'payment', source: 'BMS', tables: [
                { label: '收付款表', status: 'planned' }, { label: '付款账单表', status: 'planned' },
            ]},
            { name: '结算域', key: 'settlement', source: 'BMS', tables: [
                { label: '结算单表', status: 'planned' }, { label: '结算明细表', status: 'planned' },
            ]},
            { name: '人力资源域', key: 'hr', source: 'HRD', tables: [
                { label: '员工主数据表', status: 'planned' }, { label: '劳动合同表', status: 'planned' }, { label: '入离职表', status: 'planned' },
            ]},
            { name: '薪酬域', key: 'salary', source: 'HRD', tables: [
                { label: '工资单表', status: 'planned' }, { label: '薪资明细表', status: 'planned' },
            ]},
            { name: '社保公积金域', key: 'social', source: 'HRD', tables: [
                { label: '社保账户表', status: 'planned' }, { label: '公积金表', status: 'planned' }, { label: '社保增减员表', status: 'planned' },
            ]},
            { name: '审批流程域', key: 'approval', source: 'BMS+HRD', tables: [
                { label: '审批事件表', status: 'planned' },
            ]},
            { name: '工伤保险域', key: 'injury', source: 'HRD', tables: [
                { label: '工伤案件表', status: 'planned' }, { label: '商业保险表', status: 'planned' },
            ]},
        ];

        function countTables(status) {
            return domains.reduce((s, d) => s + d.tables.filter(t => t.status === status).length, 0);
        }

        // 日期
        (function() {
            const now = new Date();
            document.getElementById('headerDate').textContent =
                `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
        })();

        // 数据源
        document.getElementById('bmsBadge').textContent = domains.filter(d => d.source.includes('BMS')).length + ' 域';
        document.getElementById('hrdBadge').textContent = domains.filter(d => d.source.includes('HRD')).length + ' 域';

        // 进度条
        setTimeout(() => {
            const pct = Math.round(countTables('online') / domains.reduce((s,d) => s + d.tables.length, 0) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
        }, 500);

        // === Reveal 高光效果（统一处理） ===
        document.addEventListener('mousemove', function(e) {
            document.querySelectorAll('.fluent-card').forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const rb = card.querySelector('.reveal-border');
                if (!rb) return;
                // 判断鼠标是否在卡片附近（含 60px 外围）
                const inRange = x > -60 && x < rect.width + 60 && y > -60 && y < rect.height + 60;
                if (inRange) {
                    rb.style.opacity = '1';
                    rb.style.background = `radial-gradient(150px circle at ${x}px ${y}px, rgba(255,255,255,0.15), transparent 55%)`;
                } else {
                    rb.style.opacity = '0';
                }
            });
        });

        // 域卡片
        function renderCard(d) {
            const c = DOMAIN_COLORS[d.key];
            const isOnline = d.tables.some(t => t.status === 'online');
            const st = isOnline ? 'online' : 'planned';

            const rows = d.tables.map(t => `
                <div class="dwd-row ${t.status}">
                    <span class="dwd-check">${t.status === 'online' ? CHECK_SVG : ''}</span>
                    <span class="dwd-text">${t.label}</span>
                </div>`).join('');

            return `
            <div class="fluent-card domain-card ${st}" style="--card-color:${c.color};--card-glow:${c.glow};--card-bg:${c.bg}">
                <div class="reveal-border"></div>
                <div class="card-head">
                    <div class="domain-icon">${ICONS[d.key]}</div>
                    <div class="card-titles">
                        <div class="domain-name">${d.name}</div>
                        <div class="domain-sub">
                            <span class="domain-source-tag">${d.source}</span>
                            <span class="domain-status-badge">${isOnline ? '已上线' : '待建设'}</span>
                        </div>
                    </div>
                </div>
                <div class="dwd-list">${rows}</div>
            </div>`;
        }

        const online = domains.filter(d => d.tables.some(t => t.status === 'online'));
        const planned = domains.filter(d => !d.tables.some(t => t.status === 'online'));

        document.getElementById('onlineMeta').textContent = `${online.length} 域 · ${countTables('online')} 表`;
        document.getElementById('plannedMeta').textContent = `${planned.length} 域 · ${countTables('planned')} 表`;
        document.getElementById('onlineGrid').innerHTML = online.map(renderCard).join('');
        document.getElementById('plannedGrid').innerHTML = planned.map(renderCard).join('');

        // 数字动画
        setTimeout(() => {
            ['mv1','mv2','mv3'].forEach(id => {
                const el = document.getElementById(id);
                const target = parseInt(el.textContent);
                let cur = 0;
                const step = Math.max(1, Math.floor(target / 12));
                const timer = setInterval(() => {
                    cur = Math.min(cur + step, target);
                    el.textContent = cur;
                    if (cur >= target) clearInterval(timer);
                }, 60);
            });
        }, 400);
    </script>
