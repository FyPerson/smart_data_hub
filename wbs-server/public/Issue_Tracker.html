<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据开发 - 智数协同平台</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="assets/css/style.css?v=v1.141.0_badge2">
    <link rel="stylesheet" href="assets/css/components.css?v=v1.153.0_fastlanetier15">
    <style>
        /* ============================================================
           需求跟踪页 · 页面专属残留（共享组件层已迁移至 assets/css/components.css）
           前端统一 C3（全对齐方案）：本页与数据修正基准页结构/配色高度一致，共享安全组件（筛选栏/按钮/
           统计卡片/表格/徽章 base/抽屉/弹窗/表单/操作栏/空状态）全部并入共享层，采用共享 u- 全部取值
           （含 amber 头/600 宽/焦点 ring），不 override 保留原值——唯一例外为下方表格 min-width（本页
           12 列比共享层默认 1100 更宽，需 1200）。仅保留详情网格/评论区/优先级色点/时间显示等
           页面专属结构（未并入共享层，class 名与 CSS 均不变）。
           ============================================================ */

        /* 表格（页面专属覆盖）：共享 .u-corr-table 默认 min-width 1100，本页 12 列需 1200（C6c M-4） */
        .unified-page .u-corr-table { min-width: 1200px; }

        /* 优先级样式已统一为共享徽章 components.css .u-pri（状态列/优先级列统一轮 2026-07-10：
           原页面专属 .priority-dot 圆点删除，与系统迭代同款色底徽章） */

        /* 类型标签修饰色（base 已 harmonize → components.css .u-type-tag；7 类类型色块，
           类名规范化：/ 和空格 → -，对齐 typeClass() JS helper） */
        .u-type-tag.t-看板-报表需求 { background: #dbeafe; color: #1d4ed8; }
        .u-type-tag.t-数据治理需求 { background: #e0e7ff; color: #4338ca; }
        .u-type-tag.t-数据应用需求 { background: #ede9fe; color: #6d28d9; }
        .u-type-tag.t-平台-bug { background: #fee2e2; color: #dc2626; }
        .u-type-tag.t-数据质量 { background: #fef3c7; color: #92400e; }
        .u-type-tag.t-源系统变更 { background: #fce7f3; color: #9d174d; }
        .u-type-tag.t-调度异常 { background: #fecaca; color: #991b1b; }

        /* 状态徽章语义别名（6 态·class 用中文状态值；—— 状态徽章统一 v1.2 §2.2 S2 接线 ——）
           色值全部来自 components.css :root 语义色板，本页不再写具体色值；别名替换原 direct 声明
           禁双存（复审 M-1）；六值齐设、一律 var() 引用。
           本页无语义变化（方案 §2.4：仅 C 观感）——各态映射到与原色最近的语义层。
           注意「已关闭」的用户可见文案由 statusDisplayLabel()(:1792) 改显「已完成」，故映射 done（绿）；
           class 片段仍是 s-已关闭（数据值不变，写读同源）。 */
        .u-status-badge.s-待处理 { --sb-bg: var(--sem-wait-bg); --sb-fg: var(--sem-wait-fg); --sb-bd: var(--sem-wait-bd); --sb-bds: var(--sem-wait-bds); --sb-dot: var(--sem-wait-dot); --sb-deco: var(--sem-wait-deco); }
        .u-status-badge.s-处理中 { --sb-bg: var(--sem-active-bg); --sb-fg: var(--sem-active-fg); --sb-bd: var(--sem-active-bd); --sb-bds: var(--sem-active-bds); --sb-dot: var(--sem-active-dot); --sb-deco: var(--sem-active-deco); }
        .u-status-badge.s-待验证 { --sb-bg: var(--sem-review-bg); --sb-fg: var(--sem-review-fg); --sb-bd: var(--sem-review-bd); --sb-bds: var(--sem-review-bds); --sb-dot: var(--sem-review-dot); --sb-deco: var(--sem-review-deco); }
        .u-status-badge.s-已关闭 { --sb-bg: var(--sem-done-bg); --sb-fg: var(--sem-done-fg); --sb-bd: var(--sem-done-bd); --sb-bds: var(--sem-done-bds); --sb-dot: var(--sem-done-dot); --sb-deco: var(--sem-done-deco); }
        .u-status-badge.s-已暂缓 { --sb-bg: var(--sem-hold-bg); --sb-fg: var(--sem-hold-fg); --sb-bd: var(--sem-hold-bd); --sb-bds: var(--sem-hold-bds); --sb-dot: var(--sem-hold-dot); --sb-deco: var(--sem-hold-deco); }
        .u-status-badge.s-已拒绝 { --sb-bg: var(--sem-rejected-bg); --sb-fg: var(--sem-rejected-fg); --sb-bd: var(--sem-rejected-bd); --sb-bds: var(--sem-rejected-bds); --sb-dot: var(--sem-rejected-dot); --sb-deco: var(--sem-rejected-deco); }

        /* 通知状态徽章修饰色（base 已 harmonize → components.css .u-notify-badge；C6c：notify_status 配色 H-4）
           〔状态徽章统一 S5a·口径二〕两处改动：
             ① 前缀 `notify-*` → `n-*`，与 Data_Correction 的 `t-*` / Issue_Tracker 的 `t-*` 同款短前缀对齐；
             ② 色值改语义色板 token 引用（sent→done / failed→failed / not_sent→wait）。
           **deco 不继承**（终审 L）：通知族不是主状态徽章族，映射到某层时只取色，不带删除线等文字修饰。
           `no_phone` 一态方案里写了"若有"——S0 实测本页 CHECK 只有三值、全仓 grep 零命中，故不建规则。
           次级/通知族**只把已有的 background/color 换成 token**，不新增 border 声明：
           加边框会改盒子尺寸，那是观感重构不是"色值 token 化"，超出口径二范围。 */
        .u-notify-badge.n-sent { background: var(--sem-done-bg); color: var(--sem-done-fg); }
        .u-notify-badge.n-failed { background: var(--sem-failed-bg); color: var(--sem-failed-fg); cursor: help; }
        .u-notify-badge.n-not_sent { background: var(--sem-wait-bg); color: var(--sem-wait-fg); }
        /* 〔S5a-fix MED-7〕原此处有三条 `notify-*` 旧类兼容别名，**已删**。
           删除理由：兼容别名的成文前提是「可能还有页面在渲染旧类名」——而这里 CSS 与产出 class 的
           JS **同在一个 HTML 文件里、同一版发布**，浏览器不可能拿到"新 CSS + 旧 JS"的组合；
           那个前提在本项目的单文件页面结构下根本不可达。留着只会变成第二份要维护的色值来源。 */

        /* ===== 详情网格（页面专属，未并入共享层）===== */
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 20px;
            margin-bottom: 20px;
        }
        .detail-item label {
            display: block;
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .detail-item .detail-value {
            font-size: 13px;
            color: #111827;
        }
        .detail-item.full-width {
            grid-column: 1 / -1;
        }
        .detail-desc {
            background: #f9fafb;
            border-radius: 8px;
            padding: 14px;
            font-size: 13px;
            color: #374151;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 40px;
        }
        .preview-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
        }
        .preview-link:hover { text-decoration: underline; }

        /* 评论区（页面专属，未并入共享层） */
        .comments-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin: 0 0 12px;
        }
        .comment-item {
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .comment-item:last-child { border-bottom: none; }
        .comment-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .comment-author {
            font-size: 13px;
            font-weight: 600;
            color: #111827;
        }
        .comment-time {
            font-size: 11px;
            color: #9ca3af;
        }
        .comment-content {
            font-size: 13px;
            color: #374151;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .comment-input-area {
            margin-top: 16px;
            display: flex;
            gap: 8px;
        }
        .comment-input-area textarea {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 13px;
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
            outline: none;
        }
        .comment-input-area textarea:focus { border-color: #d97706; }
        .comment-input-area button {
            align-self: flex-end;
        }

        /* 时间显示（页面专属，未并入共享层） */
        .time-relative { color: #6b7280; font-size: 12px; }
        .time-absolute { color: #6b7280; font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    </style>
</head>

    <script src="assets/js/app.js?v=v1.142.0_notify1"></script>

    <!-- S5（前端统一 贴图粘贴扩展方案 20260801_v0.1）：Ctrl+V 贴图共享层接入。文件本体未改，沿用
         S5 checkVersion 下沉后的缓存串；改共享层本体时须同步 bump 这里 + 所有引用页。 -->
    <script src="assets/js/u-paste.js?v=v1.134.0_upaste3"></script>
    <script>
        let allIssues = [];
        let allUsers = [];
        let currentStatusFilter = '';
        let searchTimer = null;

        function syncIssueStatCardsActive() {
            document.querySelectorAll('#statsRow .u-stat-card').forEach(card => {
                card.classList.toggle('active', card.dataset.status === currentStatusFilter);
            });
        }

        // ===== 表头排序（前端统一：共享层 UnifyHelpers.attachTableSort）=====
        // 本页有三个独立枚举字段（优先级/通知/状态）各自需要业务序，非 Data_Collab 那种单一 status
        // 字段场景——用 statusOrder 的"按字段分命名空间"形状 { field: { value: order } }（unify-helpers.js
        // compareByType 自动判别两种形状，向后兼容 Data_Collab 的 flat 单枚举写法）。
        const ISSUE_SORT_FIELD_TYPES = {
            id: 'number',
            priority: 'statusOrder',
            type: 'string',
            notify_status: 'statusOrder',
            status: 'statusOrder',
            title: 'string',
            assigned_to_name: 'string',
            created_by_name: 'string',
            requester_dept: 'string',
            data_domain: 'string',
            oa_number: 'string',
            created_at: 'date',
        };
        const issueSorter = UnifyHelpers.attachTableSort({
            tableSelector: '#issueListTable',
            fieldTypes: ISSUE_SORT_FIELD_TYPES,
            statusOrder: {
                priority: { P0: 0, P1: 1, P2: 2, P3: 3 },
                notify_status: { not_sent: 0, failed: 1, sent: 2 },
                status: { '待处理': 0, '处理中': 1, '待验证': 2, '已关闭': 3 },
            },
            getList: () => allIssues,
            render: renderTable,
            defaultSort: { field: 'id', dir: 'desc' },
            pagination: { containerSelector: '#issuePagination' },
        });

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof checkAuth === 'function') {
                const ok = await checkAuth();
                if (!ok) return;
            }
            trInitUPaste();   // S5：注册本页贴图目标区
            await loadUsers();
            await loadFilterDropdowns(); // C6c：填充部门/数据域筛选下拉
            syncIssueStatCardsActive();
            await loadIssues();
            issueSorter.init(); // 前端统一：表头排序初始化（loadIssues 后绑定）

            // 调度异常显示异常时间字段
            document.getElementById('formType').addEventListener('change', function() {
                document.getElementById('errorTimeGroup').style.display = this.value === '调度异常' ? 'block' : 'none';
            });

            // v1.74.1 M-3：钉钉完成通知深链 ?id=N 直达详情（对齐 collab Data_Collab.html:4983 既有深链范式）。
            //   /^\d+$/ 严格匹配纯数字串（挡 abc/12abc/-1 脏值，比 parseInt 更严，避免拼脏值进 fetch）；
            //   codex 25 L-4：再加 Number.isSafeInteger && >0 收紧——挡 0 / 超大整数（parseInt 精度丢失），
            //   与 buildIssueDeepLink「只发正整数 id」约束一致。脏 id 漏过校验也无碍——openDrawer 后端返非 2xx 静默 return。
            try {
                const deepId = new URLSearchParams(window.location.search).get('id');
                if (deepId && /^\d+$/.test(deepId)) {
                    const idNum = parseInt(deepId, 10);
                    if (Number.isSafeInteger(idNum) && idNum > 0) openDrawer(idNum);
                }
            } catch (e) { /* ignore */ }
        });

        // C6c：填充筛选栏部门 + 数据域下拉
        //   部门筛选侧保留"系统自动"（FDL 工单可按它筛，§4.1）；数据域复用 loadDataDomains 缓存
        async function loadFilterDropdowns() {
            const deptSel = document.getElementById('filterDept');
            const deptList = ISSUE_REQUESTER_DEPTS.concat(['系统自动']);
            deptSel.innerHTML = '<option value="">全部部门</option>' +
                deptList.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
            const domSel = document.getElementById('filterDomain');
            const domains = await loadDataDomains();
            domSel.innerHTML = '<option value="">全部数据域</option>' +
                domains.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
        }

        // ===== 数据加载 =====

        async function loadUsers() {
            try {
                const res = await authFetch('/api/users/active');
                if (!res || !res.ok) return;
                allUsers = await res.json();
                const sel = document.getElementById('filterAssigned');
                allUsers.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u.id;
                    opt.textContent = u.display_name || u.username;
                    sel.appendChild(opt);
                });
            } catch (e) { console.error('加载用户列表失败', e); }
        }

        async function loadIssues() {
            try {
                const params = buildIssueFilterParams(true); // 含 status 筛选
                const res = await authFetch(`/api/issues?${params.toString()}`);
                if (!res || !res.ok) return;
                allIssues = await res.json();
                issueSorter.render();
                updateStats();
            } catch (e) { console.error('加载需求列表失败', e); }
        }

        function debounceSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => loadIssues(), 300);
        }

        function filterByStatus(status) {
            currentStatusFilter = status;
            syncIssueStatCardsActive();
            loadIssues();
        }

        // ===== 渲染 =====
        // 前端统一：renderTable(sorted) 由 issueSorter.render() 调用，参数已是排序后的数组
        //   （不再直接读 allIssues 全局——排序态下 allIssues 顺序不变，展示顺序由 sorted 决定）。
        function renderTable(sorted) {
            const tbody = document.getElementById('issueTableBody');
            const empty = document.getElementById('emptyState');

            if (!sorted.length) {
                tbody.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            // 12 列（#/优先级/类型/通知/状态/标题/开发/创建人/部门/数据域/OA/创建时间）——列名术语统一轮 2026-07-10
            //   v1.75.2：删更新时间列（用户诉求列表只看创建时间）；创建时间改 formatFullTime 完整 YYYY-MM-DD HH:mm:ss 绝对时间
            //   H-1：所有后端文本字段走 escapeHtml；窄列加 .ellip + title 单行省略
            tbody.innerHTML = sorted.map(issue => `
                <tr onclick="openDrawer(${issue.id})">
                    <td style="color:#9ca3af; font-size:12px;">#${issue.id}</td>
                    <td><span class="u-pri ${itPriClass(issue.priority)}">${escapeHtml(issue.priority)}</span></td>
                    <td><span class="u-type-tag ${typeClass(issue.type)}">${escapeHtml(issue.type)}</span></td>
                    <td><span class="u-status-badge ${itStatusClass(issue.status)}">${escapeHtml(statusDisplayLabel(issue.status))}</span></td>
                    <td>${notifyBadge(issue)}</td>
                    <td style="font-weight:500; max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                        ${escapeHtml(issue.title)}
                        ${issue.acceptance_url ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" style="margin-left:4px;vertical-align:middle;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' : ''}
                    </td>
                    <td>${issue.assigned_to_name ? escapeHtml(issue.assigned_to_name) : '<span style="color:#d1d5db;">未指派</span>'}</td>
                    <td>${escapeHtml(issue.created_by_name || '')}</td>
                    <td class="ellip" title="${escapeHtml(issue.requester_dept || '')}">${escapeHtml(issue.requester_dept || '')}</td>
                    <td class="ellip">${domainText(issue.data_domain)}</td>
                    <td class="ellip" title="${escapeHtml(formatOaNo(issue.oa_number))}">${formatOaNo(issue.oa_number) ? escapeHtml(formatOaNo(issue.oa_number)) : '<span style="color:#d1d5db;">-</span>'}</td>
                    <td class="time-absolute">${escapeHtml(formatFullTime(issue.created_at))}</td>
                </tr>
            `).join('');
        }

        // C6c（codex C-5/C-6）：列表与统计共用筛选参数构造，保证统计尊重 type/priority/assigned/dept/domain/search
        //   withStatus=true 含 currentStatusFilter（列表用）；false 不含（统计卡片要算各状态全量）
        function buildIssueFilterParams(withStatus) {
            const params = new URLSearchParams();
            const type = document.getElementById('filterType').value;
            const priority = document.getElementById('filterPriority').value;
            const assigned = document.getElementById('filterAssigned').value;
            const dept = document.getElementById('filterDept').value;
            const domain = document.getElementById('filterDomain').value;
            const search = document.getElementById('filterSearch').value.trim();
            if (withStatus && currentStatusFilter) params.set('status', currentStatusFilter);
            if (type) params.set('type', type);
            if (priority) params.set('priority', priority);
            if (assigned) params.set('assigned_to', assigned);
            if (dept) params.set('requester_dept', dept);
            if (domain) params.set('data_domain', domain);
            if (search) params.set('search', search);
            return params;
        }

        async function updateStats() {
            try {
                const params = buildIssueFilterParams(false); // 不含 status，算各状态全量
                const res = await authFetch(`/api/issues?${params.toString()}`);
                if (!res || !res.ok) return;
                const all = await res.json();

                document.getElementById('statAll').textContent = all.length;
                document.getElementById('statPending').textContent = all.filter(i => i.status === '待处理').length;
                document.getElementById('statInProgress').textContent = all.filter(i => i.status === '处理中').length;
                document.getElementById('statVerify').textContent = all.filter(i => i.status === '待验证').length;
                document.getElementById('statClosed').textContent = all.filter(i => i.status === '已关闭').length;
            } catch (e) { /* ignore */ }
        }

        // ===== 详情抽屉 =====

        async function openDrawer(issueId) {
            try {
                const res = await authFetch(`/api/issues/${issueId}`);
                if (!res || !res.ok) return;
                const issue = await res.json();
                renderDrawer(issue);
                document.getElementById('drawerOverlay').classList.add('open');
                document.getElementById('drawer').classList.add('open');
            } catch (e) { console.error('加载需求详情失败', e); }
        }

        function closeDrawer() {
            document.getElementById('drawerOverlay').classList.remove('open');
            document.getElementById('drawer').classList.remove('open');
        }

        function renderDrawer(issue) {
            document.getElementById('drawerTitle').textContent = `#${issue.id} ${issue.title}`;
            const isManager = currentUser && (currentUser.role === 'admin' || currentUser.role === 'publisher');
            const isAdmin = currentUser && currentUser.role === 'admin';
            // H-1（C8 合并审）：被指派本人——后端 PUT /status 允许被指派人推进到「处理中/待验证」
            //   （server.js:10159-10172 ASSIGNEE_ALLOWED_TARGETS），故状态按钮可见性须对齐后端，
            //   不能整块包在 isManager 下（否则被指派 user 看不到推进按钮 + publisher 看到终态按钮点了必 403）。
            const isAssignee = currentUser && issue.assigned_to != null && Number(issue.assigned_to) === Number(currentUser.id);
            // 6 态状态机（逐字对齐后端 ISSUE_STATUS_TRANSITIONS，server.js:85-92）
            const statusTransitions = {
                '待处理': ['处理中', '已暂缓', '已拒绝'],
                '处理中': ['待验证', '已暂缓'],
                '待验证': ['已关闭', '处理中'],
                '已关闭': ['处理中'],
                '已暂缓': ['待处理'],
                '已拒绝': []
            };
            const nextStatuses = statusTransitions[issue.status] || [];

            // H-1：每个目标态按后端真实放行集计算可见性——
            //   admin 全部可见；被指派人（user/publisher 本人）仅「处理中/待验证」可见（对齐 ASSIGNEE_ALLOWED_TARGETS）。
            //   终态（已关闭/已暂缓/已拒绝）+ 激活（已暂缓→待处理）仅 admin（server.js:10163-10167）。
            //   ⚠️ 前端可见性仅为体验对齐，后端 line 10159-10172 才是真闸门，前端永不作权限来源（changeStatus 失败兜底展后端 message）。
            const ASSIGNEE_STATUS_TARGETS = ['处理中', '待验证'];
            const canDoStatus = (s) => isAdmin || (isAssignee && ASSIGNEE_STATUS_TARGETS.includes(s));
            const visibleStatuses = nextStatuses.filter(canDoStatus);

            // E1（建单人编辑权限，2026-07-23）：建单人本人对自己的单可编辑录入信息，限非终态
            //   （已关闭/已拒绝锁定）。可见性对齐后端 PUT /api/issues/:id 双通道判定（后端才是真闸门）。
            // M-4（codex E1 审）：镜像后端 id>0 约束——currentUser.id 规范化为正整数再参与建单人比较，
            //   防 null/0/空串等异常值在前端误显编辑按钮（点了必被后端拒）。
            const _uid = currentUser ? Number(currentUser.id) : NaN;
            const isCreator = Number.isInteger(_uid) && _uid > 0 && Number(issue.created_by) === _uid;
            const creatorCanEdit = isCreator && !isManager && !['已关闭', '已拒绝'].includes(issue.status);

            let html = '';

            // 操作栏：isManager（指派/编辑/删除/通知）或 有可见状态按钮（被指派 user 推进）或 建单人可编辑 时渲染容器
            if (isManager || visibleStatuses.length > 0 || creatorCanEdit) {
                html += `<div class="u-action-bar u-action-bar-sticky">`;
                // 状态流转（按 H-1 过滤后的 visibleStatuses）
                visibleStatuses.forEach(s => {
                    const btnClass = s === '已关闭' ? 'u-btn-secondary' : 'u-btn-primary';
                    html += `<button class="${btnClass}" onclick="changeStatus(${issue.id}, '${s}', '${issue.status}')" style="font-size:12px; padding:5px 12px;">${transitionBtnLabel(issue.status, s)}</button>`;
                });
                // 以下管理动作（指派/编辑/删除/通知）仍仅 isManager 可见
                if (isManager) {
                    // 指派
                    html += `<select onchange="assignIssue(${issue.id}, this)" style="font-size:12px;">
                        <option value="">指派给...</option>`;
                    allUsers.forEach(u => {
                        const sel = issue.assigned_to === u.id ? 'selected' : '';
                        // H-2：option 文本 + value 都 escapeHtml（display_name 是用户可改字段，防 XSS/属性注入）
                        html += `<option value="${escapeHtml(String(u.id))}" data-name="${escapeHtml(u.display_name || u.username)}" ${sel}>${escapeHtml(u.display_name || u.username)}</option>`;
                    });
                    html += `</select>`;
                    // 编辑
                    html += `<button class="u-btn-secondary" onclick="openEditModal(${issue.id})" style="font-size:12px; padding:5px 12px;">编辑</button>`;
                }
                // E1：建单人（非 manager）编辑入口——独立于 isManager 块，仅非终态可见
                if (creatorCanEdit) {
                    html += `<button class="u-btn-secondary" onclick="openEditModal(${issue.id})" style="font-size:12px; padding:5px 12px;">编辑</button>`;
                }
                if (isManager) {
                    // 删除（仅admin）
                    if (currentUser.role === 'admin') {
                        html += `<button class="u-btn-danger" onclick="deleteIssue(${issue.id})" style="font-size:12px; padding:5px 12px;">删除</button>`;
                    }
                    // C6c：3 个通知按钮（H-2 可见条件=乐观提示，对齐后端闸门；点击失败展后端 message）
                    // 〔通知统一 N2a·J23〕三处 onclick 补传 `this`，让 notifyAction/notifyRequesterDone
                    //   拿到按钮节点做「发送中…」disabled 态（本页原来三个通知按钮**零防抖**，
                    //   而同页拉群按钮早就有——防线不齐）。文案按 D1 保留「通知+对象」构词不动。
                    if (canNotifyDeveloper(issue)) {
                        html += `<button class="u-btn-secondary u-nb-btn" onclick="notifyAction(${issue.id}, 'notify-developer', this)">通知开发</button>`;
                    }
                    if (canNotifyReassign(issue)) {
                        html += `<button class="u-btn-secondary u-nb-btn" onclick="notifyAction(${issue.id}, 'notify-reassign', this)">通知改派</button>`;
                    }
                    if (canNotifyRequesterDone(issue)) {
                        html += `<button class="u-btn-secondary u-nb-btn" onclick="notifyRequesterDone(${issue.id}, this)">通知业务方完成</button>`;
                    }
                }
                html += `</div>`;
            }

            // v1.75.0 C1：已读跟踪展示（对齐数据协作 Data_Collab checkReadStatus 范式）
            //   两路独立：开发侧仅 notify_status='sent' 显示；业务方侧仅 requester_notify_status='sent' 显示
            //   不自动查（决策 1：按钮触发）；已读固化后后端返 cached=true，前端展 📖 已读
            //   v1.75.2：仅 isManager（admin/publisher）可见——已读是"发通知方确认对方收到没"，被通知方/viewer 无意义。
            //     查询按钮触发后端 API（后端 authenticateToken 守门）；区块整体隐藏后 checkIssueReadStatus 不会被触发（无按钮）。
            //   codex M-1：box id 含 issue.id（readStatusBox_<id>_<recipient>），快速切单时旧请求回包
            //     在新抽屉里 getElementById(旧 boxId)=null 自然失效，不污染新抽屉（对齐附件区 dataset.issueId 防错位思路）
            //   v1.75.2：已读状态只对管理侧（admin/publisher）有意义——是"发通知的人确认对方收到没"。
            //     被通知方（指派开发本人）/viewer 看自己的单不需要此信息，整块按 isManager 隐藏。
            if (isManager) {
                // 〔通知统一 N2a-fix S3·矩阵 Q14〕整块抽成 itNotifyReadSection(issue)：
                //   J24 的「通知渲染函数禁新增内联色值」守卫是**按函数名单圈范围**的，而本块原来长在
                //   巨型 renderDrawer 里——把 renderDrawer 整个圈进去会误伤全页非通知渲染，不圈又覆盖不到本块。
                //   抽出独立 helper 是让守卫圈得住的前置（纯搬运，零逻辑变化）。
                html += itNotifyReadSection(issue);
            }

            // v1.75.0 C4：钉钉拉群讨论（对齐数据协作 Data_Collab create-chat 朴素幂等范式）
            //   权限：admin/publisher/本单 assigned_to/本单 created_by（viewer 后端硬挡，前端再保险隐藏）
            //   已建群（dingtalk_open_conversation_id 非空且 trim 后有值）→ 灰显展示群名 + 提示去钉钉客户端
            //   未建群 → 蓝色按钮"💬 拉群讨论"；点击 confirm + 防抖（busy 锁）
            //   错误码：NOT_ENOUGH_MEMBERS / CHAT_LINK_FAILED / CHAT_CREATED_DB_UPDATE_FAILED /
            //          DINGTALK_USER_LOOKUP_EMPTY / NO_DINGTALK_CONFIG → 展后端 error 文案
            //   warning：requester_degraded=true → 拉群成功 toast 后追加 warning toast 提示业务方未加入
            {
                const isIssueCreator = currentUser && issue.created_by != null && Number(issue.created_by) === Number(currentUser.id);
                const canCreateChat = currentUser && currentUser.role !== 'viewer' && (isManager || isAssignee || isIssueCreator);
                if (canCreateChat) {
                    // trim 后判断（口径与后端 11134 一致，防历史空白脏值误判已建群）
                    const existingChatName = String(issue.dingtalk_chat_name || '').trim();
                    const existingOpenConvId = String(issue.dingtalk_open_conversation_id || '').trim();
                    const chatHasGroup = existingOpenConvId.length > 0;
                    let chatHtml = '';
                    if (chatHasGroup) {
                        const chatNameDisplay = existingChatName || '（群名缺失）';
                        chatHtml = `<button class="u-btn-secondary" disabled style="font-size:12px; padding:5px 12px; opacity:0.7; cursor:not-allowed;" title="点击钉钉客户端查看群消息">💬 ${escapeHtml(chatNameDisplay)}（请到钉钉查看）</button>`;
                    } else {
                        chatHtml = `<button class="u-btn-primary" id="btnCreateChat_${issue.id}" onclick="createIssueChat(${issue.id}, this)" style="font-size:12px; padding:5px 12px;">💬 拉群讨论</button>`;
                    }
                    html += `<div style="margin-bottom:16px; padding:10px 14px; background:#f9fafb; border-radius:8px;">
                        <label style="font-size:11px; color:#6b7280; display:block; margin-bottom:6px; font-weight:500;">钉钉沟通群</label>
                        ${chatHtml}
                    </div>`;
                }
            }

            // 详情网格（C6c：加业务方信息/OA/数据域；H-1 所有后端文本走 escapeHtml）
            html += `<div class="detail-grid">
                <div class="detail-item"><label>类型</label><div class="detail-value"><span class="u-type-tag ${typeClass(issue.type)}">${escapeHtml(issue.type)}</span></div></div>
                <div class="detail-item"><label>优先级</label><div class="detail-value"><span class="u-pri ${itPriClass(issue.priority)}">${escapeHtml(issue.priority)}</span></div></div>
                <div class="detail-item"><label>状态</label><div class="detail-value"><span class="u-status-badge ${itStatusClass(issue.status)}">${escapeHtml(statusDisplayLabel(issue.status))}</span></div></div>
                <div class="detail-item"><label>来源</label><div class="detail-value">${escapeHtml(issue.source || '')}</div></div>
                <div class="detail-item"><label>通知状态</label><div class="detail-value">${notifyBadge(issue)}</div></div>
                <div class="detail-item"><label>业务方部门</label><div class="detail-value">${escapeHtml(issue.requester_dept || '-')}</div></div>
                <div class="detail-item"><label>业务方姓名</label><div class="detail-value">${escapeHtml(issue.requester_name || '-')}</div></div>
                <div class="detail-item"><label>业务方手机</label><div class="detail-value">${escapeHtml(issue.requester_phone || '-')}</div></div>
                <div class="detail-item"><label>数据域</label><div class="detail-value">${domainText(issue.data_domain)}</div></div>
                <div class="detail-item"><label>开发</label><div class="detail-value">${escapeHtml(issue.assigned_to_name || '未指派')}</div></div>
                <div class="detail-item"><label>创建人</label><div class="detail-value">${escapeHtml(issue.created_by_name || '')}</div></div>
                <div class="detail-item"><label>创建时间</label><div class="detail-value">${escapeHtml(issue.created_at || '-')}</div></div>
                <div class="detail-item"><label>更新时间</label><div class="detail-value">${escapeHtml(issue.updated_at || '-')}</div></div>`;
            if (issue.oa_number) {
                html += `<div class="detail-item"><label>OA 流程号</label><div class="detail-value">${escapeHtml(formatOaNo(issue.oa_number))}</div></div>`;
            }
            if (issue.deadline) {
                html += `<div class="detail-item"><label>截止日</label><div class="detail-value">${escapeHtml(issue.deadline)}</div></div>`;
            }
            if (issue.related_table) {
                html += `<div class="detail-item"><label>关联表名</label><div class="detail-value" style="font-family:monospace; color:#b45309;">${escapeHtml(issue.related_table)}</div></div>`;
            }
            if (issue.error_time) {
                html += `<div class="detail-item"><label>异常时间</label><div class="detail-value">${escapeHtml(issue.error_time)}</div></div>`;
            }
            if (issue.closed_at) {
                html += `<div class="detail-item"><label>关闭时间</label><div class="detail-value">${escapeHtml(issue.closed_at)}</div></div>`;
            }
            html += `</div>`;

            // 原始诉求区（与描述分区；无值不显示）
            if (issue.raw_requirement) {
                html += `<div style="margin-bottom:16px;">
                    <label style="font-size:11px;color:#6b7280;display:block;margin-bottom:4px;font-weight:500;">原始诉求（业务方原话）</label>
                    <div class="detail-desc">${escapeHtml(issue.raw_requirement)}</div>
                </div>`;
            }

            // 预览地址（M-4：scheme 白名单——仅 http/https 渲染链接，否则纯文本展示，前端双重防御）
            if (issue.acceptance_url) {
                const safeUrl = safeHttpUrl(issue.acceptance_url);
                const urlText = escapeHtml(issue.acceptance_url);
                html += `<div style="margin-bottom:16px;"><label style="font-size:11px;color:#6b7280;display:block;margin-bottom:4px;font-weight:500;">预览地址</label>
                    ${safeUrl
                        ? `<a href="${escapeHtml(safeUrl)}" target="_blank" class="preview-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> ${urlText}</a>`
                        : `<span style="font-size:12px; color:#6b7280;">${urlText}</span>`}
                    </div>`;
            }

            // 描述
            html += `<div style="margin-bottom:20px;">
                <label style="font-size:11px;color:#6b7280;display:block;margin-bottom:4px;font-weight:500;">描述</label>
                <div class="detail-desc">${issue.description ? escapeHtml(issue.description) : '<span style="color:#d1d5db;">无描述</span>'}</div>
            </div>`;

            // 预览/验收地址编辑（M-5：仅管理侧可编辑，viewer 只读已在上方"预览地址"展示）
            if (isManager) {
                html += `<div style="margin-bottom:20px; padding:12px 14px; background:#f9fafb; border-radius:8px;">
                    <label style="font-size:12px; font-weight:600; color:#374151; display:block; margin-bottom:6px;">预览/验收地址</label>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="acceptanceUrlInput" value="${escapeHtml(issue.acceptance_url || '')}" placeholder="输入页面预览地址" style="flex:1; padding:6px 10px; border:1px solid #d1d5db; border-radius:6px; font-size:12px; outline:none;">
                        <button class="u-btn-secondary" onclick="updateAcceptanceUrl(${issue.id})" style="font-size:12px; padding:5px 12px;">保存</button>
                    </div>
                </div>`;
            }

            // 状态时间线（C6c：issue.status_history 后端已内联倒序；L-7 展示 from→to；L-3 空 reason 不显示 reason 行）
            html += `<div style="margin-bottom:20px;">
                <label style="font-size:12px; font-weight:600; color:#374151; display:block; margin-bottom:8px;">状态时间线</label>`;
            const hist = issue.status_history || [];
            if (hist.length) {
                html += `<div style="border-left:2px solid #e5e7eb; padding-left:12px;">`;
                hist.forEach(h => {
                    const flow = h.from_status ? `${escapeHtml(statusDisplayLabel(h.from_status))} → ${escapeHtml(statusDisplayLabel(h.to_status))}` : `创建 → ${escapeHtml(statusDisplayLabel(h.to_status))}`;
                    html += `<div style="margin-bottom:10px;">
                        <div style="font-size:12px; color:#374151;"><span class="u-status-badge ${itStatusClass(h.to_status)}" style="font-size:10px;">${escapeHtml(statusDisplayLabel(h.to_status))}</span> <span style="color:#6b7280;">${flow}</span></div>
                        <div style="font-size:11px; color:#9ca3af; margin-top:2px;">${escapeHtml(h.operator_name || '系统')} · ${escapeHtml(h.created_at || '')}</div>
                        ${h.reason ? `<div style="font-size:12px; color:#4b5563; margin-top:2px;">原因：${escapeHtml(h.reason)}</div>` : ''}
                    </div>`;
                });
                html += `</div>`;
            } else {
                html += `<p style="color:#d1d5db; font-size:13px;">暂无状态记录</p>`;
            }
            html += `</div>`;

            // 附件区（C6c：M-3 异步加载占位，回填前校验 issue.id 一致防快速切单错位）
            html += `<div style="margin-bottom:20px;">
                <label style="font-size:12px; font-weight:600; color:#374151; display:block; margin-bottom:8px;">录入附件</label>
                <div id="attachmentArea" data-issue-id="${issue.id}" style="font-size:12px; color:#9ca3af;">加载中…</div>
            </div>`;

            // 评论区
            html += `<div class="comments-section">
                <h3>评论 (${issue.comments ? issue.comments.length : 0})</h3>`;
            if (issue.comments && issue.comments.length) {
                issue.comments.forEach(c => {
                    html += `<div class="comment-item">
                        <div class="comment-meta">
                            <span class="comment-author">${escapeHtml(c.user_name)}</span>
                            <span class="comment-time">${formatTime(c.created_at)}</span>
                        </div>
                        <div class="comment-content">${escapeHtml(c.content)}</div>
                    </div>`;
                });
            } else {
                html += `<p style="color:#d1d5db; font-size:13px;">暂无评论</p>`;
            }
            // M-5：viewer 隐藏评论输入区（后端 POST comments 是 requireNonViewer），只读看评论 + 轻提示
            const isViewer = currentUser && currentUser.role === 'viewer';
            if (isViewer) {
                html += `<p style="color:#9ca3af; font-size:12px; margin-top:8px;">只读账号不可评论</p>`;
            } else {
                html += `<div class="comment-input-area">
                    <textarea id="commentInput" placeholder="添加评论..."></textarea>
                    <button class="u-btn-primary" onclick="addComment(${issue.id})" style="padding:8px 14px; font-size:12px;">发送</button>
                </div>`;
            }
            html += `</div>`;

            document.getElementById('drawerBody').innerHTML = html;
            loadAttachments(issue.id); // M-3：异步填充附件区
        }

        // ===== 操作 =====

        // C6c H-2：通知按钮可见条件=乐观提示（对齐后端闸门，非权限来源；点击仍处理后端 4xx）
        //   notify-developer：assigned_to 非空 + status∈{待处理,处理中,待验证}（server.js 闸门）
        function canNotifyDeveloper(issue) {
            return !!issue.assigned_to && ['待处理', '处理中', '待验证'].includes(issue.status);
        }
        //   notify-reassign：pending_reassign_to_id 非空（改派后未通知）
        function canNotifyReassign(issue) {
            return !!issue.pending_reassign_to_id;
        }
        //   notify-requester-done：status='已关闭'（requester_phone 空时后端拒，前端点击时软二次确认）
        function canNotifyRequesterDone(issue) {
            return issue.status === '已关闭';
        }

        // ===== 通知失败原因文案（通知统一 N2a·2026-08-09）=====
        //   ⚠️ 唯一文案源＝**已冻结的错误码映射表** `docs/local/前端统一/通知统一_错误码映射_20260809_v1.0.md`
        //   （§1 跨页共享码 / §2 Issue_Tracker 专属码 / §7 发送层 reason 枚举 / §9.3 HTTP 兜底）。
        //   **禁止自创原因文案**；跨页同码必同文案（本页与 Data_Correction 的共享码文案逐字一致）。
        //   本页原状是"几乎纯透传"：`body.error` 直进 toast、`errcode=` 数字拼给用户看、
        //   徽章 title 直出英文枚举、**两处 500 分支把 `err.message` 原始异常文本外显**（可能含堆栈/SQL/路径）。

        // 发送层 reason → 原因短语（`notify_error` 列的落库值域＝徽章 title 的内容·映射表 §7）
        const IT_REASON_TEXT = Object.freeze({
            network: '网络异常', server_5xx: '钉钉服务异常', invalid_response: '钉钉返回异常',
            token_expired: '钉钉凭证已过期', user_invalid: '收件人钉钉账号失效或已离职',
            no_scope: '钉钉接口权限不足', rate_limit: '钉钉发送被限流',
            no_config: '钉钉配置未填写', no_phone: '收件人未填手机号',
            // 〔裁定⑮·2026-08-09〕`new_dev_not_found` 是 server.js:12050 直接写死进 `notify_error` 列的
            //   reason（notify-reassign 新负责人账号不存在时），冻结映射表初版漏收——**保留本实现键**，
            //   并已补录进映射表 §7 IT 段（记 P5 待追认）。删掉它 title 会退成「未知原因」，是信息倒退。
            message_key_missing: '缺少消息标识', new_dev_not_found: '新负责人账号不存在',
            requester_phone_empty: '业务方未填手机号', requester_invalid: '业务方手机号查不到企业钉钉号',
            bad_args: '参数非法', other: '未知原因',
        });
        // 已知**中文字面量** → 原因短语（映射表 §8·第 3 级回退专用）。
        //   与 reason 表分表的理由（N2a-fix S1）：键的形态不同源——这张是后端直出中文串，那张是英文枚举；
        //   混用会让英文枚举参与 `error` 文本匹配（错配面）。逐条取自冻结表 §8 的 IT 段。
        const IT_LITERAL_TEXT = Object.freeze({
            '需求不存在': '需求不存在',
            '尚未指派开发，无法通知': '尚未指派开发',
            '被指派开发账号不存在': '开发账号不存在',
            '钉钉推送失败': '钉钉发送失败',
            '钉钉配置未填写，请管理员先到系统配置填写凭证': '钉钉配置未填写',
            '钉钉已发送但未返回消息标识，无法跟踪已读，请重试': '缺少消息标识',
            '业务方手机号查不到钉钉号（非企业成员/未绑定/离职），请线下转达': '业务方手机号查不到企业钉钉号',
            '无效的 recipient': '收件人参数无效',
        });
        // 〔N2b-fix·跨页硬化·2026-08-09〕表查值统一走 hasOwnProperty + typeof 双判
        //   （＝映射表 §0.2「实现上建议…用 `Object.prototype.hasOwnProperty.call(MAP, …)` 判定」的原文口径）。
        //   动因：裸 `MAP[k]` 会让 `constructor` / `toString` / `valueOf` 这类**原型链键**"命中"并返回函数对象，
        //   后端只要吐出这几个词，函数体就被当成中文原因渲染进 UI；typeof 断言再兜住取到非字符串值的情况。
        //   四页（DC/DCorr/IT/IL）同批硬化，范式一致。本页 itReasonText 另被徽章 title 消费（J8/0b-9①）⇒ 一并受益。
        function itMapText(map, key) {
            if (key == null) return '';
            const k = String(key);
            if (!Object.prototype.hasOwnProperty.call(map, k)) return '';
            const v = map[k];
            return (typeof v === 'string') ? v : '';
        }
        function itReasonText(reason) {
            const key = String(reason == null ? '' : reason);
            const byReason = itMapText(IT_REASON_TEXT, key);
            if (byReason) return byReason;
            if (key.startsWith('other:')) return '未知原因';   // `other:{errcode}` 动态形态按前缀归一
            return '未知原因';                                  // 回落**固定**，绝不把后端码原样显给用户
        }

        // 结构化 code → 原因短语（映射表 §1 共享码 + §2 IT 专属码）
        const IT_ERR_TEXT = Object.freeze({
            REQUESTER_PHONE_EMPTY: '业务方未填手机号', INVALID_RECIPIENT: '收件人参数无效',
            NOT_NOTIFIED: '尚未成功通知', NO_MESSAGE_KEY: '缺少消息标识',
            NO_DINGTALK_CONFIG: '钉钉配置未填写', STATUS_NOT_NOTIFIABLE: '当前状态不可通知',
            INVALID_STATE_FOR_NOTIFY: '当前状态不可通知',
            NOT_ASSIGNED: '尚未指派开发', NO_REASSIGN: '无改派记录可通知',
            NEW_DEV_NOT_FOUND: '新负责人账号不存在', NO_ACCEPTANCE_URL: '未填预览/验收地址',
        });
        const IT_HTTP_ERR_TEXT = Object.freeze({ 401: '登录已过期或无权限', 403: '登录已过期或无权限', 404: '需求不存在', 409: '状态已变化，请刷新后重试', 500: '未知原因', 502: '钉钉服务异常', 504: '发送超时，结果未知' });
        // 五级回退（映射表 §0.2）：code → reason → 已知中文字面量 → HTTP status → 未知原因。
        //   ⚠️ HTTP 500 且无 code/reason 时**跳过字面量档**：那一档的 `error` 就是 `err.message`
        //   （server.js:12031/12213/12299），属"异常文本不是契约"——一律「未知原因」。
        function itErrText(res, data) {
            const d = data || {};
            const byCode = itMapText(IT_ERR_TEXT, d.code);
            if (byCode) return byCode;
            // 〔裁定⑯·N2b-fix·2026-08-09〕reason 档改「**命中才 return，未命中继续下探**」，与 §0.2
            //   「逐级下探，命中即停」对齐（此前是 `if (d.reason) return itReasonText(...)`＝只要字段存在
            //   就吃掉整条回退链，未登记的 reason 直接落「未知原因」，把后面的字面量档/HTTP 档全跳过了）。
            //   ⚠️ **路径分界是本裁定的关键，改这里而不改 itReasonText 本体**：
            //     · **HTTP 响应路径**（本函数）——手上有 `res.status`，未登记 reason 还能靠 HTTP 档给出
            //       「钉钉服务异常」这类**更笼统但不错**的原因 ⇒ 应下探。
            //     · **存储列路径**（`itReasonText` 被徽章 title :1779 与行内失败句直接调用）——入参是库里存的
            //       `notify_error` 值，**根本没有 HTTP 上下文**可下探 ⇒ 固定回落「未知原因」才是正确语义。
            //     故 `itReasonText` 保持原样，两条路径各用各的回落策略。
            const byReason = itMapText(IT_REASON_TEXT, d.reason);
            if (byReason) return byReason;
            // `other:{errcode}` 动态形态按前缀归一（与 Collab/IL 同款，**不下探**：它是"已识别的未知"）
            if (d.reason && String(d.reason).startsWith('other:')) return '未知原因';
            const status = res ? res.status : 0;
            // 〔N2a-fix S1〕第 3 级**只查中文字面量表**，不再拿 reason 表当字面量表用
            //   （reason 表的键是英文枚举，让它参与 `error` 文本匹配＝给错配开口子）。
            const literal = String(d.error || d.message || '').trim();
            if (status !== 500 && literal) { const byLiteral = itMapText(IT_LITERAL_TEXT, literal); if (byLiteral) return byLiteral; }
            return itMapText(IT_HTTP_ERR_TEXT, status) || '未知原因';
        }

        // 通知动作（notify-developer / notify-reassign）：H-2 点击处理 400/403/409 展后端 message
        //   〔通知统一 N2a〕① 失败文案走冻结映射表（原 `body.error` 直透，含 500 的 err.message）
        //   ② 补发送中 disabled 态（J23·照搬同页 createIssueChat 的 btn.isConnected 判活范式）
        //   ③ 成功 toast **保留**（矩阵 I2·J6）：本页 `notify-developer` 重发时
        //      **行内零可见变化**——后端不清 `read_at`（server.js:12019 的 SET 不含该列）、
        //      `notified_at` 全页不渲染、徽章已是「已通知」不动。同一个调用点分不出首发/重发语境，
        //      删了会让重发操作**完全没有反馈** ⇒ 按 A' 保留，不是漏删。
        //   ④〔通知统一 N5-fix·HIGH·终态范式对齐〕**发送段与刷新段拆开**。原实现把
        //      `loadIssues()+openDrawer()` 放在与 fetch 同一个 try 里，刷新一抛错就落进末尾 catch 弹
        //      「通知失败（网络异常）」——而此时成功 toast 已经弹过了 ⇒ 用户先看到「通知已发送」、
        //      紧接着一条「通知失败」，**自相矛盾且诱导重发**（钉钉其实已经发出去了，重发＝真实双发）。
        //      IT 本页没有 A 类删除面（成功 toast 按 J6 保留），但"误报失败"这个方向必须堵，
        //      修法与其余四页同款：刷新段独立 try + DOM 哨兵判定 + 抽屉版兜底文案。
        async function notifyAction(id, action, btn) {
            const restore = itLockNotifyBtn(btn);
            let sentOk = false;
            try {
                const res = await authFetch(`/api/issues/${id}/${action}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
                const body = await res.json().catch(() => ({}));
                if (!res || !res.ok) { showToast(`通知失败（${itErrText(res, body)}）`, 'error'); restore(); return; }
                showToast('通知已发送', 'success');
                sentOk = true;
            } catch (e) {
                // 拆分后本 catch 只覆盖 **fetch/解析失败**（真没发出去），不再吞刷新异常
                showToast('通知失败（网络异常）', 'error'); restore(); return;
            }
            await itRefreshAfterNotify(id, btn, restore, sentOk, '通知');
        }

        // 〔N5-fix·HIGH〕通知后的**独立刷新段**（notifyAction / notifyRequesterDone 共用，避免两处漂移）。
        //   判定靠 **DOM 哨兵**不靠 catch：`openDrawer` 刷新成功会把抽屉整体重渲染，捕获到的按钮节点被
        //   替换掉（isConnected=false）；节点还挂在文档上 ⇒ 这次刷新没生效。按钮取不到时退
        //   `#drawerBody` 的**子节点**做锚点（容器本体恒在、不能当哨兵——SI 那边踩过这个坑）。
        //   ⚠️ 无论刷新成败，**绝不弹「通知失败」**：钉钉已经发出去了，说失败是谎报且诱导重发。
        async function itRefreshAfterNotify(id, btn, restore, sentOk, label) {
            //   锚点直接取 `#drawerBody`（openDrawer 就是往它 innerHTML 写·:1058，id 恒在）。
            //   ⚠️ 初版还写了 `|| document.querySelector('.drawer-body')` 兜底，两处都不对：① 那是**裸**
            //   共享根类（规范要求 `u-` 前缀，本页元素实为 `class="u-drawer-body"`）② id 路径恒可用，
            //   这个兜底是一条永远走不到的死分支。删掉即可，两个问题一起消。
            //   （这行注释本身能原样留下，是因为 N5-fix 已给守卫补了"剥注释先行"——在那之前它会把注释
            //     里的这个类名也判成违规，属守卫口径问题，不是代码问题。）
            const bodyEl = document.getElementById('drawerBody');
            const anchorChild = bodyEl ? bodyEl.firstElementChild : null;
            const sentinel = (btn && btn.isConnected) ? btn : anchorChild;
            try { await loadIssues(); await openDrawer(id); } catch (e) { /* 异常止于此，判定交给哨兵 */ }
            const stale = sentinel ? sentinel.isConnected : true;   // 取不到哨兵＝判不了＝fail-loud
            restore();
            if (sentOk && stale) showToast(`${label}：已发送，详情刷新失败，可重开抽屉查看`, 'error');
        }

        // 〔J23〕通知按钮发送中态：禁用 + 文案切「发送中…」，回来再还原。
        //   `btn.isConnected` 判活是必须的——成功后 `loadIssues()+openDrawer()` 会把整个抽屉重渲染，
        //   原按钮节点已不在文档里，再去写它的属性是白写（同页 createIssueChat :1174-1177 同款处置）。
        function itLockNotifyBtn(btn) {
            if (!btn || !btn.tagName) return () => {};
            const original = btn.textContent;
            btn.disabled = true;
            btn.textContent = '发送中…';
            return () => {
                if (!btn.isConnected) return;
                btn.disabled = false;
                btn.textContent = original;
            };
        }

        // 通知业务方完成：requester_phone 空时后端返 REQUESTER_PHONE_EMPTY；无 acceptance_url 软二次确认 confirm_no_link
        async function notifyRequesterDone(id, btn) {
            const restore = itLockNotifyBtn(btn);
            let sentOk = false;
            try {
                let res = await authFetch(`/api/issues/${id}/notify-requester-done`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
                let body = await res.json().catch(() => ({}));
                // 软二次确认：后端 code=NO_ACCEPTANCE_URL（未填验收地址，need_confirm）→ confirm 后带 confirm_no_link 重发
                if (!res.ok && body.code === 'NO_ACCEPTANCE_URL') {
                    if (!confirm('该需求未填验收/预览地址，仍要通知业务方完成吗？')) { restore(); return; }
                    res = await authFetch(`/api/issues/${id}/notify-requester-done`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirm_no_link: true }) });
                    body = await res.json().catch(() => ({}));
                }
                if (!res || !res.ok) { showToast(`通知失败（${itErrText(res, body)}）`, 'error'); restore(); return; }
                // 〔通知统一 N2a·J5·写读语义同源〕**后端幂等被前端报成了成功**：
                //   后端命中幂等闸时返 **HTTP 200** `{already_sent:true, message:'已通知过业务方，未重复发送（如需重发传 force_resend）'}`
                //   （server.js:12163-12167），**一条钉钉都没发**；原代码拿到 200 就无条件弹「已通知业务方完成」，
                //   用户以为又发了一次。现按 `already_sent` 分流成 A' 幂等提示（info 级，不冒充成功）。
                //   ⚠️ 连带事实（登记不改·J6）：本页从不传 `force_resend`，即业务方完成通知在 UI 上**无重发入口**——
                //   属"后端只读不扩能力"边界，不在本批范围。
                if (body.already_sent) showToast('已通知过业务方，未重复发送', 'info');
                else { showToast('已通知业务方完成', 'success'); sentOk = true; }
                // 〔N5-fix·HIGH〕刷新段拆出（同 notifyAction）。**幂等分支 sentOk 保持 false**：
                //   already_sent＝后端一条都没发，刷新失败时说「已发送，详情刷新失败」是谎报
                //   （B2' 同族教训），那条分支已有自己的 info toast，不叠兜底。
            } catch (e) {
                showToast('通知失败（网络异常）', 'error'); restore(); return;
            }
            await itRefreshAfterNotify(id, btn, restore, sentOk, '通知业务方完成');
        }

        // v1.75.0 C4：拉群讨论（对齐数据协作 Data_Collab create-chat 范式）
        //   防抖：btn.disabled + busy 文案，请求期间禁止重复点击（codex 35 M-2 残余风险兜底）
        //   错误码（5 个，对齐后端契约 server.js:11078+）：
        //          NOT_ENOUGH_MEMBERS / CHAT_LINK_FAILED / CHAT_CREATED_DB_UPDATE_FAILED /
        //          DINGTALK_USER_LOOKUP_EMPTY / NO_DINGTALK_CONFIG → 展后端 error 文案
        //   warning：requester_degraded=true → 拉群成功后追加 warning toast（业务方未加入）
        //   幂等（idempotent=true）：当用户两次点击之间已被别人拉群 → 后端直接返已有群，
        //          前端 toast 用 success（结果一致都是"群可用"，国内 UI 习惯 info 蓝色易让用户误判"什么都没发生"）
        //   confirm 文案（codex 37 #3 + codex 38 #4）："群管理员（示例用户A）" 保留人名让用户知道会拉谁 + 补稳定角色名提示
        //   注意：本处人名是硬编码，将来 COLLAB_CHAT_ADMIN_ID 改人时**需同步修改本处**（不会自动跟随后端常量）；
        //   治本方案 = 后端 GET /api/system/chat-admin 返管理员展示名供前端动态渲染（P3 backlog）
        async function createIssueChat(id, btn) {
            if (!confirm('确认为该需求拉钉钉讨论群？\n群成员：群管理员（示例用户A）+ 负责人 + 业务方（按手机号反查命中时加入）+ 当前操作人，系统自动去重')) return;
            // 防抖：禁用按钮 + 改文案；finally 恢复（重新 openDrawer 会重新渲染整段，此处仅兜底）
            let originalText = '';
            if (btn) {
                originalText = btn.textContent;
                btn.disabled = true;
                btn.textContent = '建群中…';
            }
            try {
                const res = await authFetch(`/api/issues/${id}/create-chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}'
                });
                if (!res) return;
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    // codex 39 #3：识别 schema readiness 503 → warning toast 区分"初始化/未就绪"vs 真错误
                    //   v1.74.x ISSUE_SCHEMA_* + v1.75.0 ISSUE_V1750_SCHEMA_* 两套都识别
                    if (data.code === 'ISSUE_V1750_SCHEMA_INITIALIZING' || data.code === 'ISSUE_V1750_SCHEMA_NOT_READY' ||
                        data.code === 'ISSUE_SCHEMA_INITIALIZING' || data.code === 'ISSUE_SCHEMA_NOT_READY') {
                        showToast(data.error || '功能初始化中或字段未就绪，请稍后刷新重试或联系管理员', 'warning');
                    } else {
                        showToast(data.error || '拉群失败', 'error');
                    }
                    return;
                }
                // 成功 / 幂等已建群 / 降级 三种情况都进这里
                if (data.idempotent) {
                    showToast(data.message || '该需求已有讨论群，请到钉钉客户端查看', 'success');
                } else {
                    showToast(data.message || '讨论群已创建，请到钉钉客户端查看', 'success');
                    if (data.requester_degraded) {
                        // 业务方未加入：成功 toast 后追加 warning（让用户知道需线下转达）
                        setTimeout(() => showToast('业务方未加入（手机号反查未命中），请线下转达或补填手机号', 'warning'), 1200);
                    }
                }
                // 刷新列表 + 重开 drawer 让按钮变成"已建群"灰显形态
                await loadIssues();
                openDrawer(id);
            } catch (e) {
                showToast('网络错误', 'error');
            } finally {
                if (btn && btn.isConnected) {
                    btn.disabled = false;
                    btn.textContent = originalText;
                }
            }
        }

        // v1.75.0 C1：查询钉钉已读状态（移植自数据协作 checkReadStatus，适配 issues recipient）
        //   recipient='issue_developer'（开发侧，走 assigned_to）或 'issue_requester'（业务方侧，走 phone 反查）
        //   后端返 {read, read_at, cached} 或错误 {error, code}；查到已读后刷新 drawer 让区块直接渲染 📖 形态
        //   codex M-1 防错位：boxId 含 id，回包后用 getElementById(boxId) 重新取——
        //     若用户已切到别的单（旧 box 不在 DOM），返回 null → 直接 return，不污染新抽屉、不 openDrawer 跳回旧单
        async function checkIssueReadStatus(id, recipient) {
            const boxId = `readStatusBox_${id}_${recipient}`;
            const startBox = document.getElementById(boxId);
            if (startBox) startBox.innerHTML = '<span class="u-nt-idle">查询中…</span>';
            const label = recipient === 'issue_requester' ? '业务方' : '开发';
            try {
                const res = await authFetch(`/api/issues/${id}/notify-read-status?recipient=${recipient}`);
                const data = await res.json().catch(() => ({}));
                // 回包后重新取 box（异步窗口内可能已切单）：不在 DOM → 当前抽屉已非本单，静默放弃
                const box = document.getElementById(boxId);
                if (!box) return;
                if (res && res.ok) {
                    if (data.read) {
                        const timePart = data.read_at ? ` · 于 ${escapeHtml(formatFullTime(data.read_at))}` : '';
                        box.innerHTML = `<span class="u-nt-ok">📖 ${label}已读${timePart}</span>`;
                        // box 仍在 = 当前抽屉确为本单，才刷新 drawer 渲染固化的"📖 已读"形态（后端已写 read_at）
                        openDrawer(id);
                    } else if (data.read_status === 'recipient_unresolved') {
                        // codex M-3（2026-07-13）：后端收件人钉钉号未解析时返此，前端原缺处理会误报"尚未读取"
                        // §3.3「无法查询」态模板：`⚠️ {原因}，无法查询已读`
                        box.innerHTML = `<span class="u-nt-warn">⚠️ 收件人未解析，无法查询已读</span>`;
                    } else if (data.read_status === 'unread_expired') {
                        // §3.3「超窗口未读」态：`⏰` 收编为 `—`，槽 muted。
                        // ⚠️〔J7·mock-only〕**本分支在 Issue_Tracker 是死代码**：`unread_expired` 全仓唯一产出点
                        //   是 server.js:15760（Data_Collab 查已读，唯一带 24h 窗口判定的端点）；
                        //   `/api/issues/:id/notify-read-status`（server.js:12235-12300）无任何窗口判定。
                        //   保留分支＝零行为变更（J7 裁定），但**验收时只能 route mock 造**，
                        //   不得当成"本页已有超窗态"记进验收矩阵。
                        box.innerHTML = `<span class="u-nt-muted">— 未读（已超过钉钉可查询时间）</span>`;
                    } else {
                        // §3.3「窗口内未读」态：`👀` 收编为 `⏳`（去 label + 去"重查"按钮的既有口径不变）
                        box.innerHTML = `<span class="u-nt-warn">⏳ 尚未读取</span>`;
                    }
                } else {
                    // 〔通知统一 N2a·J8〕原来两条路都在透传后端原文：`data.error` 直出（500 时就是 err.message
                    //   原始异常文本）、还把 `errcode=42001` 这种数字拼给用户看。现全部走**冻结映射表**
                    //   五级回退（NO_MESSAGE_KEY 等已登记码照旧命中，只是文案来自映射表而非此处硬编码）。
                    // §3.3「查询失败」态：`❌` 收编为 `⚠️`
                    box.innerHTML = `<span class="u-nt-fail">⚠️ 查询失败（${escapeHtml(itErrText(res, data))}）</span>`;
                }
            } catch (e) {
                const box = document.getElementById(boxId);
                if (box) box.innerHTML = '<span class="u-nt-fail">⚠️ 查询失败（网络异常）</span>';
            }
        }

        // 附件区异步加载（M-3：loading 占位 + 回填前校验当前 drawer issue.id 一致防快速切单错位）
        async function loadAttachments(issueId) {
            const area = document.getElementById('attachmentArea');
            if (!area) return;
            try {
                const res = await authFetch(`/api/issues/${issueId}/attachments`);
                // 防错位（M-3）：回填前确认 attachmentArea 仍属当前 issue（用户可能已切到别的单）
                let cur = document.getElementById('attachmentArea');
                if (!cur || String(cur.dataset.issueId) !== String(issueId)) return;
                if (!res || !res.ok) { cur.innerHTML = '<span style="color:#dc2626;">附件加载失败</span>'; return; }
                const atts = await res.json();
                // M-5（codex C6c）：JSON 解析也是异步窗口，解析后再二次校验 issueId 一致才回填
                cur = document.getElementById('attachmentArea');
                if (!cur || String(cur.dataset.issueId) !== String(issueId)) return;
                if (!atts.length) { cur.innerHTML = '<span style="color:#d1d5db;">暂无附件</span>'; return; }
                // H-1：下载链接 encodeURIComponent(file_name)；file_name 存相对路径 issues/<名>，逐段编码
                cur.innerHTML = atts.map(a => {
                    const href = '/uploads/' + String(a.file_name || '').split('/').map(encodeURIComponent).join('/');
                    const sizeKb = a.file_size ? ` (${Math.round(a.file_size / 1024)}KB)` : '';
                    return `<div style="margin-bottom:4px;"><a href="${escapeHtml(href)}" target="_blank" class="preview-link">${escapeHtml(a.original_name || a.file_name)}</a><span style="color:#9ca3af;">${escapeHtml(sizeKb)} · ${escapeHtml(a.uploaded_by_name || '')}</span></div>`;
                }).join('');
            } catch (e) {
                const cur = document.getElementById('attachmentArea');
                if (cur && String(cur.dataset.issueId) === String(issueId)) cur.innerHTML = '<span style="color:#dc2626;">附件加载失败</span>';
            }
        }

        // reason modal Promise 封装（M-4：让 changeStatus 保持线性 async/await，避免回调地狱/重复提交）
        let _reasonResolve = null;
        function requestTransitionReason(meta) {
            // meta = { toStatus, label }
            // codex C6b M-1：pending 防护——前一个 reason modal 未确认/取消时再次触发，直接返回 null
            //   （避免覆盖旧 resolver 致第一个 Promise 永不 resolve 调用链悬挂）
            if (_reasonResolve !== null) {
                showToast('请先完成当前原因填写', 'warning');
                return Promise.resolve(null);
            }
            return new Promise(resolve => {
                _reasonResolve = resolve;
                document.getElementById('reasonModalTitle').textContent = meta.label;
                document.getElementById('reasonModalLabel').textContent = meta.label + ' *';
                document.getElementById('reasonModalInput').value = '';
                document.getElementById('reasonModalConfirm').disabled = false;
                document.getElementById('reasonModal').classList.add('open');
                setTimeout(() => document.getElementById('reasonModalInput').focus(), 50);
            });
        }
        function confirmReasonModal() {
            const val = (document.getElementById('reasonModalInput').value || '').trim();
            if (!val) { showToast('原因不能为空', 'error'); return; }
            if (val.length > 500) { showToast('原因不超过 500 字', 'error'); return; }
            document.getElementById('reasonModal').classList.remove('open');
            const r = _reasonResolve; _reasonResolve = null;
            if (r) r(val);
        }
        function cancelReasonModal() {
            document.getElementById('reasonModal').classList.remove('open');
            const r = _reasonResolve; _reasonResolve = null;
            if (r) r(null); // 取消 → resolve(null)，changeStatus 据此中止
        }

        // 判断目标态/退回是否必填 reason（对齐后端 C4：已关闭/已暂缓/已拒绝 必填 + 待验证→处理中 退回必填）
        function reasonRequired(fromStatus, toStatus) {
            if (['已关闭', '已暂缓', '已拒绝'].includes(toStatus)) return true;
            if (fromStatus === '待验证' && toStatus === '处理中') return true; // 退回
            return false;
        }
        function reasonLabel(toStatus) {
            if (toStatus === '已关闭') return '完成说明';   // v1.0.5 方案 A：关闭场景文案=完成说明
            if (toStatus === '处理中') return '退回原因';
            return '变更原因';
        }

        async function changeStatus(id, toStatus, fromStatus) {
            // v1.75.2：提交验收（处理中→待验证）加二次确认，防开发误点把未完成的需求提交给 admin 验收
            //   （此流转不必填 reason，故走轻量 confirm；其余流转维持原有 reason/无确认逻辑）
            if (fromStatus === '处理中' && toStatus === '待验证') {
                if (!confirm('确认已完成开发、提交给管理员验收？\n提交后状态将变为「待验证」，由管理员验收归档。')) return;
            }
            let reason = null;
            if (reasonRequired(fromStatus, toStatus)) {
                reason = await requestTransitionReason({ toStatus, label: reasonLabel(toStatus) });
                if (reason === null) return; // 用户取消（resolve(null)；reason 只会是 null 或 string）
            }
            try {
                const payload = { status: toStatus };
                if (reason !== null) payload.last_transition_reason = reason;
                const res = await authFetch(`/api/issues/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res || !res.ok) {
                    const err = await res.json().catch(() => ({}));
                    showToast(err.error || '操作失败', 'error');
                    return;
                }
                showToast(`状态已更新为「${statusDisplayLabel(toStatus)}」`, 'success');
                await loadIssues();
                openDrawer(id);
            } catch (e) { showToast('操作失败', 'error'); }
        }

        async function assignIssue(id, selectEl) {
            const userId = selectEl.value;

                    body: JSON.stringify({ assigned_to: userId || null, assigned_to_name: userName || null })
                });
                if (!res || !res.ok) { showToast('指派失败', 'error'); return; }
                showToast(userName ? `已指派给 ${userName}` : '已取消指派', 'success');
                await loadIssues();
                openDrawer(id);
            } catch (e) { showToast('指派失败', 'error'); }
        }

        // data_domain 下拉源缓存（OP-2：GET /api/models 提 domain；M-7：一次性缓存 + 失败降级）
        let dataDomainCache = null;
        async function loadDataDomains() {
            if (dataDomainCache !== null) return dataDomainCache;
            try {
                const res = await authFetch('/api/models');
                if (!res || !res.ok) { dataDomainCache = []; return dataDomainCache; }
                const models = await res.json();
                const set = new Set();
                (models || []).forEach(m => { const d = (m.domain || '').trim(); if (d) set.add(d); });
                dataDomainCache = Array.from(set).sort((a, b) => a.localeCompare(b, 'zh-Hans-CN'));

            return dataDomainCache;
        }

        // ============================================================
        // S2（附件预览+删除统一，接续 S5 贴图接入）：本页只有 1 个上传点 formAttachments（先行后传：
        //   先建需求再逐个上传，见 §录入附件 注释）。从"input.files 直接持态、attachmentPreview 从未
        //   渲染过内容"升级为"数组持态 + 缩略图预览 + 单张删除"，对齐 Data_Correction 的 corrPicker*
        //   范式（命名换 tr 前缀），但本页只有 1 个上传点，不需要 S1 那种 key→数组字典，直接用一个
        //   模块级数组即可；也不抽共享 js（新建共享层要改 HTML 引用 + bump 缓存串，扩大本次范围）。
        //   input 只在 onchange 一次性读取后立即清空（input 不再是真相源，避免两份状态互相打架）。
        //   不新增任何校验——本页既有校验闸门＝无（前端不做扩展名/大小/去重/数量检查，全靠后端），本次
        //   只补预览与删除，无 S1 的 max=5 警示（本页无数量上限，不凭空加）。
        //   scopeResolver：本页仅 createModal 一个相关弹窗（reasonModal 是变更原因输入，与附件无关），
        //   未开则返回 null，由共享层回落 document；selector 仍用 #formAttachments 本身（原生文件输入
        //   有真实渲染尺寸，风险最低，不改注册面）。
        // ============================================================
        const TR_UPASTE_KIT_EXPECTED = 'upaste3';   // 须与 <script src="...u-paste.js?v=..._upaste3"> 缓存串尾部一致
        const TR_ATTACH_FILES = [];   // 单一附件数组（本页仅 1 个上传点，无需 S1 那种 key→数组字典）
        const TR_ATTACH_URLS = [];    // 与 TR_ATTACH_FILES 下标一一对应的 objectURL 缓存（仅图片项非空）
        const TR_IMG_EXTS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'];
        // 纯追加，不做任何校验（本页既有裸 input 链本无扩展名/大小/去重闸门，此处零新增）
        function trPickerCollect(files) {
            for (const f of Array.from(files || [])) TR_ATTACH_FILES.push(f);
        }
        function trPickerRevokeUrls() {
            TR_ATTACH_URLS.forEach(u => { if (u) URL.revokeObjectURL(u); });
            TR_ATTACH_URLS.length = 0;
        }
        // 渲染到既有 attachmentPreview 容器：图片（TR_IMG_EXTS）出 blob: 缩略图，非图片出图标+文件名；
        //   每项带删除按钮。缩略图尺寸（90x68）与 safeAttr 引号转义口径参考 Data_Correction 的
        //   corrPickerRender 保持两页一致，但非图片分支等实现细节不完全等价，非整体照抄。
        function trPickerRender() {
            const wrap = document.getElementById('attachmentPreview');
            if (!wrap) return;
            trPickerRevokeUrls();   // 重渲染前先 revoke 上一轮 objectURL，防泄漏
            wrap.innerHTML = TR_ATTACH_FILES.map((f, idx) => {
                const safeName = escapeHtml(f.name);
                // 属性位加转双引号（app.js escapeHtml 是 textContent→innerHTML 实现，不转义引号——
                // 文件名含 " 时可逃逸 title/alt 属性边界；文本节点位用 safeName 即可）
                const safeAttr = safeName.replace(/"/g, '&quot;');
                const ext = f.name.split('.').pop().toLowerCase();
                const sizeKB = (f.size / 1024).toFixed(1);
                if (TR_IMG_EXTS.includes(ext)) {
                    const urlAttr = URL.createObjectURL(f);
                    TR_ATTACH_URLS[idx] = urlAttr;
                    return `<div class="tr-picker-item" style="position:relative;display:inline-block;margin:0 6px 6px 0;vertical-align:top;" title="${safeAttr}">
                        <img src="${urlAttr}" alt="${safeAttr}" style="width:90px;height:68px;object-fit:cover;border-radius:6px;border:1px solid #e5e7eb;display:block;">
                        <button type="button" onclick="trPickerRemove(${idx})" title="移除" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;line-height:16px;text-align:center;background:#dc2626;color:#fff;border:0;border-radius:50%;cursor:pointer;font-size:11px;padding:0;">×</button>
                        <div style="max-width:90px;font-size:10px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;">${safeName}</div>
                    </div>`;
                }
                const icon = ext === 'pdf' ? '📄' : '📊';
                return `<div class="tr-picker-item" style="position:relative;display:inline-block;margin:0 6px 6px 0;vertical-align:top;" title="${safeAttr}">
                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:90px;height:68px;background:#fef3c7;color:#92400e;border-radius:6px;border:1px solid #fde68a;">
                        <span style="font-size:20px;line-height:1;">${icon}</span>
                        <span style="font-size:10px;margin-top:2px;max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${safeName}</span>
                        <span style="font-size:9px;color:#b45309;">${sizeKB} KB</span>
                    </div>
                    <button type="button" onclick="trPickerRemove(${idx})" title="移除" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;line-height:16px;text-align:center;background:#dc2626;color:#fff;border:0;border-radius:50%;cursor:pointer;font-size:11px;padding:0;">×</button>
                </div>`;
            }).join('');
        }
        function trPickerRemove(idx) {
            if (idx < 0 || idx >= TR_ATTACH_FILES.length) return;
            TR_ATTACH_FILES.splice(idx, 1);
            trPickerRender();
        }
        // 返回数组快照（供提交链读取，避免调用方直接持有内部数组引用被意外改动）
        function trPickerFiles() {
            return TR_ATTACH_FILES.slice();
        }
        // 清空数组 + revoke 全部 objectURL + 清 formAttachments 的已选残留 + 重渲染
        function trPickerReset() {
            TR_ATTACH_FILES.length = 0;
            trPickerRevokeUrls();
            const input = document.getElementById('formAttachments');
            if (input) input.value = '';
            trPickerRender();
        }
        // formAttachments 唯一 onchange：读 input.files → 追加进数组 → 立即清空 input（input 不再是
        //   真相源，贴图/多次选择/重选统一走数组追加语义）→ 重渲染预览
        function trPickerOnPick() {
            const input = document.getElementById('formAttachments');
            if (!input) return;
            trPickerCollect(input.files);
            input.value = '';
            trPickerRender();
        }
        function trInitUPaste() {
            // codex S5 复审 M1 采纳：一次性哨兵，防未来重复初始化路径重复 register()（详见 Sys_Iteration
            // siInitUPaste 同款注释）。
            if (trInitUPaste._done) return;
            trInitUPaste._done = true;
            if (!window.UPaste) { console.error('[贴图共享层] u-paste.js 未加载'); return; }

                scopeResolver: () => {
                    const modal = document.getElementById('createModal');

                },

        async function openCreateModal() {

            fillDeptSelect();
            fillAssignSelect('');

            await fillDomainSelect(''); // L-5：先填充数据域再开弹窗，避免弹窗已显示但下拉还空时秒选
            document.getElementById('createModal').classList.add('open');
        }

        async function openEditModal(id) {

                document.getElementById('formRequesterName').value = issue.requester_name || '';
                document.getElementById('formRequesterPhone').value = issue.requester_phone || '';

                document.getElementById('errorTimeGroup').style.display = issue.type === '调度异常' ? 'block' : 'none';
