<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智数协同平台</title>
    <style>
        :root {
            --color-primary: #292524;
            --color-accent: #d97706;
            --color-accent-hover: #b45309;
            --color-accent-soft: #fef3c7;
            --color-bg-page: #fafaf9;
            --color-bg-card: #ffffff;
            --color-text-primary: #1c1917;
            --color-text-secondary: #57534e;
            --color-text-muted: #a8a29e;
            --color-border: #e7e5e4;
            --color-danger: #dc2626;
            --color-danger-bg: #fee2e2;
            --radius-sm: 4px;
            --radius-md: 6px;
            --shadow-md: 0 4px 6px rgba(41,37,36,0.06);
            --shadow-lg: 0 10px 15px rgba(41,37,36,0.10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-bg-page);
        }

        .login-container {
            background: var(--color-bg-card);
            padding: 40px;
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 1.8em;
            color: var(--color-text-primary);
            margin-bottom: 4px;
        }

        .login-header .subtitle-en {
            font-size: 0.95em;
            color: var(--color-text-secondary);
            font-weight: 400;
            margin-bottom: 12px;
        }

        .login-header p {
            color: var(--color-text-secondary);
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-text-secondary);
            font-weight: 600;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 1em;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px var(--color-accent-soft);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-accent);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
        }

        .login-btn:hover {
            background: var(--color-accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            background: var(--color-text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            background: var(--color-danger-bg);
            color: var(--color-danger);
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: var(--color-text-muted);
            font-size: 0.8em;
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>智数协同平台</h1>
            <div class="subtitle-en">Smart Data Hub</div>
            <p>请登录以继续</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                登 录
            </button>
        </form>

        <div class="footer-text" id="versionText">
            智数协同平台
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // 加载版本号
        async function loadVersion() {
            try {
                const res = await fetch(`${API_URL}/version`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('versionText').textContent = `${data.name} v${data.version}`;
                }
            } catch (e) {
                console.error('Failed to load version:', e);
            }
        }

        // 检查是否已登录
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                // 验证token是否有效
                fetch(`${API_URL}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                    .then(res => {
                        if (res.ok) {
                            // token有效,跳转到主页
                            window.location.href = '/Task_Pool.html';
                        } else {
                            // token无效,清除
                            localStorage.removeItem('token');
                            localStorage.removeItem('user');
                        }
                    })
                    .catch(() => {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                    });
            }
        }

        // 页面加载时检查登录状态并加载版本号
        checkAuth();
        loadVersion();

        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');

            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            // 显示加载状态
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading"></span>登录中...';
            errorMessage.classList.remove('show');

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 登录成功,保存token和用户信息
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // 根据角色跳转到不同页面
                    if (data.user.role === 'viewer') {
                        // 查看者跳转到统计中心
                        window.location.href = '/Statistics.html';
                    } else {
                        // 其他角色跳转到任务池
                        window.location.href = '/Task_Pool.html';
                    }
                } else {
                    showError(data.error || '登录失败');
                }
            } catch (error) {
                showError('网络错误,请稍后重试');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '登 录';
            }
        });

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        // 回车键提交
        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>

</html>
